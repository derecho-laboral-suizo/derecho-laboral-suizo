nnerhalb von 18 Monaten. Genf verlängert den Mutterschaftsurlaub um 2 Wochen, und ein längerer Spitalaufenthalt des Neugeborenen kann bis zu 8 Wochen zusätzlich bringen. Der Arbeitgeber ist nicht zur Aufstockung verpflichtet, ausser der Vertrag sieht sie vor.","yyit2eoodq":" Monat","28vek4vmnse":"Skala und Dienstjahr","1ly9ziukff1":"Zürich","1ctz6lnwcf1":"Bern","1xnm9mhuxa3":"Jahr ","2a84gvmqbn7":"Voller Lohn (pro Dienstjahr)","xzdtwh89li":"Voller Lohn bis ungefähr","22xff39jwyy":"Kündigungsschutz (Sperrfrist)","13ysx7grhuj":" Tage","wc2020lfqo":"Geschützt bis","13gdvkaw3xu":"Die Kündigung ist nichtig.","2git9auqcsy":"Sie wurde innerhalb der Sperrfrist der Krankheit erhalten, daher muss der Arbeitgeber sie wiederholen nach dem ","b4ng3h9o2i":"Die Kündigung bleibt gültig, wird aber unterbrochen für ","21v7cbqu2ff":" Tage.","b27hpst73m":"Das Arbeitsverhältnis endet am ","1b1slc0miy7":" statt am ","208lmxh8l94":"Keine Auswirkung auf die Kündigung.","1a79y5uwmdu":"Die Skalen sind Gerichtspraxis: Berner Skala in den meisten Kantonen, Zürcher Skala in ZH, SH und TG. Ein Vertrag oder eine Krankentaggeldversicherung kann die Skala ersetzen. Der Schutz gilt nur nach der Probezeit und nur gegen die Kündigung durch den Arbeitgeber (die Arbeitnehmerin kann weiterhin selbst kündigen); es sind Kalendertage. Der Lohn wird pro Dienstjahr gezählt, wobei alle Absenzen zusammengerechnet werden.","1jy5udsoxm0":"Rechner: Fristen, Leistungen und Schlusszahlung","mqdcslenua":"Sechs kleine Rechner für alltägliche HR-Fragen. Öffnen Sie den, den Sie brauchen; jeder erklärt, was er macht, was Sie eingeben und was Sie erhalten. Für den Nettolohn nutzen Sie den Nettolohnrechner.","1hf29y3k21x":"Letzter Arbeitstag nach einer Kündigung","11l8yy8xob5":"Genaues Enddatum nach einer Kündigung durch Arbeitgeber oder Arbeitnehmer.","gv9w00864l":"<b>Was er macht:<\/b> Nach der Probezeit endet eine Kündigung immer auf Ende eines Monats. Er wendet die Kündigungsfrist nach Dienstjahren an (1 Monat im ersten Dienstjahr, 2 Monate vom 2. bis 9. Dienstjahr, 3 Monate ab dem 10.) und liefert den letzten Tag. <b>Sie geben ein:<\/b> das Datum, an dem die andere Partei das Schreiben erhält, die Dienstjahre und ob die Person noch in der Probezeit ist (dann beträgt die Frist nur 7 Tage). <b>Sie erhalten:<\/b> die Dauer der Kündigungsfrist und das Enddatum. <b>Beispiel:<\/b> Ein am 12. November im ersten Dienstjahr erhaltenes Schreiben bedeutet 1 Monat Kündigungsfrist, das Arbeitsverhältnis endet also am 31. Dezember.","w25xm10ju3":"Datum des Erhalts der Kündigung","1ohenhlseor":"Dienstalter","hbl0zehg85":"Erstes Dienstjahr","1kt4ao9db8b":"2. bis 9. Dienstjahr","1iaqzvhesg1":"10. Dienstjahr oder mehr","1u8g6sy8hb2":" Noch in der Probezeit","8tbe6rcqar":"Ferientage bei einem Teiljahr","zdqexdzm87":"Ferientage bei Ein- oder Austritt im Laufe des Jahres.","p70jt9wg71":"<b>Was er macht:<\/b> Er berechnet, wie viele Ferientage zustehen, wenn das Arbeitsverhältnis nicht das ganze Jahr dauert (Ein- oder Austritt im Laufe des Jahres). <b>Sie geben ein:<\/b> den ersten und letzten Tag der Anstellung im selben Kalenderjahr, die vertraglichen Ferienwochen (mindestens 4; 5 bis zum Alter von 20 Jahren oder wenn es der Vertrag vorsieht) und die Arbeitstage pro Woche. <b>Sie erhalten:<\/b> die Ferientage, auf halbe Tage gerundet. <b>Beispiel:<\/b> Eine Anstellung vom 1. Juli bis 31. Dezember mit 4 Wochen und einer 5-Tage-Woche ergibt etwa 10 Tage.","uco0wf8t2m":"Eintrittsdatum","1riw5myqcce":"Austrittsdatum (gleiches Jahr)","2fvjdtvsw2j":"Ferienwochen pro Jahr","1w8cuvoa0pa":"Arbeitstage pro Woche","15z0psp4d36":"Arbeitslosenentschädigung (ALV)","tyi9sd17r0":"Taggeld und Monatsbetrag, Wartetage und maximale Bezugsdauer.","zmj53rbzxh":"<b>Was er macht:<\/b> Er schätzt das Arbeitslosentaggeld, das Sie in der Schweiz erhalten würden. <b>Sie geben ein:<\/b> Ihren durchschnittlichen Bruttomonatslohn vor der Arbeitslosigkeit (er zählt bis CHF 12’350), ob Sie Kinder unter 25 Jahren unterstützen, ob Sie eine Invalidenrente von mindestens 40 % beziehen, Ihr Alter und die Beitragsmonate der letzten 2 Jahre. <b>Sie erhalten:<\/b> das Taggeld und den Monatsbetrag (70 % oder 80 %), die Wartetage und die maximale Anzahl Taggelder. <b>Beispiel:<\/b> CHF 6’000 pro Monat, keine Kinder, Alter 35, 24 Monate: CHF 193.55 pro Tag, 10 Wartetage und bis zu 400 Taggelder.","2eiqfvv6aoa":"Durchschnittlicher Bruttomonatslohn (CHF)","15fu06dmb7n":"Beitragsmonate in den letzten 2 Jahren","1ewmlx81dxp":"Ich unterstütze Kinder unter 25 Jahren","1umwyv7kwba":"Ich beziehe eine Invalidenrente von mindestens 40 %","222s4bmqdaw":"Schlusszahlung und Abgangsentschädigung","11611g8kgy9":"Was eine Person beim Austritt erhält und ob eine Abgangsentschädigung gilt.","2drgvwz9fdu":"<b>Was er macht:<\/b> Er erstellt die letzte Lohnabrechnung bei Beendigung des Arbeitsverhältnisses: letzter Monat, 13. Monatslohn anteilig, nicht bezogene Ferien, Überstunden, und prüft, ob die gesetzliche Abgangsentschädigung gilt (nur ab 50 Jahren mit 20 Dienstjahren: 2 bis 8 Monatslöhne). <b>Sie geben ein:<\/b> den Lohn, den letzten Arbeitstag, die gearbeiteten Tage im letzten Monat, nicht bezogene Ferientage, Überstunden, Alter und Dienstjahre sowie eine allfällig in einer Aufhebungsvereinbarung vereinbarte Abgangsentschädigung. <b>Sie erhalten:<\/b> die Bruttopositionen, ein ungefähres Netto nach AHV und ALV und den Bereich der Abgangsentschädigung.","636apdzmcb":"Bruttomonatslohn (CHF)","ppicjta0vq":"Auszahlungen pro Jahr","100hrmsci8n":"Letzter Arbeitstag","2fmfqlrq07q":"Gearbeitete Tage im letzten Monat (von 30)","d4n7kgqna5":"Nicht bezogene Ferientage","54chi16g08":"Arbeitstage pro Jahr (für den Tageslohn)","167vyx2lvyg":"Auszuzahlende Überstunden","10um70nnsuw":"Vertragliche Wochenstunden","1f9i3oifkrf":"Überstunden mit 25 % Zuschlag vergüten","hlxnhkxm4g":"Dienstjahre","lh9ayn3was":"Weitere vereinbarte Abgangsentschädigung (CHF, brutto)","a9l7aay817":"Mutterschafts-, Vaterschafts- und Betreuungsentschädigung (EO)","1ma7az59y52":"Entschädigung während Mutterschafts-, Vaterschafts-, Adoptions- und Betreuungsurlaub.","129lf0m65mm":"<b>Was er macht:<\/b> Er berechnet die Entschädigung der Erwerbsersatzordnung (EO): 80 % des durchschnittlichen Einkommens, bis CHF 220 pro Tag. <b>Sie geben ein:<\/b> das durchschnittliche Monatseinkommen vor dem Urlaub und die Art des Urlaubs. <b>Sie erhalten:<\/b> das Taggeld, die Anzahl Tage, den Gesamtbetrag und wie viel gegenüber dem Lohn fehlt (was ein Arbeitgeber aufstocken müsste). <b>Beispiel:<\/b> CHF 6’000 pro Monat ergeben CHF 160 pro Tag, also CHF 15’680 über 98 Tage Mutterschaftsurlaub.","2fn6l2ajt0u":"Durchschnittliches Monatseinkommen vor dem Urlaub (CHF)","1mwysvarcod":"Art des Urlaubs","p7znx48tdc":"Mutterschaft (98 Tage)","2b99i7r861t":"Vaterschaft (14 Taggelder)","o0k4mm1vm2":"Adoption (14 Taggelder)","1aa6fvu02oc":"Betreuung eines schwer kranken Kindes (bis 98 Tage)","1gvr0mywws3":"Lohnfortzahlung bei Krankheit und Kündigungsschutz","17pavnydgeu":"Wie lange der Lohn bezahlt wird, Kündigungsschutz und wie eine Krankheit das Enddatum verschiebt.","31uy0i0oc1":"<b>Was er macht:<\/b> Er zeigt, wie lange der Arbeitgeber bei Krankheit den vollen Lohn zahlt (Berner oder Zürcher Skala), wie viele Tage die Person vor Kündigung geschützt ist (30, 90 oder 180 Tage je nach Dienstjahr) und was mit einer Kündigung geschieht, die vor oder während der Krankheit eintrifft. <b>Sie geben ein:<\/b> die Skala, das Dienstjahr, den ersten Tag und die Dauer der Krankheit und, falls vorhanden, das Datum, an dem die Kündigung erhalten wurde. <b>Sie erhalten:<\/b> die Lohnzahlungsdauer, die Schutzfrist und das neue Enddatum. <b>Beispiel:<\/b> Kündigung am 20. Februar erhalten (3. Dienstjahr: 2 Monate, also bis 30. April) und eine Krankheit ab 2. März während 40 Tagen: Die Kündigung wird für 40 Tage unterbrochen und das Arbeitsverhältnis endet am 30. Juni.","253nksi6vh8":"Skala","24d0gfbvkpz":"Bern (die meisten Kantone)","t9o0w55vy7":"Zürich (ZH, SH irchensteuer","1qc5tpw2gz0":"Ja (Mitglied einer anerkannten Kirche)","1cgxbj9pjk0":"Nein","15b4isn2dov":"Jahresbruttoeinkommen der Partnerin oder des Partners (CHF, 0 falls keines; nur Verheiratete)","gi8lv1jhvf":"Versicherungsabzüge anpassen (optional)","71q1mupq5m":"Krankentaggeld, Ihr Anteil. 0, falls nicht auf Ihrer Abrechnung.","1y1wd4ocvx9":"Nichtberufsunfall in % (NBU)","1k5kqqjacsk":"Unfall ausserhalb der Arbeit (NBU). Meist 1–1,5 %.","6h4kvjz7m1":"Pensionskasse (BVG), Arbeitnehmeranteil in % des koordinierten Lohns","e19bbqphio":"Pensionskasse (BVG), Ihr %. 0 = gesetzliche Schätzung.","1xc7dclzzry":"Typische Werte verwenden","spcc28tis1":"Was ist das?","22mbak36xji":"<p><b>KTG.<\/b> <b>Was es ist:<\/b> eine Versicherung, die bei längerer Krankheit etwa 80 % Ihres Lohns zahlt, meist nach einer Wartefrist. Nicht jeder Arbeitgeber hat sie, und viele teilen die Kosten mit Ihnen. <b>Auf Ihrer Lohnabrechnung:<\/b> «KTG» oder «Krankentaggeld». Geben Sie 0 ein, wenn Sie es nicht sehen. Hier verwendeter typischer Wert: 0,5 %.<\/p><p><b>NBU.<\/b> <b>Was es ist:<\/b> eine Versicherung für Unfälle ausserhalb der Arbeit (Sport, Haushalt, Reisen). Sie ist obligatorisch, wenn Sie 8 oder mehr Stunden pro Woche arbeiten, und üblicherweise zahlt sie der Arbeitnehmer. <b>Auf Ihrer Lohnabrechnung:<\/b> «NBU» oder «Nichtberufsunfall». Der Satz hängt vom Versicherer und von der Risikoklasse Ihres Arbeitgebers ab; die Beispielabrechnung im Simulator zeigt 1,433 %. Hier verwendeter typischer Wert: 1 %.<\/p><p><b>BVG.<\/b> <b>Was es ist:<\/b> Ihr Anteil an der Pensionskasse (2. Säule), ein obligatorisches Alterssparen, das Sie zusammen mit Ihrem Arbeitgeber aufbauen. Es wird auf dem koordinierten Lohn berechnet (Brutto minus CHF 26’460, höchstens CHF 64’260), nur wenn Sie mehr als CHF 22’680 im Jahr verdienen und mindestens 25 Jahre alt sind. <b>Auf Ihrer Lohnabrechnung:<\/b> «BVG», «Berufliche Vorsorge» oder «PK», mit einem Prozentsatz. Der Satz hängt von Ihrer Kasse und Ihrem Alter ab; die Beispielabrechnung im Simulator zeigt 7,000 %. <b>Wenn Sie ihn nicht kennen, lassen Sie 0:<\/b> Der Rechner verwendet dann die Hälfte der gesetzlichen Mindestgutschrift (3,5 %, 5 %, 7,5 % oder 9 % des koordinierten Lohns, je nach Alter).<\/p>","12q7l9ylpe1":"Wie geschätzt wird und Grenzen","thlfqy3tmy":"So wird geschätzt.","3972c59yv3":"Die Sozialabgaben folgen denselben Regeln wie im Lohnabrechnungs-Simulator. Die direkte Bundessteuer verwendet den Bundestarif 2026 nach den Standardabzügen (3 % Berufskosten, Versicherungspauschale, Kinderabzug, Zweiverdienerabzug). Die Kantons-, Gemeinde- und Kirchensteuer verwenden die Steuerbelastungstabellen 2025 der Eidgenössischen Steuerverwaltung (ESTV) für die Kantonshauptstadt, als Prozentsatz des Bruttoeinkommens und nach Einkommen interpoliert. Die Sätze enthalten die Kirchensteuer, ausser Sie wählen Nein (dann um etwa 5,5 % reduziert, eine grobe Anpassung). Bei 1 oder 3 und mehr Kindern wird der Satz aus den Tabellen für 0 und 2 Kinder interpoliert bzw. extrapoliert, und Alleinerziehende verwenden die Tabellen für Verheiratete.","1xf42c0b22h":"Grenzen.","pju65dikpl":"Ihre Gemeinde kann um mehrere Punkte von der Hauptstadt abweichen; weitere Abzüge (Säule 3a, Arbeitsweg, Kinderbetreuung, Schulden) werden nicht berücksichtigt; Angestellte ohne Ausweis C zahlen Quellensteuer nach Tarif, die abweichen kann. Für eine genaue Zahl nutzen Sie den offiziellen ","21zlqlw7cob":"Steuerrechner der ESTV","1d4bm7b8lxe":"CV: Ihr Lebenslauf für die Schweiz","1edaza752by":"Einfacher heller Hintergrund","dodvqnunfu":"In die Kamera schauen","jsw5x3esad":"Kopf und Schultern","6b7mnq2sb":"Hochformat 2:3 (etwa 4,5 × 6 cm)","6h735tj2i9":"Foto: das Erste, was Schweizer Recruiter sehen","w5pxhi7en6":"Ein Foto ist gesetzlich nicht vorgeschrieben, doch Schweizer Arbeitgeber erwarten es, und eine Schweizer Personalvermittlung bezeichnet ein perfektes Bewerbungsfoto als wichtiger denn je. Behandeln Sie es als Teil Ihrer Bewerbung und investieren Sie in ein professionelles.","c2kipiszre":"So sollte es sein","29w8i6gvrjq":"Vermeiden","290nd3gzbe1":"Bezugsquelle: ein Fotostudio in Ihrer Nähe (Stichwort «Bewerbungsfoto»); verlangen Sie eine hochaufgelöste Datei im Hochformat. Bei einer englischsprachigen Bewerbung an ein internationales Unternehmen können Sie das Foto weglassen. Grundlage: Karriereberatung Schweizer Hochschulen (ZHAW), der Bewerbungsratgeber der Schweizerischen Post und Robert Half Schweiz; Grössen- und Formatangaben stammen aus deutschsprachigen Bewerbungsratgebern und sind üblich, nicht verbindlich.","1jaw607egwm":"Professionelles Foto im Hochformat","2d2cat94dbo":"CV: So schreiben Sie Ihren Lebenslauf für die Schweiz","1nty47kpc24":"Schweizer Arbeitgeber lesen einen Lebenslauf auf eine bestimmte Weise. Diese Regeln stammen von Karriereberatungen Schweizer Hochschulen, dem Staatssekretariat für Wirtschaft (SECO) und der Berufsberatung. Nutzen Sie die Reiter unten für fiktive Beispiele.","w0xbf5m3jk":"Regeln für den Lebenslauf","10f61y1lcco":"Beispiele (fiktive Personen)","1j2l59ezcmx":"Vorlagen zum Herunterladen (Word)","1d5wya64wyu":"Füllen Sie die [Klammern] aus, löschen Sie die Hinweiszeile und speichern Sie das Dokument vor dem Versand als PDF. Schriften und Abstände können Sie frei ändern.","2dv4yh3i5f":".docx herunterladen","1ao0mkit62u":"Die Download-Schaltflächen erscheinen, wenn Sie die Seite in claude.ai öffnen.","jjuytcr1p6":"Gespeichert: ","2doz1x95u0s":"Download abgebrochen.","gs4mbdjra7":"Der Download ist in dieser Ansicht nicht verfügbar.","296egarrieu":"Monat","1zxj2fo8800":"Ihres Lohns","1nywnzik023":"AHV-Rente (Säule 1), 12 Auszahlungen","2crpn2hw2q8":"AHV-Rente mit der 13. Auszahlung, monatlicher Durchschnitt","2d06okpadod":"Pensionskassenkapital bei der Pensionierung (Säule 2)","rx3t4ejcx0":"Pensionskassenrente (Kapital × 6,8 % pro Jahr)","1k4s9bh5nqd":"Säule-3a-Kapital bei der Pensionierung","1cu3yq4b5aj":"Säule 3a, verteilt auf ","28391kksuwg":"Ihr Renteneinkommen gilt ein vom Bundesrat festgelegter Mindestzinssatz.","vgu1r7psye":"<b>Bei einem Stellenwechsel:<\/b> Ihr Kapital folgt Ihnen.","171i28xclpp":"Säule 3: private Vorsorge (3a und 3b)","1hhypjmbtun":"Freiwillig","24qaehotcpl":"<b>3a:<\/b> gebundenes Sparen mit Steuerabzug, bis CHF 7’258 pro Jahr im Jahr 2026, wenn Sie eine Pensionskasse haben.","5rg8689hb":"<b>3b:<\/b> freies Sparen ohne Abzug und ohne Bindung.","2054wr0x2ex":"<b>Rendite:<\/b> Sie bestimmen die Anlage: ein 3a-Konto mit tiefem festem Zins und ohne Risiko oder eine Wertschriftenlösung (Fonds oder ETFs) mit mehr Risiko und langfristig meist höherer Rendite. Die Gebühren spielen eine grosse Rolle.","2a3f7y0gw0l":"<b>Was Sie erhalten:<\/b> das gesparte Kapital plus Zinsen, als Kapitalauszahlung: ab 5 Jahren vor dem Referenzalter oder früher für den Kauf von Wohneigentum, den Schritt in die Selbstständigkeit oder den endgültigen Wegzug aus der Schweiz.","1ep9l00ydvw":"<b>Zweck:<\/b> die Rente aufbessern und Steuern sparen.","2qksmgvenz":"Die Schweiz baut Ihr Renteneinkommen wie ein Haus mit drei Säulen auf: eine staatliche Basis (Säule 1), ein obligatorisches Sparkonto über Ihren Arbeitgeber (Säule 2) und Ihr eigenes freiwilliges Sparen (Säule 3). In vielen Ländern deckt die staatliche Rente fast alles ab; in der Schweiz ist sie nur die Basis, und der Rest wird während des Erwerbslebens angespart.","1pu0jxdvk93":"Schätzen Sie Ihr Renteneinkommen","1xhmgycqojy":"<b>Was er macht:<\/b> Er schätzt Ihre Rente aus jeder Säule und zeigt Ihr Einkommen im Ruhestand nur mit Säule 1, mit den Säulen 1 + 2 und mit allen dreien. <b>Sie geben ein:<\/b> Ihr Alter, Ihren Lohn und die Jahre, in denen Sie in der Schweiz an die AHV beigetragen haben werden; optional das Kapital laut Ihrem Pensionskassenausweis und Ihr Säule-3a-Guthaben. <b>Sie erhalten:<\/b> Monatsbeträge und den Anteil Ihres Lohns, den jedes Szenario abdeckt. Alle Beträge sind brutto, vor Steuern.","xrksbpbf5":"Ihr heutiges Alter","2gn1lkxvs3k":"Pensionierungsalter","zyktcsc4qu":"Aktueller Bruttojahreslohn (CHF)","1bxzplp2h2e":"Erwartetes jährliches Lohnwachstum (%)","18hejrbhq68":"Jahre, in denen Sie in der Schweiz an die AHV beigetragen haben werden (maximal 44)","1sj6ikf23r3":"Durchschnittliches Jahreseinkommen für die AHV (0 = Ihren Lohn verwenden)","1adregsh6fb":"Ich bin verheiratet und meine Partnerin oder mein Partner erhält ebenfalls eine ähnliche Rente (Ehepaarplafonierung)","1bkuechjy9x":"Pensionskassenkapital heute (CHF, gemäss Ihrem Ausweis)","1x1xvrd8qjp":"Zins auf dem Pensionskassenkapital (% pro Jahr, Annahme)","22qgd3x4ktr":"Beitrag in die Säule 3a (CHF pro Jahr)","iviynu3q3h":"Rendite der Säule 3a (% pro Jahr, Annahme: ein Sparkonto bringt wenig, Fonds mehr, aber ohne Garantie)","v6fq39lrkj":"Jahre, über die Sie das Säule-3a-Kapital verteilen (nur zum Vergleich)","1slh8m1idgq":"So wird gerechnet.","w89j32rhwc":"Säule 1 verwendet die offizielle Skala 2026: Die volle Rente beträgt CHF 1’260 bis zu einem durchschnittlichen Einkommen von CHF 15’120, steigt dann mit dem Einkommen bis CHF 2’520 ab CHF 90’720; bei weniger als 44 Beitragsjahren erhalten Sie den Anteil Jahre ÷ 44. Säule 2 addiert die gesetzlichen Mindestgutschriften (7 %, 10 %, 15 % und 18 % des koordinierten Lohns je nach Altersstufe) mit dem eingegebenen Zins und rechnet das Kapital zu 6,8 % um. Säule 3a kumuliert Ihre Beiträge mit der eingegebenen Rendite. Grenzen: Viele Pensionskassen zahlen mehr als das gesetzliche Minimum ein und zahlen auf dem überobligatorischen Teil weniger als 6,8 % aus; die Schwellenwerte werden als konstant angenommen; die 13. Rente ist eingerechnet; nicht berücksichtigt sind Steuern, vorzeitige oder aufgeschobene Pensionierung und Jahre in anderen Ländern.","264riivws9w":"Welche Säulen legen mein Geld an und bringen eine Rendite?","2g6vmultown":"Säule 1 legt Ihre Beiträge nicht an: Sie finanziert die heutigen Renten. In Säule 2 legt die Pensionskasse das Geld aller Versicherten an und schreibt Ihrem Konto Zinsen gut; Sie können normalerweise nicht wählen. In Säule 3a wählen Sie: ein 3a-Konto (tiefer, sicherer Zins) oder Wertschriften (Fonds oder ETFs: mehr Risiko, langfristig meist mehr Rendite, und die Gebühren fallen ins Gewicht). Säule 3b ist frei: ein Sparkonto, Wertschriften oder eine Lebensversicherung, ohne Steuerabzug.","25nazxej96w":"Was, wenn ich nur einige Jahre in der Schweiz verbringe?","10ae69d0fi0":"Die AHV-Rente ist proportional zu Ihren Beitragsjahren: Mit 22 von 44 Jahren erhalten Sie etwa die Hälfte. Jedes Land zahlt seine eigene Rente für seine eigenen Zeiten, fragen Sie daher im anderen Land nach den dort gearbeiteten Jahren.","mthkcgs1q6":"Was geschieht mit meiner Pensionskasse, wenn ich die Stelle wechsle?","1foowx390fj":"Ihr Kapital geht an die Kasse des neuen Arbeitgebers über oder auf ein Freizügigkeitskonto, wenn Sie keine Stelle haben. Verlangen Sie von jedem Arbeitgeber den Vorsorgeausweis.","fpzmuwoib4":"Was, wenn ich die Schweiz in ein anderes Land verlasse?","ws7a82a4ai":"Die AHV-Rente wird weiterhin im Ausland ausbezahlt. Der obligatorische Teil der Pensionskasse kann nicht bar ausbezahlt werden, wenn Sie in einem EU/EFTA-Staat obligatorisch versichert bleiben: Er bleibt auf einem Schweizer Freizügigkeitskonto, verfügbar 5 Jahre vor dem Referenzalter. Der überobligatorische Teil kann ausbezahlt werden. Die Säule 3a kann bei endgültigem Wegzug aus der Schweiz bezogen werden.","xzfiqqdvnm":"Rente oder Kapital?","1xdzqasgonb":"Bei der Pensionskasse hängt es vom Reglement ab: lebenslange Rente, Kapitalbezug oder eine Mischung. Die Säule 3a wird immer als Kapital ausbezahlt. Kapitalbezüge werden getrennt von anderem Einkommen besteuert.","1z8cw8dv4s9":"Erhalten Paare weniger?","g4mtfhbmvl":"Ja, in der AHV: Die beiden Renten eines Ehepaars sind zusammen auf CHF 3’780 pro Monat plafoniert, während zwei Unverheiratete je bis zu CHF 2’520 erhalten können.","12xt3121nuv":"Häufige Fragen","1hpzr6miw0w":"Mehr Details mit Beispielen im Leitfaden: Abschnitt 26, die drei Säulen im Detail.","1te42bvezwa":"Sprachen","ev3hzc9irn":"Mindestlohn (brutto, pro Stunde)","25snl32b8sk":"Gesetzlich keiner (nur Gesamtarbeitsverträge nach Branche)","2com5srku49":"Im ganzen Kanton geltende Feiertage, 2026","1df0h174dza":"Hinweise zu den Feiertagen","95wm6ky1hd":"Skala für die Lohnfortzahlung bei Krankheit (Gerichtspraxis)","1uct5r3m1fj":"Familienzulagen pro Kind und Monat","2gkir0syo8u":"Bundesminimum CHF 215 / 268 oder etwas höher; fragen Sie bei Ihrer kantonalen Familienausgleichskasse nach","i1zrs9afew":"Geburtszulage","18qw82qjj9o":"Ja (kantonal)","2f0sxly4w7q":"Nein, dieser Kanton sieht keine vor","13ywqfrqcz7":"Nettolohn bei CHF 100’000 brutto","1yyx4lpefwr":"Rang ","265t9957x20":"Nettolohn: alleinstehende Person ohne Kinder, inklusive Kirchensteuer, Sozialabgaben 2026 und geschätzte Einkommenssteuer der Kantonshauptstadt (Details im Nettolohnrechner). Feiertage, Zulagen und Mindestlohn richten sich nach dem Kanton, in dem Sie arbeiten; die Lohnfortzahlungsskala folgt der Gerichtspraxis, sofern Ihr Vertrag oder eine Krankentaggeldversicherung nichts anderes vorsieht.","jbn6t6l5i4":"Unterschiede zwischen den Kantonen","23us0t10sd9":"In der Schweiz hängen viele arbeitsrechtliche Regeln vom Kanton ab, in dem Sie arbeiten: Feiertage, Mindestlöhne, Familienzulagen und die Skala für die Lohnfortzahlung bei Krankheit. Wählen Sie einen Kanton, um sein Profil zu sehen, oder öffnen Sie die Vergleichstabellen unten.","1s93k7ckk4r":"Höchster der Schweiz, jedes Jahr indexiert. Der kantonale Mindestlohn geht (vorerst) den Gesamtarbeitsverträgen vor.","edr7ckoyu7":"Ein allgemeinverbindlicher Gesamtarbeitsvertrag geht vor. Die Ferienentschädigung kommt zum Stundenlohn hinzu.","1ym96i35ja2":"Ein allgemeinverbindlicher Gesamtarbeitsvertrag geht vor.","1qr4mrv04ej":"Der kantonale Mindestlohn geht (vorerst) den Gesamtarbeitsverträgen vor. CHF 18.15 in der Landwirtschaft, im Weinbau und im Gartenbau.","1ych0mbu386":"Je nach Branche (2027: 20.50–21.00). Ein allgemeinverbindlicher Gesamtarbeitsvertrag geht vor.","286r07it88d":"Kommunaler Mindestlohn, seit 2026.","mukq4wotqx":"Vom Bundesgericht am 12. Mai 2026 bestätigt, aber noch nicht in Kraft: Die Stadt gibt das Datum mindestens 6 Monate im Voraus bekannt. Die Ferienentschädigung kommt hinzu.","zxosshcndi":"Vom Bundesgericht am 12. Mai 2026 bestätigt; das Inkrafttreten ist vom Stadtrat noch zu bestimmen.","1ezrbiidkmq":"Am 14. Juni 2026 haben die Stimmberechtigten den Grundsatz eines Mindestlohns in der Kantonsverfassung verankert, aber das Ausführungsgesetz und den Gegenvorschlag (CHF 23 pro Stunde) abgelehnt: Noch ist kein Betrag in Kraft.","dihqzeqige":"Die übrigen 21 Kantone","1abdch2occ0":"Kein gesetzlicher Mindestlohn; nur die Mindestlöhne allgemeinverbindlicher Gesamtarbeitsverträge nach Branche.","uokczoxz1a":"Mindestlöhne","1yvg238flt1":"Kantone und Städte mit Mindestlohn, 2026.","t6xnhvquc3":"Es gibt keinen nationalen Mindestlohn. Einige Kantone und Städte legen einen fest; sonst bestimmen nur allgemeinverbindliche Gesamtarbeitsverträge (GAV) die Mindestlöhne nach Branche. Die Beträge sind brutto pro Stunde.","15s5d7x76w0":"Kanton oder Stadt","wvzf0wnn85":"CHF pro Stunde (2026)","w0ql8swnwo":"Hinweise","794rzbesd2":"Was sich ändert:","2bpe10ndlbr":"Am 19. Juni 2026 hat das Bundesparlament ein Gesetz verabschiedet, nach dem Mindestlöhne in allgemeinverbindlichen Gesamtarbeitsverträgen, auch tiefere, den kantonalen und kommunalen Mindestlöhnen vorgehen (mit einer Sonderregelung für Genf und Neuenburg). Gewerkschaften haben für ein Referendum am 7. Oktober 2026 mehr als 100’000 Unterschriften eingereicht; die Bundeskanzlei muss sie noch prüfen, und eine Abstimmung wird für 2027 erwartet. Die Lage kann sich geändert haben: Prüfen Sie sie, bevor Sie sich darauf verlassen.","cfo4az7gi2":"Feiertage","h1wz69404t":"Im ganzen Kanton geltende Feiertage 2026, Kanton für Kanton.","qdnk6j54za":"Nur der 1. August ist ein Bundesfeiertag. Neujahr, Auffahrt, 1. August und Weihnachten gelten in allen Kantonen; jeder Kanton kann bis zu 8 weitere Tage den Sonntagen gleichstellen (Art. 20a ArG). Die Tabelle zeigt die 2026 im ganzen Kanton geltenden Feiertage, den 1. August eingeschlossen, und lässt lokale sowie halbe Feiertage weg; Kantone, die Feiertage an Bezirke oder Gemeinden delegieren, wirken daher «knausriger», als sie sind. Massgebend ist der Kanton, in dem Sie arbeiten; verbindlich ist die offizielle Liste Ihres Kantons oder Ihrer Gemeinde.","14swhkscddn":"Anzahl","dk3tsdvarh":"Feiertage","rs70o77hfs":"Skalen für die Lohnfortzahlung bei Krankheit","19n253bx4eg":"Welche Skala die Gerichte verwenden, Kanton für Kanton.","1rbrkirk4i1":"Das Obligationenrecht sagt nur, dass der Lohn «für eine beschränkte Zeit» zu zahlen ist. Die Gerichte haben drei Skalen nach Dienstjahren entwickelt; welche gilt, hängt von der kantonalen Gerichtspraxis ab, sofern der Vertrag oder eine Krankentaggeldversicherung nichts anderes vorsieht. Die Rechner unter Werkzeuge decken die Berner und die Zürcher Skala ab.","kn3lu96ke2":"Kantone","14zcq6wvmrz":"Dauer","1i7n1kwmp1l":"Basel","1tpr97upwi8":"alle übrigen Kantone (Graubünden: siehe Hinweis)","1kb4sjcb4lr":"Familienzulagen","14wwndtxxox":"Kinder- und Ausbildungszulagen nach Kanton, 2026.","1qa6juot3ec":"Das Bundesminimum beträgt CHF 215 pro Monat und Kind (bis 16 Jahre) und CHF 268 für ein Kind in Ausbildung (16–25). Die Kantone können mehr zahlen. Geburtszulagen gibt es nur in FR, GE, JU, LU, NE, SZ, UR, VS und VD. Für Angestellte entscheidet in der Regel der Kanton, in dem Sie arbeiten. Die folgenden Beträge sind Richtwerte aus Zusammenfassungen der offiziellen BSV-Tabelle; verbindlich ist die kantonale Familienausgleichskasse.","9syjzxwy0d":"Kind","v81c4nzlom":"Ausbildung","1r8zizzfdmj":"Hinweis","18kpshtvgh0":"Einkommenssteuer ≈ ","2fh3wt4ggnj":"Rangliste des Nettolohns","fz9849q76h":"Was Ihnen von CHF 100’000 brutto in jedem Kanton bleibt.","222fcutjc5o":"Schätzung für eine alleinstehende Person ohne Kinder, mit Kirchensteuer, 35 Jahre alt, 12 Auszahlungen, Sozialabgaben 2026 und Einkommenssteuer der Kantonshauptstadt. Für Ihren eigenen Fall nutzen Sie den Nettolohnrechner.","wfkjt5l4xc":"Netto pro Jahr","xl91eby9tt":"Einkommenssteuer","1wrhtefgap0":"← Zurück zu den Werkzeugen","14yq40kh1tq":"1. Ihre Rechte auf einen Blick","gn38ni2yme":"<b>Zweck:<\/b> eine einseitige Checkliste für Sie und für die Mitarbeitenden, die Sie beraten werden. Zu jedem Punkt steht, wo das Detail zu finden ist.","2cs5wb0k72o":"<b>Vertrag und Lohn:<\/b> Gibt es keinen schriftlichen Vertrag, schriftliche Bestätigung der wesentlichen Bedingungen innert eines Monats (Art. 330b); Lohn pünktlich mit schriftlicher Lohnabrechnung (Art. 323b); Lohnforderungen verjähren nach 5 Jahren. Siehe Abschnitte 4 und 13.","mva9zbxswl":"<b>Arbeitszeit:<\/b> gesetzliche Höchstarbeitszeit von 45 oder 50 Stunden pro Woche, 11 Stunden tägliche Ruhezeit, Pausen von 15, 30 oder 60 Minuten, 25 % Zuschlag auf gesetzliche Überzeit, und Nacht- oder Sonntagsarbeit nur mit Bewilligung. Siehe Abschnitte 8–10.","dh8yaj41pt":"<b>Ferien:<\/b> mindestens 4 Wochen (5 bis zum Alter von 20), zwei zusammenhängende Wochen am Stück, der Lohn wird weiterbezahlt, und keine Auszahlung während des Arbeitsverhältnisses. Siehe Abschnitt 12.","q4szzd6nm1":"<b>Krankheit und Unfall:<\/b> Lohnfortzahlung für beschränkte Zeit (Art. 324a) oder ein Krankentaggeld, meist 80 %; die Unfallversicherung zahlt ab dem 3. Tag 80 %. Siehe Abschnitt 17.","bnnxs0vqyi":"<b>Familie:<\/b> Mutterschaft 14 Wochen zu 80 %, Vaterschaft 2 Wochen, Betreuungsurlaub bis zu 14 Wochen und bis zu 3 Tage pro Ereignis für eine kranke Angehörige oder einen kranken Angehörigen. Siehe Abschnitte 18 und 19.","r6xi99mtuq":"<b>Kündigung:<\/b> Kündigungsfrist von 1, 2 oder 3 Monaten je nach Dienstalter und 7 Tage in der Probezeit; Schutz bei Krankheit, Schwangerschaft und Militärdienst; eine missbräuchliche Kündigung gibt bis zu 6 Monatslöhne; fristlose Kündigung nur aus wichtigem Grund. Siehe Abschnitte 20–23.","hne0qn9jdd":"<b>Dokumente:<\/b> ein Arbeitszeugnis jederzeit (Art. 330a); ein Konkurrenzverbot nur schriftlich und begründet. Siehe Abschnitt 24.","4sxyd80bhm":"<b>Würde und Daten:<\/b> Der Arbeitgeber muss Ihre Persönlichkeit und Gesundheit schützen (Art. 328) und darf nur Daten bearbeiten, die für die Stelle nötig sind (Art. 328b).","uv3n20z46s":"<b>Sozialversicherungen:<\/b> Die Beiträge werden auf der Lohnabrechnung abgezogen; AHV, ALV, BVG und Unfallversicherung schützen Sie. Siehe Abschnitte 25 und 26.","7vkgmzwlkq":"<b>Was man nicht annehmen darf:<\/b> Es gibt keine allgemeine Abgangsentschädigung, keinen gesetzlichen 13. Monatslohn, keinen nationalen Mindestlohn, keine Pflicht, eine Kündigung zu begründen, und der einzige eidgenössische Feiertag ist der 1. August.","17w08ehw6hi":"<b>Wenn etwas schiefgeht:<\/b> Machen Sie es schriftlich geltend und bewahren Sie den Zustellnachweis auf. Bei einer Kündigung erheben Sie vor Ablauf der Kündigungsfrist schriftlich Einsprache und klagen innert 180 Tagen nach Ende des Arbeitsverhältnisses. Streitigkeiten bis CHF 30’000 sind kostenlos und beginnen bei der kantonalen Schlichtungsbehörde.","cos2ukziqf":"Rechtsquellen","1zfjac24d9s":"Obligationenrecht (OR, Art. 319–362): der Einzelarbeitsvertrag. Zwingende und relativ zwingende Vorschriften sind in Art. 361–362 aufgeführt.","27xci0vszp7":"Arbeitsgesetz (ArG) und seine Verordnungen: Arbeitszeit, Ruhezeit, Gesundheitsschutz und Arbeitssicherheit, besonderer Schutz von Jugendlichen und Schwangeren.","1yz3wl4s3af":"Gesamtarbeitsverträge (GAV) und Normalarbeitsverträge (NAV): legen oft höhere Mindeststandards nach Branche oder Kanton fest.","27gg02mm2dd":"Sozialversicherungsgesetze: AHV, ALV, BVG, UVG, EO, Familienzulagen.","6ke8x0ds8p":"Rangfolge: zwingendes Recht, dann Gesamtarbeitsvertrag, dann Einzelarbeitsvertrag, dann Betriebsreglement.","8v9ttf35kt":"<b>Zwingende Vorschriften:<\/b> OR Art. 361 nennt Regeln, die nie durch Vertrag geändert werden können; Art. 362 nennt Regeln, die nur zugunsten der Arbeitnehmerin oder des Arbeitnehmers geändert werden dürfen (Günstigkeitsprinzip).","2axpu4twgap":"<b>Weitere wichtige Gesetze:<\/b> Gleichstellungsgesetz (GlG), Datenschutzgesetz (revDSG, seit 2023 in Kraft), Mitwirkungsgesetz (Informations- und Konsultationsrechte), Entsendegesetz, Arbeitsvermittlungsgesetz (AVG, für Vermittler und Temporärbüros). Zum ArG gehören fünf Verordnungen: ArGV 1 (allgemein), 2 (besondere Branchen), 3 (Gesundheitsschutz), 4 (Industrielle Betriebe), 5 (Jugendarbeitsschutz).","p9p8qabqy8":"<b>Behörden und Streitigkeiten:<\/b> Das SECO (Bundesebene) und die kantonalen Arbeitsinspektorate vollziehen das ArG. Einzelstreitigkeiten gehen zuerst an eine Schlichtungsbehörde, dann an das Arbeitsgericht; bei arbeitsrechtlichen Streitigkeiten bis CHF 30’000 fallen keine Gerichtskosten an. Lohnforderungen verjähren nach 5 Jahren (Art. 128 OR).","1q6hh6mdioe":"<b>So lesen Sie eine Zitierung:<\/b> «Art. 335c Abs. 2 OR» bedeutet Artikel 335c, zweiter Absatz, des Obligationenrechts; «lit. a» bedeutet Buchstabe a; «ff.» bedeutet «und folgende Artikel». Die amtlichen Texte stehen auf Fedlex (fedlex.admin.ch) auf Deutsch, Französisch und Italienisch; Übersetzungen in andere Sprachen sind nur informativ.","run8mao4ye":"<b>SR-Nummern (Systematische Rechtssammlung):<\/b> OR = SR 220; ArG = SR 822.11; ArGV 1 = SR 822.111; AVIG (Arbeitslosenversicherung) = SR 837.0. AHVG = SR 831.10; BVG = SR 831.40; UVG = SR 832.20; EOG = SR 834.1; FamZG = SR 836.2; GlG = SR 151.1. Prüfen Sie stets den aktuellen Text auf Fedlex.","o2o9ssxdou":"<b>Reihenfolge der Abklärung bei einer HR- oder Lohnfrage:<\/b> 1) das Gesetz (OR, ArG und die Sozialversicherungsgesetze); 2) der Gesamtarbeitsvertrag (GAV) oder Normalarbeitsvertrag (NAV) der Branche; 3) der Einzelarbeitsvertrag; 4) das Betriebsreglement; 5) das Reglement des Versicherers oder der Pensionskasse für Leistungen.","13qctjc1ps8":"<b>Bund und Kantone:<\/b> Das Arbeitsrecht ist Bundesrecht, aber Feiertage, Mindestlöhne, Familienzulagen über dem Bundesminimum, die von den Gerichten angewandte Skala für die Lohnfortzahlung bei Krankheit und die Einkommenssteuer hängen vom Kanton ab.","1xew38gcttv":"4. Arbeitsvertrag","ntf6hztghm":"Es ist keine Form vorgeschrieben: Ein mündlicher Vertrag ist gültig (Art. 320). Befristete und unbefristete Verträge sind beide zulässig.","1wbf47cowzx":"Ist der Vertrag nicht schriftlich, muss der Arbeitgeber die wesentlichen Bedingungen innert eines Monats nach Arbeitsbeginn schriftlich mitteilen (Art. 330b): Parteien, Beginn, Funktion, Lohn und Zuschläge, Wochenstunden.","1qnuw0rl3c1":"Pflichten der Arbeitnehmerin oder des Arbeitnehmers: Sorgfalt und Treue (Art. 321a), einschliesslich Verschwiegenheit und Verbot konkurrenzierender Arbeit während des Arbeitsverhältnisses.","27w7t36py1x":"Pflichten des Arbeitgebers: Lohn zahlen, die Persönlichkeit und Gesundheit der Arbeitnehmerin oder des Arbeitnehmers schützen (Art. 328), den Datenschutz am Arbeitsplatz beachten (Art. 328b).","340wqb2j22":"<b>Vertragsarten:<\/b> unbefristet; befristet (endet automatisch, keine ordentliche Kündigung, es sei denn vereinbart; wiederholte befristete Verträge ohne sachlichen Grund können als unbefristet gelten); Teilzeit; Arbeit auf Abruf; Lehrvertrag (Schriftform erforderlich); Heimarbeit; Handelsreisender (Schriftform erforderlich).","136fpb9q07w":"<b>Haftung und Auslagen:<\/b> Die Arbeitnehmerin oder der Arbeitnehmer haftet nur für Schaden, den sie oder er absichtlich oder fahrlässig verursacht, und der Massstab hängt vom Risiko der Tätigkeit ab (Art. 321e). Der Arbeitgeber muss notwendige Auslagen ersetzen, etwa Reise- oder Telefonkosten (Art. 327a).","12vhua1laum":"<b>Vorstellungsgespräche:<\/b> Der Arbeitgeber darf nur fragen, was für die Stelle oder den Vertrag nötig ist (Art. 328b). Nebenjobs sind erlaubt, solange sie nicht konkurrenzieren oder die Treuepflicht verletzen.","12md3d1ugxp":"<b>Weisungen und Änderungen:<\/b> Der Arbeitgeber darf Weisungen zur Arbeit und zum Verhalten erteilen (Art. 321d OR), aber wesentliche Bedingungen nicht einseitig ändern: Eine Änderung braucht das Einverständnis der Arbeitnehmerin oder des Arbeitnehmers oder eine Kündigung mit Angebot neuer Bedingungen (Änderungskündigung).","2cj1zbf8ovv":"<b>Betriebsreglement:<\/b> Ein Personalreglement bindet die Arbeitnehmerin oder den Arbeitnehmer nur, wenn der Vertrag darauf verweist oder sie oder er es akzeptiert, und es darf nicht schlechter sein als das Gesetz oder der Vertrag.","828u16x1sh":"<b>Personendaten:<\/b> Die Arbeitnehmerin oder der Arbeitnehmer kann verlangen zu erfahren, welche Daten der Arbeitgeber über sie oder ihn führt; der Arbeitgeber muss sie richtig halten und nur bearbeiten, was die Stelle erfordert (Art. 328b OR und Datenschutzgesetz).","5ogxrvr1re":"<b>Tipp für die Vertragsgestaltung im HR:<\/b> Verwenden Sie pro Vertragsart eine Vorlage mit Beilagen (Stellenbeschrieb, Spesenreglement, Pensionskassen- und Versicherungsreglemente) und halten Sie das Datum fest, an dem die Mitarbeiterin oder der Mitarbeiter jede Beilage erhalten hat.","1eacgxih80o":"5. Vertragsarten, mit Praktikum im Detail","28wakt2usxd":"<b>Unbefristeter Vertrag:<\/b> der Normalfall. Probezeit, Kündigungsfristen und Sperrfristen funktionieren wie in den Abschnitten 6, 20 und 22.","1eginr7rzix":"<b>Befristeter Vertrag (Art. 334):<\/b> Er endet automatisch am vereinbarten Datum und braucht keine Kündigung. Er kann nicht vorzeitig beendet werden, ausser der Vertrag sieht es vor. Wird die Arbeit nach dem Enddatum einfach fortgesetzt, wird er unbefristet. Kettenverträge ohne sachliche Gründe können als unbefristet behandelt werden.","6gvgms1yk4":"<b>Teilzeit:<\/b> dieselben Rechte wie bei Vollzeit, anteilig (Ferien werden in Wochen gezählt und bleiben daher gleich). Die BVG-Eintrittsschwelle gilt für den Jahreslohn, ein tiefer Teilzeitlohn ist daher unter Umständen nicht versichert. Der gesetzliche Koordinationsabzug ist fix, was Teilzeitarbeitende stark trifft; viele Kassen skalieren ihn herunter, prüfen Sie daher das Reglement.","bz0f0tnfoh":"<b>Arbeit auf Abruf:<\/b> Die Stunden variieren je nach Abruf des Arbeitgebers. Halten Sie Mindest- und Höchststunden sowie die Vorankündigungsfrist für Abrufe schriftlich fest. Geleistete Stunden werden mit Ferien- und 13.-Monatslohn-Zuschlägen in Prozent vergütet; vom Arbeitgeber auferlegte Bereitschaftszeit muss unter Umständen bezahlt werden.","4vqvdnskjv":"<b>Lehre (Lehrvertrag, Art. 344 ff.):<\/b> ein besonderer schriftlicher Vertrag, von der kantonalen Behörde genehmigt, mit Bildungsplan, 2 bis 4 Jahre je nach Ausbildung, Probezeit von 1 bis 3 Monaten und mindestens 5 Wochen Ferien bis zum Alter von 20 Jahren.","1ednmn1yepr":"<b>Temporärarbeit:<\/b> ein Dreiecksverhältnis: Ein bewilligtes Personalverleihunternehmen stellt die Arbeitnehmerin oder den Arbeitnehmer an und verleiht sie oder ihn an den Einsatzbetrieb. Die Kündigungsfrist ist in den ersten Monaten kürzer, und der Branchen-Gesamtarbeitsvertrag (GAV Personalverleih) legt Mindestlöhne fest.","quzb3zh3e5":"<b>Freie Mitarbeit oder Auftrag (Auftrag, Werkvertrag):<\/b> kein Arbeitsvertrag. Die AHV schaut auf die tatsächliche Unterordnung, nicht auf die Bezeichnung: Ein «Freelancer», der Weisungen befolgt und in den Räumen des Auftraggebers arbeitet, kann als Arbeitnehmer eingestuft werden, mit Nachzahlung der Beiträge.","1mwrwrqv6io":"<b>Praktikum im Detail:<\/b> Die Schweiz hat kein Praktikumsgesetz. Ein bezahltes Praktikum mit produktiver Arbeit ist ein befristeter Arbeitsvertrag nach Art. 319 ff. OR, daher gelten die Arbeitnehmerrechte. Von Schule oder Hochschule vorgeschriebene Praktika werden oft über eine dreiseitige Vereinbarung (Praktikumsvereinbarung) geregelt, aber wenn die Praktikantin oder der Praktikant arbeitet und bezahlt wird, sollte ein Arbeitsvertrag bestehen.","djo3b35t9e":"<b>Was der Praktikumsvertrag enthalten sollte:<\/b> Beginn und Ende, Arbeitszeit, Bruttolohn, Probezeit, eine Klausel zur vorzeitigen Beendigung oder eine Kündigungsfrist, Ferien, Versicherungen, Lernziele und eine Betreuungsperson. Ein Bildungsplan ist gesetzlich nicht vorgeschrieben, aber das beste Zeichen für ein echtes Praktikum.","c98pedrjv9":"<b>Probezeit und Beendigung:<\/b> Der erste Monat gilt als Probezeit, sofern nichts anderes vereinbart ist, mit 7 Tagen Kündigungsfrist. Danach endet ein befristetes Praktikum ohne Kündigung (Art. 334) und kann nicht vorzeitig beendet werden, ausser der Vertrag erlaubt es, oder aus wichtigem Grund (Art. 337). Nehmen Sie eine Klausel zur vorzeitigen Beendigung auf, wenn Flexibilität gewünscht ist.","1mw7udtgu17":"<b>Lohn:<\/b> Es gibt keinen gesetzlichen Mindestlohn für Praktikantinnen und Praktikanten, und die Bezahlung liegt meist unter jener des regulären Personals, ist aber verhandelbar und muss im Vertrag stehen. Prüfen Sie, ob ein kantonaler Mindestlohn oder ein Gesamtarbeitsvertrag gilt.","1n11h5edcwb":"<b>Sozialversicherungen:<\/b> AHV/IV/EO (5,3 % Arbeitnehmeranteil) ist ab dem 1. Januar nach dem 17. Geburtstag geschuldet; Löhne bis CHF 2’500 pro Jahr sind befreit, sofern nicht verlangt. ALV 1,1 % gilt. Das BVG gilt nur, wenn der Jahreslohn CHF 22’680 übersteigt. UVG: Berufsunfall immer; Nichtberufsunfall ab 8 Stunden pro Woche.","2cjalzytmbf":"<b>Ferien und Zeugnis:<\/b> Ferien werden anteilig erworben (etwa 2 Wochen in 6 Monaten, 2,5 unter 20 Jahren) und normalerweise während des Praktikums bezogen. Am Ende kann die Praktikantin oder der Praktikant ein volles Zeugnis oder eine einfache Praktikumsbestätigung verlangen.","1xyklf6giq3":"<b>HR-Tipps:<\/b> Vermeiden Sie wiederholte aufeinanderfolgende Praktika für dieselbe Funktion (sie können als normale Anstellung behandelt werden), vereinbaren Sie einen klaren Lernplan, erfassen Sie die Arbeitszeit und nutzen Sie für EU-Bürgerinnen und -Bürger das Online-Meldeverfahren bis zu 90 Arbeitstagen oder eine Bewilligung L für längere Einsätze.","1i7maz367tw":"6. Probezeit","hhmx5nr6nr":"Normalfall: 1 Monat. Sie kann schriftlich (Vertrag, NAV oder GAV) auf höchstens 3 Monate geändert werden.","uadp35fffc":"Während der Probezeit kann jede Partei mit 7 Tagen Kündigungsfrist kündigen, ohne Begründung.","qcrzfmt32k":"Wird die Probezeit durch Krankheit, Unfall oder Militärdienst unterbrochen, verlängert sie sich um dieselbe Dauer.","mqoyr5ib4":"<b>Beispiel:<\/b> Eine neue Mitarbeiterin beginnt am 1. September mit der üblichen Probezeit von 1 Monat. Kündigt der Arbeitgeber am 20. September, endet der Vertrag am 27. September (7 Tage), nicht am Monatsende. Wird am 3. Oktober gekündigt, ist die Probezeit vorbei und es gilt die normale Kündigungsfrist.","5tiyl6lc31":"Während der Probezeit gelten die Sperrfristen nach Art. 336c (Krankheit, Schwangerschaft, Militärdienst) nicht, der Arbeitgeber darf also auch kündigen, wenn die Arbeitnehmerin oder der Arbeitnehmer krank ist. Die Regeln zur missbräuchlichen Kündigung gelten weiterhin.","cxs5fodc3":"Eine längere Probezeit (bis 3 Monate) muss schriftlich im Vertrag, NAV oder GAV vereinbart werden. Sie kann pro Arbeitsverhältnis nur einmal festgelegt werden: Für dieselbe Stelle lässt sie sich nicht wiederholen.","1pfz7hmo0k3":"<b>Befristete Verträge:<\/b> Ein befristeter Vertrag kann eine Probezeit enthalten; er endet trotzdem automatisch am Enddatum.","2c5yeo5w52z":"<b>Praxis:<\/b> HR-Abteilungen setzen für qualifizierte Stellen oft 3 Monate an, bedenken Sie aber, dass die Kündigungsfrist in der Probezeit für beide Seiten nur 7 Tage beträgt und die Sperrfristen nach Art. 336c nicht gelten.","2bkuh2cvlay":"<b>Lernende:<\/b> Die Probezeit einer Lehre beträgt 1 bis 3 Monate; sagt der Vertrag nichts, gelten 3 Monate (Art. 344a Abs. 3).","1w4wy0y9hgs":"8. Arbeitszeit","1v2hra0rlov":"Gesetzliche Höchstarbeitszeit pro Woche: 45 Stunden für Industriepersonal, Büro- und technisches Personal sowie Verkaufspersonal in Grossbetrieben des Detailhandels; 50 Stunden für alle übrigen.","1q2gs8qjj2m":"Übliche vertragliche Arbeitszeiten sind 40–42 Stunden pro Woche, das ist aber Sache von Vertrag oder GAV, nicht des Gesetzes.","26vny50gf98":"Leitende Angestellte mit echter Entscheidungsbefugnis sind von den meisten ArG-Regeln ausgenommen (Art. 3 lit. d). Andere können in manchen Fällen unter Bedingungen eine vereinfachte oder keine Arbeitszeiterfassung wählen.","23mshe2i1dw":"Tägliches Arbeitszeitfenster: 14 Stunden inklusive Pausen und Überzeit (Art. 10). Ruhezeit: 11 aufeinanderfolgende Stunden pro Tag (Art. 15a).","200yj79qdk6":"<b>Arbeitszeiterfassung (Art. 46 ArG, Art. 73 ArGV 1):<\/b> Der Arbeitgeber muss die Arbeitszeit, einschliesslich Pausen und Ruhezeit, für dem ArG unterstelltes Personal erfassen. Das ArG gilt nicht für höhere leitende Angestellte, bestimmte wissenschaftliche Mitarbeitende und Handelsreisende; für sie besteht daher keine gesetzliche Erfassungspflicht.","1msvpe0hq6w":"<b>Vollständiger Verzicht (Art. 73a ArGV 1):<\/b> nur möglich, wenn ein Gesamtarbeitsvertrag es erlaubt und die Arbeitnehmerin oder der Arbeitnehmer mehr als CHF 120’000 brutto pro Jahr verdient, grosse Autonomie hat und den Grossteil der eigenen Arbeitszeit selbst festlegt, und einzeln schriftlich zustimmt. Jede Seite kann ihn auf Jahresende widerrufen. Der Arbeitgeber bewahrt die Vereinbarung und die Liste der verzichtenden Mitarbeitenden für die Inspektoren auf.","3idu5f3jhc":"<b>Vereinfachte Erfassung (Art. 73b):<\/b> nur die täglich geleistete Gesamtarbeitszeit (plus Beginn und Ende bei Nacht- und Sonntagsarbeit). Voraussetzung ist, dass die Arbeitnehmerin oder der Arbeitnehmer einen wesentlichen Teil der Arbeitszeit selbst festlegt (mindestens ein Viertel), eine Vereinbarung mit der Arbeitnehmervertretung (oder eine individuelle in Betrieben mit weniger als 50 Mitarbeitenden) und eine dokumentierte jährliche Überprüfung.","1b1icn2zxaj":"<b>Pausen:<\/b> Eine Pause zählt als Arbeitszeit, wenn die Arbeitnehmerin oder der Arbeitnehmer den Arbeitsplatz nicht verlassen darf (Art. 15 Abs. 2 ArG). Das Minimum hängt von der täglichen Arbeitszeit ab: 15 Minuten über 5,5 Stunden, 30 Minuten über 7 und 60 Minuten über 9 Stunden.","o1t8xthnxm":"<b>Beispiel:<\/b> Eine Büroangestellte arbeitet von 8:00 bis 18:30 mit 1 Stunde Mittagspause, also 9,5 Nettostunden; die 60-minütige Pause ist das gesetzliche Minimum über 9 Stunden. Bei einer Höchstarbeitszeit von 45 Stunden kann sie an fünf Tagen je 9 Stunden arbeiten; ein sechster Tag ist bereits gesetzliche Überzeit (Abschnitt 10).","mxka9bg4ly":"9. Pausen, Nacht- und Sonntagsarbeit","1bg2od2kybp":"Pausen (bezahlt nur, wenn vereinbart oder auf Anordnung des Arbeitgebers am Arbeitsplatz verbracht): mindestens 15 Min., wenn der Tag 5,5 Std. überschreitet, 30 Min. über 7 Std., 60 Min. über 9 Std.","12h1bocezck":"Tagesarbeit: 06:00–20:00 Uhr; Abendarbeit 20:00–23:00 Uhr (braucht Anhörung oder Einverständnis); Nachtarbeit 23:00–06:00 Uhr ist verboten, ausser sie ist bewilligt.","1q6e69xkgxp":"Vorübergehende Nachtarbeit: 25 % Lohnzuschlag (oder gleichwertige Zeit). Sonntags- und Feiertagsarbeit ist verboten, ausser sie ist bewilligt; vorübergehende Sonntagsarbeit: 50 % Zuschlag.","2clr7eu0m8g":"Regelmässige Nachtarbeit gibt einen Zeitausgleich von 10 % und Anspruch auf medizinische Untersuchungen.","292li5tkoqk":"<b>Ruhezeit:<\/b> 11 aufeinanderfolgende Stunden Ruhe zwischen zwei Arbeitstagen; einmal pro Woche kann sie auf 8 Stunden gekürzt werden, wenn der Durchschnitt von 11 Stunden über zwei Wochen eingehalten wird (Art. 15a ArG).","bxz920ep3i":"<b>Nachtarbeit (23:00 bis 06:00 Uhr):<\/b> Sie braucht eine Bewilligung. Sie ist vorübergehend unter 25 Nächten pro Jahr, mit einem Lohnzuschlag von mindestens 25 %, und regelmässig ab 25 Nächten, mit 10 % der Nachtzeit als bezahlte Freizeit, auf die nicht durch Vereinbarung verzichtet werden kann. Nachts beträgt der Arbeitstag höchstens 9 Stunden innerhalb eines Zeitraums von 10 Stunden (Art. 17a ArG).","14x0sy5flb7":"<b>Gesundheitsuntersuchungen:<\/b> Wer 25 oder mehr Nächte pro Jahr arbeitet, hat Anspruch auf eine ärztliche Untersuchung und Beratung, alle 2 Jahre bis zum Alter von 45 Jahren und danach jährlich.","1lfhula29c8":"<b>Beispiel:<\/b> Stundenlohn CHF 30; eine Mitarbeiterin leistet 4 vorübergehende Nachtschichten zu je 6 Stunden innerhalb des Nachtfensters: 24 Stunden × CHF 30 × 25 % = CHF 180 Zuschlag.","yiyunpe4vi":"<b>Sonntagsarbeit:<\/b> Vorübergehende Sonntagsarbeit (bis zu 6 Sonntage pro Jahr) braucht eine kantonale Bewilligung und gibt 50 % Zuschlag plus Ersatzruhe. Regelmässige Sonntagsarbeit wird von der Bundesbehörde bewilligt und gibt keinen Lohnzuschlag, aber Ersatzruhe ist trotzdem geschuldet. Sonntagsarbeit von bis zu 5 Stunden wird mit gleich viel Freizeit ausgeglichen; längere Arbeit braucht einen Ersatzruhetag.","1i1h2v298s2":"<b>HR-Kontrolle:<\/b> Zählen Sie die Nächte jeder Mitarbeiterin und jedes Mitarbeiters pro Kalenderjahr, denn das entscheidet zwischen dem 25-%-Lohnzuschlag und dem 10-%-Zeitausgleich.","1ejk6rr7pa4":"10. Überstunden und Überzeit","wkky377g6j":"Zwei Begriffe: Überstunden (Stunden über der vertraglichen Arbeitszeit, OR) und Überzeit (Stunden über der gesetzlichen Wochenhöchstarbeitszeit, ArG).","1q7hg7a6rcs":"OR: Die Arbeitnehmerin oder der Arbeitnehmer muss Überstunden leisten, wenn sie nötig und zumutbar sind. Abgeltung: Bezahlung mit 25 % Zuschlag oder Freizeit 1:1, wenn beide einverstanden sind. Auf den Zuschlag kann schriftlich verzichtet werden.","1ucusu1mzbr":"ArG: Über der Höchstarbeitszeit von 45/50 Std. ist ein Zuschlag von 25 % zwingend (für andere als leitende Angestellte; die ersten 60 Std. pro Jahr bei Büro-, technischen und Verkaufstätigkeiten geben keinen Zuschlag). Jahreshöchstgrenze 170 Std. (45-Std.-Gruppe) bzw. 140 Std. (50-Std.-Gruppe).","flfledj12s":"<b>Definitionen nochmals:<\/b> Überstunden sind Stunden über der Vertragsarbeitszeit (Art. 321c OR); Überzeit sind Stunden über der gesetzlichen Höchstarbeitszeit von 45 oder 50 Stunden pro Woche (Art. 12–13 ArG). Überstunden ohne Überzeit sind möglich (zum Beispiel 42 bis 44 Stunden pro Woche), und über 45 oder 50 Stunden hat man beides zugleich.","5pyubvyya5":"<b>Wann Überzeit zulässig ist:<\/b> nur bei dringender Arbeit oder ausserordentlichem Arbeitsanfall (Art. 12 ArG), und es ist keine Bewilligung nötig. Grenzen: höchstens 2 Stunden pro Tag und Person (mehr an arbeitsfreien Werktagen und in Notfällen) und höchstens 170 Stunden pro Jahr (45-Stunden-Gruppe) bzw. 140 Stunden (50-Stunden-Gruppe).","13gsqvq9hpm":"<b>Abgeltung:<\/b> Überzeit braucht einen Zuschlag von 25 % oder gleich viel Freizeit, wenn die Arbeitnehmerin oder der Arbeitnehmer einverstanden ist. Büro-, technisches und Verkaufspersonal im Grossdetailhandel erhält den Zuschlag erst ab 60 Stunden Überzeit im Kalenderjahr, der Grundlohn für alle Stunden ist aber trotzdem geschuldet. Überstunden folgen Art. 321c: 25 % Zuschlag oder gleich viel Freizeit nach Vereinbarung, sofern keine schriftliche Vereinbarung etwas anderes vorsieht (zum Beispiel einen tieferen oder keinen Zuschlag).","1kgmt2h3xfc":"<b>Leitende Angestellte:<\/b> Höhere leitende Angestellte fallen nicht unter die Stundengrenzen des ArG: Es gilt nur das OR, und sie können schriftlich auf die Überstundenvergütung verzichten. Andere Kader unterstehen den Überzeitregeln des ArG.","ltoa28ohtk":"<b>Beispiel:<\/b> Eine Büroangestellte verdient CHF 40 pro Stunde und leistet in einem Jahr 100 Stunden Überzeit. Der Arbeitgeber schuldet den Grundlohn für alle 100 Stunden (CHF 4’000) plus den 25-%-Zuschlag nur auf die 40 Stunden über den ersten 60: 40 × CHF 40 × 25 % = CHF 400. Total CHF 4’400.","9xgb892685":"Prüfen Sie den aktuellen Text von Art. 13 ArG und den GAV Ihrer Branche, bevor Sie dies in der Lohnbuchhaltung anwenden.","lb6luq3s3f":"11. Rechenbeispiele: Überstunden, Ferien, 13. Monatslohn","1wmdqto1ogm":"<b>Überstunden:<\/b> Eine Büroangestellte hat eine Vertragswoche mit 42 Stunden und verdient etwa CHF 44 pro Stunde. In einer Woche arbeitet sie 46 Stunden. Die 4 zusätzlichen Stunden sind Überstunden (über dem Vertrag): CHF 44 × 125 % = CHF 55 pro Stunde, also CHF 220, oder 4 Stunden Freizeit, wenn beide Seiten einverstanden sind. Eine Klausel, wonach Überstunden im Lohn inbegriffen sind, wird meist nur akzeptiert, wenn sie schriftlich ist und auf eine angemessene Stundenzahl begrenzt.","f35lussn5u":"Die 46. Stunde liegt auch über der gesetzlichen Höchstarbeitszeit von 45 Stunden (Überzeit). Für Büropersonal geben die ersten 60 Stunden Überzeit pro Jahr keinen gesetzlichen Zuschlag. Der Arbeitgeber darf Überzeit nicht über 2 Stunden pro Tag (ausser in Notfällen) und nicht über die Jahreshöchstgrenze von 170 Stunden hinaus anordnen.","1ds1ynib0gq":"Arbeitszeiterfassung: Der Arbeitgeber muss die Arbeitszeit erfassen (ArGV 1 Art. 73), ausser es gilt eine vereinfachte Erfassung oder ein Verzicht. Die Aufzeichnungen werden 5 Jahre aufbewahrt.","26510o0bqat":"<b>Ferien:<\/b> Eine Mitarbeiterin tritt am 1. Juli ein. Vier Wochen pro Jahr ergeben anteilig 2 Wochen für das verbleibende halbe Jahr (2,5 Wochen unter 20 Jahren).","205xdh8o1ec":"Krankheit und Ferien: Ist die Arbeitnehmerin oder der Arbeitnehmer in einem Jahr mehr als einen Monat krank, darf der Arbeitgeber die Ferien für jeden vollen Monat nach dem ersten um 1/12 kürzen (Art. 329b). Beispiel: 3 Monate Krankheit = 2/12 von 20 Tagen = etwa 3,3 Tage. Bei Schwangerschaft beginnt die Kürzung erst nach 2 Monaten. Wer während der Ferien erkrankt und sich nicht erholen kann, dessen Tage zählen normalerweise nicht als Ferien (ärztliches Zeugnis).","1qwhd2zb059":"Stundenlöhner: Die Ferienentschädigung wird als Prozentsatz zugeschlagen: 8,33 % bei 4 Wochen, 10,64 % bei 5 Wochen, und sie muss auf der Lohnabrechnung ausgewiesen werden.","11qj59591zg":"<b>13. Monatslohn:<\/b> Jahreslohn CHF 78’000 in 13 Auszahlungen = CHF 6’000 pro Monat. Tritt die Mitarbeiterin am 31. August aus, ist der 13. normalerweise anteilig geschuldet: 8/12 × 6’000 = CHF 4’000.","1lio9q5jt1p":"12. Ferien und Feiertage","1eqbn3erkh3":"Mindestens 4 Wochen pro Jahr; 5 Wochen bis zum Jahr, in dem die Arbeitnehmerin oder der Arbeitnehmer 20 wird. Verträge und GAV geben oft 5 Wochen oder mehr.","2dkxxki5gau":"Mindestens zwei zusammenhängende Wochen müssen im Jahr am Stück bezogen werden.","rntqx8cb47":"Der Lohn wird während der Ferien weitergezahlt; Ferien dürfen während des Arbeitsverhältnisses nicht durch Geld abgegolten werden (Art. 329d).","b08lmxoz7z":"Der einzige eidgenössische Feiertag ist der 1. August. Alle anderen werden von Kanton oder Gemeinde festgelegt.","qsdhfq4vlt":"<b>Wann Ferien bezogen werden (Art. 329c):<\/b> Sie werden normalerweise im Dienstjahr bezogen. Der Arbeitgeber bestimmt den Zeitpunkt, muss aber auf die Wünsche der Arbeitnehmerin oder des Arbeitnehmers Rücksicht nehmen, soweit der Betrieb es erlaubt. Mindestens zwei Wochen müssen zusammenhängen.","26ayozy3hb4":"<b>Kein Geld statt Ferien (Art. 329d):<\/b> Geld statt Ferien während des Arbeitsverhältnisses ist nicht erlaubt, ausser in Ausnahmefällen wie unregelmässiger Arbeit, wo der prozentuale Zuschlag auf der Lohnabrechnung klar ausgewiesen sein muss. Nicht bezogene Tage werden erst bei Beendigung des Arbeitsverhältnisses ausbezahlt.","a72uz2ut8y":"<b>Kürzungen (Art. 329b):<\/b> Ist die Arbeitnehmerin oder der Arbeitnehmer aus Gründen abwesend, die sie oder er nicht verschuldet hat (Krankheit, Unfall, Militärdienst), und zwar im Jahr mehr als einen Monat, darf der Arbeitgeber die Ferien für jeden vollen Monat nach dem ersten um 1/12 kürzen. Bei Schwangerschaft zählen nur Abwesenheiten über zwei volle Monate. Ist die Abwesenheit selbstverschuldet und übersteigt einen Monat im Jahr, beträgt die Kürzung 1/12 für jeden vollen Monat.","2b2dlft16k1":"<b>Feiertage:<\/b> Der 1. August ist der einzige vom Gesetz bezahlte Feiertag, im Verhältnis zum Pensum. Die Kantone können bis zu 8 weitere Feiertage den Sonntagen gleichstellen (Art. 20a ArG). Für andere Feiertage behalten Monatslöhnerinnen und -löhner meist ihren Lohn, während Stundenlöhnerinnen und -löhner ohne Vereinbarung oft keinen Anspruch haben. Ein Feiertag innerhalb einer Ferienperiode zählt nicht als Ferientag, und Teilzeitangestellte erhalten keine zusätzlichen Tage, wenn ein Feiertag auf einen Tag fällt, an dem sie nicht arbeiten.","j194eieuqm":"<b>Krankheit während der Ferien:<\/b> Informieren Sie den Arbeitgeber sofort. Hat die Krankheit die Erholung verhindert (mit ärztlichem Zeugnis), können diese Tage nachgeholt werden, und der Arbeitgeber legt die Ersatztermine fest.","b49adnu5lc":"<b>Beispiel:<\/b> Eine Teilzeitangestellte, die von Montag bis Mittwoch arbeitet, hat bei 4 Wochen = 12 Arbeitstage Ferien (4 × 3 Tage), nicht 20.","1smstby9etp":"13. Lohn","1dpl6nfe12i":"Es gibt keinen eidgenössischen Mindestlohn. Die Kantone Genf, Neuenburg, Jura, Tessin und Basel-Stadt haben eigene Mindestlöhne, und einige GAV legen Branchenminima fest.","9ayzhf6xhu":"Der Lohn wird monatlich am Monatsende bezahlt, sofern nichts anderes vereinbart ist. Eine schriftliche Lohnabrechnung ist vorgeschrieben (Art. 323b).","25zlzppr0zy":"Der 13. Monatslohn ist nur obligatorisch, wenn er im Vertrag oder GAV vereinbart ist. Ist er vereinbart, ist er bei Beendigung im Laufe des Jahres normalerweise anteilig geschuldet; eine freiwillige Gratifikation (Art. 322d) ist etwas anderes.","1rtcfieln9z":"Arbeitgeber dürfen vom Lohn nur abziehen, was Gesetz und Vertrag erlauben, und Abzüge für Schäden sind streng begrenzt. Gleicher Lohn für gleichwertige Arbeit ist durch das Gleichstellungsgesetz vorgeschrieben.","1ebk6fyt5vy":"<b>Bestandteile:<\/b> Grundlohn, 13. Monatslohn, Provisionen (Art. 322b), Bonus, Spesenentschädigungen und Naturalleistungen. Ist kein Lohn vereinbart, ist der übliche geschuldet (Art. 322).","704v23jt5y":"<b>Gratifikation oder Bonus:<\/b> Eine Gratifikation (Art. 322d) ist freiwillig und liegt im Ermessen des Arbeitgebers. Wird sie aber regelmässig ohne Vorbehalt ausgerichtet oder ist sie an messbare Ziele geknüpft, kann sie zu einem Lohnbestandteil werden, auf den ein Anspruch besteht. Prüfen Sie stets den Wortlaut.","eym0zmcxl0":"<b>Zahlung und verspäteter Lohn:<\/b> Der Lohn wird monatlich bezahlt; zahlt der Arbeitgeber nach einer Mahnung verspätet, läuft ein Verzugszins von 5 % pro Jahr (Art. 104). Der Arbeitgeber kann den Lohn nicht einseitig kürzen: Eine Änderung braucht Einverständnis oder eine Kündigung mit neuem Angebot (Änderungskündigung).","1nafta4udi3":"<b>Lohngleichheitsanalyse:<\/b> Arbeitgeber mit 100 oder mehr Mitarbeitenden müssen eine Lohngleichheitsanalyse durchführen, überprüfen lassen und die Mitarbeitenden informieren (GlG Art. 13a ff.) und sie alle 4 Jahre wiederholen, wenn die Gleichheit noch nicht nachgewiesen ist.","1k5vagqmzns":"<b>Mindestlöhne:<\/b> Es gibt keinen nationalen Mindestlohn. Im Jahr 2026 haben fünf Kantone gesetzliche Mindestlöhne, brutto pro Stunde: Genf CHF 24.59 (ab 2027: 24.73), Basel-Stadt 22.20, Jura 21.40, Neuenburg 21.35 und Tessin 20.00–20.50 je nach Branche. Die Stadt Luzern hat seit 2026 22.75, und die Städte Zürich (23.90) und Winterthur (23.00) haben Mindestlöhne beschlossen, die das Bundesgericht im Mai 2026 bestätigt hat, die aber noch nicht in Kraft sind. Waadt hat im Juni 2026 den Grundsatz beschlossen, aber noch keinen Betrag. Lernende, Praktikantinnen und Praktikanten, Minderjährige und Ferienjobs sind je nach Regelung oft ausgenommen. Die Details nach Kanton finden Sie unter Werkzeuge, «Unterschiede zwischen den Kantonen».","27noqye9epm":"<b>Gesamtarbeitsverträge:<\/b> In Branchen mit GAV ergeben sich die Lohnuntergrenzen aus dem Vertrag (zum Beispiel der L-GAV im Gastgewerbe). In Tessin, Basel-Stadt und Jura geht ein allgemeinverbindlicher GAV dem kantonalen Mindestlohn vor; in Genf und Neuenburg gilt der kantonale Mindestlohn. Am 19. Juni 2026 hat das Parlament ein Gesetz verabschiedet, das den Mindestlöhnen allgemeinverbindlicher Gesamtarbeitsverträge Vorrang vor kantonalen und kommunalen einräumt (mit einer Sonderregelung für Genf und Neuenburg); Gewerkschaften haben das Referendum eingereicht, eine Abstimmung wird daher für 2027 erwartet. Prüfen Sie die aktuelle Regelung.","216lvqmznpz":"<b>Stunden- und Monatslohn:<\/b> Monatslohn = Stundenlohn × Wochenstunden × 52 ÷ 12. Bei 42 Stunden pro Woche ergibt ein Lohn von CHF 22 pro Stunde 22 × 42 × 52 ÷ 12 = CHF 4’004 pro Monat.","1wa0a67e2uy":"14. Lohnbuchhaltung: Lohnabrechnung, beitragspflichtiger Lohn, 12 oder 13 Auszahlungen","5tiw8n0pxy":"<b>Von Brutto zu Netto:<\/b> Die Lohnabrechnung (vorgeschrieben durch Art. 323b OR) geht vom Bruttolohn aus, zieht die Sozialabgaben der Arbeitnehmerin oder des Arbeitnehmers und gegebenenfalls die Quellensteuer ab und endet mit dem Nettolohn. Der Arbeitgeber fügt seinen eigenen Anteil hinzu und zahlt beides an die Ausgleichskasse und die Versicherer. Nach Jahresende stellt der Arbeitgeber den Lohnausweis aus, den Sie der Steuererklärung beilegen.","18wrq54vdpd":"<b>Was für AHV/IV/EO und ALV zählt (massgebender Lohn):<\/b> Grundsätzlich zählt jede Entschädigung für unselbständige Arbeit. Dazu gehören Grundlohn, 13. Monatslohn, Boni und Gratifikationen, Provisionen, Überstundenentschädigungen und Zuschläge, Nacht- und Sonntagszuschläge, Ferienentschädigung, Naturalleistungen (private Nutzung eines Geschäftswagens, kostenlose Unterkunft oder Verpflegung, zu Pauschalansätzen bewertet) und vom Arbeitgeber bezahlte private Kosten.","4wx41c9wa3":"<b>Was nicht zählt:<\/b> Familienzulagen; echte Spesenvergütungen (tatsächliche Kosten, etwa Geschäftsreisen gegen Beleg, oder genehmigte Pauschalen); geringfügige oder unregelmässige Naturalleistungen wie ein Halbtax-Abo, ein Geschäftstelefon oder gelegentliche Essenseinladungen; Löhne bis CHF 2’500 pro Jahr bei einem Arbeitgeber (nicht für Haushaltsarbeit, und die Arbeitnehmerin oder der Arbeitnehmer kann trotzdem Beiträge verlangen); und die eigenen Beiträge des Arbeitgebers. Als «Spesen» getarnter Lohn funktioniert nicht: Die AHV behandelt ihn als Lohn.","1twsy9hsoqk":"<b>Obergrenzen und Unterschiede je Versicherung:<\/b> Die AHV/IV/EO hat keine Obergrenze. ALV und UVG sind bei CHF 148’200 Lohn plafoniert. Das BVG verwendet die eigene Definition des versicherten Lohns der Pensionskasse (oft der feste Lohn inklusive 13., manchmal ohne unregelmässige Boni), lesen Sie daher das Reglement Ihrer Kasse.","1kk8il8wxeb":"<b>Typische Abzüge auf einer Schweizer Lohnabrechnung:<\/b> AHV/IV/EO 5,3 %; ALV 1,1 %; BVG (Arbeitnehmeranteil an die Pensionskasse); NBU (Nichtberufsunfall); oft KTG (Krankentaggeld), wenn der Arbeitgeber eines hat; und Quellensteuer, wenn Sie keine Bewilligung C haben. Familienzulagen zahlt der Arbeitgeber zusätzlich, und sie sind kantonal geregelt.","1q2ci2kzak3":"<b>Beispiel mit 13 Auszahlungen:<\/b> Jahresbrutto CHF 97’500 = 13 × CHF 7’500, Arbeitnehmer 40 Jahre alt. Monatliche Abzüge: AHV/IV/EO CHF 397.50; ALV CHF 82.50; BVG etwa CHF 247 (CHF 3’213 pro Jahr ÷ 13); NBU mit 1,0 % angenommen = CHF 75. Netto vor Quellensteuer: etwa CHF 6’698. Die 13. Auszahlung, meist im November oder Dezember, unterliegt ebenfalls AHV und ALV und je nach Kasse dem BVG. Das ist eine Vereinfachung: Die tatsächlichen BVG- und NBU-Sätze hängen von Ihrer Kasse und Ihrem Versicherer ab.","ax7ps62d3o":"<b>12 oder 13 Auszahlungen:<\/b> In der Schweiz nennt der Vertrag einen Jahresbruttolohn und wie er ausbezahlt wird: «12 × CHF 8’000» (CHF 96’000) oder «13 × CHF 7’385» (rund CHF 96’000). Der 13. ist gesetzlich nicht vorgeschrieben; es gibt ihn nur, wenn er im Vertrag, in einem Gesamtarbeitsvertrag oder im Betriebsreglement vereinbart ist. Er wird meist im November oder Dezember ausbezahlt (manchmal je die Hälfte im Juni und Dezember). Vergleichen Sie Jahresbruttolöhne, nicht Monatslöhne: CHF 78’000 sind CHF 6’500 pro Monat bei 12 Auszahlungen, aber CHF 6’000 bei 13.","1jpkm67zu6x":"<b>Stundenlöhner:<\/b> Der 13. Monatslohn wird mit 8,33 % (1/12) auf den Stundenlohn aufgeschlagen, und die Ferienentschädigung (8,33 % oder 10,64 %) erscheint als eigener Prozentsatz auf der Lohnabrechnung.","elepz5aew5":"<b>Arbeitgeberkosten:<\/b> Zusätzlich zum Bruttolohn zahlt der Arbeitgeber AHV/IV/EO 5,3 % und ALV 1,1 %, mindestens die Hälfte des BVG, die Berufsunfallversicherung (BU), meist einen Teil der Krankentaggeldprämie, den Beitrag an die (kantonale) Familienausgleichskasse und kleine Verwaltungskosten. Als grobe Schätzung sind das etwa 12–20 % über dem Brutto, je nach Kanton, Branche und Pensionskasse.","1mueamj7zqi":"15. Beispiel-Lohnabrechnungen für verschiedene Fälle","olh3pfmafj":"<b>Annahmen (monatlich, CHF):<\/b> AHV/IV/EO 5,3 %; ALV 1,1 % bis CHF 148’200 pro Jahr; BVG Arbeitnehmerhälfte der gesetzlichen Gutschrift (Alter 25–34: 7 %, 35–44: 10 %, 45–54: 15 %, 55–65: 18 %) auf dem koordinierten Lohn (Jahresbrutto minus CHF 26’460, maximal CHF 64’260); NBU mit 1,0 % angenommen; keine Quellensteuer. Die tatsächlichen Sätze von Pensionskasse und Versicherer weichen ab.","xypyl4xzhj":"<b>A. Standardangestellte, 12 Auszahlungen:<\/b> CHF 6’000 pro Monat (CHF 72’000 pro Jahr), Alter 30. AHV/IV/EO CHF 318.00; ALV CHF 66.00; BVG CHF 132.83 (7 % × (72’000 − 26’460) = CHF 3’187.80 pro Jahr, Hälfte, ÷ 12); NBU CHF 60.00. Total Abzüge CHF 576.83; Netto vor Quellensteuer CHF 5’423.17. Der Arbeitgeber zahlt mindestens CHF 516.83 zusätzlich (318.00 + 66.00 + 132.83), plus BU, KTG, Familienkasse und Gebühren.","1wnwuqc7te7":"<b>B. 13 Auszahlungen:<\/b> CHF 7’500 × 13 (CHF 97’500 pro Jahr), Alter 40. AHV/IV/EO CHF 397.50; ALV CHF 82.50; BVG CHF 247.15; NBU CHF 75.00. Netto CHF 6’697.85 pro Auszahlung, mit denselben Abzügen auf der 13. Auszahlung. Die Verteilung des BVG auf 13 Auszahlungen ist eine Vereinfachung.","17pgggp9jmv":"<b>C. Teilzeit 50 %:<\/b> CHF 3’500 × 12 (CHF 42’000), Alter 40. AHV/IV/EO CHF 185.50; ALV CHF 38.50; BVG CHF 64.75 (10 % × (42’000 − 26’460) = CHF 1’554 pro Jahr, Hälfte, ÷ 12, mit dem gesetzlichen festen Koordinationsabzug); NBU CHF 35.00. Netto CHF 3’176.25. Viele Kassen skalieren den Koordinationsabzug für Teilzeitangestellte, was den BVG-Betrag ändern würde.","ozuhwmjmc5":"<b>D. Tiefer Lohn, unter der BVG-Schwelle:<\/b> CHF 1’800 × 12 (CHF 21’600, unter CHF 22’680). AHV/IV/EO CHF 95.40; ALV CHF 19.80; kein BVG; NBU CHF 18.00 (ab 8 Stunden pro Woche). Netto CHF 1’666.80.","23f4d55vpsa":"<b>E. Hoher Verdienst über den Obergrenzen:<\/b> CHF 20’000 × 12 (CHF 240’000), Alter 50. AHV/IV/EO CHF 1’060.00 auf dem ganzen Lohn; ALV CHF 135.85 (nur auf CHF 12’350 pro Monat, der Obergrenze ÷ 12); BVG CHF 401.63 (15 % × CHF 64’260 = CHF 9’639 pro Jahr, Hälfte, ÷ 12, nur obligatorisches Minimum); NBU CHF 123.50 (plafonierter Lohn). Netto vor Steuern CHF 18’279.02. Überobligatorische Pläne fügen meist mehr BVG hinzu.","jp9dpkcm0m":"<b>F. Arbeiten nach dem Referenzalter (65):<\/b> CHF 5’000 pro Monat. Mit dem monatlichen Freibetrag von CHF 1’400 gilt die AHV/IV/EO nur auf CHF 3’600 = CHF 190.80; keine ALV; BVG freiwillig; NBU CHF 50.00. Netto CHF 4’759.20.","l9al0x8j2l":"<b>G. Angestellte ohne Bewilligung C:<\/b> dieselben Abzüge wie in Fall A, plus Quellensteuer: ein kantonaler Tarif nach Kanton, Zivilstand und Kindern, vom Lohn abgezogen und anstelle der normalen Steuerzahlungen. Siehe die Regel mit CHF 120’000 in Abschnitt 3.","1bqrhr5e2ur":"16. Eine echte Lohnabrechnung Zeile für Zeile lesen","2fbdrr79t0k":"<b>Aufbau:<\/b> Eine echte Schweizer Abrechnung listet Bezeichnung, Anzahl, %, Basis und Betrag in drei Blöcken (Lohn, Abzüge, Weitere Abzüge) und endet mit dem Nettolohn. Fall K des Simulators bildet eine solche nach, ohne persönliche Daten.","pbaj1djs8j":"<b>Festlohn und Anzahl:<\/b> Festlohn ist der feste Monatslohn. In der Gastronomie zählt die Lohnbuchhaltung einen Monat oft als 30 Tage (Anzahl 30.00), ein Teilmonat wird daher in Tagen bezahlt. Andere Branchen lassen Anzahl leer.","1u2o96o8usg":"<b>13. Monatslohn:<\/b> Die Zeile kann in Monaten ohne 13. Auszahlung mit 0.00 erscheinen. Der Betrag erscheint im vertraglich festgelegten Monat.","4zumh5vpdn":"<b>AHV/IV/EO 5.300 % und ALV 1.100 %:<\/b> auf dem ganzen Bruttolohn (ALV bis CHF 148’200 pro Jahr). Kontrolle: 4’200.00 × 5,3 % = 222.60; × 1,1 % = 46.20.","3xen7ccg8n":"<b>Krankengeldversicherung (KTG), 0.770 %:<\/b> Krankentaggeldversicherung. Der Satz stammt vom Versicherer, und der Abzug ist der Arbeitnehmeranteil. 4’200 × 0,77 % = 32.34, nach Rundung als 32.35 ausgewiesen.","128lisf4up5":"<b>Unfallversicherung (NBU), 1.433 %:<\/b> Prämie für Nichtberufsunfall, festgelegt vom Versicherer und von der Risikoklasse des Arbeitgebers. 4’200 × 1,433 % = 60.19, als 60.20 ausgewiesen. In Abschnitt 15 haben wir 1,0 % angenommen: Die tatsächlichen Sätze weichen ab.","2e316gcd0le":"<b>UVG Zusatzversicherung, 0.020 %:<\/b> Zusatzversicherung Unfall, also Deckung über das gesetzliche UVG hinaus. Auf dieser Abrechnung steht für den Arbeitnehmer 0.00, sie wird ihm also nicht belastet.","29t4opexvtp":"<b>Berufliche Vorsorge, 7.000 % auf 1’995.00:<\/b> Der Arbeitnehmersatz wird von der Pensionskasse festgelegt. Die Basis ist der koordinierte Monatslohn: (4’200 × 12 − 26’460) ÷ 12 = 1’995. 1’995 × 7 % = 139.65. In Abschnitt 15 haben wir die Hälfte der gesetzlichen Gutschrift verwendet; viele Kassen verrechnen stattdessen einen festen Prozentsatz des koordinierten Lohns, der auch Risiko- und Verwaltungskosten deckt.","f33unrftxp":"<b>Quellensteuer nach Tarif (A0N), 1.770 %:<\/b> Quellensteuer nach einem kantonalen Tarif. Der Code besteht aus drei Teilen: A = alleinstehend, 0 = Anzahl Kinderabzüge, N = keine Kirchensteuer (Y = mit Kirchensteuer). Der Arbeitgeber wendet den Code gemäss der Erklärung der Arbeitnehmerin oder des Arbeitnehmers an. 4’200 × 1,77 % = 74.34, als 74.35 ausgewiesen.","39zghyi9pm":"<b>Weitere Abzüge, Verpflegung pauschal:<\/b> eine Verpflegungspauschale, 30 Tage × CHF 9.00 = CHF 270.00, nach den Sozialabzügen vom Nettolohn abgezogen. Die AHV-Basis bleibt auf dieser Abrechnung bei 4’200. Die AHV-Pauschalen (Frühstück 3.50, Mittagessen 10.00, Abendessen 8.00 pro Tag) sind wichtig, wenn der Arbeitgeber weniger als den Pauschalwert verrechnet oder die Mahlzeiten gratis abgibt.","24yzma7sjob":"<b>Block Nettolohn:<\/b> Nettolohn 3’354.65 = 4’200.00 − 575.35 (Abzüge) − 270.00 (Weitere Abzüge). Differenz Vormonat ist meist eine Korrektur aus dem Vormonat, Zahlung am zeigt das Zahlungsdatum und das Dateiformat (XML / ISO 20022 ist der Bankdatei-Standard), und Restbetrag/Übertrag ist ein vorgetragener Betrag. Klären Sie das mit Ihrem Lohnbuchhaltungsanbieter.","1mmnc31ck98":"<b>Rundung:<\/b> Die Schweizer Lohnbuchhaltung rundet jeden Abzug üblicherweise auf 5 Rappen, wie hier zu sehen (32.34 auf 32.35, 60.19 auf 60.20, 74.34 auf 74.35).","1onusew8rr6":"7. HR-Prozesse: Eintritt, monatliche Lohnbuchhaltung, Jahresabschluss, Austritt","jt4ifdkzm0":"<b>Eintritt, vor dem Starttermin:<\/b> Prüfen Sie das Arbeitsrecht (eine EU/EFTA-Staatsangehörige oder ein EU/EFTA-Staatsangehöriger braucht eine Bewilligung oder, bis zu 90 Arbeitstagen, die Online-Meldung) und unterzeichnen Sie den Vertrag oder geben Sie die Bedingungen innert eines Monats schriftlich bekannt (Art. 330b). Vereinbaren Sie Probezeit, Lohn, Anzahl Auszahlungen und Pensum.","9ub0o9eq81":"<b>Eintritt, Anmeldungen:<\/b> AHV (hat die Person keine AHV-Nummer, verlangen Sie bei der Ausgleichskasse den Versicherungsausweis beim Eintritt; neue Mitarbeitende werden einmal jährlich mit der Lohnmeldung gemeldet); Pensionskasse, wenn der Lohn die Eintrittsschwelle übersteigt, einschliesslich Übertrag der Freizügigkeitsleistung der früheren Kasse; Unfallversicherer (BU, und NBU ab 8 Stunden pro Woche); Krankentaggeldversicherung, falls der Betrieb eine hat; Familienausgleichskasse und Familienbüchlein für Mitarbeitende mit Kindern; Quellensteuercode gemäss Erklärung der Person, wenn sie keine Bewilligung C hat. Die Krankenversicherung (KVG) ist Sache der Person selbst, nicht der Lohnbuchhaltung.","1mnebnh737f":"<b>Jeden Monat:<\/b> variable Daten erfassen (Stunden, Absenzen, Boni, Spesen), berechnen, die schriftliche Lohnabrechnung ausstellen (Art. 323b) und bis Monatsende zahlen. Der Arbeitgeber zahlt AHV-, ALV- und Familienkassen-Akonti monatlich oder vierteljährlich an die Ausgleichskasse, innert 30 Tagen nach Periodenende, sonst läuft Zins. Beiträge an Pensionskasse und Versicherer folgen dem Reglement der jeweiligen Kasse; die Quellensteuer wird nach den Regeln des Kantons mit diesem abgerechnet.","1oxtun5d4lc":"<b>Änderungen im Laufe des Jahres:<\/b> Melden Sie den Versicherern und der Kasse jede Änderung von Lohn, Pensum, Zivilstand oder Austritt.","17nfpx9n5ji":"<b>Jahresende:<\/b> Die Lohnmeldung an die Ausgleichskasse (AHV/IV/EO/ALV/FAK) muss bis 30. Januar eintreffen, bei Verspätung mit 5 % Verzugszins. Unfall- und Krankentaggeldmeldungen haben meist dasselbe Datum, das der Vertrag festlegt. Die Pensionskasse will die Löhne des kommenden Jahres im Voraus. Die Angestellten erhalten im Januar ihren Lohnausweis (das gleiche Formular in der ganzen Schweiz) für die Steuererklärung.","1lnp8qzz475":"<b>Austritt:<\/b> Stellen Sie die Schlussabrechnung aus (Ferienauszahlung, anteiliger 13., Überstunden), das Arbeitszeugnis oder die Arbeitsbestätigung (Art. 330a) und jede für das Arbeitslosengeld nötige Arbeitgeberbescheinigung. Melden Sie den Austritt der Pensionskasse (die Freizügigkeitsleistung geht an die neue Kasse oder ein Freizügigkeitskonto), dem Unfallversicherer und der Ausgleichskasse. Der Versicherungsschutz läuft nach dem Austritt 31 Tage nach UVG und 1 Monat nach BVG weiter, sagen Sie der Person daher, was sie zu regeln hat.","31m694y5hm":"<b>Gute Praxis:<\/b> Führen Sie pro Phase eine Checkliste, halten Sie den Nachweis jeder schriftlichen Mitteilung fest und bewahren Sie die Lohnunterlagen für Prüfungen auf.","zhpodt8a3w":"17. Krankheit und Unfall","1ocqfshai1n":"Ist die Arbeitnehmerin oder der Arbeitnehmer ohne eigenes Verschulden an der Arbeit verhindert (Art. 324a), zahlt der Arbeitgeber den Lohn für beschränkte Zeit: mindestens 3 Wochen im ersten Dienstjahr, danach eine längere Zeit «als angemessen» nach Skala.","y8udeoi055":"Die Gerichte verwenden drei Skalen: Basel, Bern und Zürich. Viele Arbeitgeber schliessen eine Krankentaggeldversicherung ab, typischerweise 80 % während bis zu 720 Tagen.","1pzt0uwcwbx":"Unfälle: Die UVG-Versicherung zahlt 80 % des versicherten Lohns. Der Arbeitgeber zahlt den Berufsunfall (BU); die Arbeitnehmerin oder der Arbeitnehmer zahlt normalerweise den Nichtberufsunfall (NBU), wenn sie oder er mindestens 8 Std. pro Woche arbeitet.","1q4tg7qhqur":"Ein ärztliches Zeugnis kann ab dem ersten Tag verlangt werden, wenn der Vertrag oder das Betriebsreglement es vorsieht.","1923uy1jf6m":"<b>Zeitpunkt der Unfallversicherung:<\/b> Die UVG-Taggelder beginnen am 3. Tag nach dem Unfall. Für die ersten 2 Tage muss der Arbeitgeber den Lohn nach Art. 324a weiterzahlen. Die Arbeitnehmerin oder der Arbeitnehmer muss die Abwesenheit sofort melden; Missbrauch oder falsche Zeugnisse können eine Kündigung rechtfertigen.","29vd5tkoyac":"<b>Skalen für die Lohnfortzahlung bei Krankheit (Art. 324a):<\/b> Nach dem ersten Dienstjahr sagt das Gesetz nur «eine längere Zeit als angemessen», daher verwenden die Gerichte drei Skalen. Bern (die meisten Kantone): Jahr 1 = 3 Wochen; Jahr 2 = 1 Monat; Jahre 3–4 = 2 Monate; Jahre 5–9 = 3 Monate; Jahre 10–14 = 4 Monate; Jahre 15–19 = 5 Monate; ab Jahr 20 = 6 Monate. Zürich (v. a. ZH, SH, TG): 3 Wochen, dann 8 Wochen im Jahr 2, 9 im Jahr 3, 10 im Jahr 4, plus eine Woche für jedes weitere Jahr. Basel (BS, BL): 3 Wochen, 2 Monate in den Jahren 2–3, dann 3 Monate und mehr mit zunehmendem Dienstalter.","1dxrssdxubx":"<b>So funktioniert es:<\/b> Der Anspruch entsteht in jedem Dienstjahr neu und zählt alle Absenzen dieses Jahres zusammen, nicht pro Krankheit. Er setzt ein Arbeitsverhältnis voraus, das mehr als 3 Monate gedauert hat oder dafür vereinbart war; die Arbeitnehmerin oder der Arbeitnehmer darf kein Verschulden treffen; der Arbeitgeber darf ein ärztliches Zeugnis verlangen.","97lincwnlu":"<b>Versicherung statt Skala:<\/b> Die Parteien können schriftlich eine Krankentaggeldversicherung von mindestens gleichwertigem Wert vereinbaren, typischerweise 80 % des Lohns. Beträgt die Leistung mindestens 80 %, darf der Arbeitgeber der Arbeitnehmerin oder dem Arbeitnehmer bis zur Hälfte der Prämie belasten. Der Versicherer zahlt entweder an den Arbeitgeber oder direkt an die Arbeitnehmerin oder den Arbeitnehmer.","19qzvdyemqc":"<b>Behandlung in der Lohnbuchhaltung:<\/b> Vom Arbeitgeber weitergezahlter Lohn ist AHV-Lohn. Von einem Versicherer bezahlte Krankentaggelder sind kein AHV-Lohn, daher werden darauf keine AHV/IV/EO/ALV-Beiträge abgezogen. Ob die Pensionskassenbeiträge während der Krankheit weiterlaufen, hängt vom Reglement der Kasse ab.","qjy118q9ao":"<b>Beispiel (Berner Skala):<\/b> Eine Arbeitnehmerin im 4. Dienstjahr ist ab 1. März 3 Monate krank: Der Arbeitgeber zahlt 2 Monate zu 100 %, dann endet die Pflicht für dieses Dienstjahr, es sei denn, eine Taggeldversicherung zahlt weiter. Der Kündigungsschutz (Abschnitt 22) kann auch nach dem Ende der Lohnzahlung fortbestehen.","17kbazlvco0":"20. Kündigung und Kündigungsfrist","273b7y7jbgu":"Grundsatz: Kündigungsfreiheit. Es braucht keinen Grund, aber er muss schriftlich mitgeteilt werden, wenn die andere Partei es verlangt (Art. 335).","2fb17uyjonc":"Kündigungsfrist nach der Probezeit: 1 Monat im ersten Dienstjahr, 2 Monate vom 2. bis 9., 3 Monate ab dem 10. Sie endet auf Ende eines Monats.","1b2apgsgi9n":"Kürzere oder längere Fristen können schriftlich vereinbart werden, aber nicht kürzer als 1 Monat (ausser im ersten Dienstjahr durch GAV), und sie müssen für beide Parteien gleich sein.","ao2ztqcvd3":"Die Frist beginnt, wenn die andere Partei die Kündigung erhält; endet sie nicht auf ein Monatsende, läuft sie bis zum nächsten Monatsende.","1cu475jkr9n":"<b>Form und Zustellung:<\/b> Das Gesetz verlangt keine Form, ausser der Vertrag oder ein Gesamtarbeitsvertrag tut es, aber eine schriftliche Kündigung mit Empfangsnachweis wird dringend empfohlen. Die Kündigung wird wirksam, wenn sie bei der anderen Partei eintrifft, und wer kündigt, muss die Zustellung beweisen können.","1g2wditabuu":"<b>Gründe:<\/b> Es braucht keinen Grund, aber auf Verlangen müssen die Gründe schriftlich mitgeteilt werden (Art. 335 Abs. 2), und sie müssen wahr sein. Das gilt auch in der Probezeit und bei fristloser Kündigung.","6sc8nzajcp":"<b>Freistellung:<\/b> Der Arbeitgeber kann die Arbeitnehmerin oder den Arbeitnehmer bis zum Enddatum von der Arbeit freistellen. Das Arbeitsverhältnis dauert rechtlich bis zum letzten Tag, der auch das Austrittsdatum im Zeugnis ist. Das Ferienguthaben gilt meist als durch die Freistellung abgegolten, Überstunden können aber nur kompensiert werden, wenn die Person einverstanden ist oder der Vertrag Zeitausgleich vorsieht. Halten Sie die Rechte und Pflichten während der Freistellung schriftlich fest.","zfdjeul33r":"<b>Sonderfälle:<\/b> Ein befristeter Vertrag endet ohne Kündigung (Art. 334); wird die Arbeit nach dem Enddatum einfach fortgesetzt, wird er unbefristet; ein für mehr als 10 Jahre befristeter Vertrag kann nach 10 Jahren gekündigt werden (Art. 334 Abs. 3). Eine Kündigungsfrist unter 1 Monat ist im ersten Dienstjahr nur durch Gesamtarbeitsvertrag möglich (Art. 335c Abs. 2); die Frist muss für beide Seiten gleich sein, ausser dass bei einer Kündigung des Arbeitgebers aus wirtschaftlichen Gründen für die Arbeitnehmerin oder den Arbeitnehmer eine kürzere Frist vereinbart werden kann (Art. 335a Abs. 2).","19kfaewv8ov":"<b>Ferien und Sperrfristen:<\/b> Eine während der Ferien ausgesprochene Kündigung ist gültig. Während einer Sperrfrist (Abschnitt 22) ist die Kündigung des Arbeitgebers nichtig.","1tokkn7tmab":"<b>HR-Checkliste für eine Kündigung:<\/b> 1) Vertragsart und Dienstjahr; 2) Sperrfristen; 3) Enddatum (Monatsende), ab Empfangsdatum gezählt; 4) Schreiben mit Empfangsnachweis; 5) Ferien, Überstunden und Freistellung; 6) Schlussabrechnung, Zeugnis und Versicherungsinformationen; 7) Austritt der Pensionskasse und den Versicherern melden (Abschnitt 7). Ein Musterbrief steht unter Vorlagen.","567j1ctldp":"21. Rechenbeispiele: Kündigung, Lohnfortzahlung, Abgangsentschädigung","nn0jgi9pg5":"<b>Kündigung (der Empfang zählt):<\/b> Die Arbeitnehmerin hat 3 Dienstjahre (2 Monate Kündigungsfrist). Das Schreiben des Arbeitgebers geht am 12. März ein. Zwei Monate später ist der 12. Mai, kein Monatsende, der Vertrag endet daher am 31. Mai. Praktischer Tipp: Entscheidend ist das Datum, an dem das Schreiben die Arbeitnehmerin erreicht, verwenden Sie daher eingeschriebene Post oder übergeben Sie es gegen unterschriebene Empfangsbestätigung.","it9e4pfrky":"<b>Sperrfrist:<\/b> Im 3. Jahr erhält die Arbeitnehmerin am 25. Mai die Kündigung (Ende 31. Juli). Am 10. Juni erkrankt sie bis 30. Juni (21 Tage, innerhalb des 90-tägigen Schutzes). Die Kündigungsfrist wird während der Krankheit unterbrochen und läuft am 1. Juli weiter. Das nominelle Ende verschiebt sich vom 25. Juli auf den 15. August, der Vertrag endet daher am 31. August.","3ke8alcieu":"Kernpunkt: Die Sperrfrist verhindert nur eine Kündigung, die <i>während<\/i> der Krankheit ausgesprochen wird (nichtig), oder unterbricht eine Kündigung, die <i>vorher<\/i> ausgesprochen wurde. Sie hindert die Arbeitnehmerin nicht daran, selbst zu kündigen.","14m4y4imv5":"<b>Lohnfortzahlung (Art. 324a):<\/b> Das Gesetz sagt nur «für beschränkte Zeit», daher verwenden die Gerichte Skalen. Berner Skala: Jahr 1 = 3 Wochen; Jahr 2 = 1 Monat; Jahre 3–4 = 2 Monate; Jahre 5–9 = 3 Monate. Die Zürcher und die Basler Skala sind anders. Beispiel: Ein Arbeitnehmer im 4. Dienstjahr, der 3 Monate krank ist, erhält nach der Berner Skala 2 Monate vollen Lohn (ausser es gibt einen besseren Vertrag oder eine Krankentaggeldversicherung).","2bzgo11e7lt":"Krankentaggeldversicherung (Krankentaggeld

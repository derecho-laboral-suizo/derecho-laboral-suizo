<script>
var T=[
{t:["1. Your rights at a glance","1. Tus derechos laborales de un vistazo"],r:"CO · ArG · UVG · EOG · GlG · summary of the guide sections",
b:[["<b>Purpose:</b> a one-page checklist for you and for the staff you will advise. Each point says where the detail is.","<b>Contract and pay:</b> if there is no written contract, written confirmation of the essential terms within one month (art. 330b); salary on time with a written payslip (art. 323b); salary claims last 5 years. See sections 4 and 13.","<b>Working time:</b> statutory maximum of 45 or 50 hours a week, 11 hours’ daily rest, breaks of 15, 30 or 60 minutes, a 25% supplement on statutory overtime, and night or Sunday work only with authorisation. See sections 8–10.","<b>Holidays:</b> at least 4 weeks (5 until age 20), two consecutive weeks in one block, pay continues, and no payout during employment. See section 12.","<b>Sickness and accident:</b> salary continued for a limited time (art. 324a) or a daily sickness allowance, usually 80%; accident insurance pays 80% from day 3. See section 17.","<b>Family:</b> maternity 14 weeks at 80%, paternity 2 weeks, care leave up to 14 weeks, and up to 3 days per event for a sick relative. See sections 18 and 19.","<b>Dismissal:</b> notice of 1, 2 or 3 months by seniority and 7 days in probation; protection during illness, pregnancy and military service; abusive dismissal gives up to 6 months’ pay; immediate dismissal only for good cause. See sections 20–23.","<b>Documents:</b> a work reference at any time (art. 330a); a non-compete only if written and justified. See section 24.","<b>Dignity and data:</b> the employer must protect your personality and health (art. 328) and may only process data needed for the job (art. 328b).","<b>Social insurance:</b> contributions are deducted on the payslip; AHV, ALV, BVG and accident insurance cover you. See sections 25 and 26.","<b>What not to assume:</b> there is no general severance pay, no statutory 13th salary, no national minimum wage, no need for a reason to dismiss, and the only federal public holiday is 1 August.","<b>If something goes wrong:</b> raise it in writing and keep proof of delivery. For dismissal, object in writing before the notice ends and sue within 180 days after employment ends. Disputes up to CHF 30,000 have no court costs, and they start at the cantonal conciliation authority."],["<b>Objetivo:</b> una lista de una página para ti y para el personal al que asesores. Cada punto indica dónde está el detalle.","<b>Contrato y pago:</b> si no hay contrato escrito, confirmación escrita de las condiciones esenciales en un mes (art. 330b); salario a tiempo con nómina por escrito (art. 323b); las reclamaciones salariales duran 5 años. Ver apartados 4 y 13.","<b>Jornada:</b> máximo legal de 45 o 50 horas semanales, 11 horas de descanso diario, pausas de 15, 30 o 60 minutos, recargo del 25% en las horas extra legales, y trabajo nocturno o dominical solo con autorización. Ver apartados 8–10.","<b>Vacaciones:</b> al menos 4 semanas (5 hasta los 20 años), dos semanas seguidas de una vez, se mantiene el salario y no se pagan en dinero durante la relación. Ver apartado 12.","<b>Enfermedad y accidente:</b> salario continuado durante un tiempo limitado (art. 324a) o subsidio diario por enfermedad, normalmente del 80%; el seguro de accidentes paga el 80% desde el día 3. Ver apartado 17.","<b>Familia:</b> maternidad 14 semanas al 80%, paternidad 2 semanas, permiso de cuidado hasta 14 semanas, y hasta 3 días por caso para un familiar enfermo. Ver apartados 18 y 19.","<b>Despido:</b> preaviso de 1, 2 o 3 meses según antigüedad y 7 días en la prueba; protección durante enfermedad, embarazo y servicio militar; el despido abusivo da hasta 6 meses de salario; el despido inmediato solo con causa justa. Ver apartados 20–23.","<b>Documentos:</b> certificado de trabajo en cualquier momento (art. 330a); la no competencia solo si es escrita y justificada. Ver apartado 24.","<b>Dignidad y datos:</b> el empleador debe proteger tu personalidad y salud (art. 328) y solo puede tratar datos necesarios para el trabajo (art. 328b).","<b>Seguros sociales:</b> las cotizaciones se descuentan en la nómina; AHV, ALV, BVG y seguro de accidentes te cubren. Ver apartados 25 y 26.","<b>Lo que no debes dar por supuesto:</b> no hay indemnización general por despido, ni salario 13 legal, ni salario mínimo nacional, ni hace falta motivo para despedir, y el único festivo federal es el 1 de agosto.","<b>Si algo sale mal:</b> comunícalo por escrito y guarda la prueba de entrega. En un despido, oponte por escrito antes de que termine el preaviso y demanda en los 180 días posteriores al fin de la relación. Los litigios de hasta 30.000 CHF no tienen costas, y empiezan en la autoridad cantonal de conciliación."]],
s:["In Spain, dismissal needs a cause and gives severance, and collective agreements cover most staff. Switzerland leaves much more to the contract, so reading the contract is the first step.","En España el despido necesita causa y da indemnización, y los convenios colectivos cubren a casi todo el personal. Suiza deja mucho más al contrato, así que leer el contrato es el primer paso."]},
{t:["Sources of law","Fuentes del derecho"],r:"OR/CO/CO · ArG/LTr · UVG/LAA · BVG/LPP · AHVG/LAVS · AVIG/LACI",
b:[["Code of Obligations (CO, art. 319–362): the individual employment contract. Mandatory and semi-mandatory rules are listed in art. 361–362.","Labour Act (ArG/LTr) and its ordinances: working time, rest, health and safety, special protection for young people and pregnant women.","Collective labour agreements (GAV/CCT) and standard contracts (NAV): often set higher minimums by sector or canton.","Social insurance laws: AHV, ALV, BVG, UVG, EO, family allowances.","Hierarchy: mandatory law, then collective agreement, then individual contract, then company rules.","<b>Mandatory rules:</b> CO art. 361 lists rules that can never be changed by contract; art. 362 lists rules that can only be changed in the employee’s favour (favourability principle).","<b>Other laws to know:</b> Gender Equality Act (GlG), Data Protection Act (revDSG, in force since 2023), Participation Act (information and consultation rights), Posted Workers Act, Employment Services Act (AVG, for recruiters and temp agencies). The ArG has five ordinances: ArGV 1 (general), 2 (special sectors), 3 (health protection), 4 (industrial plans), 5 (young workers).","<b>Authorities and disputes:</b> SECO (federal level) and cantonal labour inspectorates enforce the ArG. Individual disputes go first to a conciliation authority, then the labour court; in employment disputes up to CHF 30,000 there are no court costs. Salary claims expire after 5 years (art. 128 CO).","<b>How to read a citation:</b> “art. 335c para. 2 CO” means article 335c, second paragraph, of the Code of Obligations; “lit. a” means letter a; “ff.” means “and the following articles”. Official texts are on Fedlex (fedlex.admin.ch) in German, French and Italian; the English versions are informative only.","<b>SR numbers (systematic collection):</b> CO = SR 220; ArG = SR 822.11; ArGV 1 = SR 822.111; AVIG (unemployment) = SR 837.0. AHVG = SR 831.10; BVG = SR 831.40; UVG = SR 832.20; EOG = SR 834.1; FamZG = SR 836.2; GlG = SR 151.1. Always check the current text on Fedlex.","<b>Order of lookup for an HR or payroll question:</b> 1) the law (CO, ArG and the social insurance acts); 2) the collective agreement (GAV) or standard contract (NAV) of the sector; 3) the individual contract; 4) company regulations; 5) the regulations of the insurer or pension fund for benefits.","<b>Federal and cantonal:</b> labour law is federal, but public holidays, minimum wages, family allowances above the federal minimum, the sick-pay scale used by the courts and income tax depend on the canton."],["Código de Obligaciones (CO, arts. 319–362): el contrato individual de trabajo. Las normas imperativas y semiimperativas figuran en los arts. 361–362.","Ley de Trabajo (ArG/LTr) y sus ordenanzas: jornada, descansos, seguridad y salud, protección especial de jóvenes y embarazadas.","Convenios colectivos (GAV/CCT) y contratos tipo (NAV): suelen fijar mínimos superiores por sector o cantón.","Leyes de seguridad social: AHV, ALV, BVG, UVG, EO, subsidios familiares.","Jerarquía: ley imperativa, convenio colectivo, contrato individual y normas de empresa.","<b>Normas imperativas:</b> el art. 361 CO enumera las reglas que nunca pueden modificarse por contrato; el art. 362 las que solo pueden modificarse a favor del trabajador (principio de favorabilidad).","<b>Otras leyes a conocer:</b> Ley de Igualdad (GlG), Ley de Protección de Datos (revDSG, vigente desde 2023), Ley de Participación (derechos de información y consulta), Ley de Trabajadores Desplazados, Ley de Servicios de Empleo (AVG, para agencias y ETT). La ArG tiene cinco ordenanzas: ArGV 1 (general), 2 (sectores especiales), 3 (protección de la salud), 4 (planes industriales), 5 (jóvenes).","<b>Autoridades y conflictos:</b> la SECO (nivel federal) y las inspecciones cantonales de trabajo vigilan la ArG. Los conflictos individuales van primero a una autoridad de conciliación y luego al tribunal laboral; en litigios laborales de hasta 30.000 CHF no hay costas judiciales. Las reclamaciones salariales prescriben a los 5 años (art. 128 CO).","<b>Cómo leer una cita:</b> “art. 335c ap. 2 CO” significa artículo 335c, segundo apartado, del Código de Obligaciones; “lit. a” es la letra a; “ss.” significa “y siguientes”. Los textos oficiales están en Fedlex (fedlex.admin.ch) en alemán, francés e italiano; las versiones en inglés son solo informativas.","<b>Números SR (colección sistemática):</b> CO = SR 220; ArG = SR 822.11; ArGV 1 = SR 822.111; AVIG (desempleo) = SR 837.0. AHVG = SR 831.10; BVG = SR 831.40; UVG = SR 832.20; EOG = SR 834.1; FamZG = SR 836.2; GlG = SR 151.1. Comprueba siempre el texto vigente en Fedlex.","<b>Orden de consulta ante una duda de RRHH o nóminas:</b> 1) la ley (CO, ArG y las leyes de seguros sociales); 2) el convenio colectivo (GAV) o contrato tipo (NAV) del sector; 3) el contrato individual; 4) el reglamento de la empresa; 5) el reglamento de la aseguradora o caja de pensiones para las prestaciones.","<b>Federal y cantonal:</b> el derecho laboral es federal, pero los festivos, los salarios mínimos, los subsidios familiares por encima del mínimo federal, la escala de baja que usan los tribunales y el impuesto sobre la renta dependen del cantón."]],
s:["Switzerland has no single labour code and no Estatuto de los Trabajadores equivalent. The CO is part of private law, so the contract carries more weight than in Spain.","Suiza no tiene un código laboral único ni equivalente al Estatuto de los Trabajadores. El CO es derecho privado, por lo que el contrato pesa más que en España."]},
{t:["4. Employment contract","4. Contrato de trabajo"],r:"CO art. 319–320, 330b",
b:[["No form is required: a verbal contract is valid (art. 320). Fixed-term and open-ended contracts are both allowed.","If the contract is not written, the employer must give the essential terms in writing within one month of start (art. 330b): parties, start date, role, salary and supplements, weekly hours.","Employee duties: diligence and loyalty (art. 321a), including confidentiality and a ban on competing work during the relationship.","Employer duties: pay, protect the employee’s personality and health (art. 328), respect data protection at work (art. 328b).","<b>Types of contract:</b> open-ended; fixed-term (ends automatically, no ordinary termination unless agreed; repeated fixed-term contracts without objective reason may be treated as open-ended); part-time; on-demand work; apprenticeship contract (written form required); homework; commercial traveller (written form required).","<b>Liability and expenses:</b> the employee answers only for damage caused intentionally or negligently, and the standard depends on the risk of the job (art. 321e). The employer must reimburse necessary expenses, such as travel or phone costs (art. 327a).","<b>Job interviews:</b> the employer may only ask what is needed for the job or the contract (art. 328b). Side jobs are allowed unless they compete or breach the duty of loyalty.","<b>Instructions and changes:</b> the employer may give instructions on the work and on conduct (art. 321d CO), but it cannot change essential terms unilaterally: a change needs the employee’s agreement, or a termination with an offer of new terms (Änderungskündigung).","<b>Company regulations:</b> a staff handbook (Personalreglement) binds the employee only if the contract refers to it or the employee accepts it, and it cannot be worse than the law or the contract.","<b>Personal data:</b> the employee can ask what data the employer holds about them; the employer must keep it accurate and process only what the job needs (art. 328b CO and the data protection act).","<b>Drafting tip for HR:</b> use one contract template per type, with annexes (job description, expenses policy, pension fund and insurance rules), and record the date on which the employee received each annex."],["No se exige forma: el contrato verbal es válido (art. 320). Se permiten contratos de duración determinada e indefinida.","Si no es escrito, el empleador debe entregar por escrito las condiciones esenciales en el plazo de un mes desde el inicio (art. 330b): partes, fecha de inicio, función, salario y complementos, horas semanales.","Deberes del trabajador: diligencia y fidelidad (art. 321a), incluida la confidencialidad y la prohibición de trabajo competidor durante la relación.","Deberes del empleador: pagar, proteger la personalidad y salud del trabajador (art. 328) y respetar la protección de datos (art. 328b).","<b>Tipos de contrato:</b> indefinido; de duración determinada (termina automáticamente, sin despido ordinario salvo pacto; la sucesión de contratos temporales sin motivo objetivo puede tratarse como indefinido); a tiempo parcial; trabajo a demanda; contrato de aprendizaje (exige forma escrita); trabajo a domicilio; viajante de comercio (exige forma escrita).","<b>Responsabilidad y gastos:</b> el trabajador responde solo de los daños causados con dolo o negligencia, y el criterio depende del riesgo del puesto (art. 321e). El empleador debe reembolsar los gastos necesarios, como viajes o teléfono (art. 327a).","<b>Entrevistas de selección:</b> el empleador solo puede preguntar lo necesario para el puesto o el contrato (art. 328b). Se pueden tener otros trabajos salvo que compitan o infrinjan el deber de fidelidad.","<b>Instrucciones y cambios:</b> el empleador puede dar instrucciones sobre el trabajo y la conducta (art. 321d CO), pero no puede cambiar unilateralmente las condiciones esenciales: un cambio exige el acuerdo del trabajador, o un despido con oferta de nuevas condiciones (Änderungskündigung).","<b>Reglamentos de empresa:</b> un manual del personal (Personalreglement) solo obliga al trabajador si el contrato lo menciona o el trabajador lo acepta, y no puede ser peor que la ley o el contrato.","<b>Datos personales:</b> el trabajador puede preguntar qué datos tiene el empleador sobre él; el empleador debe mantenerlos exactos y tratar solo lo que el puesto necesita (art. 328b CO y la ley de protección de datos).","<b>Consejo de redacción para RRHH:</b> usa una plantilla de contrato por tipo, con anexos (descripción del puesto, política de gastos, reglas de la caja de pensiones y seguros), y registra la fecha en que el trabajador recibió cada anexo."]],
s:["Open-ended is the default and there is no catalogue of contract types as in Spain.","El indefinido es la regla general y no existe el catálogo de modalidades contractuales de España."]},
{t:["5. Types of contract, with internships in detail","5. Tipos de contrato, con las prácticas en detalle"],r:"CO art. 319 ff., 334, 344 ff. · AHVG",
b:[["<b>Open-ended contract:</b> the default. Probation, notice periods and protected periods work as in sections 6, 20 and 22.","<b>Fixed-term contract (art. 334):</b> it ends automatically on the agreed date and needs no notice. It cannot be ended early unless the contract provides for it. If work simply continues after the end date, it becomes open-ended. Chains of fixed-term contracts without objective reasons can be treated as open-ended.","<b>Part-time:</b> same rights as full-time, pro rata (holidays are counted in weeks, so they stay the same). The BVG entry threshold applies to the annual salary, so a low part-time salary may not be insured. The legal coordination deduction is fixed, which hits part-timers hard; many funds scale it down, so check the regulations.","<b>On-demand work (Arbeit auf Abruf):</b> hours vary with the employer’s calls. Put minimum and maximum hours and the notice for calls in writing. Hours worked are paid with holiday and 13th supplements shown as percentages; standby time imposed on the employee may have to be paid.","<b>Apprenticeship (Lehrvertrag, art. 344 ff.):</b> a special written contract approved by the cantonal authority, with a training plan, 2 to 4 years depending on the programme, probation of 1 to 3 months and at least 5 weeks’ holiday until age 20.","<b>Temporary agency work:</b> a three-party arrangement: a licensed agency employs the worker and lends them to the client. Notice is shorter in the first months and the sector collective agreement (GAV Personalverleih) sets minimum wages.","<b>Freelance or service contract (Auftrag, Werkvertrag):</b> not an employment contract. The AHV looks at real subordination, not the label: a ‘freelancer’ who follows instructions and works on the client’s premises may be reclassified as an employee, with back-payment of contributions.","<b>Internship (Praktikum) in detail:</b> Switzerland has no internship law. A paid internship with productive work is a fixed-term employment contract under art. 319 ff. CO, so employee rights apply. Internships required by a school or university are often covered by a three-party agreement (Praktikumsvereinbarung), but if the intern works and is paid, an employment contract should exist.","<b>What the internship contract should say:</b> start and end dates, hours, gross salary, probation, an early-termination clause or notice period, holidays, insurance, learning objectives and a supervisor. A training plan is not required by law, but it is the best sign of a genuine internship.","<b>Probation and ending:</b> the first month counts as probation unless agreed otherwise, with 7 days’ notice. After that, a fixed-term internship ends without notice (art. 334) and cannot be ended early unless the contract allows it, except for serious cause (art. 337). Add an early-termination clause if flexibility is wanted.","<b>Salary:</b> there is no statutory minimum for interns and pay is usually below that of regular staff, but it is negotiable and must be written in the contract. Check whether a cantonal minimum wage or a collective agreement applies.","<b>Social insurance:</b> AHV/IV/EO (5.3% employee) is due from 1 January after the 17th birthday; wages up to CHF 2,500 a year are exempt unless requested. ALV 1.1% applies. BVG applies only if the annual salary exceeds CHF 22,680. UVG: occupational accident always; non-occupational from 8 hours a week.","<b>Holidays and reference:</b> holidays accrue pro rata (about 2 weeks over 6 months, 2.5 if under 20) and are normally taken during the internship. At the end the intern can ask for a full reference or a simple internship confirmation (Praktikumsbestätigung).","<b>HR tips:</b> avoid repeated consecutive internships for the same role (they may be treated as ordinary employment), agree a clear learning plan, record hours, and for EU citizens use the online notification up to 90 working days or an L permit for longer."],["<b>Contrato indefinido:</b> la regla general. La prueba, los preavisos y los períodos de protección funcionan como en los apartados 6, 20 y 22.","<b>Contrato de duración determinada (art. 334):</b> termina automáticamente en la fecha pactada y no necesita preaviso. No puede resolverse antes salvo que el contrato lo prevea. Si el trabajo simplemente continúa tras la fecha de fin, pasa a ser indefinido. Las cadenas de contratos temporales sin motivo objetivo pueden tratarse como indefinidas.","<b>Tiempo parcial:</b> mismos derechos que a tiempo completo, en proporción (las vacaciones se cuentan en semanas, así que no cambian). El umbral de entrada de la BVG se aplica al salario anual, por lo que un salario parcial bajo puede quedar sin asegurar. La deducción de coordinación legal es fija, lo que perjudica mucho a los trabajadores a tiempo parcial; muchas cajas la reducen proporcionalmente, así que revisa el reglamento.","<b>Trabajo a demanda (Arbeit auf Abruf):</b> las horas varían según las llamadas del empleador. Fija por escrito las horas mínimas y máximas y el preaviso de las llamadas. Las horas trabajadas se pagan con suplementos de vacaciones y de salario 13 en forma de porcentajes; el tiempo de disponibilidad impuesto al trabajador puede tener que pagarse.","<b>Aprendizaje (Lehrvertrag, art. 344 ss.):</b> contrato especial por escrito aprobado por la autoridad cantonal, con plan de formación, de 2 a 4 años según el programa, prueba de 1 a 3 meses y al menos 5 semanas de vacaciones hasta los 20 años.","<b>Trabajo temporal (ETT):</b> relación a tres partes: una agencia con licencia emplea al trabajador y lo cede a la empresa cliente. El preaviso es más corto en los primeros meses y el convenio sectorial (GAV Personalverleih) fija salarios mínimos.","<b>Autónomo o contrato de servicios (Auftrag, Werkvertrag):</b> no es un contrato de trabajo. La AHV mira la subordinación real, no la etiqueta: un ‘autónomo’ que sigue instrucciones y trabaja en los locales del cliente puede ser reclasificado como empleado, con pago retroactivo de cotizaciones.","<b>Prácticas (Praktikum) en detalle:</b> Suiza no tiene una ley de prácticas. Unas prácticas remuneradas con trabajo productivo son un contrato de trabajo de duración determinada según el art. 319 ss. CO, así que se aplican los derechos del trabajador. Las prácticas exigidas por una escuela o universidad suelen cubrirse con un acuerdo a tres partes (Praktikumsvereinbarung), pero si el practicante trabaja y cobra, debería existir un contrato de trabajo.","<b>Qué debe decir el contrato de prácticas:</b> fechas de inicio y fin, horario, salario bruto, prueba, cláusula de resolución anticipada o preaviso, vacaciones, seguros, objetivos de aprendizaje y un tutor. El plan de formación no lo exige la ley, pero es la mejor señal de unas prácticas genuinas.","<b>Prueba y fin:</b> el primer mes cuenta como prueba salvo pacto en contrario, con 7 días de preaviso. Después, unas prácticas de duración determinada terminan sin preaviso (art. 334) y no pueden terminarse antes salvo que el contrato lo permita, o por causa grave (art. 337). Añade una cláusula de resolución anticipada si quieres flexibilidad.","<b>Salario:</b> no hay mínimo legal para practicantes y el pago suele ser inferior al del personal ordinario, pero es negociable y debe constar en el contrato. Comprueba si se aplica un salario mínimo cantonal o un convenio colectivo.","<b>Seguros sociales:</b> la AHV/IV/EO (5,3% a cargo del trabajador) se debe desde el 1 de enero posterior al cumpleaños 17; los salarios de hasta 2.500 CHF al año están exentos salvo petición. Se aplica la ALV del 1,1%. La BVG solo se aplica si el salario anual supera 22.680 CHF. UVG: accidente profesional siempre; no profesional desde 8 horas semanales.","<b>Vacaciones y certificado:</b> las vacaciones se devengan en proporción (unas 2 semanas en 6 meses, 2,5 si es menor de 20) y normalmente se disfrutan durante las prácticas. Al final se puede pedir un certificado completo o una simple confirmación de prácticas (Praktikumsbestätigung).","<b>Consejos de RRHH:</b> evita prácticas consecutivas repetidas para el mismo puesto (pueden tratarse como empleo ordinario), acuerda un plan de aprendizaje claro, registra las horas y, para ciudadanos de la UE, usa la notificación en línea hasta 90 días laborables o el permiso L si es más largo."]],
s:["In Spain, paid prácticas are regulated: the contrato formativo for professional practice has statutory duration and pay rules, and extracurricular internships must contribute to Social Security. In Switzerland there is no internship law, so the contract is what protects the intern.","En España las prácticas remuneradas están reguladas: el contrato formativo para la obtención de práctica profesional tiene duración y reglas salariales legales, y las prácticas extracurriculares deben cotizar a la Seguridad Social. En Suiza no hay ley de prácticas, así que lo que protege al practicante es el contrato."]},
{t:["6. Probation period","6. Período de prueba"],r:"CO art. 335b",
b:[["Default: 1 month. It can be changed in writing (contract, NAV or GAV) up to a maximum of 3 months.","During probation either party can terminate with 7 days’ notice, no reason needed.","If illness, accident or military service interrupts probation, it is extended by the same duration.","<b>Example:</b> a new employee starts on 1 September with the default 1-month probation. If the employer gives notice on 20 September, the contract ends on 27 September (7 days), not at month-end. If notice is given on 3 October, probation is over and the normal notice period applies.","During probation, the protected periods of art. 336c (illness, pregnancy, military service) do not apply, so the employer may terminate even if the employee is sick. Abusive dismissal rules still apply.","A longer probation (up to 3 months) must be agreed in writing in the contract, NAV or GAV. It can only be set once per employment relationship: it cannot be repeated for the same job.","<b>Fixed-term contracts:</b> a fixed-term contract can include a probation period; it still ends automatically on the end date.","<b>Practice:</b> HR departments often set 3 months for qualified roles, but remember that during probation the notice is only 7 days for both sides and the protected periods of art. 336c do not apply.","<b>Apprentices:</b> the probation of an apprenticeship is 1 to 3 months; if the contract says nothing, 3 months apply (art. 344a para. 3)."],["Por defecto: 1 mes. Puede modificarse por escrito (contrato, NAV o GAV) hasta un máximo de 3 meses.","Durante la prueba cualquiera de las partes puede resolver con 7 días de preaviso, sin necesidad de motivo.","Si la prueba se interrumpe por enfermedad, accidente o servicio militar, se prolonga por el mismo tiempo.","<b>Ejemplo:</b> un trabajador entra el 1 de septiembre con la prueba por defecto de 1 mes. Si el empleador comunica el despido el 20 de septiembre, el contrato termina el 27 de septiembre (7 días), no a fin de mes. Si se comunica el 3 de octubre, la prueba ya ha terminado y se aplica el preaviso normal.","Durante la prueba no se aplican los períodos de protección del art. 336c (enfermedad, embarazo, servicio militar), así que el empleador puede despedir aunque el trabajador esté enfermo. Las reglas sobre despido abusivo sí se aplican.","Una prueba más larga (hasta 3 meses) debe pactarse por escrito en el contrato, NAV o GAV. Solo puede fijarse una vez por relación laboral: no se puede repetir para el mismo puesto.","<b>Contratos de duración determinada:</b> un contrato temporal puede incluir período de prueba; aun así termina automáticamente en la fecha de fin.","<b>Práctica:</b> los departamentos de RRHH suelen fijar 3 meses para puestos cualificados, pero recuerda que durante la prueba el preaviso es de solo 7 días para ambas partes y no se aplican los períodos de protección del art. 336c.","<b>Aprendices:</b> la prueba de un contrato de aprendizaje es de 1 a 3 meses; si el contrato no dice nada, se aplican 3 meses (art. 344a ap. 3)."]]},
{t:["8. Working time","8. Jornada de trabajo"],r:"ArG art. 9, 3 · ArGV 1",
b:[["Statutory maximum per week: 45 hours for industrial staff, office and technical staff, and sales staff in large retail; 50 hours for everyone else.","Typical contractual hours are 40–42 per week, but that is contract or GAV, not statute.","Senior executives with a real decision-making role are excluded from most ArG rules (art. 3 lit. d). Others in some cases can opt for simplified or no time recording under conditions.","Daily work window: 14 hours including breaks and overtime (art. 10). Rest: 11 consecutive hours per day (art. 15a).","<b>Time recording (art. 46 ArG, art. 73 ArGV 1):</b> the employer must record working time, including breaks and rest, for staff covered by the ArG. The ArG does not apply to higher executives, certain scientific staff and commercial travellers, so for them there is no recording duty by law.","<b>Full waiver (art. 73a ArGV 1):</b> possible only if a collective agreement allows it and the employee earns more than CHF 120,000 gross a year, has great autonomy and sets most of their own hours, and agrees individually in writing. Either side can revoke it at year-end. The employer keeps the agreement and the list of waiving employees for the inspectors.","<b>Simplified recording (art. 73b):</b> only the total hours worked each day (plus start and end for night and Sunday work). It requires that the employee sets a significant part of their hours (at least a quarter), an agreement with employee representatives (or an individual one in firms with fewer than 50 staff) and a documented annual review.","<b>Breaks:</b> a break counts as working time if the employee cannot leave the workplace (art. 15 para 2 ArG). The minimum depends on the daily working time: 15 minutes above 5.5 hours, 30 minutes above 7 and 60 minutes above 9.","<b>Example:</b> an office employee works 8:00 to 18:30 with a 1-hour lunch break, so 9.5 net hours; the 60-minute break is the legal minimum above 9 hours. With a 45-hour limit she can work 9 hours on each of five days; a sixth day is already statutory overtime (section 10)."],["Máximo legal semanal: 45 horas para personal industrial, administrativo y técnico y vendedores de grandes comercios; 50 horas para el resto.","La jornada contractual habitual es de 40–42 horas semanales, pero eso es contrato o GAV, no ley.","Los directivos con verdadero poder de decisión quedan excluidos de gran parte de la ArG (art. 3 lit. d). En algunos casos otros pueden optar por registro simplificado o sin registro bajo ciertas condiciones.","Franja diaria de trabajo: 14 horas incluidas pausas y horas extra (art. 10). Descanso: 11 horas consecutivas por día (art. 15a).","<b>Registro horario (art. 46 ArG, art. 73 ArGV 1):</b> el empleador debe registrar el tiempo de trabajo, con pausas y descansos, del personal cubierto por la ArG. La ArG no se aplica a los directivos superiores, a cierto personal científico ni a los viajantes de comercio, así que para ellos no hay obligación legal de registro.","<b>Renuncia total (art. 73a ArGV 1):</b> solo es posible si un convenio colectivo la permite y el trabajador gana más de 120.000 CHF brutos al año, tiene gran autonomía y fija la mayor parte de su horario, y la acepta individualmente por escrito. Cualquiera de las partes puede revocarla a fin de año. El empleador conserva el acuerdo y la lista de quienes renuncian para los inspectores.","<b>Registro simplificado (art. 73b):</b> solo las horas totales de cada día (más inicio y fin en trabajo nocturno y dominical). Exige que el trabajador fije una parte significativa de su horario (al menos una cuarta parte), un acuerdo con los representantes de los trabajadores (o individual en empresas de menos de 50 empleados) y una revisión anual documentada.","<b>Pausas:</b> una pausa cuenta como tiempo de trabajo si el trabajador no puede abandonar el puesto (art. 15 ap. 2 ArG). El mínimo depende de la jornada diaria: 15 minutos por encima de 5,5 horas, 30 por encima de 7 y 60 por encima de 9.","<b>Ejemplo:</b> una empleada de oficina trabaja de 8:00 a 18:30 con 1 hora de comida, es decir 9,5 horas netas; la pausa de 60 minutos es el mínimo legal por encima de 9 horas. Con un límite de 45 horas puede trabajar 9 horas cada uno de cinco días; un sexto día ya sería hora extra legal (apartado 10)."]],
s:["Spain: 40 h/week average and 9 h/day. Switzerland is looser: the ceilings are 45/50 h.","España: 40 h/semana de media y 9 h/día. Suiza es más flexible: los topes son 45/50 h."]},
{t:["9. Breaks, night and Sunday work","9. Pausas, trabajo nocturno y dominical"],r:"ArG art. 15–19, 17a–17b",
b:[["Breaks (paid only if agreed or taken at the workplace on employer’s order): at least 15 min if the day exceeds 5.5 h, 30 min above 7 h, 60 min above 9 h.","Daytime work window: 06:00–20:00; evening 20:00–23:00 (needs consultation or agreement); night 23:00–06:00 is prohibited unless authorised.","Temporary night work: 25% wage supplement (or equivalent time). Sunday and public-holiday work is prohibited unless authorised; temporary Sunday work: 50% supplement.","Regular night work gives a time compensation of 10% and health check rights.","<b>Rest rules:</b> 11 consecutive hours of rest between two working days; once a week it can be cut to 8 hours if the 11-hour average is kept over two weeks (art. 15a ArG).","<b>Night work (23:00 to 06:00):</b> it needs authorisation. It is temporary below 25 nights a year, with a wage supplement of at least 25%, and regular from 25 nights, with 10% of the night time given as paid time off, which cannot be waived by agreement. At night the working day is at most 9 hours within a 10-hour period (art. 17a ArG).","<b>Health checks:</b> staff working 25 or more nights a year are entitled to a medical check and advice, every 2 years up to age 45 and every year afterwards.","<b>Example:</b> hourly wage CHF 30; an employee works 4 temporary night shifts with 6 hours each inside the night window: 24 hours × CHF 30 × 25% = CHF 180 supplement.","<b>Sunday work:</b> temporary Sunday work (up to 6 Sundays a year) needs a cantonal permit and pays a 50% supplement plus compensatory rest. Regular Sunday work is authorised by the federal authority and has no wage supplement, but compensatory rest is still due. Sunday work of up to 5 hours is compensated with equal time off; longer work needs a replacement day of rest.","<b>HR check:</b> count each employee’s nights per calendar year, because it decides between the 25% wage supplement and the 10% time compensation."],["Pausas (retribuidas solo si así se pacta o se toman en el puesto por orden del empleador): mínimo 15 min si la jornada supera 5,5 h, 30 min por encima de 7 h y 60 min por encima de 9 h.","Franja diurna: 06:00–20:00; vespertina 20:00–23:00 (requiere consulta o acuerdo); el trabajo nocturno 23:00–06:00 está prohibido salvo autorización.","Nocturno temporal: recargo salarial del 25% (o equivalente en tiempo). Domingos y festivos prohibidos salvo autorización; domingo temporal: recargo del 50%.","El nocturno regular da derecho a compensación en tiempo del 10% y a controles de salud.","<b>Reglas de descanso:</b> 11 horas consecutivas de descanso entre dos jornadas; una vez por semana se puede reducir a 8 horas si se mantiene la media de 11 horas en dos semanas (art. 15a ArG).","<b>Trabajo nocturno (23:00 a 06:00):</b> necesita autorización. Es temporal por debajo de 25 noches al año, con un recargo salarial de al menos el 25%, y regular desde 25 noches, con el 10% del tiempo nocturno concedido como descanso remunerado, que no se puede renunciar por acuerdo. De noche la jornada es de como máximo 9 horas dentro de un período de 10 horas (art. 17a ArG).","<b>Controles de salud:</b> quien trabaja 25 o más noches al año tiene derecho a un control médico y asesoramiento, cada 2 años hasta los 45 y cada año después.","<b>Ejemplo:</b> salario por hora de 30 CHF; un empleado hace 4 turnos nocturnos temporales de 6 horas dentro de la franja nocturna: 24 horas × 30 CHF × 25% = 180 CHF de recargo.","<b>Trabajo dominical:</b> el trabajo dominical temporal (hasta 6 domingos al año) necesita permiso cantonal y paga un recargo del 50% más descanso compensatorio. El trabajo dominical regular lo autoriza la autoridad federal y no lleva recargo salarial, pero sí descanso compensatorio. El trabajo dominical de hasta 5 horas se compensa con el mismo tiempo libre; si es más largo hace falta un día de descanso sustitutivo.","<b>Control de RRHH:</b> cuenta las noches de cada empleado por año natural, porque decide entre el recargo salarial del 25% y la compensación del 10% en tiempo."]]},
{t:["10. Overtime","10. Horas extra"],r:"CO art. 321c · ArG art. 12–13",
b:[["Two concepts: Überstunden (hours above the contractual time, CO) and Überzeit (hours above the statutory weekly maximum, ArG).","CO: the employee must work overtime when necessary and reasonable. Compensation: pay with a 25% supplement, or time off 1:1 if both agree. The supplement can be waived in writing.","ArG: above the 45/50 h maximum, a 25% supplement is mandatory (for staff other than those in senior roles; the first 60 h per year in office, technical and sales jobs carry no supplement). Annual cap 170 h (45 h group) or 140 h (50 h group).","<b>Definitions again:</b> Überstunden are hours beyond the contract hours (art. 321c CO); Überzeit are hours beyond the statutory maximum of 45 or 50 hours a week (art. 12–13 ArG). You can have Überstunden without Überzeit (for example 42 to 44 hours a week) and above 45 or 50 hours you have both at once.","<b>When Überzeit is allowed:</b> only for urgent work or exceptional workload (art. 12 ArG), and no permit is needed. Limits: at most 2 hours a day per employee (more on non-working weekdays and in emergencies) and at most 170 hours a year (45-hour group) or 140 hours (50-hour group).","<b>Compensation:</b> Überzeit needs a 25% supplement, or equal time off if the employee agrees. Office, technical and large-retail sales staff only receive the supplement above 60 hours of Überzeit in the calendar year, but the basic pay for all the hours is still owed. Überstunden follow art. 321c: 25% supplement, or equal time off by agreement, unless a written agreement says otherwise (for example a lower supplement or none).","<b>Executives:</b> higher executives are outside the ArG hour limits: only the CO applies and they can waive overtime pay in writing. Other managers (Kader) are covered by the ArG overtime rules.","<b>Example:</b> an office employee earns CHF 40 an hour and works 100 hours of Überzeit in a year. The employer owes the basic pay for all 100 hours (CHF 4,000) plus the 25% supplement only on the 40 hours above the first 60: 40 × CHF 40 × 25% = CHF 400. Total CHF 4,400."],["Dos conceptos: Überstunden (horas por encima de la jornada contractual, CO) y Überzeit (horas por encima del máximo semanal legal, ArG).","CO: el trabajador debe hacer horas extra cuando sea necesario y razonable. Compensación: pago con recargo del 25%, o descanso 1:1 si ambos lo acuerdan. El recargo puede excluirse por escrito.","ArG: por encima del máximo de 45/50 h el recargo del 25% es obligatorio (en personal sin cargo directivo; en puestos administrativos, técnicos y de ventas las primeras 60 h anuales no llevan recargo). Tope anual: 170 h (grupo 45 h) o 140 h (grupo 50 h).","<b>Definiciones otra vez:</b> Überstunden son las horas por encima de la jornada contractual (art. 321c CO); Überzeit son las horas por encima del máximo legal de 45 o 50 horas semanales (art. 12–13 ArG). Puedes tener Überstunden sin Überzeit (por ejemplo de 42 a 44 horas semanales) y por encima de 45 o 50 horas tienes ambas a la vez.","<b>Cuándo se permite la Überzeit:</b> solo por trabajo urgente o carga extraordinaria (art. 12 ArG), y no hace falta permiso. Límites: como máximo 2 horas al día por trabajador (más en días laborables no trabajados y en emergencias) y como máximo 170 horas al año (grupo de 45 horas) o 140 horas (grupo de 50 horas).","<b>Compensación:</b> la Überzeit exige un recargo del 25%, o descanso igual si el trabajador está de acuerdo. El personal de oficina, técnico y de ventas de grandes comercios solo recibe el recargo por encima de 60 horas de Überzeit en el año natural, pero el salario base de todas las horas se debe igualmente. Las Überstunden siguen el art. 321c: recargo del 25%, o descanso igual por acuerdo, salvo que un pacto escrito diga otra cosa (por ejemplo un recargo menor o ninguno).","<b>Directivos:</b> los directivos superiores quedan fuera de los límites de jornada de la ArG: solo se aplica el CO y pueden renunciar por escrito al pago de las horas extra. Otros mandos (Kader) están cubiertos por las reglas de Überzeit de la ArG.","<b>Ejemplo:</b> una empleada de oficina gana 40 CHF por hora y hace 100 horas de Überzeit al año. El empleador debe el salario base de las 100 horas (4.000 CHF) y el recargo del 25% solo sobre las 40 horas por encima de las 60 primeras: 40 × 40 CHF × 25% = 400 CHF. Total 4.400 CHF."]],
s:["Verify the current text of ArG art. 13 and your sector’s GAV before applying it in payroll.","Verifica el texto vigente del art. 13 ArG y el GAV de tu sector antes de aplicarlo en nómina."]},
{t:["11. Worked examples: overtime, holidays, 13th salary","11. Ejemplos: horas extra, vacaciones, salario 13"],r:"CO art. 321c, 322, 329a–329d · ArG art. 12–13 · ArGV 1 art. 73",
b:[["<b>Overtime:</b> an office employee works a 42-hour contract week and earns about CHF 44 per hour. One week she works 46 hours. The 4 extra hours are Überstunden (above contract): CHF 44 × 125% = CHF 55 per hour, so CHF 220, or 4 hours of time off if both sides agree. A clause saying overtime is included in the salary is usually accepted only if it is written and limited to a reasonable number of hours.","The 46th hour is also above the statutory 45-hour maximum (Überzeit). For office staff the first 60 hours of Überzeit per year carry no statutory supplement. The employer cannot order Überzeit beyond 2 hours a day (except emergencies) or beyond the annual cap of 170 hours.","Time recording: the employer must record working time (ArGV 1 art. 73) unless a simplified record or a waiver applies. Records are kept for 5 years.","<b>Holidays:</b> an employee joins on 1 July. Four weeks a year pro rata gives 2 weeks for the remaining half year (2.5 weeks if under 20).","Sickness and holidays: if the employee is off sick for more than one month in a year, the employer may cut holidays by 1/12 for each full month beyond the first (art. 329b). Example: 3 months’ sickness = 2/12 of 20 days = about 3.3 days. For pregnancy, the cut starts only after 2 months. If you fall ill during holidays and cannot rest, those days are normally not counted as holiday (medical proof).","Hourly workers: holiday pay is added as a percentage: 8.33% for 4 weeks, 10.64% for 5 weeks, and it must be shown on the payslip.","<b>13th salary:</b> annual salary CHF 78,000 paid in 13 payments = CHF 6,000 per month. If the employee leaves on 31 August, the 13th is normally owed pro rata: 8/12 × 6,000 = CHF 4,000."],["<b>Horas extra:</b> una empleada de oficina tiene jornada contractual de 42 horas y gana unos 44 CHF por hora. Una semana trabaja 46. Las 4 horas de más son Überstunden (sobre el contrato): 44 × 125% = 55 CHF por hora, es decir 220 CHF, o 4 horas de descanso si ambas partes lo acuerdan. Una cláusula que diga que las horas extra están incluidas en el salario suele aceptarse solo si es escrita y limitada a un número razonable de horas.","La hora 46 también supera el máximo legal de 45 horas (Überzeit). En personal de oficina las primeras 60 horas de Überzeit al año no llevan recargo legal. El empleador no puede ordenar Überzeit por encima de 2 horas al día (salvo urgencias) ni del tope anual de 170 horas.","Registro horario: el empleador debe registrar el tiempo de trabajo (ArGV 1 art. 73), salvo registro simplificado o renuncia. Los registros se conservan 5 años.","<b>Vacaciones:</b> un trabajador entra el 1 de julio. Cuatro semanas al año en proporción dan 2 semanas para el medio año restante (2,5 semanas si es menor de 20).","Enfermedad y vacaciones: si el trabajador está de baja más de un mes en el año, el empleador puede reducir las vacaciones 1/12 por cada mes completo después del primero (art. 329b). Ejemplo: 3 meses de baja = 2/12 de 20 días = unos 3,3 días. En el embarazo, la reducción empieza solo tras 2 meses. Si enfermas durante las vacaciones y no puedes descansar, esos días normalmente no cuentan como vacaciones (con justificante médico).","Trabajadores por horas: la paga de vacaciones se suma como porcentaje: 8,33% para 4 semanas, 10,64% para 5 semanas, y debe constar en la nómina.","<b>Salario 13:</b> salario anual 78.000 CHF en 13 pagos = 6.000 CHF al mes. Si el trabajador se va el 31 de agosto, el 13.º normalmente se debe en proporción: 8/12 × 6.000 = 4.000 CHF."]],
s:["Spain: overtime is voluntary and capped at 80 hours a year. The CO has no annual cap, only the ArG limits above.","España: las horas extra son voluntarias y con tope de 80 horas al año. El CO no tiene tope anual, solo los límites de la ArG."]},
{t:["12. Holidays and public holidays","12. Vacaciones y festivos"],r:"CO art. 329a–329d · ArG art. 20a",
b:[["Minimum 4 weeks per year; 5 weeks until the year the employee turns 20. Contracts and GAV often give 5 weeks or more.","At least two consecutive weeks must be taken in one block during the year.","Pay during holidays continues; holidays cannot be replaced by money during the employment relationship (art. 329d).","The only federal public holiday is 1 August. All others are set by canton or municipality.","<b>When holidays are taken (art. 329c):</b> they are normally taken during the service year. The employer sets the dates but must consider the employee’s wishes as far as the business allows. At least two weeks must be taken together.","<b>No cash instead of holidays (art. 329d):</b> paying cash instead of holidays during employment is not allowed, except in exceptional cases such as irregular work, where the percentage supplement must be shown clearly on the payslip. Unused days are paid only when employment ends.","<b>Reductions (art. 329b):</b> if the employee is absent for reasons that are not their fault (sickness, accident, military service) for more than one month in the year, the employer may cut holidays by 1/12 for each full month beyond the first. For pregnancy, only absences beyond two full months count. If the absence is the employee’s own fault and exceeds one month in the year, the cut is 1/12 for each full month.","<b>Public holidays:</b> 1 August is the only holiday paid by law, in proportion to the workload. The cantons may equate up to 8 more holidays with Sundays (art. 20a ArG). For other holidays, monthly-paid staff usually keep their salary, while hourly-paid staff often have no right to pay unless agreed. A public holiday inside a holiday period is not counted as a holiday day, and part-timers get no extra days when a holiday falls on a day they do not work.","<b>Sickness during holidays:</b> tell the employer immediately. If the illness prevented recovery (with medical proof), those days can be made up, and the employer sets the replacement dates.","<b>Example:</b> a part-time employee working Monday to Wednesday has 4 weeks = 12 working days of holiday (4 × 3 days), not 20."],["Mínimo 4 semanas al año; 5 semanas hasta el año en que se cumplen 20 años. Contratos y GAV suelen dar 5 semanas o más.","Al menos dos semanas seguidas deben disfrutarse de una vez en el año.","Se mantiene el salario durante las vacaciones y no pueden sustituirse por dinero mientras dure la relación (art. 329d).","El único festivo federal es el 1 de agosto. Los demás los fija cada cantón o municipio.","<b>Cuándo se toman las vacaciones (art. 329c):</b> normalmente se toman durante el año de servicio. El empleador fija las fechas pero debe tener en cuenta los deseos del trabajador en la medida en que lo permita la empresa. Al menos dos semanas deben tomarse seguidas.","<b>Sin dinero en lugar de vacaciones (art. 329d):</b> no se permite pagar en efectivo en lugar de vacaciones durante la relación, salvo casos excepcionales como el trabajo irregular, donde el suplemento porcentual debe figurar claramente en la nómina. Los días no disfrutados solo se pagan al terminar la relación.","<b>Reducciones (art. 329b):</b> si el trabajador falta por causas que no son culpa suya (enfermedad, accidente, servicio militar) más de un mes en el año, el empleador puede reducir las vacaciones en 1/12 por cada mes completo después del primero. En el embarazo solo cuentan las ausencias que superan dos meses completos. Si la ausencia es por culpa del propio trabajador y supera un mes en el año, la reducción es de 1/12 por cada mes completo.","<b>Festivos:</b> el 1 de agosto es el único festivo pagado por ley, en proporción a la jornada. Los cantones pueden equiparar hasta 8 festivos más a los domingos (art. 20a ArG). En los demás festivos, el personal con salario mensual suele mantener el sueldo, mientras que el de pago por horas a menudo no tiene derecho a cobro salvo pacto. Un festivo dentro de un período de vacaciones no cuenta como día de vacaciones, y los de tiempo parcial no reciben días extra cuando un festivo cae en un día que no trabajan.","<b>Enfermedad durante las vacaciones:</b> avisa de inmediato al empleador. Si la enfermedad impidió descansar (con justificante médico), esos días pueden recuperarse, y el empleador fija las nuevas fechas.","<b>Ejemplo:</b> una empleada a tiempo parcial que trabaja de lunes a miércoles tiene 4 semanas = 12 días laborables de vacaciones (4 × 3 días), no 20."]],
s:["Spain: 30 calendar days. Switzerland: 4 weeks, usually counted in working days (20).","España: 30 días naturales. Suiza: 4 semanas, normalmente contadas en días laborables (20)."]},
{t:["13. Salary","13. Salario"],r:"CO art. 322–323b",
b:[["There is no federal minimum wage. The cantons of Geneva, Neuchâtel, Jura, Ticino and Basel-Stadt have their own minimum wages and some GAV set sector minimums.","Salary is paid monthly, at the end of the month, unless agreed otherwise. A written payslip is required (art. 323b).","The 13th month salary is mandatory only if agreed in the contract or GAV. If agreed, it is normally owed pro rata when employment ends mid-year; a discretionary bonus (art. 322d) is different.","Employers cannot deduct from salary beyond what the law and contract allow, and deductions for damage are strictly limited. Equal pay for equal work is required by the Gender Equality Act.","<b>Components:</b> base salary, 13th salary, commissions (art. 322b), bonus, expense allowances and benefits in kind. If no salary is agreed, the customary one is owed (art. 322).","<b>Gratifikation vs bonus:</b> a gratuity (art. 322d) is voluntary and discretionary. But if it is paid regularly without a reservation, or is tied to measurable targets, it can become a salary component the employee has a right to. Always check the wording.","<b>Payment and late salary:</b> salary is paid monthly; if the employer pays late after a reminder, default interest of 5% a year runs (art. 104). The employer cannot cut salary unilaterally: a change requires agreement or a termination with a new offer (Änderungskündigung).","<b>Pay equality analysis:</b> employers with 100 or more employees must run a pay equality analysis, have it verified and inform staff (GlG art. 13a ff.), repeating it every 4 years if equality is not yet proven.","<b>Minimum wages:</b> there is no national minimum wage. In 2026 five cantons have statutory minimums, gross per hour: Geneva CHF 24.59 (24.73 from 2027), Basel-Stadt 22.20 (22.50 from 2027), Jura 21.40, Neuchâtel 21.35 and Ticino 20.00–20.50 depending on the sector (20.50–21.00 from 2027). The city of Lucerne has 22.75 since 2026, and the cities of Zurich (23.90) and Winterthur (23.00) approved minimums that the Federal Court upheld in May 2026 but that are not yet in force. Vaud approved the principle in June 2026 but has no amount yet. Apprentices, interns, minors and holiday jobs are often exempt, depending on the rules. The canton-by-canton detail is in Tools, “Differences between cantons”.","<b>Collective agreements:</b> in sectors with a GAV, wage floors come from the agreement (for example the hospitality L-GAV). In Ticino, Basel-Stadt and Jura a generally binding GAV takes precedence over the cantonal minimum; in Geneva and Neuchâtel the cantonal minimum prevails. On 19 June 2026 Parliament passed a law that gives the minimums of generally binding collective agreements precedence over cantonal and municipal ones (with a special regime for Geneva and Neuchâtel); unions have submitted a referendum, so a vote is expected in 2027. Verify the current rule.","<b>Hourly and monthly pay:</b> monthly salary = hourly wage × weekly hours × 52 ÷ 12. For 42 hours a week, a wage of CHF 22 an hour is 22 × 42 × 52 ÷ 12 = CHF 4,004 a month."],["No existe salario mínimo federal. Ginebra, Neuchâtel, Jura, Tesino y Basilea-Ciudad tienen salarios mínimos propios y algunos GAV fijan mínimos sectoriales.","El salario se paga mensualmente a fin de mes, salvo pacto. Es obligatorio entregar nómina por escrito (art. 323b).","El salario 13 es obligatorio solo si está en el contrato o GAV. Si se ha pactado, normalmente se debe de forma proporcional cuando la relación termina a mitad de año; un bonus discrecional (art. 322d) es distinto.","No se puede descontar del salario más allá de lo permitido por ley y contrato, y los descuentos por daños están muy limitados. La igualdad salarial la exige la Ley de Igualdad.","<b>Componentes:</b> salario base, salario 13, comisiones (art. 322b), bonus, indemnizaciones de gastos y retribución en especie. Si no se pacta salario, se debe el habitual (art. 322).","<b>Gratifikation y bonus:</b> la gratificación (art. 322d) es voluntaria y discrecional. Pero si se paga con regularidad sin reserva, o está ligada a objetivos medibles, puede convertirse en un componente salarial con derecho a cobrarla. Revisa siempre la redacción.","<b>Pago y mora:</b> el salario se paga mensualmente; si el empleador paga tarde tras un requerimiento, corre un interés de demora del 5% anual (art. 104). El empleador no puede reducir el salario unilateralmente: hace falta acuerdo o un despido con nueva oferta (Änderungskündigung).","<b>Análisis de igualdad salarial:</b> los empleadores con 100 o más empleados deben realizar un análisis de igualdad salarial, hacerlo verificar e informar al personal (art. 13a ss. GlG), repitiéndolo cada 4 años si aún no se ha demostrado la igualdad.","<b>Salarios mínimos:</b> no hay salario mínimo nacional. En 2026 cinco cantones tienen mínimos legales, brutos por hora: Ginebra 24,59 CHF (24,73 desde 2027), Basilea Ciudad 22,20 (22,50 desde 2027), Jura 21,40, Neuchâtel 21,35 y Tesino 20,00–20,50 según el sector (20,50–21,00 desde 2027). La ciudad de Lucerna tiene 22,75 desde 2026, y las ciudades de Zúrich (23,90) y Winterthur (23,00) aprobaron mínimos que el Tribunal Federal confirmó en mayo de 2026 pero que aún no están en vigor. Vaud aprobó el principio en junio de 2026 pero todavía no tiene importe. Aprendices, practicantes, menores y trabajos de vacaciones suelen estar exentos, según las normas. El detalle cantón por cantón está en Herramientas, «Diferencias entre cantones».","<b>Convenios colectivos:</b> en los sectores con GAV, los mínimos salariales vienen del convenio (por ejemplo el L-GAV de hostelería). En Tesino, Basilea Ciudad y Jura un GAV de obligado cumplimiento tiene preferencia sobre el mínimo cantonal; en Ginebra y Neuchâtel prevalece el mínimo cantonal. El 19 de junio de 2026 el Parlamento aprobó una ley que da preferencia a los mínimos de los convenios colectivos de obligado cumplimiento sobre los cantonales y municipales (con un régimen especial para Ginebra y Neuchâtel); los sindicatos han presentado un referéndum, así que se espera una votación en 2027. Verifica la regla vigente.","<b>Salario por hora y mensual:</b> salario mensual = salario por hora × horas semanales × 52 ÷ 12. Con 42 horas semanales, un salario de 22 CHF por hora es 22 × 42 × 52 ÷ 12 = 4.004 CHF al mes."]],
s:["Spain: two extra pagas by default. In Switzerland the 13th is agreed, not statutory.","España: dos pagas extra por convenio o ley. En Suiza la 13.ª se pacta, no es legal."]},
{t:["14. Payroll: payslip, what counts for contributions, 12 or 13 payments","14. Nómina: conceptos, cotización y 12 o 13 pagas"],r:"CO art. 322–323b · AHVG art. 5 · AHVV art. 7–8 · Merkblatt 2.01",
b:[["<b>Gross to net:</b> the payslip (Lohnabrechnung, required by art. 323b CO) starts from gross salary (Bruttolohn), subtracts the employee’s social contributions and, if applicable, tax at source, and ends with net pay (Nettolohn). The employer adds its own share and pays both to the compensation fund (Ausgleichskasse) and the insurers. After year-end the employer issues the annual salary certificate (Lohnausweis) that you attach to your tax return.","<b>What counts towards AHV/IV/EO and ALV (massgebender Lohn):</b> the rule is that any remuneration for dependent work counts. That includes base salary, the 13th salary, bonuses and gratuities, commissions, overtime pay and supplements, night and Sunday supplements, holiday pay, benefits in kind (private use of a company car, free housing or meals, valued at flat rates) and private costs paid by the employer.","<b>What does not count:</b> family allowances; genuine expense reimbursements (real costs, such as business travel against receipts, or approved flat rates); minor or irregular benefits in kind such as a half-fare travelcard, a business phone or occasional meal invitations; wages up to CHF 2,500 a year from one employer (not for household work, and the employee can ask for contributions anyway); and the employer’s own contributions. Paying salary disguised as ‘expenses’ does not work: the AHV treats it as salary.","<b>Ceilings and differences by insurance:</b> AHV/IV/EO has no ceiling. ALV and UVG are capped at CHF 148,200 of salary. BVG uses the pension fund’s own definition of insured salary (often fixed salary including the 13th, sometimes excluding irregular bonuses), so read your fund regulations.","<b>Typical deductions on a Swiss payslip:</b> AHV/IV/EO 5.3%; ALV 1.1%; BVG (employee share to the pension fund); NBU (non-occupational accident); often KTG (daily sickness insurance) if the employer has one; and Quellensteuer if you have no C permit. Family allowances are paid by the employer on top, and are cantonal.","<b>Example with 13 payments:</b> annual gross CHF 97,500 = 13 × CHF 7,500, employee aged 40. Monthly deductions: AHV/IV/EO CHF 397.50; ALV CHF 82.50; BVG about CHF 247 (CHF 3,213 a year ÷ 13); NBU assumed at 1.0% = CHF 75. Net before tax at source: about CHF 6,698. The 13th payment, usually in November or December, is also subject to AHV and ALV and, depending on the fund, BVG. This is a simplification: real BVG and NBU rates depend on your fund and insurer.","<b>12 or 13 payments:</b> in Switzerland the contract states an annual gross salary and how it is paid: ‘12 × CHF 8,000’ (CHF 96,000) or ‘13 × CHF 7,385’ (about CHF 96,000). The 13th is not required by law; it exists only if agreed in the contract, a collective agreement or company rules. It is usually paid in November or December (sometimes half in June and half in December). Compare annual gross salaries, not monthly ones: CHF 78,000 is CHF 6,500 a month over 12 payments, but CHF 6,000 over 13.","<b>Hourly workers:</b> the 13th salary is added as 8.33% (1/12) on top of the hourly rate, and holiday pay (8.33% or 10.64%) is shown as a separate percentage on the payslip.","<b>Employer cost:</b> on top of gross salary, the employer pays AHV/IV/EO 5.3% and ALV 1.1%, at least half of BVG, occupational accident (BU), usually part of the sickness daily allowance premium, the family allowance fund contribution (cantonal) and small administration fees. As a rough estimate this is around 12–20% over gross, depending on canton, sector and pension fund."],["<b>Del bruto al neto:</b> la nómina (Lohnabrechnung, exigida por el art. 323b CO) parte del salario bruto (Bruttolohn), resta las cotizaciones sociales del trabajador y, si procede, el impuesto en origen, y termina en el salario neto (Nettolohn). El empleador añade su parte y paga ambas a la caja de compensación (Ausgleichskasse) y a las aseguradoras. Después de fin de año el empleador emite el certificado anual de salario (Lohnausweis) que adjuntas a tu declaración de impuestos.","<b>Qué cotiza en AHV/IV/EO y ALV (massgebender Lohn):</b> la regla es que cuenta toda retribución por trabajo dependiente. Incluye salario base, salario 13, bonus y gratificaciones, comisiones, pago y recargos de horas extra, recargos de noche y domingo, paga de vacaciones, retribución en especie (uso privado de vehículo de empresa, vivienda o comidas gratuitas, valoradas a tanto alzado) y gastos privados pagados por el empleador.","<b>Qué no cotiza:</b> los subsidios familiares; los reembolsos de gastos genuinos (costes reales, como viajes de trabajo con justificantes, o tanto alzado aprobado); la retribución en especie menor o irregular, como un abono de media tarifa, un móvil de empresa o invitaciones ocasionales a comidas; los salarios de hasta 2.500 CHF al año de un mismo empleador (no en servicio doméstico, y el trabajador puede pedir igualmente que se coticen); y las cotizaciones propias del empleador. Pagar salario disfrazado de ‘gastos’ no funciona: la AHV lo trata como salario.","<b>Topes y diferencias por seguro:</b> AHV/IV/EO no tiene tope. ALV y UVG tienen un tope de 148.200 CHF de salario. La BVG usa la definición de salario asegurado de cada caja de pensiones (a menudo salario fijo incluido el 13, a veces sin los bonus irregulares), así que lee el reglamento de tu caja.","<b>Descuentos típicos en una nómina suiza:</b> AHV/IV/EO 5,3%; ALV 1,1%; BVG (parte del trabajador a la caja de pensiones); NBU (accidente no profesional); a menudo KTG (subsidio diario por enfermedad) si el empleador lo tiene; y Quellensteuer si no tienes permiso C. Los subsidios familiares los paga el empleador además y son cantonales.","<b>Ejemplo con 13 pagas:</b> bruto anual 97.500 CHF = 13 × 7.500 CHF, trabajador de 40 años. Descuentos mensuales: AHV/IV/EO 397,50 CHF; ALV 82,50 CHF; BVG unos 247 CHF (3.213 CHF al año ÷ 13); NBU supuesto del 1,0% = 75 CHF. Neto antes del impuesto en origen: unos 6.698 CHF. La paga 13, normalmente en noviembre o diciembre, también cotiza en AHV y ALV y, según la caja, en BVG. Es una simplificación: los tipos reales de BVG y NBU dependen de tu caja y aseguradora.","<b>12 o 13 pagas:</b> en Suiza el contrato fija un salario bruto anual y cómo se paga: ‘12 × 8.000 CHF’ (96.000 CHF) o ‘13 × 7.385 CHF’ (unos 96.000 CHF). La 13.ª no la exige la ley; existe solo si se pacta en el contrato, un convenio colectivo o normas de empresa. Suele pagarse en noviembre o diciembre (a veces mitad en junio y mitad en diciembre). Compara salarios brutos anuales, no mensuales: 78.000 CHF son 6.500 CHF al mes en 12 pagas, pero 6.000 CHF en 13.","<b>Trabajadores por horas:</b> el salario 13 se añade como 8,33% (1/12) sobre la tarifa horaria, y la paga de vacaciones (8,33% o 10,64%) consta como porcentaje aparte en la nómina.","<b>Coste del empleador:</b> además del salario bruto, el empleador paga AHV/IV/EO 5,3% y ALV 1,1%, al menos la mitad de la BVG, accidente profesional (BU), normalmente parte de la prima del subsidio diario por enfermedad, la cuota de la caja de subsidios familiares (cantonal) y pequeñas tasas de administración. Como estimación aproximada, supone en torno a un 12–20% sobre el bruto, según cantón, sector y caja de pensiones."]],
s:["In Spain pay is quoted as an annual gross split into 12 or 14 pagas. Two extra pagas are normally owed by statute (Estatuto art. 31, timing set by convenio) and can be prorated into the 12 monthly payslips. In Switzerland extras exist only by contract. Employer social cost in Spain is roughly 30% or more of gross, much higher than in Switzerland.","En España el salario se cita como bruto anual repartido en 12 o 14 pagas. Normalmente la ley da dos pagas extra (art. 31 del Estatuto, fecha fijada por convenio) y pueden prorratearse en las 12 nóminas mensuales. En Suiza las extras existen solo por contrato. El coste social del empleador en España es de en torno al 30% o más del bruto, mucho más alto que en Suiza."]},
{t:["15. Example payslips for different cases","15. Nóminas de ejemplo según casuística"],r:"AHVG · AVIG · BVG · UVG · CO art. 323b",
b:[["<b>Assumptions (monthly, CHF):</b> AHV/IV/EO 5.3%; ALV 1.1% up to CHF 148,200 a year; BVG employee half of the legal credit (age 25–34: 7%, 35–44: 10%, 45–54: 15%, 55–65: 18%) on the coordinated salary (annual gross minus CHF 26,460, maximum CHF 64,260); NBU assumed at 1.0%; no tax at source. Real pension fund and insurer rates differ.","<b>A. Standard employee, 12 payments:</b> CHF 6,000 a month (CHF 72,000 a year), age 30. AHV/IV/EO CHF 318.00; ALV CHF 66.00; BVG CHF 132.83 (7% × (72,000 − 26,460) = CHF 3,187.80 a year, half, ÷ 12); NBU CHF 60.00. Total deductions CHF 576.83; net before tax at source CHF 5,423.17. The employer pays at least CHF 516.83 on top (318.00 + 66.00 + 132.83), plus BU, KTG, family fund and fees.","<b>B. 13 payments:</b> CHF 7,500 × 13 (CHF 97,500 a year), age 40. AHV/IV/EO CHF 397.50; ALV CHF 82.50; BVG CHF 247.15; NBU CHF 75.00. Net CHF 6,697.85 per payment, with the same deductions on the 13th payment. Spreading BVG over 13 payments is a simplification.","<b>C. Part-time 50%:</b> CHF 3,500 × 12 (CHF 42,000), age 40. AHV/IV/EO CHF 185.50; ALV CHF 38.50; BVG CHF 64.75 (10% × (42,000 − 26,460) = CHF 1,554 a year, half, ÷ 12, using the legal fixed coordination deduction); NBU CHF 35.00. Net CHF 3,176.25. Many funds scale the coordination deduction for part-timers, which would change the BVG amount.","<b>D. Low salary, below the BVG threshold:</b> CHF 1,800 × 12 (CHF 21,600, under CHF 22,680). AHV/IV/EO CHF 95.40; ALV CHF 19.80; no BVG; NBU CHF 18.00 (from 8 hours a week). Net CHF 1,666.80.","<b>E. High earner above the caps:</b> CHF 20,000 × 12 (CHF 240,000), age 50. AHV/IV/EO CHF 1,060.00 on the full salary; ALV CHF 135.85 (only on CHF 12,350 a month, the cap ÷ 12); BVG CHF 401.63 (15% × CHF 64,260 = CHF 9,639 a year, half, ÷ 12, mandatory minimum only); NBU CHF 123.50 (capped salary). Net before tax CHF 18,279.02. Supra-mandatory plans usually add more BVG.","<b>F. Working after reference age (65):</b> CHF 5,000 a month. With the CHF 1,400 monthly allowance, AHV/IV/EO applies only to CHF 3,600 = CHF 190.80; no ALV; BVG optional; NBU CHF 50.00. Net CHF 4,759.20.","<b>G. Employee without a C permit:</b> same deductions as case A, plus tax at source (Quellensteuer): a cantonal tariff based on canton, marital status and children, deducted from the pay and replacing normal tax payments. See the CHF 120,000 rule in section 3."],["<b>Supuestos (mensual, CHF):</b> AHV/IV/EO 5,3%; ALV 1,1% hasta 148.200 CHF al año; BVG la mitad del trabajador de la bonificación legal (25–34 años: 7%, 35–44: 10%, 45–54: 15%, 55–65: 18%) sobre el salario coordinado (bruto anual menos 26.460 CHF, máximo 64.260 CHF); NBU supuesto del 1,0%; sin impuesto en origen. Los tipos reales de la caja y la aseguradora varían.","<b>A. Empleado estándar, 12 pagas:</b> 6.000 CHF al mes (72.000 CHF al año), 30 años. AHV/IV/EO 318,00 CHF; ALV 66,00 CHF; BVG 132,83 CHF (7% × (72.000 − 26.460) = 3.187,80 CHF al año, la mitad, ÷ 12); NBU 60,00 CHF. Descuentos totales 576,83 CHF; neto antes del impuesto en origen 5.423,17 CHF. El empleador paga al menos 516,83 CHF adicionales (318,00 + 66,00 + 132,83), más BU, KTG, caja de familia y tasas.","<b>B. 13 pagas:</b> 7.500 CHF × 13 (97.500 CHF al año), 40 años. AHV/IV/EO 397,50 CHF; ALV 82,50 CHF; BVG 247,15 CHF; NBU 75,00 CHF. Neto 6.697,85 CHF por paga, con los mismos descuentos en la paga 13. Repartir la BVG en 13 pagas es una simplificación.","<b>C. Tiempo parcial 50%:</b> 3.500 CHF × 12 (42.000 CHF), 40 años. AHV/IV/EO 185,50 CHF; ALV 38,50 CHF; BVG 64,75 CHF (10% × (42.000 − 26.460) = 1.554 CHF al año, la mitad, ÷ 12, con la deducción de coordinación fija legal); NBU 35,00 CHF. Neto 3.176,25 CHF. Muchas cajas reducen la deducción de coordinación para trabajadores a tiempo parcial, lo que cambiaría el importe de la BVG.","<b>D. Salario bajo, por debajo del umbral BVG:</b> 1.800 CHF × 12 (21.600 CHF, menos de 22.680 CHF). AHV/IV/EO 95,40 CHF; ALV 19,80 CHF; sin BVG; NBU 18,00 CHF (desde 8 horas semanales). Neto 1.666,80 CHF.","<b>E. Salario alto por encima de los topes:</b> 20.000 CHF × 12 (240.000 CHF), 50 años. AHV/IV/EO 1.060,00 CHF sobre todo el salario; ALV 135,85 CHF (solo sobre 12.350 CHF al mes, el tope ÷ 12); BVG 401,63 CHF (15% × 64.260 CHF = 9.639 CHF al año, la mitad, ÷ 12, solo el mínimo obligatorio); NBU 123,50 CHF (salario topado). Neto antes de impuestos 18.279,02 CHF. Los planes supraobligatorios suelen añadir más BVG.","<b>F. Trabajo tras la edad de referencia (65):</b> 5.000 CHF al mes. Con la franquicia de 1.400 CHF mensuales, la AHV/IV/EO solo se aplica sobre 3.600 CHF = 190,80 CHF; sin ALV; BVG opcional; NBU 50,00 CHF. Neto 4.759,20 CHF.","<b>G. Empleado sin permiso C:</b> mismos descuentos que el caso A, más el impuesto en origen (Quellensteuer): una tarifa cantonal según cantón, estado civil e hijos, que se descuenta de la paga y sustituye a los pagos normales de impuestos. Ver la regla de 120.000 CHF en el apartado 3."]],
s:["A Spanish payslip shows the base de cotización and a progressive IRPF withholding on every payment. In Switzerland, residents with a C permit or Swiss nationality pay income tax later through their own tax return, and only Quellensteuer is withheld at source.","Una nómina española muestra la base de cotización y una retención progresiva de IRPF en cada pago. En Suiza, los residentes con permiso C o nacionalidad suiza pagan el impuesto sobre la renta después, con su propia declaración, y solo se retiene en origen la Quellensteuer."]},
{t:["16. Reading a real payslip line by line","16. Cómo leer una nómina real línea a línea"],r:"Case K of the simulator · AHVG · UVG · BVG · Quellensteuer",
b:[["<b>Layout:</b> a real Swiss slip lists Bezeichnung, Anzahl, %, Basis and Betrag in three blocks (Lohn, Abzüge, Weitere Abzüge) and ends with Nettolohn. Case K of the simulator reproduces one, with personal data removed.","<b>Festlohn and Anzahl:</b> Festlohn is the fixed monthly salary. Hospitality payroll often counts a month as 30 days (Anzahl 30.00), so a partial month is paid in days. Other sectors leave Anzahl blank.","<b>13. Monatslohn:</b> the line can appear with 0.00 in months when no 13th is paid. The amount appears in the month set by the contract.","<b>AHV/IV/EO 5.300% and ALV 1.100%:</b> on the full gross salary (ALV up to CHF 148,200 a year). Check: 4,200.00 × 5.3% = 222.60; × 1.1% = 46.20.","<b>Krankengeldversicherung (KTG), 0.770%:</b> daily sickness insurance. The rate comes from the insurer and the deduction is the employee share. 4,200 × 0.77% = 32.34, shown as 32.35 after rounding.","<b>Unfallversicherung (NBU), 1.433%:</b> non-occupational accident premium, set by the insurer and the employer’s risk class. 4,200 × 1.433% = 60.19, shown as 60.20. In section 15 we assumed 1.0%: real rates differ.","<b>UVG Zusatzversicherung, 0.020%:</b> supplementary accident insurance, i.e. cover beyond the statutory UVG. On this slip it shows 0.00 for the employee, so it is not charged to the employee.","<b>Berufliche Vorsorge, 7.000% on 1,995.00:</b> the employee rate is set by the pension fund. The base is the coordinated monthly salary: (4,200 × 12 − 26,460) ÷ 12 = 1,995. 1,995 × 7% = 139.65. In section 15 we used half of the legal credit; many funds instead charge a fixed percentage of the coordinated salary that also covers risk and administration costs.","<b>Quellensteuer nach Tarif (A0N), 1.770%:</b> tax at source from a cantonal tariff. The code has three parts: A = single (alleinstehend), 0 = number of child deductions, N = no church tax (Y = with church tax). The employer applies the code from the employee’s declaration. 4,200 × 1.77% = 74.34, shown as 74.35.","<b>Weitere Abzüge, Verpflegung pauschal:</b> a flat meal charge, 30 days × CHF 9.00 = CHF 270.00, deducted from net pay after the social deductions. The AHV base stays at 4,200 on this slip. AHV flat rates (breakfast 3.50, lunch 10.00, dinner 8.00 a day) matter when the employer charges less than the flat value or provides meals for free.","<b>Nettolohn block:</b> Nettolohn 3,354.65 = 4,200.00 − 575.35 (Abzüge) − 270.00 (Weitere Abzüge). Differenz Vormonat is usually a correction carried from the previous month, Zahlung am shows the payment date and file format (XML / ISO 20022 is the bank file standard) and Restbetrag/Übertrag is any amount carried forward. Confirm these with your payroll provider.","<b>Rounding:</b> Swiss payroll commonly rounds each deduction to the nearest 5 Rappen, as seen here (32.34 to 32.35, 60.19 to 60.20, 74.34 to 74.35)."],["<b>Estructura:</b> una nómina suiza real enumera Bezeichnung, Anzahl, %, Basis y Betrag en tres bloques (Lohn, Abzüge, Weitere Abzüge) y termina en Nettolohn. El caso K del simulador reproduce una, sin datos personales.","<b>Festlohn y Anzahl:</b> Festlohn es el salario fijo mensual. En hostelería se suele contar el mes como 30 días (Anzahl 30,00), así que un mes parcial se paga por días. Otros sectores dejan Anzahl en blanco.","<b>13. Monatslohn:</b> la línea puede aparecer con 0,00 en los meses en que no se paga la 13.ª. El importe aparece en el mes fijado por el contrato.","<b>AHV/IV/EO 5,300% y ALV 1,100%:</b> sobre el salario bruto completo (ALV hasta 148.200 CHF al año). Comprobación: 4.200,00 × 5,3% = 222,60; × 1,1% = 46,20.","<b>Krankengeldversicherung (KTG), 0,770%:</b> subsidio diario por enfermedad. El tipo lo fija la aseguradora y el descuento es la parte del trabajador. 4.200 × 0,77% = 32,34, que figura como 32,35 tras el redondeo.","<b>Unfallversicherung (NBU), 1,433%:</b> prima del accidente no profesional, fijada por la aseguradora y la clase de riesgo del empleador. 4.200 × 1,433% = 60,19, que figura como 60,20. En el apartado 15 supusimos el 1,0%: los tipos reales varían.","<b>UVG Zusatzversicherung, 0,020%:</b> seguro complementario de accidentes, es decir, cobertura adicional a la UVG legal. En esta nómina figura 0,00 para el trabajador, así que no se le carga.","<b>Berufliche Vorsorge, 7,000% sobre 1.995,00:</b> el tipo del trabajador lo fija la caja de pensiones. La base es el salario coordinado mensual: (4.200 × 12 − 26.460) ÷ 12 = 1.995. 1.995 × 7% = 139,65. En el apartado 15 usamos la mitad de la bonificación legal; muchas cajas cobran en cambio un porcentaje fijo del salario coordinado que cubre también riesgo y administración.","<b>Quellensteuer nach Tarif (A0N), 1,770%:</b> impuesto en origen de un baremo cantonal. El código tiene tres partes: A = soltero (alleinstehend), 0 = número de deducciones por hijos, N = sin impuesto eclesiástico (Y = con él). El empleador aplica el código según la declaración del trabajador. 4.200 × 1,77% = 74,34, que figura como 74,35.","<b>Weitere Abzüge, Verpflegung pauschal:</b> cobro fijo de comidas, 30 días × 9,00 CHF = 270,00 CHF, descontado del neto tras las deducciones sociales. La base AHV sigue en 4.200 en esta nómina. Los tantos alzados AHV (desayuno 3,50, almuerzo 10,00, cena 8,00 al día) importan cuando el empleador cobra menos que el valor fijo o da las comidas gratis.","<b>Bloque Nettolohn:</b> Nettolohn 3.354,65 = 4.200,00 − 575,35 (Abzüge) − 270,00 (Weitere Abzüge). Differenz Vormonat suele ser una corrección arrastrada del mes anterior, Zahlung am indica la fecha de pago y el formato de fichero (XML / ISO 20022 es el estándar bancario) y Restbetrag/Übertrag es cualquier importe arrastrado. Confírmalo con tu proveedor de nóminas.","<b>Redondeo:</b> la nómina suiza suele redondear cada descuento a 5 céntimos, como se ve aquí (32,34 a 32,35, 60,19 a 60,20, 74,34 a 74,35)."]],
s:["A Spanish nómina groups devengos and deducciones with a base de cotización and a single IRPF withholding. A Swiss payslip lists each insurance on its own line, each with its own rate and base.","Una nómina española agrupa devengos y deducciones con una base de cotización y una única retención de IRPF. Una nómina suiza lista cada seguro en su propia línea, con su tipo y su base."]},
{t:["7. HR processes: onboarding, monthly payroll, year-end, offboarding","7. Procesos de RRHH: alta, nómina mensual, cierre anual, baja"],r:"AHVG · BVG · UVG · CO art. 330a, 330b · Lohndeklaration",
b:[["<b>Onboarding, before the start date:</b> check the right to work (an EU/EFTA national needs a permit or, for up to 90 working days, the online notification) and sign the contract, or give the written terms within one month (art. 330b). Agree probation, salary, number of payments and workload.","<b>Onboarding, registrations:</b> AHV (if the employee has no AHV number, ask the compensation fund for the insurance card when they join; new staff are reported once a year with the salary declaration); pension fund if the salary passes the entry threshold, including transfer of vested benefits from the previous fund; accident insurer (BU, and NBU from 8 hours a week); daily sickness insurance if the company has one; family allowance fund and family booklet for staff with children; tax at source code from the employee’s declaration if they have no C permit. Health insurance (KVG) is the employee’s own, not payroll.","<b>Every month:</b> collect variable data (hours, absences, bonuses, expenses), calculate, issue the written payslip (art. 323b) and pay by month-end. The employer pays AHV, ALV and family fund advances to the compensation fund, monthly or quarterly, within 30 days of the period end or interest runs. Pension fund and insurer contributions follow each fund’s rules; tax at source is settled with the canton as its rules set.","<b>Changes during the year:</b> report to the insurers and the fund any change of salary, workload, marital status or exit.","<b>Year-end:</b> the salary declaration to the compensation fund (AHV/IV/EO/ALV/FAK) must arrive by 30 January, with 5% default interest if late. Accident and daily sickness declarations usually have the same date, set by the contract. The pension fund wants the salaries for the coming year in advance. Employees get their annual salary certificate (Lohnausweis, the same form nationwide) in January for the tax return.","<b>Offboarding:</b> issue the final payslip (holiday payout, pro-rata 13th, overtime), the work

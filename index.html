{t:["27. Returning to your home country from Switzerland", "27. Volver a España desde Suiza"],r:"Reg. 883/2004 · FZG art. 5 · AVIG",
b:[["<b>Order matters:</b> some steps can only be done while you are still in Switzerland. Before leaving: give notice to your employer, choose a vested-benefits foundation for your pension fund, request the U1 form, decide about pillar 3a, and deregister from your commune. This section is written for people moving to an EU/EFTA country; for other countries, rules depend on the social security agreement between Switzerland and your country.","<b>Deregister (Abmeldung):</b> in person at your commune, usually between 8 weeks and 14 days before leaving (it varies by commune). Bring ID or passport, your exact address abroad and a Swiss contact address for tax matters. Deregistration ends your residence permit; keep the confirmation, you need it for pillar 3a.","<b>Health and accident insurance:</b> the mandatory Swiss health and accident insurance ends when you leave for good, so cancel the policy and any supplementary cover. In your new country, register with the local authorities and the national health system to get cover; the steps differ by country.","<b>Unemployment, you lose your job in Switzerland:</b> if you have been registered with the RAV for at least 4 weeks, you can ask to export your Swiss benefit to look for work in an EU/EFTA country for up to 3 months. Request it before leaving: the RAV gives you the form PD U2, which you hand in to the employment service of your new country, registering as a job seeker within the deadline (normally 7 days). It does not extend your total entitlement.","<b>Unemployment, you return without a Swiss benefit:</b> under EU coordination, your new country can count your Swiss contributions together with its own, but it often requires that you work there last, after returning, and become unemployed under its rules. Ask the Swiss unemployment fund for the U1 form before leaving (not compulsory, but it speeds things up). The foreign benefit is reduced by the days you already received in another EU country.","<b>If you contributed in your home country before moving:</b> if you did not use those contributions and your job in Switzerland ends, you may be able to claim there directly on return, provided you receive no benefit in Switzerland. The minimum contribution period and how far back it is counted depend on national rules, so check them before leaving.","<b>AHV pension:</b> it is paid abroad when you reach the reference age and is not reduced because you live abroad. Contributions generally cannot be refunded when you move to an EU state. Your new country may require you to declare the pension and tax it there, so check the local rules.","<b>Pension fund (2nd pillar):</b> if you will be compulsorily insured for old age in an EU/EFTA state, the mandatory part cannot be paid out in cash: it stays in a Swiss vested-benefits account, available from 5 years before the reference age. The supra-mandatory part can be paid out. If you give no instructions, the money goes to the Auffangeinrichtung. Capital paid to someone living abroad is taxed at source in Switzerland, so check the tax treatment in both countries first.","<b>Pillar 3a:</b> you can withdraw it when you leave Switzerland for good, wherever you go, with proof of deregistration and of your foreign address. It is taxed in Switzerland at source, so timing matters. You can also leave it where it is, but some providers do not keep 3a accounts for people living abroad.","<b>Retirement pension in your new country:</b> under EU rules your Swiss years can count towards the minimum insurance period required there; each country then pays its own share pro rata, and you can receive both pensions. From Switzerland the claim is filed through your last Swiss compensation fund.","<b>Taxes:</b> file your last Swiss return and settle the withholding tax. In your new country you become tax resident under local rules (often more than 183 days a year or your centre of economic interests there) and are usually taxed on your worldwide income. A double taxation treaty applies; consider a tax adviser.","<b>Take with you:</b> your work certificate (see the certificate section), final payslips and the annual salary statement, the AHV account statement, the pension fund certificate and vested-benefits details, the health insurance certificate, the deregistration confirmation and the unemployment forms. More on pensions in section 26."], ["<b>El orden importa:</b> algunos trámites solo se pueden hacer mientras sigues en Suiza. Antes de irte: avisa a tu empresa respetando el preaviso, elige una fundación de libre paso para tu caja de pensiones, solicita el formulario U1, decide sobre el pilar 3a y date de baja en tu municipio.", "<b>Baja en el municipio (Abmeldung):</b> en persona en tu municipio, normalmente entre 8 semanas y 14 días antes de irte (varía según el municipio). Lleva DNI o pasaporte, tu dirección exacta en el extranjero y una dirección de contacto en Suiza para asuntos fiscales. La baja pone fin a tu permiso de residencia; guarda el justificante, lo necesitas para el pilar 3a.", "<b>Seguro médico y de accidentes:</b> el seguro médico y de accidentes obligatorio suizo termina cuando te vas definitivamente, así que cancela la póliza y los complementarios. En España, empadrónate en tu ayuntamiento y date de alta en la Seguridad Social para obtener la tarjeta sanitaria.", "<b>Paro, pierdes el empleo en Suiza:</b> si llevas al menos 4 semanas inscrito en el RAV, puedes pedir exportar tu prestación suiza para buscar trabajo en España hasta 3 meses. Solicítalo antes de irte: el RAV te da el formulario PD U2, que entregas al servicio de empleo español (SEPE), inscribiéndote como demandante dentro del plazo (normalmente 7 días). No amplía tu derecho total.", "<b>Paro, vuelves sin prestación suiza:</b> España suma tus cotizaciones suizas a las españolas, pero debes trabajar en España en último lugar, tras volver, y quedarte en desempleo según las reglas españolas. Pide a la caja de desempleo suiza el formulario U1 antes de irte (no es obligatorio, pero agiliza el trámite). La prestación española se reduce en los días que ya hayas cobrado en otro país de la UE.", "<b>Si cotizaste en España antes de emigrar:</b> si no usaste esas cotizaciones y termina tu trabajo en Suiza, puedes reclamar directamente en España al volver, siempre que no cobres prestación en Suiza y tengas 360 días cotizados en los 6 años anteriores a salir de España.", "<b>No es el subsidio de “emigrante retornado”:</b> ese subsidio español es para quienes trabajaron fuera del EEE y de Suiza, así que no se aplica si vuelves de Suiza.", "<b>Pensión AHV:</b> se cobra en el extranjero al llegar a la edad de referencia y no se reduce por vivir en España. Por lo general, las cotizaciones no se reembolsan al irte a un país de la UE. En España la pensión debe declararse y, según resoluciones de la Hacienda española, tributa allí.", "<b>Caja de pensiones (2.º pilar):</b> si vas a estar asegurado obligatoriamente para la vejez en España, la parte obligatoria no se puede cobrar en efectivo: queda en una cuenta de libre paso suiza, disponible desde 5 años antes de la edad de referencia. La parte supraobligatoria sí puede cobrarse. Si no das instrucciones, el dinero va a la Auffangeinrichtung. El capital pagado a quien vive en el extranjero tributa en origen en Suiza, así que revisa antes el tratamiento fiscal en ambos países.", "<b>Pilar 3a:</b> puedes retirarlo cuando te vas de Suiza definitivamente, vayas donde vayas, con el justificante de baja y de tu dirección en el extranjero. Tributa en Suiza en origen, así que el momento importa. También puedes dejarlo donde está, pero algunas entidades no mantienen cuentas 3a para residentes en el extranjero.", "<b>Pensión de jubilación española:</b> tus años suizos cuentan para los 15 años exigidos en España (2 de ellos dentro de los últimos 15); después cada país paga su parte a prorrata y puedes cobrar ambas pensiones. Desde Suiza, la solicitud se presenta a través de tu última caja de compensación suiza.", "<b>Impuestos:</b> presenta tu última declaración suiza y liquida la retención en origen. En España pasas a ser residente fiscal, por lo general si pasas más de 183 días al año allí o tu centro de intereses económicos está allí, y tributas por tu renta mundial. Se aplica un convenio de doble imposición; conviene un asesor fiscal.", "<b>Qué llevarte:</b> tu certificado de trabajo (ver el apartado del certificado), las últimas nóminas y el certificado anual de salario, el extracto de cuenta de la AHV, el certificado de la caja de pensiones y los datos de libre paso, el certificado del seguro médico, el justificante de baja y los formularios de desempleo. Más sobre pensiones en el apartado 26."]]}

{k:'A',t:['Standard employee, 12 payments','Empleada estándar, 12 pagas'],nm:'Ana García',r:['HR Assistant','Asistente de RRHH'],g:6000,n:12,a:30,w:100,fr:0,q:0,nt:['BVG base = (72,000 − 26,460) ÷ 12. The legal credit for ages 25–34 is 7%, split 50/50 between employee and employer.','Base BVG = (72.000 − 26.460) ÷ 12. La bonificación legal de 25–34 años es del 7%, a partes iguales entre trabajador y empleador.']},
{k:'B',t:['13 payments','13 pagas'],nm:'Carlos Ruiz',r:['HR Specialist','Especialista de RRHH'],g:7500,n:13,a:40,w:100,fr:0,q:0,nt:['Salary is CHF 7,500 each month plus a 13th payment in December with the same deductions. Caps are divided by 13.','El salario es de 7.500 CHF cada mes más una 13.ª paga en diciembre con los mismos descuentos. Los topes se dividen entre 13.']},
{k:'C',t:['Part-time 50%','Tiempo parcial 50%'],nm:'Marta López',r:['HR Officer (50%)','Técnica de RRHH (50%)'],g:3500,n:12,a:40,w:50,fr:0,q:0,nt:['The legal coordination deduction (26,460) is not reduced here, so the BVG base is low. Many funds scale it down for part-timers.','Aquí no se reduce la deducción de coordinación legal (26.460), por eso la base BVG es baja. Muchas cajas la reducen para el tiempo parcial.']},
{k:'D',t:['Intern below the BVG threshold','Practicante bajo el umbral BVG'],nm:'Lucas Meier',r:['HR Intern (25%)','Practicante de RRHH (25%)'],g:1800,n:12,a:22,w:25,fr:0,q:0,nt:['Annual salary CHF 21,600 is below the BVG entry threshold of 22,680: no pension-fund deduction. NBU applies from 8 weekly hours.','El salario anual de 21.600 CHF está por debajo del umbral BVG de 22.680: sin descuento de caja de pensiones. El NBU aplica desde 8 horas semanales.']},
{k:'E',t:['High earner above the caps','Salario alto sobre los topes'],nm:'Laura Keller',r:['Head of HR','Directora de RRHH'],g:20000,n:12,a:50,w:100,fr:0,q:0,nt:['ALV and NBU stop at CHF 148,200 a year (12,350 a month). AHV has no cap. BVG uses the 90,720 limit, so only the mandatory minimum is shown.','ALV y NBU se detienen en 148.200 CHF al año (12.350 al mes). La AHV no tiene tope. La BVG usa el límite de 90.720, así que solo se muestra el mínimo obligatorio.']},
{k:'F',t:['Working after age 65','Trabajo tras los 65'],nm:'Hans Brunner',r:['Senior Consultant','Consultor sénior'],g:5000,n:12,a:66,w:100,fr:1400,q:0,nt:['Above reference age, CHF 1,400 a month is AHV-free. No ALV and no BVG.','Por encima de la edad de referencia, 1.400 CHF al mes están libres de AHV. Sin ALV ni BVG.']},
{k:'G',t:['No C permit: tax at source','Sin permiso C: impuesto en origen'],nm:'Sofía Martín',r:['HR Assistant','Asistente de RRHH'],g:6000,n:12,a:30,w:100,fr:0,q:7.5,nt:['Same as case A plus Quellensteuer with an illustrative 7.5% rate. Real tariffs depend on canton, marital status and children.','Igual que el caso A más Quellensteuer con un tipo ilustrativo del 7,5%. Las tarifas reales dependen del cantón, estado civil e hijos.']},
{k:'H',t:['Daily sickness insurance (KTG) deducted','Descuento del seguro de subsidio diario (KTG)'],nm:'Elena Fischer',r:['HR Business Partner','HR Business Partner'],g:6000,n:12,a:35,w:100,fr:0,q:0,kt:0.6,nt:['Many employers insure salary during sickness (KTG). The employer may deduct up to half of the premium; here the total premium is assumed at 1.2% and the employee pays 0.6%. Check the policy and the contract.','Muchos empleadores aseguran el salario en caso de enfermedad (KTG). El empleador puede descontar hasta la mitad de la prima; aquí se supone una prima total del 1,2% y el trabajador paga el 0,6%. Revisa la póliza y el contrato.']},
{k:'I',t:['Restaurant: CHF 300 for meals deducted','Restaurante: 300 CHF de comidas descontados'],nm:'Diego Torres',r:['Waiter','Camarero'],g:4500,n:12,a:28,w:100,fr:0,q:0,kt:0.5,md:30,mr:10,er:1,nt:['The employer charges CHF 300 a month for lunch on site, deducted from net pay. The AHV flat rate for lunch is CHF 10 a day (CHF 300 a month), so a charge of this size means no benefit in kind and the AHV base stays at CHF 4,500. Check your collective agreement (L-GAV) for meal rules.','El empleador cobra 300 CHF al mes por el almuerzo en el local, descontados del neto. El tanto alzado AHV del almuerzo es de 10 CHF al día (300 CHF al mes), así que un cobro de este importe significa que no hay retribución en especie y la base AHV sigue en 4.500 CHF. Revisa tu convenio colectivo (L-GAV) sobre las comidas.']},
{k:'J',t:['Restaurant: free lunch as benefit in kind','Restaurante: almuerzo gratis como retribución en especie'],nm:'Diego Torres',r:['Waiter','Camarero'],g:4500,n:12,a:28,w:100,fr:0,q:0,kt:0.5,nl:300,er:1,nt:['Same restaurant, but lunch is free. It is benefit in kind: CHF 300 a month at the AHV flat rate is added to gross salary, so AHV, ALV, NBU and KTG are calculated on CHF 4,800. The employee does not pay in cash, so net pay is higher than in case I. BVG is shown on cash salary only; funds may differ.','Mismo restaurante, pero el almuerzo es gratis. Es retribución en especie: 300 CHF al mes al tanto alzado AHV se suman al bruto, así que AHV, ALV, NBU y KTG se calculan sobre 4.800 CHF. El trabajador no paga en efectivo, por lo que el neto es mayor que en el caso I. La BVG se muestra solo sobre el salario en efectivo; las cajas pueden diferir.']},
{k:'K',t:['Replica of a real restaurant payslip (tax at source A0N)','Réplica de una nómina real de restaurante (impuesto en origen A0N)'],nm:'Miguel Torres',r:['Waiter','Camarero'],g:4200,n:12,a:30,w:100,fr:0,dy:30,t13:1,q:1.77,qc:'A0N',kt:0.77,nb:1.433,uz:0.02,uzz:1,br:7,r5:1,md:30,mr:9,er:1,nt:['Anonymised replica of a real slip: 30-day month, flat meal charge 30 × CHF 9.00, tax at source code A0N, KTG 0.770%, NBU 1.433%, a UVG supplementary line shown at 0.00, BVG employee rate 7.000% on a coordinated base of 1,995 = (4,200 × 12 − 26,460) ÷ 12, and amounts rounded to 5 Rappen.','Réplica anonimizada de una nómina real: mes de 30 días, cobro fijo de comidas 30 × 9,00 CHF, impuesto en origen con código A0N, KTG 0,770%, NBU 1,433%, una línea UVG complementaria a 0,00, tipo BVG del trabajador 7,000% sobre una base coordinada de 1.995 = (4.200 × 12 − 26.460) ÷ 12, e importes redondeados a 5 céntimos.']},
{k:'L',t:['Sickness: employer pays, then the insurer pays directly','Baja por enfermedad: paga el empleador y luego la aseguradora'],nm:'Elena Fischer',r:['HR Business Partner','HR Business Partner'],g:6000,n:12,a:30,w:100,fr:0,q:0,kt:0.6,ln:[['Lohnfortzahlung Krankheit (Tage 1–15)',['Salary continued by the employer, days 1–15','Salario continuado por el empleador, días 1–15'],'15.00',3000]],inf:['Krankentaggeld (Versicherung zahlt direkt)',['Daily allowance 80%, days 16–30, paid by the insurer to the employee: off payroll and not AHV-subject','Subsidio diario 80%, días 16–30, pagado por la aseguradora al trabajador: fuera de nómina y sin AHV'],2400],nt:['The employee is sick in the second half of the month. The employer pays days 1–15 (CHF 3,000, AHV-subject). From day 16 the daily sickness insurance pays 80% directly (CHF 2,400): it is not on the payslip and not AHV-subject. BVG is shown in full; whether a fund waives it during sickness depends on its regulations. Total cash received: 2,627.17 + 2,400.00 = CHF 5,027.17.','La empleada está de baja en la segunda mitad del mes. El empleador paga los días 1–15 (3.000 CHF, sujetos a AHV). Desde el día 16 el seguro de subsidio diario paga el 80% directamente (2.400 CHF): no figura en la nómina ni cotiza a la AHV. La BVG se muestra completa; que una caja la suspenda durante la baja depende de su reglamento. Total cobrado: 2.627,17 + 2.400,00 = 5.027,17 CHF.']},
{k:'N',t:['Joined mid-month (pro rata)','Entrada a mitad de mes (prorrata)'],nm:'Marta López',r:['HR Officer','Técnica de RRHH'],g:6000,n:12,a:30,w:100,fr:0,q:0,bvp:16/30,ln:[['Festlohn (Eintritt 15.10.)',['Salary from the start date, 16 of 30 days','Salario desde la fecha de entrada, 16 de 30 días'],'16.00',3200]],nt:['Start on 15 October: 16 of 30 days = CHF 3,200 (6,000 × 16 ÷ 30). Social deductions apply to what is actually paid. BVG is shown pro rata here; some funds charge the full month.','Entrada el 15 de octubre: 16 de 30 días = 3.200 CHF (6.000 × 16 ÷ 30). Las deducciones sociales se aplican a lo realmente pagado. La BVG se muestra prorrateada; algunas cajas cobran el mes entero.']},
{k:'O',t:['Bonus month','Mes con bonus'],nm:'Carlos Ruiz',r:['HR Specialist','Especialista de RRHH'],g:6000,n:12,a:40,w:100,fr:0,q:0,ln:[['Festlohn',['Fixed monthly salary','Salario fijo mensual'],'',6000],['Bonus',['Annual bonus paid this month','Bonus anual pagado este mes'],'',3000]],nt:['The bonus is salary for AHV, ALV and accident insurance, so those deductions apply to CHF 9,000. In this example the fund insures fixed salary only, so BVG does not change; check your regulations. With tax at source the bonus would also be taxed at a higher rate (not shown).','El bonus es salario a efectos de AHV, ALV y seguro de accidentes, así que esas deducciones se aplican a 9.000 CHF. En este ejemplo la caja asegura solo el salario fijo, por lo que la BVG no cambia; revisa tu reglamento. Con impuesto en origen el bonus también tributaría a un tipo mayor (no se muestra).']},
{k:'P',t:['Final payslip with holiday payout','Última nómina con pago de vacaciones'],nm:'Lucas Meier',r:['HR Assistant','Asistente de RRHH'],g:6000,n:12,a:40,w:100,fr:0,q:0,ln:[['Festlohn (Austritt 31.10.)',['Last month’s salary','Salario del último mes'],'30.00',6000],['Ferienentschädigung',['Payout of 5 unused holiday days (6,000 × 12 ÷ 260 per day)','Pago de 5 días de vacaciones no disfrutados (6.000 × 12 ÷ 260 por día)'],'5.00',1384.62]],nt:['Holiday pay is salary for AHV, so contributions apply to CHF 7,384.62. Unused holidays can only be paid out when the employment ends (art. 329d), not during it. The daily rate uses 260 working days a year, an assumption: contracts and funds may use another method.','La paga de vacaciones es salario a efectos de AHV, así que las cotizaciones se aplican a 7.384,62 CHF. Las vacaciones no disfrutadas solo pueden pagarse al terminar la relación (art. 329d), no durante ella. La tarifa diaria usa 260 días laborables al año, un supuesto: contratos y cajas pueden usar otro método.']},
{k:'Z',t:['Your own calculation','Tu propio cálculo'],nm:'Anna Beispiel',r:['Your case','Tu caso'],g:6000,n:12,a:35,w:100,fr:0,q:0,kt:0,nb:1,br:0,ml:0,r5:0,custom:1,nt:['Type your own figures in the box. A field applies when you leave it or press Enter. All rates are assumptions you can change; the BVG field replaces the legal half-credit method when above 0.','Escribe tus propias cifras en el recuadro. Un campo se aplica al salir de él o con Enter. Todos los tipos son supuestos que puedes cambiar; el campo BVG sustituye al método de la mitad de la bonificación legal cuando es mayor que 0.']}

h+=sub('notice','c2',T2('Last day of employment after a notice','\u00daltimo d\u00eda del contrato tras un preaviso'),T2('Exact end date after a dismissal or resignation.','Fecha exacta de fin tras un despido o dimisi\u00f3n.'),'<p class=sn>'+T2('<b>What it does:</b> after the probation period a notice always ends at the end of a month. It applies the notice period for the years of service (1 month in the first year, 2 months from the 2nd to the 9th year, 3 months from the 10th) and gives you the last day. <b>You enter:</b> the date the other party receives the letter, the years of service, and whether the person is still in probation (then the notice is only 7 days). <b>You get:</b> the notice length and the end date. <b>Example:</b> a letter received on 12 November in the first year of service means 1 month of notice, so employment ends on 31 December.','<b>Qu\u00e9 hace:</b> tras la prueba, un preaviso termina siempre a fin de mes. Aplica el preaviso seg\u00fan los a\u00f1os de servicio (1 mes el primer a\u00f1o, 2 meses del 2.\u00ba al 9.\u00ba a\u00f1o, 3 meses desde el 10.\u00ba) y te da el \u00faltimo d\u00eda. <b>Qu\u00e9 introduces:</b> la fecha en que la otra parte recibe la carta, los a\u00f1os de servicio y si la persona sigue en prueba (entonces el preaviso es de solo 7 d\u00edas). <b>Qu\u00e9 obtienes:</b> la duraci\u00f3n del preaviso y la fecha de fin. <b>Ejemplo:</b> una carta recibida el 12 de noviembre en el primer a\u00f1o de servicio supone 1 mes de preaviso, as\u00ed que el contrato termina el 31 de diciembre.')+'</p><div class=cc><label>'+T2('Date the notice is received','Fecha de recepci\u00f3n del despido')+'<input type=date id=nd value='+S.d+'></label><label>'+T2('Seniority','Antig\u00fcedad')+'<select id=ny><option value=1'+(S.y==='1'?' selected':'')+'>'+T2('First year of service','Primer a\u00f1o de servicio')+'</option><option value=2'+(S.y==='2'?' selected':'')+'>'+T2('2nd to 9th year','Del 2.\u00ba al 9.\u00ba a\u00f1o')+'</option><opt var TP=[
{k:'Arbeitsvertrag',t:['Employment contract (German model)','Contrato de trabajo (modelo en alemán)'],tx:['ARBEITSVERTRAG (unbefristet)','(Muster: vor Verwendung anpassen und rechtlich prüfen lassen)','','zwischen','[Firma], [Strasse Nr.], [PLZ Ort] (nachfolgend «Arbeitgeberin»)','und','[Vorname Name], [Strasse Nr.], [PLZ Ort], geboren am [Datum], [Staatsangehörigkeit] (nachfolgend «Arbeitnehmerin/Arbeitnehmer»)','','1. Beginn, Dauer, Probezeit','Das Arbeitsverhältnis beginnt am [Datum] und wird auf unbestimmte Zeit abgeschlossen. Die ersten [1–3] Monate gelten als Probezeit; in dieser Zeit kann das Arbeitsverhältnis mit einer Frist von 7 Tagen gekündigt werden (Art. 335b OR).','','2. Funktion, Aufgaben, Arbeitsort','Funktion: [Funktion]. Aufgaben: [Kurzbeschreibung oder Stellenbeschrieb im Anhang]. Vorgesetzte Stelle: [Funktion]. Arbeitsort: [Ort]. [Homeoffice gemäss Reglement.]','','3. Pensum und Arbeitszeit','Beschäftigungsgrad: [100] %. Wöchentliche Sollarbeitszeit: [41] Stunden. Die Arbeitszeit wird erfasst (Art. 46 ArG, Art. 73 ArGV 1).','','4. Überstunden','Überstunden werden [mit Freizeit von gleicher Dauer kompensiert, sofern beide Parteien einverstanden sind / mit einem Zuschlag von 25 % entschädigt] (Art. 321c OR).','','5. Lohn','Bruttojahreslohn: CHF [Betrag], ausbezahlt in [12/13] Monatslöhnen zu je CHF [Betrag], jeweils am Monatsende. [Der 13. Monatslohn wird im [Monat] ausbezahlt; bei Ein- oder Austritt im Laufe des Jahres pro rata temporis.] [Bonus: freiwillig / gemäss Zielvereinbarung.] Die Lohnabrechnung erfolgt monatlich schriftlich (Art. 323b OR).','','6. Spesen','Notwendige Auslagen werden gegen Beleg vergütet (Art. 327a OR) [gemäss Spesenreglement].','','7. Ferien und Feiertage','[25] Arbeitstage pro Kalenderjahr (gesetzlich mindestens 4 Wochen, bis zum Jahr des 20. Geburtstags 5 Wochen). Der Zeitpunkt wird nach Absprache festgelegt; mindestens zwei Wochen am Stück (Art. 329a–329c OR). Feiertage gemäss Kanton [Kanton].','','8. Krankheit und Unfall','Die Arbeitgeberin hat eine Krankentaggeldversicherung abgeschlossen: [80] % des Lohnes während [720] Tagen nach einer Wartefrist von [30] Tagen; während der Wartefrist wird [100] % des Lohnes bezahlt. Die Prämie tragen die Parteien je zur Hälfte. [Ohne Taggeldversicherung gilt die [Berner/Zürcher/Basler] Skala (Art. 324a OR).] Bei Unfällen gilt das UVG; die Prämie für Nichtberufsunfälle trägt der Arbeitnehmer.','','9. Sozialversicherungen','Die Arbeitnehmerin wird bei AHV/IV/EO/ALV und, sofern die Voraussetzungen erfüllt sind, bei der Pensionskasse [Name] (BVG) angemeldet. Die Beiträge werden gemäss Gesetz und Reglement vom Lohn abgezogen; die Arbeitgeberin trägt mindestens die Hälfte der Pensionskassenbeiträge.','','10. Kündigung','Nach der Probezeit beträgt die Kündigungsfrist im ersten Dienstjahr 1 Monat, vom 2. bis 9. Dienstjahr 2 Monate und danach 3 Monate, jeweils auf das Ende eines Monats (Art. 335c OR). Die Kündigung erfolgt schriftlich.','','11. Verschwiegenheit und Nebenbeschäftigung','Über Geschäftsgeheimnisse ist auch nach Beendigung Stillschweigen zu bewahren, soweit ein berechtigtes Interesse besteht (Art. 321a OR). Nebenbeschäftigungen, die den Interessen der Arbeitgeberin schaden oder mit ihr konkurrieren, sind untersagt.','','12. [Optional] Konkurrenzverbot','[Nur wenn gerechtfertigt: schriftlich, begrenzt nach Ort, Zeit und Gegenstand, Art. 340 ff. OR.]','','13. Datenschutz und Arbeitsmittel','Personendaten werden nur bearbeitet, soweit sie für das Arbeitsverhältnis erforderlich sind (Art. 328b OR). Arbeitsmittel bleiben Eigentum der Arbeitgeberin und sind bei Austritt zurückzugeben.','','14. Schlussbestimmungen','Änderungen und Ergänzungen bedürfen der Schriftform. [Es gilt der Gesamtarbeitsvertrag [Name].] Anwendbar ist schweizerisches Recht. Gerichtsstand: [Sitz der Arbeitgeberin / gewöhnlicher Arbeitsort].','','[Ort], [Datum]','Arbeitgeberin: ______________    Arbeitnehmer/in: ______________'].join('\n'),ex:[['Written form is not required by law (art. 320 CO), but a written contract is the best evidence, and the essential terms must be confirmed in writing within one month if there is none (art. 330b).','Check the minimums: probation up to 3 months, holidays of at least 4 weeks, notice of at least 1 month (shorter only through a collective agreement in the first year), and the working-time limits of the ArG.','Sick pay: say whether the statutory scale applies (and which one: Bern, Zurich or Basel) or a daily sickness insurance of at least equivalent value, in writing (art. 324a para 4), and how the premium is split.','The 13th salary exists only if written. State when it is paid and that it is pro rata when joining or leaving.','Overtime: say whether it is compensated by equal time off (with agreement) or paid with a 25% supplement; a written waiver of the supplement is possible (art. 321c para 3).','Non-compete clauses (art. 340) need written form, a justification and limits in place, time and subject. Leave the clause out if not needed.','This is a model, not legal advice. Adapt it to any collective agreement (GAV) and have it reviewed, especially the venue and non-compete clauses.'],['La forma escrita no la exige la ley (art. 320 CO), pero un contrato escrito es la mejor prueba, y si no lo hay hay que confirmar por escrito las condiciones esenciales en un mes (art. 330b).','Comprueba los mínimos: prueba de hasta 3 meses, vacaciones de al menos 4 semanas, preaviso de al menos 1 mes (menor solo por convenio colectivo en el primer año) y los límites de jornada de la ArG.','Baja por enfermedad: indica si se aplica la escala legal (y cuál: Berna, Zúrich o Basilea) o un seguro de subsidio diario de valor al menos equivalente, por escrito (art. 324a ap. 4), y cómo se reparte la prima.','El salario 13 solo existe si está escrito. Indica cuándo se paga y que es proporcional al entrar o salir.','Horas extra: indica si se compensan con descanso igual (con acuerdo) o se pagan con recargo del 25%; se puede renunciar al recargo por escrito (art. 321c ap. 3).','La no competencia (art. 340) exige forma escrita, una justificación y límites de lugar, tiempo y objeto. Omite la cláusula si no hace falta.','Es un modelo, no asesoramiento jurídico. Adáptalo a cualquier convenio colectivo (GAV) y hazlo revisar, sobre todo las cláusulas de fuero y no competencia.']]},
{k:'Kündigung',t:['Termination letters (German models)','Cartas de despido y dimisión (modelos en alemán)'],tx:['[Firma] · [Adresse]','EINSCHREIBEN [und persönliche Übergabe gegen Empfangsbestätigung]','','[Vorname Name]','[Adresse]','','[Ort], [Datum]','','Kündigung des Arbeitsverhältnisses','','Sehr geehrte Frau [Name] / Sehr geehrter Herr [Name]','','Wir kündigen das Arbeitsverhältnis vom [Eintrittsdatum] unter Einhaltung der Kündigungsfrist von [2] Monaten auf den [31. Januar 20XX].','','[Variante Freistellung: Wir stellen Sie ab [Datum] unter Fortzahlung des Lohnes von der Arbeitspflicht frei. Ihr Ferienguthaben von [x] Tagen wird mit der Freistellung verrechnet. Ihr Überstundenguthaben von [x] Stunden wird [ausbezahlt / mit Ihrem Einverständnis kompensiert].]','','Bitte geben Sie bis spätestens [Datum] sämtliche Arbeitsmittel und Schlüssel zurück.','','Auf Ihren Wunsch begründen wir diese Kündigung schriftlich (Art. 335 Abs. 2 OR). Das Arbeitszeugnis und die Informationen zu Ihren Versicherungen (Pensionskasse, Unfall- und Krankentaggeldversicherung) erhalten Sie rechtzeitig vor dem Austritt.','','Wir danken Ihnen für Ihre Arbeit.','','Freundliche Grüsse','[Name, Funktion]','','Empfangsbestätigung: Ich habe dieses Schreiben am ____________ erhalten.','Ort/Datum: ____________    Unterschrift: ____________','','----- Kündigung durch die Arbeitnehmerin / den Arbeitnehmer -----','','[Vorname Name], [Adresse]','[Ort], [Datum]','','[Firma], z. H. [Name]','','Kündigung des Arbeitsverhältnisses','','Sehr geehrte Damen und Herren','','Hiermit kündige ich mein Arbeitsverhältnis unter Einhaltung der Kündigungsfrist auf den [31. März 20XX]. Ich bitte um eine schriftliche Bestätigung des Austrittsdatums und um ein Arbeitszeugnis.','','Freundliche Grüsse','[Unterschrift]'].join('\n'),ex:[['No legal form is required, but use one that proves receipt: a registered letter and/or hand delivery against a signed receipt. A notice takes effect when the other party receives it, so send it early; for a registered letter, leave time for the 7-day pickup period.','You need no reason to dismiss, but if the other party asks, you must give the reasons in writing (art. 335 para 2), even in probation or for immediate dismissal. The reasons must be true, and “we explained it verbally” is not enough.','Before sending, check: contract type, service year (notice of 1, 2 or 3 months), the end date (end of a month) and any protected period (Sperrfrist). A notice given during one is void and has to be repeated.','Garden leave (Freistellung): say whether the employee is released from work. The holiday balance is usually deemed covered; overtime only if the employee agrees or the contract provides time compensation. The legal end date does not change.','Announce the next steps: final payslip, work reference, insurance information (pension fund, accident and daily sickness insurance) and return of company property.','The employee’s resignation can be short: end date according to the notice period, and a request for confirmation and a certificate. A resignation is allowed at any time, even during a protected period.'],['No se exige forma legal, pero usa una que pruebe la recepción: carta certificada y/o entrega en mano con acuse firmado. El despido surte efecto cuando la otra parte lo recibe, así que envíalo con tiempo; si es certificada, deja margen para el plazo de 7 días de recogida.','No necesitas motivo para despedir, pero si la otra parte lo pide hay que darlo por escrito (art. 335 ap. 2), incluso en la prueba o en el despido inmediato. El motivo debe ser veraz, y “ya lo explicamos de palabra” no basta.','Antes de enviar, comprueba: tipo de contrato, año de servicio (preaviso de 1, 2 o 3 meses), la fecha de fin (fin de mes) y cualquier período de protección (Sperrfrist). Un despido dentro de uno es nulo y hay que repetirlo.','Dispensa de trabajo (Freistellung): indica si el trabajador queda dispensado. Las vacaciones pendientes se consideran normalmente cubiertas; las horas extra solo si el trabajador acepta o el contrato prevé compensarlas con descanso. La fecha legal de fin no cambia.','Anuncia los pasos siguientes: última nómina, certificado de trabajo, información de seguros (caja de pensiones, accidentes y subsidio diario) y devolución del material de la empresa.','La dimisión del trabajador puede ser breve: fecha de fin según el preaviso y petición de confirmación y certificado. Se puede dimitir en cualquier momento, incluso en un período de protección.']]},
{k:'Arbeitszeugnis',t:['Work reference (German model)','Certificado de trabajo (modelo en alemán)'],tx:['ARBEITSZEUGNIS','','Frau [Vorname Name], geboren am [Datum], war vom [Eintrittsdatum] bis zum [Austrittsdatum] als [Funktion] in unserem Unternehmen angestellt.','','Aufgaben','[Unternehmen kurz vorstellen.] Zu ihren Hauptaufgaben gehörten: [Aufgabe 1], [Aufgabe 2], [Aufgabe 3]. [Besondere Verantwortung oder Projekte.]','','Leistung','Frau [Name] verfügt über ein breites und fundiertes Fachwissen, das sie sicher und zielgerichtet einsetzte. Sie arbeitete selbstständig, zuverlässig und sehr sorgfältig. Auch in hektischen Zeiten behielt sie den Überblick. Die ihr übertragenen Aufgaben erledigte sie stets zu unserer vollen Zufriedenheit.','','Verhalten','Ihr Verhalten gegenüber Vorgesetzten, Mitarbeitenden und Kunden war stets einwandfrei und freundlich.','','Austritt','Frau [Name] verlässt unser Unternehmen auf eigenen Wunsch, um [eine neue berufliche Herausforderung anzunehmen].','','Wir danken Frau [Name] für ihre wertvolle Mitarbeit, bedauern ihren Weggang und wünschen ihr für die Zukunft alles Gute und weiterhin viel Erfolg.','','[Ort], [Datum]','[Firma]','[Unterschrift, Name, Funktion]'].join('\n'),ex:[['The employee can ask for a certificate at any time, even during employment (art. 330a). The full certificate covers the nature and duration of the job and the quality of work and conduct; a simple confirmation covers only nature and duration, and only if the employee asks for it.','Structure: personal data, entry and exit dates, function and tasks, performance, conduct (towards superiors, colleagues and customers, in that order), optionally the reason for leaving, a closing with thanks, regret and good wishes, then place, date and signature.','It must be true, complete and benevolent. Swiss guidance says hidden codes are neither sensible nor allowed, but standard formulas are widely read as grades, so choose wording to match the real performance.','Common scale in German-speaking practice: “stets zu unserer vollsten Zufriedenheit” = very good; “stets zu unserer vollen Zufriedenheit” = good; “zu unserer vollen Zufriedenheit” = satisfactory; “zu unserer Zufriedenheit” = sufficient; “im Grossen und Ganzen zu unserer Zufriedenheit” = poor. The model above is a “good” example.','The exit date is the legal end of employment, also when the employee was released from work. If a reason for leaving is stated, it must be true.','The employee can ask in writing for corrections and, if refused, take the matter to court.'],['El trabajador puede pedir un certificado en cualquier momento, incluso durante la relación (art. 330a). El completo abarca la naturaleza y duración del empleo y la calidad del trabajo y la conducta; la confirmación simple solo naturaleza y duración, y solo si el trabajador la pide.','Estructura: datos personales, fechas de entrada y salida, función y tareas, rendimiento, conducta (hacia superiores, compañeros y clientes, en ese orden), opcionalmente el motivo de salida, un cierre con agradecimiento, pesar y buenos deseos, y luego lugar, fecha y firma.','Debe ser veraz, completo y benevolente. La guía suiza dice que los códigos ocultos ni son sensatos ni están permitidos, pero las fórmulas habituales se leen ampliamente como notas, así que elige la redacción según el rendimiento real.','Escala habitual en la práctica de habla alemana: “stets zu unserer vollsten Zufriedenheit” = muy bien; “stets zu unserer vollen Zufriedenheit” = bien; “zu unserer vollen Zufriedenheit” = satisfactorio; “zu unserer Zufriedenheit” = suficiente; “im Grossen und Ganzen zu unserer Zufriedenheit” = deficiente. El modelo de arriba es un ejemplo de “bien”.','La fecha de salida es el fin legal de la relación, también si el trabajador estuvo dispensado de trabajar. Si se indica el motivo de salida, debe ser veraz.','El trabajador puede pedir correcciones por escrito y, si se niegan, acudir al tribunal.']]}

+'<details class=nmore><summary>'+T2('What are these?','¿Qué es esto?')+'</summary>'+T2('<p><b>KTG.</b> <b>What it is:</b> insurance that pays about 80% of your salary during a long illness, usually after a waiting period. Not every employer has it, and many share the cost with you. <b>On your payslip:</b> “KTG” or “Krankentaggeld”. Enter 0 if you do not see it. Typical value used here: 0.5%.</p><p><b>NBU.</b> <b>What it is:</b> insurance for accidents outside work (sport, home, travel). It is compulsory if you work 8 or more hours a week, and the employee normally pays it. <b>On your payslip:</b> “NBU” or “Nichtberufsunfall”. The rate depends on the insurer and on your employer’s risk class; the example payslip in the simulator shows 1.433%. Typical value used here: 1%.</p><p><b>BVG.</b> <b>What it is:</b> your share of the pension fund (second pillar), a mandatory saving for retirement that you build with your employer. It is charged on the coordinated salary (gross minus CHF 26,460, at most CHF 64,260), only if you earn more than CHF 22,680 a year and are 25 or older. <b>On your payslip:</b> “BVG”, “Berufliche Vorsorge” or “PK”, with a percentage. The rate depends on your fund and age; the example payslip in the simulator shows 7.000%. <b>If you do not know it, leave 0:</b> the calculator then uses half of the legal minimum credit (3.5%, 5%, 7.5% or 9% of the coordinated salary, by age).</p>','<p><b>KTG.</b> <b>Qué es:</b> un seguro que paga cerca del 80% de tu salario durante una enfermedad larga, normalmente tras un periodo de espera. No todas las empresas lo tienen, y muchas comparten el coste contigo. <b>En tu nómina:</b> “KTG” o “Krankentaggeld”. Pon 0 si no aparece. Valor típico usado aquí: 0,5%.</p><p><b>NBU.</b> <b>Qué es:</b> el seguro de accidentes fuera del trabajo (deporte, casa, viajes). Es obligatorio si trabajas 8 o más horas a la semana, y normalmente lo paga el trabajador. <b>En tu nómina:</b> “NBU” o “Nichtberufsunfall”. El tipo depende de la aseguradora y de la clase de riesgo de tu empresa; la nómina de ejemplo del simulador muestra 1,433%. Valor típico usado aquí: 1%.</p><p><b>BVG.</b> <b>Qué es:</b> tu parte de la caja de pensiones (segundo pilar), un ahorro obligatorio para la jubilación que construyes con tu empresa. Se calcula sobre el salario coordinado (bruto menos 26.460 CHF, como máximo 64.260 CHF), solo si ganas más de 22.680 CHF al año y tienes 25 años o más. <b>En tu nómina:</b> “BVG”, “Berufliche Vorsorge” o “PK”, con un porcentaje. El tipo depende de tu caja y de tu edad; la nómina de ejemplo del simulador muestra 7,000%. <b>Si no lo sabes, deja 0:</b> la calculadora usa entonces la mitad de la bonificación mínima legal (3,5%, 5%, 7,5% o 9% del salario coordinado, según la edad).</p>')+'</details></div></details>';
h+='<details class=nadj nnote><summary>'+T2('How it is estimated and limits','Cómo se estima y límites')+'</summary><p class=sn><b>'+T2('How it is estimated.','C\u00f3mo se estima.')+'</b> '+T2('Social contributions use the same rules as the payslip simulator. Federal tax uses the 2026 federal tariff after standard deductions (3% professional costs, insurance flat deduction, child deduction, two-earner deduction). Cantonal, communal and church tax use the 2025 burden tables of the Federal Tax Administration (ESTV) for the canton capital, as a percentage of gross income, interpolated by income. Rates include church tax unless you choose No (then reduced by about 5.5%, a rough adjustment). With 1 or 3+ children the rate is interpolated or extrapolated from the 0 and 2-child tables, and single parents use the married tables.','Las cotizaciones sociales usan las mismas reglas que el simulador de n\u00f3minas. El impuesto federal usa el baremo federal de 2026 tras las deducciones est\u00e1ndar (3% de gastos profesionales, deducci\u00f3n fija de seguros, deducci\u00f3n por hijos, deducci\u00f3n por doble ingreso). El impuesto cantonal, comunal y eclesi\u00e1stico usa las tablas de carga fiscal de 2025 de la Administraci\u00f3n Federal de Contribuciones (ESTV) para la capital del cant\u00f3n, como porcentaje del bruto, interpoladas por ingreso. Los tipos incluyen el impuesto eclesi\u00e1stico salvo que elijas No (entonces se reducen un 5,5% aprox., un ajuste burdo). Con 1 o 3 o m\u00e1s hijos el tipo se interpola o extrapola desde las tablas de 0 y 2 hijos, y las familias monoparentales usan las tablas de casados.')+'</p><p class=sn><b>'+T2('Limits.','L\u00edmites.')+'</b> '+T2('Your municipality can differ by several points from the capital; other deductions (pillar 3a, commuting, childcare, debts) are ignored; employees without a C permit pay tax at source by tariff, which can differ. For a precise figure use the official ','Tu municipio puede diferir varios puntos de la capital; no se tienen en cuenta otras deducciones (pilar 3a, desplazamientos, guarder\u00eda, deudas); quien no tiene permiso C paga impuesto en origen por baremo, que puede diferir. Para una cifra precisa usa el ')+'<a href=https://swisstaxcalculator.estv.admin.ch target=_blank rel=noopener>'+T2('ESTV tax calculator','simulador fiscal de la ESTV')+'</a>.</p></details>';

var CVR=[["<b>A dossier, not only a CV:</b> a Swiss application normally contains a cover letter (Motivationsschreiben), the CV, copies of all your work references (Arbeitszeugnisse), diplomas and certificates, and sometimes a list of referees. Send it as one PDF unless the employer asks otherwise.","<b>Length:</b> 1 to 2 pages; up to 3 only for very long careers or academic profiles. Beginners: 1 page.","<b>Order:</b> reverse chronological, with months and years, newest first, and short points with tasks and results.","<b>Personal details:</b> name, address, one phone number, a professional email, date of birth (expected in Switzerland), nationality and, for foreigners, the type and validity of the permit. Civil status and children are optional but still common. None of this is required by law.","<b>Photo:</b> not required by law, but expected by most Swiss employers: see the photo section above.","<b>Languages:</b> give the level with the CEFR scale (A1\u2013C2), plus the certificate and year if you have one. Your German level matters a lot.","<b>Swiss formats:</b> dates as DD.MM.YYYY, A4, CHF for money, German (or the language of the job ad; English only if the ad is in English).","<b>Work references (Arbeitszeugnisse):</b> they carry great weight in Switzerland. Ask each previous employer for a detailed reference stating your tasks and performance, and add a translation. A bare certificate with only dates and job title is weaker.","<b>Foreign qualifications:</b> give the original title, a German or English translation and the level (Bachelor, Master). HR is not a regulated profession, so no formal recognition is needed to apply.","<b>Tailor it:</b> reuse the keywords of the job ad; many large employers filter applications with software.","<b>Referees:</b> write \u201cReferenzen auf Anfrage\u201d (references on request), or name two referees only if they agreed.","<b>Avoid:</b> long Europass templates, unexplained gaps, unexplained abbreviations and foreign job titles without translation, a private-looking email address and very long hobby lists."],["<b>Un dossier, no solo un CV:</b> una candidatura suiza lleva normalmente una carta de presentaci\u00f3n (Motivationsschreiben), el CV, copias de todos tus certificados de trabajo (Arbeitszeugnisse), t\u00edtulos y certificados, y a veces una lista de referencias. Env\u00edalo en un solo PDF salvo que el empleador pida otra cosa.","<b>Extensi\u00f3n:</b> de 1 a 2 p\u00e1ginas; hasta 3 solo para carreras muy largas o perfiles acad\u00e9micos. Principiantes: 1 p\u00e1gina.","<b>Orden:</b> cronol\u00f3gico inverso, con meses y a\u00f1os, lo m\u00e1s reciente primero, y puntos breves con tareas y resultados.","<b>Datos personales:</b> nombre, direcci\u00f3n, un solo tel\u00e9fono, un correo profesional, fecha de nacimiento (se espera en Suiza), nacionalidad y, para extranjeros, tipo y validez del permiso. El estado civil y los hijos son opcionales pero siguen siendo habituales. Nada de esto lo exige la ley.","<b>Foto:</b> no la exige la ley, pero la esperan casi todos los empleadores suizos: ver la sección de la foto más arriba.","<b>Idiomas:</b> indica el nivel con la escala MCER (A1\u2013C2), m\u00e1s el certificado y el a\u00f1o si lo tienes. Tu nivel de alem\u00e1n importa mucho.","<b>Formatos suizos:</b> fechas como DD.MM.AAAA, A4, CHF para importes, alem\u00e1n (o el idioma del anuncio; ingl\u00e9s solo si el anuncio est\u00e1 en ingl\u00e9s).","<b>Certificados de trabajo (Arbeitszeugnisse):</b> tienen mucho peso en Suiza. Pide a cada empleador anterior una referencia detallada con tus tareas y rendimiento, y a\u00f1ade una traducci\u00f3n. Un certificado que solo diga fechas y puesto vale menos.","<b>Titulaciones espa\u00f1olas:</b> indica el t\u00edtulo original, una traducci\u00f3n al alem\u00e1n o ingl\u00e9s y el nivel (Bachelor, Master). RRHH no es una profesi\u00f3n regulada, as\u00ed que no hace falta homologaci\u00f3n formal para presentarte.","<b>Adapta el CV:</b> reutiliza las palabras clave del anuncio; muchas grandes empresas filtran las candidaturas con programas.","<b>Referencias:</b> escribe \u201cReferenzen auf Anfrage\u201d (referencias a petici\u00f3n), o nombra dos personas solo si han aceptado.","<b>Evita:</b> plantillas largas de Europass, huecos sin explicar, abreviaturas sin explicar y puestos en espa\u00f1ol sin traducci\u00f3n, un correo de aspecto personal y listas muy largas de aficiones."]];
var PHR=[["<b>Do you need one?</b> Not by law, but a photo is very common in Switzerland and many employers expect it. If you apply to an international company in English you may leave it out.","<b>Who takes it:</b> a professional photographer, not a selfie, photo booth, holiday picture or cropped group photo.","<b>Framing:</b> portrait format, head and shoulders, looking at the camera.","<b>Background and clothes:</b> plain neutral background and clothes that suit the sector (for HR, smart casual to business).","<b>Expression and quality:</b> natural, friendly look; sharp, well lit and recent, so you look like you do today.","<b>Position and file:</b> top left or top right of the CV, about the size of a passport photo; keep the PDF light so it passes email filters.","<b>Consistency:</b> use the same photo on your CV and your LinkedIn profile."],["<b>\u00bfHace falta?</b> No por ley, pero la foto es muy habitual en Suiza y muchos empleadores la esperan. Si te presentas a una empresa internacional en ingl\u00e9s puedes omitirla.","<b>Qui\u00e9n la hace:</b> un fot\u00f3grafo profesional, no un selfie, fotomat\u00f3n, foto de vacaciones ni recorte de una foto de grupo.","<b>Encuadre:</b> formato vertical, cabeza y hombros, mirando a la c\u00e1mara.","<b>Fondo y ropa:</b> fondo liso y neutro y ropa adecuada al sector (en RRHH, entre casual elegante y formal).","<b>Expresi\u00f3n y calidad:</b> aspecto natural y amable; n\u00edtida, bien iluminada y reciente, para que te parezcas a como eres hoy.","<b>Posici\u00f3n y archivo:</b> arriba a la izquierda o a la derecha del CV, aproximadamente del tama\u00f1o de una foto de carnet; mant\u00e9n el PDF ligero para que pase los filtros del correo.","<b>Coherencia:</b> usa la misma foto en el CV y en tu perfil de LinkedIn."]];

{k:['A \u00b7 HR technician from abroad','A \u00b7 T\u00e9cnica de RRHH de Espa\u00f1a'],t:['Your profile: HR technician from another EU country applying as HR Sachbearbeiterin','Tu perfil: t\u00e9cnica de RRHH de Espa\u00f1a que se presenta como HR-Sachbearbeiterin'],nm:'Laura Fern\u00e1ndez Garc\u00eda',ti:'HR-Sachbearbeiterin Personalwesen \u00b7 Lohn und Sozialversicherungen',pd:[['Adresse','Beispielweg 5, 8000 Z\u00fcrich'],['Telefon','+41 79 000 00 00'],['E-Mail','laura.fernandez@beispiel.ch'],['Geburtsdatum','14.03.1992'],['Nationalit\u00e4t','Spanisch'],['Bewilligung','B (EU/EFTA), g\u00fcltig bis 30.06.2031'],['Zivilstand','ledig']],lang:[['Spanisch','Muttersprache'],['Deutsch','B2 (Goethe-Zertifikat, 2026)'],['Englisch','C1'],['Franz\u00f6sisch','A2']],sk:['MS Office (sehr gut)','Abacus Lohn (Grundkenntnisse)','SAP HR (Grundkenntnisse)'],pr:'HR-Technikerin mit 8 Jahren Erfahrung in Personaladministration und Lohnbuchhaltung in Spanien. Seit 2026 in der Schweiz und vertieft in Schweizer Arbeitsrecht, Sozialversicherungen (AHV, BVG, UVG) und Lohnabrechnung. Sucht eine Stelle als HR-Sachbearbeiterin (80\u2013100 %).',ex:[['09.2021 \u2013 08.2026','HR-Technikerin (T\u00e9cnica de RR. HH.)','Beispiel Consulting S.L., Madrid (180 Mitarbeitende)',['Monatliche Lohnabrechnung inkl. Sozialversicherung und Steuerabzug f\u00fcr 180 Mitarbeitende','Ein- und Austritte, Arbeitsvertr\u00e4ge, Absenzenverwaltung, Zeiterfassung','Rekrutierung: Inserate, Vorselektion, Interviews','Projektleitung: Einf\u00fchrung eines neuen Zeiterfassungssystems']],['10.2018 \u2013 08.2021','HR-Assistentin','Beispiel S.A., Valencia (60 Mitarbeitende)',['Personaladministration und Dossierf\u00fchrung','Unterst\u00fctzung der Lohnbuchhaltung','Organisation von Onboarding und Schulungen']]],ed:[['2014 \u2013 2018','Bachelor in Arbeitsbeziehungen und Personalwesen (Grado en Relaciones Laborales y Recursos Humanos)','Universit\u00e4t Valencia, Spanien']],wb:[['2026','Lohnbuchhaltung Schweiz und Sozialversicherungen (Kurs, 40 Std.)'],['2026','Schweizer Arbeitsrecht f\u00fcr HR (Online-Kurs)']],nt:[['The header gives date of birth, nationality and permit: expected in Switzerland, and it answers the employer\u2019s first question.','The foreign title is shown in German with the original in brackets and the level (Bachelor).','Months and years, newest first, with tasks and a measurable project.','CEFR language levels with certificate and year; German level is visible at once.','Short Swiss training in payroll and law shows you are preparing for the local market.','Attach your foreign work references with a translation, as the dossier requires.'],['La cabecera da fecha de nacimiento, nacionalidad y permiso: se espera en Suiza y responde a la primera pregunta del empleador.','El t\u00edtulo espa\u00f1ol aparece en alem\u00e1n con el original entre par\u00e9ntesis y el nivel (Bachelor).','Meses y a\u00f1os, lo m\u00e1s reciente primero, con tareas y un proyecto medible.','Niveles de idiomas MCER con certificado y a\u00f1o; el nivel de alem\u00e1n se ve de inmediato.','Una formaci\u00f3n breve suiza en n\u00f3minas y derecho muestra que te preparas para el mercado local.','Adjunta tus certificados de trabajo espa\u00f1oles con traducci\u00f3n, como exige el dossier.']]},
{k:['B \u00b7 Junior HR assistant','B \u00b7 Asistente de RRHH j\u00fanior'],t:['One-page CV for a junior HR assistant (Swiss apprenticeship route)','CV de una p\u00e1gina de un asistente de RRHH j\u00fanior (v\u00eda de aprendizaje suiza)'],nm:'Lucas Meier',ti:'HR-Assistent \u00b7 Kaufmann EFZ',pd:[['Adresse','Beispielstrasse 9, 6000 Luzern'],['Telefon','+41 78 000 00 00'],['E-Mail','lucas.meier@beispiel.ch'],['Geburtsdatum','02.08.2002'],['Nationalit\u00e4t','Schweizer (Heimatort Luzern)']],lang:[['Deutsch','Muttersprache'],['Englisch','B2'],['Franz\u00f6sisch','B1']],sk:['MS Office (sehr gut)','Abacus (Grundkenntnisse)'],pr:'Motivierter Kaufmann EFZ mit Erfahrung in der Personaladministration. Sucht einen Einstieg als HR-Assistent (100 %) mit Weiterbildung zum HR-Fachmann.',ex:[['08.2025 \u2013 heute','HR-Assistent','Beispiel AG, Luzern',['Eintritts- und Austrittsprozesse, Dossierf\u00fchrung','Erfassen von Lohnmutationen, Unterst\u00fctzung beim Lohnlauf','Entwurf von Arbeitsbest\u00e4tigungen und Zeugnissen']],['08.2022 \u2013 07.2025','Lehre Kaufmann EFZ (Dienstleistung und Administration)','Beispiel AG, Luzern',['Rotation durch 4 Abteilungen, ein Jahr im Personalwesen','Selbstst\u00e4ndige Betreuung der Stellenausschreibungen']]],ed:[['2022 \u2013 2025','Kaufmann EFZ','Kaufm\u00e4nnische Berufsfachschule Luzern']],wb:[['2026','Zertifikat HR-Assistent HRSE (in Vorbereitung)']],nt:[['One page is enough at the start of a career.','Short, factual points; the apprenticeship counts as work experience.','Name the next step (HR certificate): employers like a clear plan.','Swiss detail: Heimatort next to the nationality for Swiss citizens.'],['Una p\u00e1gina basta al inicio de la carrera.','Puntos breves y objetivos; el aprendizaje cuenta como experiencia laboral.','Indica el siguiente paso (certificado de RRHH): a los empleadores les gusta un plan claro.','Detalle suizo: el Heimatort junto a la nacionalidad para los ciudadanos suizos.']]},

the first page carries the most recent and relevant roles.','Quantified results (employees, savings) are more convincing than lists of duties.','Federal title written in full, so foreign readers and software can recognise it.','Family details are optional; here they are given in the Swiss way (Zivilstand, children with year of birth).'],['Dos p\u00e1ginas son el m\u00e1ximo suizo para la mayor\u00eda de carreras: la primera lleva los puestos m\u00e1s recientes y relevantes.','Los resultados cuantificados (empleados, ahorros) convencen m\u00e1s que las listas de funciones.','El t\u00edtulo federal escrito completo, para que lectores extranjeros y programas lo reconozcan.','Los datos familiares son opcionales; aqu\u00ed se dan a la suiza (Zivilstand, hijos con a\u00f1o de nacimiento).']]},
{k:['D \u00b7 Cover letter','D \u00b7 Carta de presentaci\u00f3n'],t:['Cover letter (Motivationsschreiben), German model','Carta de presentaci\u00f3n (Motivationsschreiben), modelo en alem\u00e1n'],letter:['Laura Fern\u00e1ndez Garc\u00eda','Beispielweg 5','8000 Z\u00fcrich','+41 79 000 00 00 \u00b7 laura.fernandez@beispiel.ch','','Beispiel AG','Frau Anna M\u00fcller','Personalabteilung','Musterstrasse 1','8001 Z\u00fcrich','','Z\u00fcrich, 11.11.2026','','Bewerbung als HR-Sachbearbeiterin (80\u2013100 %)','','Sehr geehrte Frau M\u00fcller','','Mit grossem Interesse habe ich Ihr Inserat auf jobs.ch gelesen. Ihr Unternehmen steht f\u00fcr [Wert oder Projekt der Firma], und die Aufgabe, die Personaladministration und Lohnabrechnung zu betreuen, passt genau zu meiner Erfahrung.','','In den letzten acht Jahren habe ich in Spanien monatlich Lohnabrechnungen f\u00fcr bis zu 180 Mitarbeitende erstellt, Ein- und Austritte begleitet und Rekrutierungsprozesse unterst\u00fctzt. Seit meinem Umzug in die Schweiz habe ich mich in Schweizer Arbeitsrecht, AHV, BVG, UVG und Lohnbuchhaltung weitergebildet. Ich verf\u00fcge \u00fcber die Aufenthaltsbewilligung B, spreche Deutsch auf Niveau B2 und Englisch auf Niveau C1.','','Genauigkeit, Diskretion und Freude an der Zusammenarbeit zeichnen meine Arbeit aus. Gerne \u00fcberzeuge ich Sie in einem pers\u00f6nlichen Gespr\u00e4ch. Ich kann ab dem 01.02.2027 bei Ihnen beginnen.','','Freundliche Gr\u00fcsse','Laura Fern\u00e1ndez Garc\u00eda','','Beilagen: Lebenslauf, Arbeitszeugnisse (mit \u00dcbersetzung), Diplome und Zertifikate'].join('\n'),nt:[['One page at most, with a named contact person and the exact job title and workload.','Three short paragraphs: why this company and role, what you bring, and availability.','Do not repeat the CV: connect two or three facts to the job and mention your permit and language level.','Swiss spelling: \u201cFreundliche Gr\u00fcsse\u201d and no \u00df (\u201cgrossen\u201d, \u201cGr\u00fcsse\u201d).','List the enclosures at the end (Beilagen).'],['Una p\u00e1gina como m\u00e1ximo, con una persona de contacto concreta y el puesto y la jornada exactos.','Tres p\u00e1rrafos breves: por qu\u00e9 esta empresa y este puesto, qu\u00e9 aportas y disponibilidad.','No repitas el CV: conecta dos o tres hechos con el puesto y menciona tu permiso y nivel de idioma.','Ortograf\u00eda suiza: \u201cFreundliche Gr\u00fcsse\u201d y sin \u00df (\u201cgrossen\u201d, \u201cGr\u00fcsse\u201d).','Enumera los anexos al final (Beilagen).']]}

var PDO=[["<b>Taken by a professional photographer</b> (a studio session), not by a friend or on your phone.","<b>Portrait format, head and shoulders</b> (chest portrait): not just the face and not full body. Typically about 2:3, around 4.5 \u00d7 6 cm on the CV.","<b>Plain, light, neutral background</b> (white, light grey or beige) with even, natural-looking light.","<b>Look straight into the camera</b> with a natural, friendly smile; a slight smile is enough.","<b>Clothes that suit the job and sector:</b> for HR, smart casual to business, plain colours, tidy hair.","<b>Recent:</b> not older than about a year or two, and you should look the way you will at the interview.","<b>Sharp and high resolution,</b> without filters or heavy retouching.","<b>Placed top right (or left) of the CV;</b> use the same photo on your LinkedIn profile."],["<b>Hecha por un fot\u00f3grafo profesional</b> (una sesi\u00f3n en estudio), no por un amigo ni con el m\u00f3vil.","<b>Formato vertical, cabeza y hombros</b> (busto): no solo la cara ni cuerpo entero. Normalmente en proporci\u00f3n 2:3, de unos 4,5 \u00d7 6 cm en el CV.","<b>Fondo liso, claro y neutro</b> (blanco, gris claro o beige) con luz uniforme y natural.","<b>Mira directamente a la c\u00e1mara</b> con una sonrisa natural y amable; basta una sonrisa ligera.","<b>Ropa adecuada al puesto y al sector:</b> en RRHH, entre casual elegante y formal, colores lisos, pelo cuidado.","<b>Reciente:</b> no m\u00e1s antigua de uno o dos a\u00f1os, y que te parezcas a como ir\u00e1s a la entrevista.","<b>N\u00edtida y en alta resoluci\u00f3n,</b> sin filtros ni retoque excesivo.","<b>Arriba a la derecha (o izquierda) del CV;</b> usa la misma foto en tu perfil de LinkedIn."]];
var PDN=[["Selfies, photo-booth or passport photos.","Holiday, party or cropped group photos, and full-body shots.","Busy backgrounds such as a sofa, a kitchen or the street.","Sunglasses, hats, strong filters or heavy retouching.","A forced smile, a stern look or a pose that does not feel like you.","An old photo that no longer looks like you.","A low-quality or pixelated image, or one stretched to fit the box."],["Selfies, fotos de fotomat\u00f3n o de pasaporte.","Fotos de vacaciones, de fiestas o recortes de fotos de grupo, y fotos de cuerpo entero.","Fondos cargados, como un sof\u00e1, una cocina o la calle.","Gafas de sol, gorras, filtros fuertes o retoque excesivo.","Una sonrisa forzada, una mirada seria o una pose que no parece t\u00fa.","Una foto antigua que ya no se parece a ti.","Una imagen de baja calidad o pixelada, o deformada para que quepa en el recuadro."]];

var svg='<svg viewBox="0 0 360 230" class="temple" aria-hidden="true"><polygon points="20,74 180,18 340,74" class="tr"/><text x="180" y="62" text-anchor="middle" class="tt">'+T2('Retirement income','Ingresos de jubilaci\u00f3n')+'</text><rect x="40" y="82" width="80" height="112" rx="3" class="tp1"/><rect x="140" y="82" width="80" height="112" rx="3" class="tp2"/><rect x="240" y="82" width="80" height="112" rx="3" class="tp3"/><text x="80" y="128" text-anchor="middle" class="tn">1</text><text x="180" y="128" text-anchor="middle" class="tn">2</text><text x="280" y="128" text-anchor="middle" class="tn">3</text><text x="80" y="154" text-anchor="middle" class="tl">AHV/IV</text><text x="180" y="154" text-anchor="middle" class="tl">BVG</text><text x="280" y="154" text-anchor="middle" class="tl">3a / 3b</text><text x="80" y="172" text-anchor="middle" class="ts">'+T2('State','Estado')+'</text><text x="180" y="172" text-anchor="middle" class="ts">'+T2('Employer','Empresa')+'</text><text x="280" y="172" text-anchor="middle" class="ts">'+T2('You','T\u00fa')+'</text><rect x="20" y="194" width="320" height="16" rx="3" class="tb2"/></svg>';
var cards=[['c2',T2('Pillar 1: AHV/IV (state pension)','Pilar 1: AHV/IV (pensi\u00f3n del Estado)'),T2('Mandatory for everyone','Obligatorio para todos'),[T2('<b>Who:</b> everyone who lives or works in Switzerland.','<b>Qui\u00e9n:</b> todas las personas que viven o trabajan en Suiza.'),T2('<b>Where the money comes from:</b> contributions of employees and employers (5.3% each); today\u2019s workers pay today\u2019s pensions.','<b>De d\u00f3nde sale:</b> cotizaciones de trabajadores y empresas (5,3% cada uno); los trabajadores actuales pagan las pensiones actuales.'),T2('<b>What you get:</b> CHF 1,260 to 2,520 a month in 2026, depending on your average salary and your contribution years (44 for a full pension); a married couple gets at most CHF 3,780 together. A 13th pension is paid from December 2026.','<b>Qu\u00e9 recibes:</b> de 1.260 a 2.520 CHF al mes en 2026, seg\u00fan tu salario medio y tus a\u00f1os cotizados (44 para la pensi\u00f3n completa); un matrimonio recibe como m\u00e1ximo 3.780 CHF entre los dos. Desde diciembre de 2026 se paga una 13.\u00aa pensi\u00f3n.'),T2('<b>Return:</b> none for you: your contributions are not invested, they pay today\u2019s pensions.','<b>Rentabilidad:</b> ninguna para ti: tus cotizaciones no se invierten, pagan las pensiones actuales.'),T2('<b>Purpose:</b> cover basic needs.','<b>Objetivo:</b> cubrir las necesidades b\u00e1sicas.')]],['c3',T2('Pillar 2: BVG (company pension fund)','Pilar 2: BVG (caja de pensiones de la empresa)'),T2('Mandatory above CHF 22,680 a year','Obligatorio por encima de 22.680 CHF al a\u00f1o'),[T2('<b>Who:</b> employees above the entry threshold; the employer enrols you.','<b>Qui\u00e9n:</b> empleados por encima del umbral de entrada; la empresa te inscribe.'),T2('<b>Where the money comes from:</b> your and your employer\u2019s contributions (the employer pays at least half), saved with interest in your personal account.','<b>De d\u00f3nde sale:</b> tus cotizaciones y las de la empresa (ella paga al menos la mitad), ahorradas con intereses en tu cuenta personal.'),T2('<b>What you get:</b> a monthly pension (the mandatory capital \u00d7 6.8% a year) or part of it as capital. With pillar 1 it aims to keep your way of life.','<b>Qu\u00e9 recibes:</b> una renta mensual (el capital obligatorio \u00d7 6,8% al a\u00f1o) o parte en capital. Junto con el pilar 1 busca mantener tu nivel de vida.'),T2('<b>Return:</b> the fund invests the money of all its members and credits interest to your account; you normally do not choose the investments. The mandatory part has a minimum interest rate set by the Federal Council.','<b>Rentabilidad:</b> la caja invierte el dinero de todos sus asegurados y acredita intereses en tu cuenta; normalmente no eliges las inversiones. La parte obligatoria tiene un tipo de interés mínimo fijado por el Consejo Federal.'),T2('<b>If you change job:</b> your capital follows you.','<b>Si cambias de empresa:</b> tu capital te sigue.')]],['c4',T2('Pillar 3: private savings (3a and 3b)','Pilar 3: ahorro privado (3a y 3b)'),T2('Voluntary','Voluntario'),[T2('<b>3a:</b> locked savings with a tax deduction, up to CHF 7,258 a year in 2026 if you have a pension fund.','<b>3a:</b> ahorro bloqueado con deducci\u00f3n fiscal, hasta 7.258 CHF al a\u00f1o en 2026 si tienes caja de pensiones.'),T2('<b>3b:</b> free savings with no deduction and no lock.','<b>3b:</b> ahorro libre, sin deducci\u00f3n fiscal ni bloqueo.'),T2('<b>Return:</b> you choose how it is invested: a 3a account with a low fixed interest rate and no risk, or a securities solution (funds or ETFs) with more risk and, over the long term, usually a higher return. Fees matter a lot.','<b>Rentabilidad:</b> tú eliges cómo se invierte: una cuenta 3a con un interés fijo bajo y sin riesgo, o una solución con valores (fondos o ETF) con más riesgo y, a largo plazo, normalmente más rentabilidad. Las comisiones importan mucho.'),T2('<b>What you get:</b> the capital you saved plus interest, paid as a lump sum: from 5 years before the reference age, or earlier to buy a home, become self-employed or leave Switzerland for good.','<b>Qu\u00e9 recibes:</b> el capital ahorrado m\u00e1s intereses, de una vez: desde 5 a\u00f1os antes de la edad de referencia, o antes para comprar vivienda, ser aut\u00f3nomo o irte de Suiza definitivamente.'),T2('<b>Purpose:</b> top up your pension and save taxes.','<b>Objetivo:</b> completar tu pensi\u00f3n y ahorrar impuestos.')]]];
h+='<p>'+T2('Switzerland builds your retirement income like a house with three pillars: a state base (pillar 1), a mandatory savings account through your employer (pillar 2) and your own voluntary savings (pillar 3). In many countries the state pension covers almost everything; in Switzerland it is only the base and the rest is saved over your working life.','Suiza construye tus ingresos de jubilaci\u00f3n como una casa con tres pilares: una base p\u00fablica (pilar 1), una cuenta de ahorro obligatoria a trav\u00e9s de tu empresa (pilar 2) y tu propio ahorro voluntario (pilar 3). Frente a Espa\u00f1a, donde la pensi\u00f3n p\u00fablica cubre casi todo, en Suiza la pensi\u00f3n p\u00fablica es solo la base y el resto se ahorra durante la vida laboral.')+'</p><div class=pill><div>'+svg+'</div><div class=pcards>'+cards.map(function(c){return '<div class="pcard '+c[0]+'"><span class=tag>'+c[2]+'</span><b>'+c[1]+'</b><ul>'+c[3].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'}).join('')+'</div></div>';
h+='<p><b>'+T2('Estimate your retirement income','Estima tus ingresos de jubilaci\u00f3n')+'</b></p><p class=sn>'+T2('<b>What it does:</b> estimates your pension from each pillar and shows your income in retirement with only pillar 1, with pillars 1 + 2 and with all three. <b>You enter:</b> your age, salary and the years you will have contributed to the AHV in Switzerland; optionally the capital shown on your pension fund certificate and your pillar 3a savings. <b>You get:</b> monthly amounts and the share of your salary each scenario covers. All amounts are gross, before tax.','<b>Qu\u00e9 hace:</b> estima tu pensi\u00f3n de cada pilar y muestra tus ingresos de jubilaci\u00f3n solo con el pilar 1, con los pilares 1 + 2 y con los tres. <b>Qu\u00e9 introduces:</b> tu edad, tu salario y los a\u00f1os que habr\u00e1s cotizado a la AHV en Suiza; opcionalmente el capital que figura en el certificado de tu caja de pensiones y tu ahorro del pilar 3a. <b>Qu\u00e9 obtienes:</b> importes mensuales y qu\u00e9 parte de tu salario cubre cada escenario. Todos los importes son brutos, antes de impuestos.')+'</p><div class=cc>'+inp('age',T2('Your age now','Tu edad ahora'),S.age,1)+inp('ret',T2('Retirement age','Edad de jubilaci\u00f3n'),S.ret,1)+inp('sal',T2('Gross annual salary now (CHF)','Salario bruto anual actual (CHF)'),S.sal,1000)+inp('gr',T2('Expected yearly salary growth (%)','Crecimiento salarial anual esperado (%)'),S.gr,0.1)+inp('yrs',T2('Years you will have contributed to the AHV in Switzerland (maximum 44)','A\u00f1os que habr\u00e1s cotizado a la AHV en Suiza (m\u00e1ximo 44)'),S.yrs,1)+inp('avg',T2('Average annual income for the AHV (0 = use your salary)','Ingreso anual medio para la AHV (0 = usar tu salario)'),S.avg,1000)+chk('mar',T2('I am married and my partner also gets a similar pension (couple cap)','Estoy casado/a y mi pareja cobra una pensi\u00f3n similar (tope de matrimonio)'),S.mar)+inp('cap',T2('Pension fund capital today (CHF, from your certificate)','Capital actual de la caja de pensiones (CHF, de tu certificado)'),S.cap,1000)+inp('it',T2('Interest on the pension fund capital (% a year, assumption)','Inter\u00e9s del capital de la caja (% anual, supuesto)'),S.it,0.05)+inp('c3',T2('Pillar 3a contribution (CHF a year)','Aportaci\u00f3n al pilar 3a (CHF al a\u00f1o)'),S.c3,500)+inp('r3',T2('Pillar 3a return (% a year, assumption: a savings account yields little, funds more but without guarantee)','Rentabilidad del pilar 3a (% anual, supuesto: una cuenta rinde poco, los fondos más pero sin garantía)'),S.r3,0.1)+inp('w3',T2('Years over which you spread the pillar 3a capital (only to compare)','A\u00f1os en que repartes el capital del 3a (solo para comparar)'),S.w3,1)+'<div id=rp>'+penRes()+'</div></div>';
h+='<p class=sn><b>'+T2('How it is calculated.','C\u00f3mo se calcula.')+'</b> '+T2('Pillar 1 uses the official 2026 scale: the full pension is CHF 1,260 up to an average income of CHF 15,120, then rises with income up to CHF 2,520 from CHF 90,720; with fewer than 44 contribution years you get the share years \u00f7 44. Pillar 2 adds the legal minimum credits (7%, 10%, 15% and 18% of the coordinated salary by age band), with the interest you enter, and converts the capital at 6.8%. Pillar 3a accumulates your contributions with the return you enter. Limits: many pension funds contribute more than the legal minimum and pay less than 6.8% on the supra-mandatory part; thresholds are assumed constant; the 13th pension is included; tax, early or deferred retirement and years in other countries are not.','El pilar 1 usa la escala oficial de 2026: la pensi\u00f3n completa es de 1.260 CHF hasta un ingreso medio de 15.120 CHF, luego sube con el ingreso hasta 2.520 CHF desde 90.720 CHF; con menos de 44 a\u00f1os cotizados recibes la parte a\u00f1os \u00f7 44. El pilar 2 suma las bonificaciones m\u00ednimas legales (7%, 10%, 15% y 18% del salario coordinado seg\u00fan la edad), con el inter\u00e9s que introduces, y convierte el capital al 6,8%. El pilar 3a acumula tus aportaciones con la rentabilidad que introduces. L\u00edmites: muchas cajas aportan m\u00e1s que el m\u00ednimo legal y pagan menos del 6,8% en la parte supraobligatoria; se suponen umbrales constantes; se incluye la 13.\u00aa pensi\u00f3n; no se incluyen impuestos, la jubilaci\u00f3n anticipada o aplazada ni los a\u00f1os en otros pa\u00edses.')+'</p>';
var fq=[[T2('Which pillars invest my money and give a return?','¿Qué pilares invierten mi dinero y dan rentabilidad?'),T2('Pillar 1 does not invest your contributions: it pays today’s pensions. In pillar 2 the pension fund invests the money of all its members and credits interest to your account; you normally cannot choose. In pillar 3a you choose: a 3a account (low, safe interest) or securities (funds or ETFs: more risk, usually more return over the long term, and fees matter). Pillar 3b is free: a savings account, securities or life insurance, with no tax deduction.','El pilar 1 no invierte tus cotizaciones: paga las pensiones actuales. En el pilar 2 la caja de pensiones invierte el dinero de todos sus asegurados y acredita intereses en tu cuenta; normalmente no puedes elegir. En el pilar 3a eliges tú: una cuenta 3a (interés bajo y seguro) o valores (fondos o ETF: más riesgo, normalmente más rentabilidad a largo plazo, y las comisiones importan). El pilar 3b es libre: cuenta de ahorro, valores o seguro de vida, sin deducción fiscal.')],[T2('What if I only spend some years in Switzerland?','\u00bfY si solo paso algunos a\u00f1os en Suiza?'),T2('The AHV pension is proportional to your contribution years: with 22 of 44 years you get about half. Each country pays its own pension for its own periods, so ask the other country for the years worked there.','La pensi\u00f3n AHV es proporcional a tus a\u00f1os cotizados: con 22 de 44 a\u00f1os recibes aproximadamente la mitad. Cada pa\u00eds paga su propia pensi\u00f3n por sus propios per\u00edodos, as\u00ed que pregunta a Espa\u00f1a por los a\u00f1os trabajados all\u00ed.')],[T2('What happens to my pension fund if I change job?','\u00bfQu\u00e9 pasa con mi caja de pensiones si cambio de empresa?'),T2('Your capital moves to the new employer\u2019s fund, or to a vested-benefits account if you have no job. Ask each employer for the pension certificate.','Tu capital pasa a la caja del nuevo empleador, o a una cuenta de libre paso si no tienes trabajo. Pide a cada empleador el certificado de la caja de pensiones.')],[T2('What if I leave Switzerland for another country?','\u00bfY si me voy de Suiza a Espa\u00f1a?'),T2('The AHV pension is still paid abroad. The mandatory part of the pension fund cannot be paid out in cash if you stay compulsorily insured in an EU/EFTA country: it stays in a Swiss vested-benefits account, available 5 years before the reference age. The supra-mandatory part can be paid out. Pillar 3a can be withdrawn when you leave Switzerland for good.','La pensi\u00f3n AHV se sigue pagando en el extranjero. La parte obligatoria de la caja de pensiones no se puede cobrar en efectivo si sigues asegurado obligatoriamente en un pa\u00eds UE/AELC: queda en una cuenta de libre paso suiza, disponible 5 a\u00f1os antes de la edad de referencia. La parte supraobligatoria s\u00ed puede cobrarse. El pilar 3a puede retirarse al irte de Suiza definitivamente.')],[T2('Pension or lump sum?','\u00bfRenta o capital?'),T2('For the pension fund it depends on its regulations: a lifelong pension, a lump sum or a mix. Pillar 3a is always paid as capital. Capital withdrawals are taxed separately from other income.','En la caja de pensiones depende de su reglamento: una renta vitalicia, un capital o una mezcla. El pilar 3a se paga siempre como capital. Los retiros de capital se gravan aparte de los dem\u00e1s ingresos.')],[T2('Do couples get less?','\u00bfLos matrimonios cobran menos?'),T2('Yes, in the AHV: the two pensions of a married couple together are capped at CHF 3,780 a month, while two unmarried people can each receive up to CHF 2,520.','S\u00ed, en la AHV: las dos pensiones de un matrimonio juntas tienen un tope de 3.780 CHF al mes, mientras que dos personas solteras pueden cobrar hasta 2.520 CHF cada una.')]];
h+='<p><b>'+T2('Frequently asked questions','Preguntas frecuentes')+'</b></p><ul>'+fq.map(function(q){return '<li><b>'+q[0]+'</b> '+q[1]+'</li>'}).join('')+'</ul><p class=sn>'+T2('More detail, with examples, in the guide: section 26, the three pillars in depth.','M\u00e1s detalle, con ejemplos, en la gu\u00eda: apartado 26, los tres pilares en profundidad.')+'</p>';

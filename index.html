): Hat der Arbeitgeber sie, ersetzt sie normalerweise die Skala: typischerweise 80 % des Lohns während bis zu 720 Tagen nach einer Wartefrist (oft 30 Tage), und der Arbeitgeber zahlt meist mindestens die Hälfte der Prämie. Prüfen Sie die Police.","1eni3darvrp":"<b>Abgangsentschädigung:<\/b> Die Schweiz kennt keine allgemeine Abgangsentschädigung. Die einzige gesetzliche (Art. 339b) gilt für Arbeitnehmende, denen mit 50 oder älter nach mindestens 20 Dienstjahren gekündigt wird: zwischen 2 und 8 Monatslöhnen. Andere Zahlungen ergeben sich aus dem Vertrag, einem Gesamtarbeitsvertrag oder einem ausgehandelten Austritt («Aufhebungsvertrag»).","2bcvcwgk6e2":"Aufhebungsvereinbarung: Prüfen Sie, dass die Arbeitnehmerin oder der Arbeitnehmer nicht auf zwingende Rechte verzichtet (Art. 341) und dass Arbeitslosentaggelder verzögert werden können, wenn sie oder er freiwillig unterschreibt.","r2ewrc994q":"22. Sperrfristen","23cj0iat2xg":"Nach der Probezeit darf der Arbeitgeber nicht kündigen während: Militär- oder Zivildienst (plus 4 Wochen davor und danach), Krankheit oder Unfall (30 Tage im 1. Jahr, 90 Tage in den Jahren 2–5, 180 Tage ab dem 6. Jahr), Schwangerschaft und 16 Wochen nach der Geburt sowie einigen weiteren Fällen.","1e298m5f0fd":"Eine während einer Sperrfrist ausgesprochene Kündigung ist nichtig. Wurde sie davor ausgesprochen, wird die Kündigungsfrist unterbrochen und läuft danach weiter, mit Ende auf das nächste Monatsende.","yj6oufxn6h":"Die Arbeitnehmerin oder der Arbeitnehmer kann während dieser Zeiten kündigen; der Schutz gilt nur gegenüber dem Arbeitgeber.","3sauqa1n1i":"<b>Wann er gilt:<\/b> nur nach der Probezeit und nur gegen eine Kündigung durch den Arbeitgeber. Eine innerhalb der Sperrfrist ausgesprochene Kündigung ist nichtig und muss nach deren Ende wiederholt werden. Wurde die Kündigung vor der Sperrfrist ausgesprochen, bleibt sie gültig, aber die Kündigungsfrist wird unterbrochen und läuft danach weiter; endet sie dann nicht auf ein Monatsende, läuft sie bis zum nächsten Monatsende.","16yk7q2ni8i":"<b>Krankheit und Unfall:<\/b> Die Krankheit darf nicht selbstverschuldet sein, und sowohl volle als auch teilweise Arbeitsunfähigkeit schützen. Die Tage sind Kalendertage (Wochenenden und Feiertage zählen), und der Schutz dauert nur so lange wie die Arbeitsunfähigkeit, bis zu 30, 90 oder 180 Tage. Eine neue, nicht zusammenhängende Krankheit oder ein neuer Unfall löst eine neue Sperrfrist aus; ein Rückfall derselben Krankheit nicht. Beginnt eine Arbeitsunfähigkeit in einem Dienstjahr und dauert ins nächste an, kann die längere Frist des späteren Jahres gelten.","1u5eklaxrht":"<b>Schwangerschaft und Elternschaft:<\/b> Der Schutz dauert vom Beginn der Schwangerschaft (von der Empfängnis zurückgerechnet) bis 16 Wochen nach der Geburt oder bis zum Ende eines verlängerten Mutterschaftsurlaubs nach EOG. Es gibt auch Schutz rund um den Betreuungsurlaub für ein schwer krankes Kind.","pzwovkjd3u":"<b>Militär- und Zivildienst:<\/b> Der Schutz gilt während des schweizerischen obligatorischen Militär-, Zivilschutz- oder Zivildienstes und bei Diensten von mehr als 11 Tagen auch 4 Wochen davor und danach. Vergleichbarer Dienst im Ausland kann gleich behandelt werden.","25248hp1nrv":"<b>Beispiel:<\/b> Im 3. Dienstjahr ist eine Arbeitnehmerin krankgeschrieben, und der Arbeitgeber sendet am 3. Juli eine Kündigung. Die Kündigung ist nichtig, der Arbeitgeber muss daher warten, bis der 90-tägige Schutz endet (oder die Person wieder arbeitsfähig ist), und erneut kündigen.","17iwkp3dhwc":"<b>HR-Tipp:<\/b> Prüfen Sie vor jeder Kündigung Absenzen und Schwangerschaft und dokumentieren Sie Zustelldaten; eine nichtige Kündigung kostet Zeit und kann zu weiteren Streitigkeiten führen.","2ga8zkelsnq":"23. Missbräuchliche und fristlose Kündigung","9zlzmf017y":"Missbräuchliche Kündigung (Art. 336): z. B. wegen einer geschützten Eigenschaft, wegen der Ausübung eines verfassungsmässigen Rechts, wegen der Geltendmachung von Ansprüchen aus dem Arbeitsverhältnis nach Treu und Glauben oder um solche Ansprüche zu vereiteln.","1abto4rrttw":"Verfahren: schriftliche Einsprache beim Arbeitgeber vor Ablauf der Kündigungsfrist, dann Klage innert 180 Tagen nach Ende des Arbeitsverhältnisses. Entschädigung bis zu 6 Monatslöhnen (Art. 336a); die Kündigung bleibt bestehen.","267mh9gfp0r":"Fristlose Kündigung (Art. 337): nur aus «wichtigem Grund», der die Fortsetzung nach Treu und Glauben unzumutbar macht. Sie muss umgehend erfolgen, meist innert 2–3 Arbeitstagen nach Kenntnis der Tatsachen.","1m9lpqu48wv":"Ungerechtfertigte fristlose Kündigung: Die Arbeitnehmerin oder der Arbeitnehmer erhält, was sie oder er bis zum Ende der Kündigungsfrist verdient hätte, plus eine Entschädigung von bis zu 6 Monatslöhnen.","292dqkvf21y":"<b>In Art. 336 aufgeführte Gründe (nicht abschliessend):<\/b> eine persönliche Eigenschaft wie Herkunft, Alter oder Nationalität, ausser sie ist für die Stelle von Bedeutung; die Ausübung eines verfassungsmässigen Rechts; das Vereiteln von Ansprüchen aus dem Arbeitsverhältnis; Rache für die Geltendmachung von Ansprüchen nach Treu und Glauben (Rachekündigung); obligatorischer Militär- oder Zivildienst; die Tätigkeit als Arbeitnehmervertreterin oder -vertreter; und Massenentlassung ohne das vorgeschriebene Konsultationsverfahren. Auch andere Verstösse gegen Treu und Glauben können zählen.","nis0y5lwjw":"<b>Folgen:<\/b> Eine missbräuchliche Kündigung bleibt gültig. Das Gericht kann eine Entschädigung von bis zu 6 Monatslöhnen zusprechen (2 Monate bei einer Massenentlassung ohne Konsultation), plus Schadenersatz nach anderen Regeln. Normalerweise muss die Arbeitnehmerin oder der Arbeitnehmer den Missbrauch beweisen; ein enger zeitlicher Zusammenhang zwischen einer Forderung und der Kündigung ist ein starkes Indiz.","9nqo9hk92w":"<b>Verfahren:<\/b> Erheben Sie vor Ablauf der Kündigungsfrist schriftlich Einsprache beim Arbeitgeber (Art. 336b). Kommt keine Einigung über die Fortsetzung zustande, reichen Sie die Klage innert 180 Tagen nach Ende des Arbeitsverhältnisses ein, sonst verwirkt das Recht.","mkqxa2xrte":"<b>Fristlose Kündigung (Art. 337):<\/b> nur aus wichtigem Grund, der die Fortsetzung nach Treu und Glauben unzumutbar macht. Schlechte Leistung allein genügt meist nicht. Die Gründe müssen auf Verlangen schriftlich mitgeteilt werden. Für die Entschädigung nach Art. 337c (bis zu 6 Monatslöhne) ist keine vorgängige Einsprache nötig.","1i5nx17p5co":"<b>HR-Praxis:<\/b> Dokumentieren Sie Tatsachen und Verwarnungen, wenden Sie in vergleichbaren Fällen dieselben Regeln an, nennen Sie die Gründe wahrheitsgemäss und prüfen Sie zuerst die Sperrfristen (Abschnitt 22).","dqgfb55pzr":"18. Familienurlaub","18wqedaonp6":"Mutterschaft: 14 Wochen zu 80 % des durchschnittlichen Verdienstes, höchstens CHF 220 pro Tag (EO). Verlängert, wenn das Neugeborene lange im Spital bleibt.","1fezbd9jfzg":"Vaterschaft: 2 Wochen (10 Tage), innerhalb der 6 Monate nach der Geburt zu beziehen, gleiche 80 % und Obergrenze von CHF 220. Adoptionsurlaub: 2 Wochen.","1gvgmp8ocb6":"Betreuungsurlaub für ein schwer krankes oder verunfalltes Kind: bis zu 14 Wochen innerhalb von 18 Monaten.","slmzyxru44":"Kurze Absenzen zur Betreuung einer kranken Angehörigen oder eines kranken Angehörigen: bis zu 3 Tage pro Ereignis und 10 Tage pro Jahr (ArG Art. 36).","1jbikheju3f":"19. Familienurlaub im Detail","1i36bnmv85u":"<b>Mutterschaftsentschädigung (EO):<\/b> Die Mutter muss in den 9 Monaten vor der Geburt AHV-versichert gewesen sein und davon mindestens 5 gearbeitet haben. Die Entschädigung beträgt 80 % des durchschnittlichen Einkommens, höchstens CHF 220 pro Tag, während 98 Tagen (14 Wochen). Nimmt sie die Arbeit früher wieder auf, endet der Anspruch.","1d69mqj2h8d":"<b>Beispiel:<\/b> Lohn CHF 8’000 pro Monat: Tagesansatz 8’000 × 12 / 360 = CHF 266.67; 80 % = CHF 213 pro Tag, also insgesamt etwa CHF 20’900. Bei CHF 10’000 pro Monat wären 80 % CHF 267, es gilt daher die Obergrenze von CHF 220: 98 × 220 = CHF 21’560.","24624fwgbox":"Schutz am Arbeitsplatz (ArG Art. 35a): keine Arbeit in den 8 Wochen nach der Geburt, und von Woche 9 bis 16 nur mit Einverständnis der Mutter. Eine Kündigung ist auch während der Schwangerschaft und 16 Wochen nach der Geburt ausgeschlossen. Stillzeit gilt als bezahlte Arbeitszeit. Der Arbeitgeber kann die Entschädigung per Vertrag oder Reglement auf 100 % aufstocken.","1jmg6kwtcd1":"<b>Vaterschaft:<\/b> dieselben Versicherungsbedingungen, 2 Wochen (10 Tage), wochen- oder tageweise innerhalb von 6 Monaten nach der Geburt zu beziehen. Der Arbeitgeber reicht den Antrag bei der Ausgleichskasse ein. Adoptionsurlaub: 2 Wochen.","1sz2nrlv448":"<b>Betreuungsurlaub für ein schwer krankes Kind:<\/b> bis zu 14 Wochen (98 Taggelder) innerhalb von 18 Monaten, die die Eltern teilen und wochen- oder tageweise beziehen können. Kurze Betreuungsabsenzen für eine kranke Angehörige oder einen kranken Angehörigen: bis zu 3 Tage pro Ereignis und 10 Tage pro Jahr (ArG Art. 36).","qsnc3wgsub":"<b>Voraussetzungen der Mutterschaftsentschädigung (EO):<\/b> Die Mutter muss in den 9 Monaten vor der Geburt AHV-versichert gewesen sein, davon mindestens 5 gearbeitet haben (in beliebigem Pensum) und bei der Geburt erwerbstätig sein (oder nach einer Kündigung geschützt). Der Anspruch beginnt mit der Geburt und endet nach 98 Tagen oder früher, wenn sie wieder arbeitet. Die Entschädigung selbst ist AHV-pflichtig. Die Tagesobergrenze von CHF 220 wird ab einem Monatslohn von CHF 8’250 erreicht (8’250 × 80 % ÷ 30).","1ick39m0myx":"<b>Beispiel:<\/b> Monatslohn CHF 6’000: Tagesansatz 6’000 ÷ 30 = CHF 200; 80 % = CHF 160 pro Tag; 98 Tage = CHF 15’680. Vaterschaftsurlaub: 14 Taggelder × CHF 160 = CHF 2’240.","goihg4ndmj":"<b>Verlängerung und Kantone:<\/b> Bleibt das Neugeborene länger im Spital, kann die Mutter bis zu 8 weitere Wochen Entschädigung beantragen, wenn sie danach die Arbeit wieder aufnimmt. Genf fügt 2 Wochen hinzu (16 insgesamt) aus einem kantonalen Fonds.","m41qc2o4os":"<b>Vaterschaftsurlaub:<\/b> für den gesetzlichen Vater (und die Ehefrau einer Frau, die geboren hat). Die 2 Wochen (10 Arbeitstage) müssen innerhalb von 6 Monaten bezogen werden, am Stück oder tageweise. Der Arbeitgeber darf während des Urlaubs nicht kündigen.","236y7r1p7bz":"<b>Adoptions- und Betreuungsurlaub:<\/b> Der Adoptionsurlaub beträgt 2 Wochen für ein Kind unter 4 Jahren, unter den Eltern aufgeteilt, aber nicht gleichzeitig, und gilt nicht für die Adoption des Kindes der Ehepartnerin oder des Ehepartners. Der Betreuungsurlaub für ein schwer krankes oder verunfalltes Kind beträgt bis zu 14 Wochen innerhalb von 18 Monaten und kann von den Eltern geteilt werden.","134d02f8ax9":"25. Sozialversicherungen (2026)","1u5gc02gjq1":"AHV/IV/EO (erste Säule): 5,3 % Arbeitnehmer + 5,3 % Arbeitgeber = 10,6 % des gesamten Bruttolohns, ohne Obergrenze.","2dkejxijg1m":"ALV (Arbeitslosenversicherung): je 1,1 % auf Lohn bis CHF 148’200 pro Jahr.","w7aefw1d13":"BVG (zweite Säule): obligatorisch ab einem Jahreslohn von CHF 22’680; Koordinationsabzug CHF 26’460; obere Grenze CHF 90’720. Die Sätze nach Alter legt die Kasse fest; der Arbeitgeber zahlt mindestens 50 %.","18t591fzcb1":"UVG: Berufsunfall vom Arbeitgeber bezahlt; Nichtberufsunfall (NBU) von der Arbeitnehmerin oder dem Arbeitnehmer. Maximal versicherter Lohn CHF 148’200.","25m1doituiy":"Familienzulagen (FamZG): Bundesminimum pro Kind CHF 215/Monat (bis 16 Jahre) und CHF 268 (Ausbildung, 16–25); die Kantone können mehr zahlen. Arbeitgeber leisten Beiträge über die Familienausgleichskasse (FAK).","uub2l069l4":"Prüfen Sie jeden Herbst die Schwellenwerte des nächsten Jahres: Die BVG-Schwellenwerte können sich 2027 ändern.","y1evin7962":"<b>Arbeitslosenversicherung (ALV) in der Praxis:<\/b> Für einen Anspruch brauchen Sie mindestens 12 Beitragsmonate in den 2 Jahren vor der Anmeldung. Sie melden sich beim regionalen Arbeitsvermittlungszentrum (RAV) an und stellen bei einer Arbeitslosenkasse einen Antrag, mit Arbeitgeberbescheinigung, den letzten Lohnabrechnungen, dem Vertrag und dem Kündigungsschreiben. Die Leistungen werden als Taggelder ausbezahlt, 5 pro Woche.","21lfbh715zm":"<b>Höhe der ALV:<\/b> 70 % des versicherten Verdienstes oder 80 %, wenn Sie Kinder unter 25 Jahren unterstützen, Ihr versicherter Verdienst höchstens CHF 3’797 pro Monat beträgt oder Sie einen Invaliditätsgrad von mindestens 40 % haben. Der versicherte Verdienst ist bei CHF 148’200 pro Jahr plafoniert, und der Tagessatz ist der versicherte Monatsverdienst geteilt durch 21,7.","rrkxsprkqn":"<b>Dauer der ALV:<\/b> bis zu 200 Tage (unter 25 ohne Unterhaltspflicht), 260 Tage (12 bis unter 18 Beitragsmonate), 400 Tage (18 Monate oder mehr) und 520 Tage (22 Monate oder mehr und Alter 55 oder älter oder eine IV-Rente von mindestens 40 %). Zu Beginn gilt eine Wartefrist.","in41pzeq94":"<b>Beispiel:<\/b> Ein versicherter Monatsverdienst von CHF 5’000 ergibt einen Tagesverdienst von CHF 230.40 (5’000 ÷ 21,7). Bei 70 % beträgt das Taggeld CHF 161.30 und bei 80 % CHF 184.35, vor Abzügen wie AHV, Unfallversicherung und Pensionskasse.","25g1fzrlelq":"<b>Familienzulagen (FamZG):<\/b> Das Bundesminimum beträgt CHF 215 pro Monat und Kind bis 16 und CHF 268 für Ausbildung von 16 bis 25; die Kantone können mehr zahlen (zum Beispiel zahlen Genf, Wallis, Waadt und Zug mehr als CHF 300 Kinderzulage). Der Arbeitgeber zahlt sie über die Familienausgleichskasse.","u48ipj3062":"<b>Wer bei Krankheit und Unfall was zahlt:<\/b> der Arbeitgeber nach Art. 324a oder eine Krankentaggeldversicherung (meist 80 %, kein AHV-Lohn); die Unfallversicherung (UVG) zahlt 80 % ab dem 3. Tag; Mutterschaft und Vaterschaft zahlt die EO zu 80 % bis CHF 220 pro Tag; Arbeitslosigkeit wie oben.","21p611fmy9y":"<b>Praktische Regel für HR:<\/b> Jede Leistung hat eigene Abzugsregeln und eigene Fristen, fragen Sie daher die zahlende Stelle (Ausgleichskasse, Versicherer oder Pensionskasse), bevor Sie eine Lohnregel aufbauen.","2erw3iqbh5e":"Die Zahlen gelten für 2026 und stammen aus den Kennzahlen des Bundesamts für Sozialversicherungen (BSV); bestätigen Sie sie auf bsv.admin.ch.","1vap3645wyx":"26. Die drei Säulen im Detail","23vla3ai4pg":"<b>Idee:<\/b> drei Schichten, damit Pensionierung, Invalidität und Todesfall nicht zu einem starken Einkommenseinbruch führen. Faustregel: Die Säulen 1 und 2 zusammen zielen auf etwa 60 % des letzten Lohns.","1xn26pamtvo":"<b>Säule 1 – AHV/IV/EO (staatlich, Umlageverfahren):<\/b> obligatorisch für alle, die in der Schweiz leben oder arbeiten. Sie deckt Alter und Hinterlassene (AHV), Invalidität (IV) und Erwerbsersatz bei Militärdienst, Mutterschaft und Vaterschaft (EO). Sie wird von den heutigen Erwerbstätigen finanziert, nicht aus Ihren eigenen Ersparnissen.","rpj7ujhf37":"Rente der Säule 1: hängt von den Beitragsjahren (eine volle Rente braucht 44 Jahre) und vom durchschnittlichen Einkommen ab. Im Jahr 2026 erhält eine alleinstehende Person zwischen CHF 1’260 und CHF 2’520 pro Monat; die zwei Renten eines Ehepaars sind zusammen auf 150 % des Maximums plafoniert (CHF 3’780). Eine 13. Monatsrente wird im Dezember 2026 erstmals ausbezahlt. Jedes fehlende Jahr kürzt die Rente um etwa 1/44.","qr2gr06kq4":"Wenn Sie auch in das System eines anderen EU/EFTA-Landes eingezahlt haben, zählen diese Jahre nach EU-Recht für die minimale Versicherungsdauer, aber jedes Land zahlt seine eigene Rente anteilig.","24u3lljorsr":"<b>Säule 2 – BVG (berufliche Vorsorge, Kapitaldeckung):<\/b> obligatorisch für Angestellte, die mehr als CHF 22’680 pro Jahr verdienen. Beide Seiten zahlen, der Arbeitgeber mindestens 50 %. Das Sparkapital wächst auf Ihrem individuellen Konto bei der Pensionskasse, die auch Invalidität und Tod versichert (Risikodeckung ab 17 Jahren, Sparen ab 25).","1oi2flk2lxd":"Obligatorische Berechnung: koordinierter Lohn = Lohn minus CHF 26’460, plafoniert bei CHF 64’260 (also CHF 90’720 minus 26’460). Gesetzliche Altersgutschriften, Arbeitnehmer plus Arbeitgeber: 7 % mit 25–34, 10 % mit 35–44, 15 % mit 45–54, 18 % mit 55–65.","1tyu3wvozlg":"Bei der Pensionierung wird das Kapital zu einer Rente (gesetzlicher Umwandlungssatz 6,8 % auf dem obligatorischen Teil) oder, wenn die Kasse es erlaubt, zu einer Kapitalauszahlung. Viele Kassen sind besser als das gesetzliche Minimum (überobligatorische Pläne).","1qvhci80pmn":"Stellenwechsel: Das Kapital geht an die neue Kasse über. Wegzug aus der Schweiz in die EU/EFTA: Der obligatorische Teil kann nicht bar ausbezahlt werden und bleibt auf einem Freizügigkeitskonto; nur der überobligatorische Teil kann bezogen werden. Ein Vorbezug für den Kauf von Wohneigentum (WEF) ist unter Bedingungen möglich.","28lrby9h18n":"<b>Säule 3 – privat:<\/b> Die 3a ist ein gebundenes Sparkonto oder eine Versicherung, steuerlich abzugsfähig; für Angestellte mit Pensionskasse beträgt die Jahresobergrenze 2026 CHF 7’258 (ab 2027 CHF 7’373). Sie kann meist ab 5 Jahren vor dem Referenzalter bezogen werden, oder für den Kauf von Wohneigentum, den Schritt in die Selbstständigkeit oder den endgültigen Wegzug aus der Schweiz. Die 3b ist freies Sparen ohne Steuerabzug.","2ctu3j565nv":"<b>Beispiel:<\/b> Ana, 40, Bruttolohn CHF 100’000. AHV/IV/EO: 5,3 % = CHF 5’300. ALV: 1,1 % = CHF 1’100. BVG: koordinierter Lohn plafoniert bei CHF 64’260 × 10 % Gutschrift = CHF 6’426 pro Jahr; ihre Hälfte beträgt CHF 3’213. Ihre Abzüge betragen zusammen etwa CHF 9’613, plus Nichtberufsunfallprämie (etwa 1 %) und Einkommenssteuer. Ihr Arbeitgeber zahlt zusätzlich 5,3 % + 1,1 % + mindestens CHF 3’213, plus Familienkasse und Berufsunfall. Vereinfacht: Die tatsächlichen Kassenbeiträge decken auch Risiko- und Verwaltungskosten.","ih9bv2sxa2":"<b>In einfachen Worten:<\/b> Säule 1 ist die staatliche Grundrente, Säule 2 ein obligatorisches Sparkonto, das über Ihren Arbeitgeber aufgebaut wird, und Säule 3 ist freiwilliges Sparen mit Steuervorteil. Die Säulen 1 und 2 zusammen sollen Ihren Lebensstandard nach der Pensionierung erhalten (eine übliche Faustregel sind etwa 60 % Ihres letzten Lohns); Säule 3 füllt die Lücke.","bhnr5darev":"<b>Woher das Geld kommt:<\/b> Säule 1 funktioniert im Umlageverfahren (die heutigen Erwerbstätigen zahlen die heutigen Renten); die Säulen 2 und 3 sind kapitalgedeckt: Ihr eigenes Geld plus Zinsen.","1w2zxvtio4c":"<b>Wann jede Säule zahlt:<\/b> die AHV im Referenzalter (65; bei Frauen steigt es seit 2025 schrittweise von 64 auf 65), mit der Möglichkeit eines Vorbezugs gegen eine Kürzung (6,8 % pro Vorbezugsjahr als allgemeiner Satz) oder eines Aufschubs gegen einen Zuschlag (5,2 % nach 1 Jahr bis 31,5 % nach 5 Jahren). Die Pensionskasse und die Säule 3a zahlen ab 5 Jahren vor dem Referenzalter; die Säule 3a kann früher bezogen werden, um Wohneigentum zu kaufen, sich selbstständig zu machen oder die Schweiz endgültig zu verlassen.","1h99fxl29iv":"<b>Stellenwechsel:<\/b> Ihr Pensionskassenkapital folgt Ihnen: Die alte Kasse überträgt es der neuen oder einem Freizügigkeitskonto, wenn Sie keine Stelle haben. Verlangen Sie von jedem Arbeitgeber den Vorsorgeausweis und prüfen Sie die projizierte Rente.","gaogv0015j":"<b>Wegzug aus der Schweiz, zum Beispiel in ein anderes EU/EFTA-Land:<\/b> Die AHV-Rente wird weiterhin im Ausland ausbezahlt. Das obligatorische Pensionskassenkapital kann nicht bar ausbezahlt werden, wenn Sie in einem EU/EFTA-Land obligatorisch versichert bleiben: Es bleibt auf einem Schweizer Freizügigkeitskonto, verfügbar 5 Jahre vor dem Referenzalter. Der überobligatorische Teil kann ausbezahlt werden. Die Säule 3a kann beim endgültigen Wegzug bezogen werden.","1q42fvkgj99":"<b>Wenige Jahre in der Schweiz:<\/b> Die AHV-Rente ist proportional zu Ihren Schweizer Beitragsjahren: 22 von 44 Jahren ergeben etwa die Hälfte. Eine volle Rente braucht 44 Jahre, ab dem Alter von 21 gezählt. Jedes Land zahlt eine Rente für seine eigenen Zeiten.","1vseogjm2jn":"<b>Paare:<\/b> Die zwei AHV-Renten eines Ehepaars sind zusammen auf 150 % des Maximums plafoniert (CHF 3’780 pro Monat); zwei Unverheiratete können je bis zu CHF 2’520 erhalten.","125888msm1g":"<b>Steuern:<\/b> Renten werden als Einkommen deklariert; Beiträge in die Säule 3a sind abzugsfähig; Kapitalbezüge werden getrennt besteuert, und die Verteilung der Bezüge aus 3a und Pensionskasse auf mehrere Jahre senkt die Steuer meist. Mit dem Pensionierungsrechner unter Werkzeuge können Sie die Zahlen ausprobieren.","75k0w65299":"<b>Rendite und Risiko:<\/b> Nur die Säulen 2 und 3 werden angelegt. In Säule 2 legt die Kasse kollektiv an und schreibt Ihrem Konto Zinsen gut; in Säule 3a wählen Sie zwischen einem Sparkonto (tiefer Zins, kein Risiko) und Wertschriftenlösungen (Fonds oder ETFs, mehr Risiko und langfristig meist mehr Rendite). Gebühren schmälern die Rendite. Ab 2026 können seit 2025 nicht geleistete 3a-Beiträge unter bestimmten Bedingungen nachgeholt werden.","b6kwnuyjkr":"24. Zeugnis und Konkurrenzverbot","1lq0o8izvpi":"Arbeitszeugnis (Art. 330a): Die Arbeitnehmerin oder der Arbeitnehmer kann es jederzeit verlangen, auch während des Arbeitsverhältnisses. Das Vollzeugnis umfasst Funktion, Dauer, Leistung und Verhalten; eine einfache Bestätigung nur Funktion und Dauer. Es muss wahr und wohlwollend sein.","1elqek5ekh":"Konkurrenzverbot (Art. 340): Schriftform ist erforderlich. Gültig nur, wenn die Arbeitnehmerin oder der Arbeitnehmer Einblick in den Kundenkreis oder in Geschäftsgeheimnisse hatte und eine Verwendung erheblichen Schaden verursachen würde. Begrenzt nach Ort, Zeit (normalerweise bis zu 3 Jahre) und Gegenstand; ein Gericht kann übermässige Verbote herabsetzen.","1lzw4evm51c":"Eine Konventionalstrafe bei Verletzung ist möglich, aber der Arbeitgeber kann die Einhaltung des Verbots nur verlangen, wenn der Vertrag es ausdrücklich vorsieht.","1ilws2n02at":"<b>Wann ein Konkurrenzverbot endet (Art. 340c):<\/b> Es fällt dahin, wenn der Arbeitgeber kein tatsächliches Interesse mehr hat, wenn der Arbeitgeber kündigt, ohne dass die Arbeitnehmerin oder der Arbeitnehmer dazu begründeten Anlass gegeben hat, oder wenn die Arbeitnehmerin oder der Arbeitnehmer aus einem begründeten, dem Arbeitgeber zuzurechnenden Anlass kündigt.","1opn01p0s4j":"<b>Ein Zeugnis lesen:<\/b> Schweizer Zeugnisse haben keinen offiziellen Notencode. Eine in der deutschsprachigen Praxis verbreitete Skala ist: «stets zu unserer vollsten Zufriedenheit» = sehr gut, «stets zu unserer vollen Zufriedenheit» = gut, «zu unserer vollen Zufriedenheit» = befriedigend und «zu unserer Zufriedenheit» = genügend. Die Arbeitnehmerin oder der Arbeitnehmer kann Berichtigungen verlangen und bei Ablehnung klagen.","1b32pcsr1bj":"<b>Verschwiegenheit nach dem Austritt:<\/b> Die Geheimhaltungspflicht dauert fort, solange der Arbeitgeber ein berechtigtes Interesse hat (Art. 321a Abs. 4). Die Arbeitnehmerin oder der Arbeitnehmer muss bei Ende des Arbeitsverhältnisses auch Firmeneigentum und Unterlagen zurückgeben.","10rr5ed4zdf":"<b>Zwischenzeugnis:<\/b> Eine Arbeitnehmerin oder ein Arbeitnehmer mit begründetem Anlass, etwa einer neuen Vorgesetzten, einer Umstrukturierung oder einer geplanten Veränderung, kann während des Arbeitsverhältnisses ein Zwischenzeugnis verlangen.","2e107zqt4bk":"<b>Konventionalstrafe beim Konkurrenzverbot:<\/b> Eine Konventionalstrafe kann vereinbart werden; sofern der Vertrag nichts anderes sagt, befreit ihre Zahlung die Arbeitnehmerin oder den Arbeitnehmer vom Verbot, und ein Gericht kann eine übermässige Strafe herabsetzen (Art. 340b).","1kn2tvufpm5":"<b>HR-Praxis:<\/b> Führen Sie für jede Leistungsstufe einen Standardtext, lassen Sie jedes Zeugnis von einer zweiten Person prüfen und senden Sie den Entwurf vor dem Austrittsdatum an die Arbeitnehmerin oder den Arbeitnehmer.","1agw0bmeezq":"3. EU/EFTA-Staatsangehörige in der Schweiz","1qsjstd8ltr":"EU/EFTA-Bürgerinnen und -Bürger reisen im Rahmen des Freizügigkeitsabkommens ein. Häufige Bewilligungen: L (Kurzaufenthalt, unter 1 Jahr), B (Aufenthalt, meist 5 Jahre) und G (Grenzgänger).","6vuyck673y":"Die Sozialversicherung ist mit der EU koordiniert (Verordnung 883/2004): Versicherungszeiten können für die Arbeitslosigkeit zusammengerechnet werden, und entsandte Arbeitnehmende können mit einer A1-Bescheinigung die Deckung ihres Heimatlandes behalten.","1o512bi421c":"Quellensteuer: Angestellte ohne Bewilligung C werden kantonal an der Quelle besteuert; der Arbeitgeber zieht sie vom Lohn ab.","1tcctixb6wc":"<b>Kurzeinsätze und Anmeldung:<\/b> Bis zu 90 Arbeitstage pro Kalenderjahr ist keine Bewilligung nötig: Der Schweizer Arbeitgeber meldet die Anstellung im Online-Meldeverfahren. Bei längerer Anstellung melden Sie sich innert 14 Tagen nach der Ankunft und vor Arbeitsbeginn bei Ihrer Gemeinde an und beantragen die Bewilligung.","budi4nhmio":"<b>Die Krankenversicherung gehört nicht zur Lohnabrechnung:<\/b> Die obligatorische Krankenversicherung (KVG) ist innert 3 Monaten nach der Ankunft abzuschliessen, rückwirkend auf die Ankunft, und Sie wählen und bezahlen den Versicherer selbst (Prämie, Franchise, Selbstbehalt). Der Arbeitgeber zieht sie nicht ab.","kz3emqvyf5":"<b>Arbeitslosenentschädigung:<\/b> In der Regel brauchen Sie 12 Beitragsmonate in den letzten 2 Jahren. Nach der EU-Koordination können in einem anderen EU/EFTA-Land versicherte Monate zu den Schweizer Monaten hinzugerechnet werden.","avesyseqf6":"<b>Steuern:<\/b> Angestellte ohne Bewilligung C zahlen Quellensteuer. Wenn Sie in der Schweiz wohnen und Ihr Bruttoerwerbseinkommen CHF 120’000 pro Jahr erreicht, folgt automatisch eine ordentliche Veranlagung. Eine Bewilligung C wird für EU-15-Staatsangehörige normalerweise nach 5 Jahren erteilt. Human Resources ist in der Schweiz kein reglementierter Beruf, daher ist für die Arbeit keine Diplomanerkennung nötig.","2dk4pyevfhd":"<b>Bewilligungen für EU/EFTA-Staatsangehörige:<\/b> Bewilligung L für Verträge bis 364 Tage; Bewilligung B für Verträge von mindestens einem Jahr oder unbefristete, 5 Jahre gültig und erneuerbar; Bewilligung G für Grenzgänger, die täglich oder mindestens wöchentlich heimkehren; Bewilligung C (Niederlassung) normalerweise nach 5 Jahren ununterbrochenem Aufenthalt für Staatsangehörige von EU-15-Staaten (10 Jahre für einige andere EU-Staaten).","u5yberpal9":"<b>Verlust des Aufenthaltsrechts:<\/b> Verlieren Sie in den ersten 12 Monaten des Aufenthalts unverschuldet Ihre Stelle, behalten Sie das Aufenthaltsrecht für 6 Monate oder bis zum Ende Ihres Arbeitslosengeldes, falls das länger ist, und ohne Zugang zur Sozialhilfe. Nach den ersten 12 Monaten behalten Sie es, solange Sie Arbeitslosengeld beziehen, und 6 Monate danach. Klären Sie das mit dem kantonalen Migrationsamt. Ein langer Auslandaufenthalt kann auch eine Bewilligung C beenden, ausser Sie beantragen deren Beibehaltung.","zu4rq95ngw":"<b>Familie:<\/b> Familienangehörige einer EU/EFTA-Staatsangehörigen oder eines EU/EFTA-Staatsangehörigen mit Schweizer Bewilligung können nachziehen, erhalten normalerweise eine Bewilligung B und dürfen arbeiten.","1gyroxqp9yc":"<b>Erste Schritte:<\/b> Vertrag unterzeichnen, sich innert 14 Tagen und vor Arbeitsbeginn bei der Gemeinde anmelden, die Bewilligung über den Arbeitgeber oder den Kanton beantragen, Ihre AHV-Nummer notieren, die Grundversicherung abschliessen und Ihre Familiendokumente bereithalten.","1h1tpr9tfb2":"<b>Wenn Sie aus einem anderen EU/EFTA-Land kommen:<\/b> Versicherungszeiten im Ausland und in der Schweiz können für das Arbeitslosengeld zusammengerechnet werden (Formular PD U1), und Rentenansprüche werden nach EU-Recht kumuliert; fragen Sie vor Ihrer Abreise die Arbeitsmarkt- und Rentenbehörden Ihres bisherigen Landes.","9etdrwxk23":"<b>Staatsangehörige anderer Länder:<\/b> Unter Umständen ist ein Visum nötig, und Bewilligungen unterliegen Kontingenten. Dieser Abschnitt behandelt EU/EFTA-Staatsangehörige; klären Sie Ihren Fall beim Staatssekretariat für Migration (SEM).","1vjxriblyzu":"28. Ihre HR-Laufbahn in der Schweiz","1jn3ipgfjm":"<b>Typische Schweizer HR-Laufbahn:<\/b> HR-Assistent/in (Zertifikat HRSE) oder Sachbearbeiter/in Personalwesen (kv edupool) → HR-Fachmann/-frau mit eidg. Fachausweis (Berufsprüfung) → Leiter/in Human Resources mit eidg. Diplom (Höhere Fachprüfung).","ba4svbtgrt":"<b>Die eidgenössische Prüfung zum HR-Fachmann/zur HR-Fachfrau:<\/b> Sie setzt meist ein eidgenössisches Fähigkeitszeugnis (EFZ) oder ein gleichwertiges Maturitätsniveau, die Stufe HR-Assistent/in und mehrere Jahre HR-Erfahrung voraus (Anbieter nennen mindestens zwei Jahre in den letzten fünf). Verbände sind unter anderem HR Swiss und der Kaufmännische Verband. Der Bund erstattet nach der Prüfung bis zu 50 % der Kurskosten zurück; ein Anbieter nennt als Maximum CHF 9’500 für einen Fachausweis.","22rs75e4b34":"<b>Spezialisierungen:<\/b> Recruiting, Lohnbuchhaltung, HR-Administration und Personalentwicklung sowie Rollen, die Führungskräfte in arbeitsrechtlichen Fragen beraten.","gb6i3dp466":"<b>Ihr Ausgangspunkt aus dem Ausland:<\/b> HR ist in der Schweiz kein reglementierter Beruf, Sie können daher ohne formelle Anerkennung arbeiten, aber Arbeitgeber werden Ihren ausländischen Abschluss und Ihre Erfahrung mit Schweizer Titeln vergleichen. Das Schweizer Wissen, das Sie zuerst brauchen, ist das, was diese Website behandelt: Arbeitsrecht (OR, ArG), Sozialversicherungen, Lohnbuchhaltung und Bewilligungen.","1pv9zfsqjdu":"<b>Sprache:<\/b> Die meiste HR-Arbeit in der Schweiz erfolgt in der Landessprache (Deutsch, Französisch oder Italienisch), weil Verträge, Lohnabrechnungen und Behörden sie verwenden; gute Kenntnisse in mindestens einer Landessprache sind daher entscheidend.","24lcr5c2i6a":"<b>Lebenslauf und Bewerbung (übliche Praxis):<\/b> ein strukturierter Lebenslauf mit Daten, Kopien von Arbeitszeugnissen und Diplomen sowie ein Motivationsschreiben; ein Foto ist üblich, aber optional. Schweizer Arbeitgeber legen grossen Wert auf Zeugnisse, bitten Sie daher frühere Arbeitgeber im Ausland um ein ausführliches Arbeitszeugnis und lassen Sie es übersetzen.","1paqgfcncd1":"<b>Stellensuche (übliche Praxis):<\/b> jobs.ch, LinkedIn, Karriereseiten von Unternehmen, kantonale Arbeitsämter und Personalvermittler, die durch das Arbeitsvermittlungsgesetz (AVG) geregelt sind.","1dh7nw6g266":"<b>Die ersten 90 Tage:<\/b> Bewilligung und Anmeldung; AHV-Nummer; Krankenversicherung; Bankkonto; Übertrag der Pensionskasse; den Lohnzyklus kennenlernen (Abschnitt 7); Ihr Fachglossar aufbauen; den Lohnabrechnungs-Simulator mit echten Fällen ausprobieren.","1l0d0lwohhi":"<b>Lernplan mit dieser Website:<\/b> 1) Abschnitte 1–16 (Recht, Lohn und Lohnbuchhaltung); 2) Abschnitte 17–26 (Absenzen, Kündigung, Zeugnisse, Versicherungen); und, wenn Sie einen Umzug planen, die Abschnitte 2, 3 und 27; 3) Vorlagen und Rechner; 4) das Glossar; 5) einen ganzen Lohnzyklus bei der Arbeit begleiten.","1du4qopy9xw":"2. Ankunft in der Schweiz: die ersten 90 Tage und die Anerkennung von Diplomen","10di8ve8k6w":"<b>Vor der Reise:<\/b> EU/EFTA-Bürgerinnen und -Bürger brauchen kein Visum; Staatsangehörige anderer Länder brauchen in der Regel ein Visum und eine Bewilligung (klären Sie dies beim Staatssekretariat für Migration, SEM). Sobald Sie einen Vertrag haben, wird die Bewilligung über Ihre Gemeinde und Ihren Kanton bearbeitet: Bewilligung L für einen Vertrag von mehr als 3 Monaten und weniger als 1 Jahr, Bewilligung B (meist 5 Jahre gültig) für 12 Monate oder mehr oder einen unbefristeten Vertrag.","2f6ilp7s4th":"<b>Drei Monate ohne Bewilligung:<\/b> Sie dürfen bis zu 3 Monate bleiben, um eine Stelle zu suchen. Für eine Stelle von 3 Monaten oder weniger brauchen Sie keine Bewilligung, sie muss aber spätestens am Tag vor Arbeitsbeginn online gemeldet werden. Für eine Stelle von mehr als 3 Monaten muss die Bewilligung vor Arbeitsbeginn beantragt werden.","np7lkwob5j":"<b>Bei der Gemeinde anmelden (Einwohnerkontrolle):<\/b> Die übliche Frist beträgt 14 Tage nach der Ankunft, und einige Gemeinden verlangen weniger. Bringen Sie einen gültigen Pass oder eine Identitätskarte, Ihren Vertrag und einen Wohnsitznachweis mit; die genaue Liste finden Sie auf der Website Ihrer Gemeinde.","pz3g5ecjbj":"<b>Wenn Sie ohne Vertrag einreisen:<\/b> Nach den ersten 3 Monaten können Sie eine Bewilligung zur Stellensuche beantragen, normalerweise für 3 Monate und verlängerbar (je nach Kanton meist bis zu insgesamt 6 Monate), wenn Sie echte Bemühungen bei der Stellensuche und eigene Mittel nachweisen. Stellensuchende haben keinen Anspruch auf Sozialhilfe, und Sie können ohne in der Schweiz bezahlte Beiträge kein Schweizer Arbeitslosengeld beziehen.","1gf5omomf6l":"<b>Krankenversicherung (Krankenkasse):<\/b> obligatorisch für alle, die in der Schweiz leben, für jedes Familienmitglied einzeln. Sie haben ab der Ankunft 3 Monate Zeit, die Grundversicherung abzuschliessen, die rückwirkend auf Ihr Ankunftsdatum gilt: Die Prämien sind ab diesem Tag geschuldet. Auch bei einem Vertrag von unter 3 Monaten müssen Sie sich in der Schweiz versichern, ausser Sie haben eine gleichwertige ausländische Deckung.","1712y3cdy0u":"<b>Unfall- und Pensionskassenversicherung:<\/b> Ihr Arbeitgeber meldet Sie bei der Unfallversicherung (UVG) und, über der Eintrittsschwelle, bei der Pensionskasse an. Sie müssen nichts tun, prüfen Sie aber beide Zeilen auf Ihrer ersten Lohnabrechnung (siehe Abschnitt Sozialversicherungen).","2u982j29og":"<b>Erste Lohnabrechnung und Steuern:<\/b> Mit einer Bewilligung B oder L wird die Einkommenssteuer von Ihrem Lohn abgezogen (Quellensteuer). Vergleichen Sie Ihre Lohnabrechnung mit dem Nettolohnrechner und dem Lohnabrechnungs-Simulator unter Werkzeuge.","25ubldfed4b":"<b>Vertrag schriftlich:<\/b> Ein mündlicher Vertrag ist in der Schweiz gültig, bitten Sie aber um die wichtigsten Bedingungen schriftlich: Innert eines Monats muss Ihr Arbeitgeber Ihnen schriftlich Auskunft über die Parteien, den Beginn, die Funktion, den Lohn und die Arbeitszeit geben (Art. 330b OR).","1slupc2n4z5":"<b>Wohnung und Bank:<\/b> Vermieter verlangen meist einen Betreibungsregisterauszug Ihrer Gemeinde und Ihre Lohnabrechnungen; die Mietkaution darf gesetzlich 3 Monatsmieten nicht übersteigen und wird auf einem Sperrkonto gehalten.","22zoxqdimzf":"<b>Anerkennung von Diplomen:<\/b> Die Anerkennung ist nur für reglementierte Berufe obligatorisch, zum Beispiel Gesundheitsberufe, Lehrpersonen und einige technische oder juristische: Ohne sie dürfen Sie nicht praktizieren. Für nicht reglementierte Berufe, die grosse Mehrheit der Stellen, ist keine Anerkennung nötig, und der Arbeitgeber beurteilt Ihr Diplom. Auch zum Studieren in der Schweiz brauchen Sie keine Anerkennung.","92bluib3y5":"<b>Wer was anerkennt:<\/b> Es gibt keine einzelne Behörde; es hängt vom Beruf ab. Das Bundesportal anerkennung.swiss (SBFI) sagt Ihnen, ob Ihr Beruf reglementiert ist und wen Sie fragen müssen; das Schweizerische Rote Kreuz behandelt nichtuniversitäre Gesundheitsberufe, und swissuniversities (Swiss ENIC) beurteilt ausländische Hochschuldiplome.","1n2bza571q3":"<b>Optionale Niveaubestätigung:<\/b> Für nicht reglementierte Berufe kann das SBFI eine Niveaubestätigung (CHF 350) ausstellen, die Arbeitgebern das Niveau Ihres ausländischen Diploms zeigt, nicht aber die Gleichwertigkeit mit einem bestimmten Schweizer Abschluss. Das Anerkennungsverfahren für reglementierte Berufe kostet CHF 550. Die Dauer hängt vom Fall ab.","f0eo1x2hqo":"<b>Stellensuche:<\/b> Beginnen Sie mit den grossen Jobportalen wie jobs.ch (Deutschschweiz) und jobup.ch (Westschweiz) sowie Temporärbüros, und verlangen Sie den Vertrag schriftlich, bevor Sie reisen. Seien Sie vorsichtig bei jedem, der Geld für eine garantierte Stelle verlangt.","1zr5hxlri8s":"27. Rückkehr aus der Schweiz in Ihr Heimatland","1w20iemji30":"<b>Die Reihenfolge ist wichtig:<\/b> Einige Schritte können nur erledigt werden, solange Sie noch in der Schweiz sind. Vor der Abreise: dem Arbeitgeber kündigen, eine Freizügigkeitsstiftung für Ihr Pensionskassenguthaben wählen, das Formular U1 anfordern, über die Säule 3a entscheiden und sich bei der Gemeinde abmelden. Dieser Abschnitt richtet sich an Personen, die in ein EU/EFTA-Land ziehen; für andere Länder hängen die Regeln vom Sozialversicherungsabkommen zwischen der Schweiz und Ihrem Land ab.","n4zvxbfvdp":"<b>Abmelden (Abmeldung):<\/b> persönlich bei Ihrer Gemeinde, meist zwischen 8 Wochen und 14 Tagen vor der Abreise (je nach Gemeinde verschieden). Bringen Sie Identitätskarte oder Pass, Ihre genaue Adresse im Ausland und eine Schweizer Kontaktadresse für Steuerangelegenheiten mit. Die Abmeldung beendet Ihre Aufenthaltsbewilligung; bewahren Sie die Bestätigung auf, Sie brauchen sie für die Säule 3a.","jidcf4zlix":"<b>Kranken- und Unfallversicherung:<\/b> Die obligatorische Schweizer Kranken- und Unfallversicherung endet, wenn Sie endgültig wegziehen, kündigen Sie daher die Police und allfällige Zusatzversicherungen. Melden Sie sich in Ihrem neuen Land bei den örtlichen Behörden und beim nationalen Gesundheitssystem an, um Deckung zu erhalten; die Schritte unterscheiden sich je nach Land.","24qp6vl476x":"<b>Arbeitslosigkeit, Sie verlieren Ihre Stelle in der Schweiz:<\/b> Wenn Sie mindestens 4 Wochen beim RAV gemeldet sind, können Sie beantragen, Ihre Schweizer Leistung für die Stellensuche in einem EU/EFTA-Land bis zu 3 Monate zu exportieren. Beantragen Sie dies vor der Abreise: Das RAV gibt Ihnen das Formular PD U2, das Sie beim Arbeitsamt Ihres neuen Landes abgeben, wo Sie sich innert der Frist (normalerweise 7 Tage) als Stellensuchende oder Stellensuchender anmelden. Es verlängert Ihren Gesamtanspruch nicht.","21nvq5xreo4":"<b>Arbeitslosigkeit, Sie kehren ohne Schweizer Leistung zurück:<\/b> Nach der EU-Koordination kann Ihr neues Land Ihre Schweizer Beiträge mit den eigenen zusammenrechnen, verlangt aber oft, dass Sie zuletzt dort gearbeitet haben, nach der Rückkehr, und nach seinen Regeln arbeitslos werden. Verlangen Sie bei der Schweizer Arbeitslosenkasse vor der Abreise das Formular U1 (nicht obligatorisch, beschleunigt aber das Verfahren). Die ausländische Leistung wird um die Tage gekürzt, die Sie bereits in einem anderen EU-Land bezogen haben.","16rz0agi4dz":"<b>Wenn Sie vor dem Umzug in Ihrem Heimatland Beiträge geleistet haben:<\/b> Haben Sie diese Beiträge nicht verwendet und endet Ihre Stelle in der Schweiz, können Sie dort bei der Rückkehr unter Umständen direkt einen Anspruch geltend machen, sofern Sie in der Schweiz keine Leistung beziehen. Die minimale Beitragsdauer und wie weit sie zurückgerechnet wird, hängen vom nationalen Recht ab; prüfen Sie dies vor der Abreise.","1ulwc723wa4":"<b>AHV-Rente:<\/b> Sie wird im Ausland ausbezahlt, wenn Sie das Referenzalter erreichen, und nicht gekürzt, weil Sie im Ausland leben. Beiträge können bei einem Umzug in einen EU-Staat in der Regel nicht zurückerstattet werden. Ihr neues Land kann verlangen, dass Sie die Rente deklarieren und dort versteuern; prüfen Sie daher die örtlichen Regeln.","23qzl8k2fit":"<b>Pensionskasse (2. Säule):<\/b> Wenn Sie in einem EU/EFTA-Staat obligatorisch für das Alter versichert sein werden, kann der obligatorische Teil nicht bar ausbezahlt werden: Er bleibt auf einem Schweizer Freizügigkeitskonto, verfügbar ab 5 Jahren vor dem Referenzalter. Der überobligatorische Teil kann ausbezahlt werden. Geben Sie keine Anweisungen, geht das Geld an die Auffangeinrichtung. Kapital, das an eine im Ausland wohnhafte Person ausbezahlt wird, wird in der Schweiz an der Quelle besteuert; prüfen Sie daher zuerst die steuerliche Behandlung in beiden Ländern.","duwqwxlyfe":"<b>Säule 3a:<\/b> Sie können sie beim endgültigen Wegzug aus der Schweiz beziehen, egal wohin Sie gehen, mit Nachweis der Abmeldung und Ihrer ausländischen Adresse. Sie wird in der Schweiz an der Quelle besteuert, der Zeitpunkt ist also wichtig. Sie können sie auch dort lassen, wo sie ist, aber einige Anbieter führen keine 3a-Konten für im Ausland lebende Personen.","2dp67zul35c":"<b>Altersrente in Ihrem neuen Land:<\/b> Nach EU-Recht können Ihre Schweizer Jahre für die dort geforderte minimale Versicherungsdauer zählen; jedes Land zahlt dann seinen Anteil anteilig, und Sie können beide Renten erhalten. Von der Schweiz aus wird der Antrag über Ihre letzte Schweizer Ausgleichskasse gestellt.","3wjj2s7bt":"<b>Steuern:<\/b> Reichen Sie Ihre letzte Schweizer Steuererklärung ein und rechnen Sie die Quellensteuer ab. In Ihrem neuen Land werden Sie nach den örtlichen Regeln steuerpflichtig (oft bei mehr als 183 Tagen im Jahr oder wenn sich dort Ihr wirtschaftlicher Lebensmittelpunkt befindet) und in der Regel auf Ihr Welteinkommen besteuert. Es gilt ein Doppelbesteuerungsabkommen; ziehen Sie eine Steuerberatung in Betracht.","24t9lnb6lei":"<b>Mitnehmen:<\/b> Ihr Arbeitszeugnis (siehe Abschnitt Zeugnis), die letzten Lohnabrechnungen und den Lohnausweis, den AHV-Kontoauszug, den Pensionskassenausweis und die Freizügigkeitsangaben, die Bescheinigung der Krankenversicherung, die Abmeldebestätigung und die Arbeitslosenformulare. Mehr zu den Renten in Abschnitt 26.","8mbfwr4zdb":"Zusammenfassung","i9plll6ffs":"Ankunft in der Schweiz","ff7dzf5dez":"Einstellung und Arbeitsbeginn","267c9mbsvrx":"Arbeitszeit und Ferien","2535yu2o1ch":"Lohn und Lohnbuchhaltung","pmsuv7j4gt":"Absenzen und Familie","10jna7hrs4r":"Beendigung des Arbeitsverhältnisses","2dpsnrdi91y":"Sozialversicherungen","gikqrj874s":"Rückkehr in Ihr Heimatland","14c2jhchtjz":"Karriere","1n7aj92rqpz":"A · HR-Fachkraft aus dem Ausland","mphn9frscr":"Ihr Profil: HR-Fachkraft aus einem anderen EU-Land bewirbt sich als HR-Sachbearbeiterin","1sb8833qmab":"Die Kopfzeile nennt Geburtsdatum, Nationalität und Bewilligung: Das wird in der Schweiz erwartet und beantwortet die erste Frage des Arbeitgebers.","htvwxr7xgs":"Der ausländische Titel wird auf Deutsch angegeben, mit dem Original in Klammern und dem Niveau (Bachelor).","1ctfj5itxdi":"Monate und Jahre, das Neueste zuerst, mit Aufgaben und einem messbaren Projekt.","23ehanginqy":"Sprachniveaus nach GER mit Zertifikat und Jahr; das Deutschniveau ist sofort sichtbar.","1mykspca0t2":"Eine kurze Schweizer Weiterbildung in Lohnbuchhaltung und Recht zeigt, dass Sie sich auf den lokalen Markt vorbereiten.","1knvlmkgz8w":"Legen Sie Ihre ausländischen Arbeitszeugnisse mit Übersetzung bei, wie es das Dossier verlangt.","t1kaltr4v8":"B · Junior HR-Assistent","1czba9v3i7t":"Einseitiger Lebenslauf für einen Junior HR-Assistenten (Schweizer Lehrweg)","7k8cd20r1z":"Eine Seite genügt am Anfang der Laufbahn.","10nv4hl8r2s":"Kurze, sachliche Punkte; die Lehre zählt als Berufserfahrung.","11to7mdt4os":"Nennen Sie den nächsten Schritt (HR-Zertifikat): Arbeitgeber schätzen einen klaren Plan.","2aiyxgg2qzd":"Schweizer Detail: der Heimatort neben der Nationalität bei Schweizer Bürgerinnen und Bürgern.","1ia2e8ftexl":"C · Senior-Lohnbuchhalterin","oeizaioko9":"Zweiseitiger Lebenslauf für eine erfahrene Lohnbuchhalterin mit eidgenössischem HR-Fachausweis","atufay30op":"Zwei Seiten sind das Schweizer Maximum für die meisten Laufbahnen: Die erste Seite enthält die jüngsten und relevantesten Stellen.","1c4bjrups5n":"Quantifizierte Ergebnisse (Mitarbeitende, Einsparungen) überzeugen mehr als Aufgabenlisten.","2ekgvct41xt":"Der eidgenössische Titel wird ausgeschrieben, damit ausländische Leserinnen und Leser sowie Software ihn erkennen.","20j1zyms4aj":"Familienangaben sind optional; hier werden sie auf Schweizer Art angegeben (Zivilstand, Kinder mit Geburtsjahr).","fj1mdj2049":"D · Motivationsschreiben","axjooy9jg6":"Motivationsschreiben, deutsches Muster","icm3htlzcs":"Höchstens eine Seite, mit namentlicher Ansprechperson sowie genauer Stellenbezeichnung und Pensum.","xml1d7ivzn":"Drei kurze Absätze: warum dieses Unternehmen und diese Stelle, was Sie mitbringen und Ihre Verfügbarkeit.","ggrzofz5et":"Wiederholen Sie nicht den Lebenslauf: Verbinden Sie zwei oder drei Fakten mit der Stelle und erwähnen Sie Ihre Bewilligung und Ihr Sprachniveau.","111f1009h1e":"Schweizer Schreibweise: «Freundliche Grüsse» und kein ß («grossen», «Grüsse»).","1ib6t7eefi9":"Führen Sie am Schluss die Beilagen auf.","1ui1mmoa2u3":"<b>Ein Dossier, nicht nur ein Lebenslauf:<\/b> Eine Schweizer Bewerbung enthält normalerweise ein Motivationsschreiben, den Lebenslauf, Kopien aller Arbeitszeugnisse, Diplome und Zertifikate und manchmal eine Referenzliste. Senden Sie es als ein einziges PDF, sofern der Arbeitgeber nichts anderes verlangt.","19c4qpxyct7":"<b>Länge:<\/b> 1 bis 2 Seiten; bis zu 3 nur bei sehr langen Laufbahnen oder akademischen Profilen. Berufseinsteiger: 1 Seite.","1ts6d8jky46":"<b>Reihenfolge:<\/b> umgekehrt chronologisch, mit Monaten und Jahren, das Neueste zuerst, und kurzen Punkten mit Aufgaben und Ergebnissen.","nb1hp4xrum":"<b>Persönliche Angaben:<\/b> Name, Adresse, eine Telefonnummer, eine professionelle E-Mail-Adresse, Geburtsdatum (in der Schweiz erwartet), Nationalität und, bei Ausländerinnen und Ausländern, Art und Gültigkeit der Bewilligung. Zivilstand und Kinder sind optional, aber trotzdem üblich. Nichts davon ist gesetzlich vorgeschrieben.","rxbjelnb0m":"<b>Foto:<\/b> gesetzlich nicht vorgeschrieben, aber von den meisten Schweizer Arbeitgebern erwartet: siehe den Fotoabschnitt oben.","19bc3hyqsu6":"<b>Sprachen:<\/b> Geben Sie das Niveau nach dem GER (A1–C2) an, plus Zertifikat und Jahr, falls vorhanden. Ihr Deutschniveau ist sehr wichtig.","30lqxy95jt":"<b>Schweizer Formate:<\/b> Daten als TT.MM.JJJJ, A4, CHF für Geldbeträge, Deutsch (oder die Sprache des Inserats; Englisch nur, wenn das Inserat englisch ist).","1gpoe4s03aq":"<b>Arbeitszeugnisse:<\/b> Sie haben in der Schweiz grosses Gewicht. Bitten Sie jeden früheren Arbeitgeber um ein ausführliches Zeugnis mit Ihren Aufgaben und Leistungen und fügen Sie eine Übersetzung bei. Eine blosse Bescheinigung mit nur Daten und Funktion ist schwächer.","ksu0wtxcou":"<b>Ausländische Qualifikationen:<\/b> Geben Sie den Originaltitel, eine deutsche oder englische Übersetzung und das Niveau (Bachelor, Master) an. HR ist kein reglementierter Beruf, daher ist für die Bewerbung keine formelle Anerkennung nötig.","1xadqt8uaz":"<b>Anpassen:<\/b> Verwenden Sie die Schlüsselwörter des Inserats; viele grosse Arbeitgeber filtern Bewerbungen mit Software.","2c30tsxekx3":"<b>Referenzen:<\/b> Schreiben Sie «Referenzen auf Anfrage» oder nennen Sie zwei Referenzpersonen nur, wenn sie zugestimmt haben.","29uvw3z0j9e":"<b>Vermeiden:<\/b> lange Europass-Vorlagen, unerklärte Lücken, unerklärte Abkürzungen und ausländische Stellenbezeichnungen ohne Übersetzung, eine privat wirkende E-Mail-Adresse und sehr lange Hobbylisten.","1wssm18poni":"<b>Braucht man eines?<\/b> Nicht gesetzlich, aber ein Foto ist in der Schweiz sehr verbreitet, und viele Arbeitgeber erwarten es. Bewerben Sie sich auf Englisch bei einem internationalen Unternehmen, können Sie es weglassen.","upfkyj355h":"<b>Wer es macht:<\/b> eine professionelle Fotografin oder ein professioneller Fotograf, kein Selfie, kein Passfotoautomat, kein Urlaubsbild und kein zugeschnittenes Gruppenfoto.","12y6lhcjn2a":"<b>Bildausschnitt:<\/b> Hochformat, Kopf und Schultern, Blick in die Kamera.","1wl4tm57rgk":"<b>Hintergrund und Kleidung:<\/b> schlichter neutraler Hintergrund und Kleidung, die zur Branche passt (für HR Smart Casual bis Business).","sz5g7looxf":"<b>Ausdruck und Qualität:<\/b> natürlicher, freundlicher Blick; scharf, gut beleuchtet und aktuell, damit Sie so aussehen wie heute.","1e8mhr6ynf9":"<b>Position und Datei:<\/b> oben links oder oben rechts im Lebenslauf, etwa in der Grösse eines Passfotos; halten Sie das PDF klein, damit es die E-Mail-Filter passiert.","eh2q9c2rcj":"<b>Einheitlichkeit:<\/b> Verwenden Sie dasselbe Foto in Ihrem Lebenslauf und in Ihrem LinkedIn-Profil.","1jmogmn1bii":"Selfies, Passfotoautomaten oder Passfotos.","2anepxokmea":"Urlaubs-, Party- oder zugeschnittene Gruppenfotos sowie Ganzkörperaufnahmen.","20xniox4wq5":"Unruhige Hintergründe wie ein Sofa, eine Küche oder die Strasse.","d5woh1mokx":"Sonnenbrillen, Hüte, starke Filter oder starke Retusche.","1ulllgsah9k":"Ein gezwungenes Lächeln, ein strenger Blick oder eine Pose, die nicht zu Ihnen passt.","1isr0fbcv9d":"Ein altes Foto, das Ihnen nicht mehr ähnlich sieht.","fbgudtf54g":"Ein Bild von schlechter Qualität oder verpixelt oder eines, das auf die Box gestreckt wurde.","1kfz3u65ys6":"<b>Von einer professionellen Fotografin oder einem professionellen Fotografen aufgenommen<\/b> (Studiositzung), nicht von einer Freundin oder einem Freund oder mit dem Handy.","txzinxsert":"<b>Hochformat, Kopf und Schultern<\/b> (Brustbild): nicht nur das Gesicht und nicht Ganzkörper. Typischerweise etwa 2:3, rund 4,5 × 6 cm im Lebenslauf.","14wf0k6k0ph":"<b>Schlichter, heller, neutraler Hintergrund<\/b> (weiss, hellgrau oder beige) mit gleichmässigem, natürlich wirkendem Licht.","1eg8hht9ieq":"<b>Schauen Sie direkt in die Kamera<\/b> mit einem natürlichen, freundlichen Lächeln; ein leichtes Lächeln genügt.","239wrbf0ygd":"<b>Kleidung, die zur Stelle und Branche passt:<\/b> für HR Smart Casual bis Business, einfarbig, gepflegte Frisur.","2ek943ozrjv":"<b>Aktuell:<\/b> nicht älter als etwa ein bis zwei Jahre, und Sie sollten so aussehen, wie Sie beim Vorstellungsgespräch aussehen werden.","5wrty5kwws":"<b>Scharf und hochauflösend,<\/b> ohne Filter oder starke Retusche.","h3vrgc36mb":"<b>Oben rechts (oder links) im Lebenslauf platziert;<\/b> verwenden Sie dasselbe Foto in Ihrem LinkedIn-Profil.","28alx5cw8wn":"Arbeitsvertrag (deutsches Muster)","5nmfoev8w3":"Die Schriftform ist gesetzlich nicht vorgeschrieben (Art. 320 OR), aber ein schriftlicher Vertrag ist der beste Beweis, und die wesentlichen Bedingungen müssen innert eines Monats schriftlich bestätigt werden, wenn es keinen gibt (Art. 330b).","20rvmxzplzm":"Prüfen Sie die Mindeststandards: Probezeit bis 3 Monate, mindestens 4 Wochen Ferien, Kündigungsfrist von mindestens 1 Monat (kürzer nur durch Gesamtarbeitsvertrag im ersten Dienstjahr) und die Arbeitszeitgrenzen des ArG.","14gpo05ukmb":"Lohnfortzahlung bei Krankheit: Schreiben Sie, ob die gesetzliche Skala gilt (und welche: Bern, Zürich oder Basel) oder eine Krankentaggeldversicherung von mindestens gleichwertigem Wert (Art. 324a Abs. 4), und wie die Prämie aufgeteilt wird.","af9nuryk9u":"Den 13. Monatslohn gibt es nur, wenn er schriftlich vereinbart ist. Nennen Sie, wann er ausbezahlt wird und dass er bei Ein- oder Austritt anteilig ist.","1kl5jeiq808":"Überstunden: Nennen Sie, ob sie durch gleich viel Freizeit (mit Einverständnis) ausgeglichen oder mit 25 % Zuschlag bezahlt werden; ein schriftlicher Verzicht auf den Zuschlag ist möglich (Art. 321c Abs. 3).","4xcrhlrm9k":"Konkurrenzverbote (Art. 340) brauchen Schriftform, eine Begründung und Grenzen nach Ort, Zeit und Gegenstand. Lassen Sie die Klausel weg, wenn sie nicht nötig ist.","y48knqg6u2":"Dies ist ein Muster, keine Rechtsberatung. Passen Sie es an einen allfälligen Gesamtarbeitsvertrag (GAV) an und lassen Sie es prüfen, besonders die Klauseln zum Gerichtsstand und zum Konkurrenzverbot.","18qfahpz98h":"Kündigungsschreiben (deutsche Muster)","1giyg9b1q97":"Es ist keine gesetzliche Form vorgeschrieben, verwenden Sie aber eine, die den Empfang beweist: einen eingeschriebenen Brief und/oder persönliche Übergabe gegen unterschriebene Empfangsbestätigung. Eine Kündigung wird wirksam, wenn die andere Partei sie erhält, senden Sie sie daher früh; bei einem eingeschriebenen Brief planen Sie die 7-tägige Abholfrist ein.","t53xky22l":"Sie brauchen keinen Grund zur Kündigung, aber wenn die andere Partei es verlangt, müssen Sie die Gründe schriftlich mitteilen (Art. 335 Abs. 2), auch in der Probezeit oder bei fristloser Kündigung. Die Gründe müssen wahr sein, und «wir haben es mündlich erklärt» genügt nicht.","sjyrp3derl":"Prüfen Sie vor dem Versand: Vertragsart, Dienstjahr (Kündigungsfrist von 1, 2 oder 3 Monaten), Enddatum (Monatsende) und eine allfällige Sperrfrist. Eine während einer Sperrfrist ausgesprochene Kündigung ist nichtig und muss wiederholt werden.","29y894sztg":"Freistellung: Nennen Sie, ob die Arbeitnehmerin oder der Arbeitnehmer von der Arbeit freigestellt wird. Das Ferienguthaben gilt meist als abgegolten; Überstunden nur, wenn die Person einverstanden ist oder der Vertrag Zeitausgleich vorsieht. Das gesetzliche Enddatum ändert sich nicht.","2655nhivjee":"Kündigen Sie die nächsten Schritte an: Schlussabrechnung, Arbeitszeugnis, Versicherungsinformationen (Pensionskasse, Unfall- und Krankentaggeldversicherung) und Rückgabe des Firmeneigentums.","1ds65g26b6w":"Die Kündigung durch die Arbeitnehmerin oder den Arbeitnehmer kann kurz sein: Enddatum gemäss Kündigungsfrist und die Bitte um Bestätigung und Zeugnis. Eine Kündigung ist jederzeit erlaubt, auch während einer Sperrfrist.","j9v92eum0r":"Arbeitszeugnis (deutsches Muster)","a1xaom11k9":"Die Arbeitnehmerin oder der Arbeitnehmer kann jederzeit ein Zeugnis verlangen, auch während des Arbeitsverhältnisses (Art. 330a). Das Vollzeugnis umfasst Art und Dauer der Tätigkeit sowie die Qualität von Leistung und Verhalten; eine einfache Bestätigung nur Art und Dauer, und nur auf Verlangen der Person.","4uzkz93ibs":"Aufbau: Personalien, Ein- und Austrittsdatum, Funktion und Aufgaben, Leistung, Verhalten (gegenüber Vorgesetzten, Kolleginnen und Kollegen sowie Kundschaft, in dieser Reihenfolge), optional der Austrittsgrund, ein Schluss mit Dank, Bedauern und guten Wünschen, dann Ort, Datum und Unterschrift.","1pah2d23fk9":"Es muss wahr, vollständig und wohlwollend sein. Schweizer Empfehlungen halten versteckte Codes weder für sinnvoll noch für erlaubt, doch Standardformeln werden weitgehend als Noten gelesen, wählen Sie die Formulierung daher passend zur tatsächlichen Leistung.","yiblfs2p1f":"In der deutschsprachigen Praxis verbreitete Skala: «stets zu unserer vollsten Zufriedenheit» = sehr gut; «stets zu unserer vollen Zufriedenheit» = gut; «zu unserer vollen Zufriedenheit» = befriedigend; «zu unserer Zufriedenheit» = genügend; «im Grossen und Ganzen zu unserer Zufriedenheit» = mangelhaft. Das obige Muster ist ein «gutes» Beispiel.","ns9xu5qr5p":"Das Austrittsdatum ist das rechtliche Ende des Arbeitsverhältnisses, auch wenn die Person von der Arbeit freigestellt war. Wird ein Austrittsgrund genannt, muss er wahr sein.","153ht24f4dw":"Die Arbeitnehmerin oder der Arbeitnehmer kann schriftlich Berichtigungen verlangen und bei Ablehnung das Gericht anrufen.","2ckqhqkvunx":"Schweizer Lebenslauf-Vorlage (Deutsch)","1fktgjkd2m":"Fotofeld, Schweizer Personalien, Berufserfahrung, Ausbildung, Sprachen. Höchstens zwei Seiten.","1r5gio2nw29":"Lebenslauf-Vorlage auf Englisch (Schweizer Stil)","2bb13gmxxe7":"Für internationale Arbeitgeber: gleicher Aufbau ohne Fotofeld; ein Foto ist optional.","18x9vr2fa6h":"Vorlage Motivationsschreiben (Deutsch)","jw1xjw8i3l":"Eine Seite, namentliche Ansprechperson, drei Absätze und eine Liste der Beilagen.","278w4u4eqis":"Standardangestellte, 12 Auszahlungen","1aek902wqkr":"HR-Assistentin","xvba1ug599":"BVG-Basis = (72’000 − 26’460) ÷ 12. Die gesetzliche Gutschrift für die Altersstufe 25–34 beträgt 7 %, je zur Hälfte auf Arbeitnehmerin und Arbeitgeber aufgeteilt.","1gja0wwrtb4":"13 Auszahlungen","1c6fmzn1700":"HR-Spezialist","27zebebblus":"Der Lohn beträgt jeden Monat CHF 7’500 plus eine 13. Auszahlung im Dezember mit denselben Abzügen. Die Obergrenzen werden durch 13 geteilt.","1kfd0jghy8z":"Teilzeit 50 %","xd0hl4llx5":"HR-Sachbearbeiterin (50 %)","1aisf3uvp9h":"Der gesetzliche Koordinationsabzug (26’460) wird hier nicht gekürzt, die BVG-Basis ist daher tief. Viele Kassen skalieren ihn für Teilzeitangestellte herunter.","1glfq956en":"Praktikantin unter der BVG-Schwelle","13uc9un6klm":"HR-Praktikantin (25 %)","62bcejiadp":"Der Jahreslohn von CHF 21’600 liegt unter der BVG-Eintrittsschwelle von 22’680: kein Pensionskassenabzug. Die NBU gilt ab 8 Wochenstunden.","1k8fxcu8dsy":"Hoher Verdienst über den Obergrenzen","1yctc5ismne":"Leiter HR","106g8u57ahu":"ALV und NBU enden bei CHF 148’200 pro Jahr (12’350 pro Monat). Die AHV hat keine Obergrenze. Das BVG verwendet die Grenze von 90’720, daher wird nur das obligatorische Minimum gezeigt.","kr7p2abev9":"Arbeiten nach 65","2227h5ql2t5":"Senior Consultant","g1r1kjld18":"Über dem Referenzalter sind CHF 1’400 pro Monat AHV-frei. Keine ALV und kein BVG.","29chikmm7k3":"Keine Bewilligung C: Quellensteuer","2ggt3llp8l2":"Wie Fall A, plus Quellensteuer mit einem illustrativen Satz von 7,5 %. Die tatsächlichen Tarife hängen von Kanton, Zivilstand und Kindern ab.","1ignhq8511k":"Krankentaggeld (KTG) abgezogen","1pg26lmpze0":"HR Business Partner","2sywh5qbqp":"Viele Arbeitgeber versichern den Lohn bei Krankheit (KTG). Der Arbeitgeber darf bis zur Hälfte der Prämie abziehen; hier wird die Gesamtprämie mit 1,2 % angenommen, und die Arbeitnehmerin zahlt 0,6 %. Prüfen Sie die Police und den Vertrag.","34zte6t597":"Restaurant: CHF 300 für Mahlzeiten abgezogen","1umbgr9orzj":"Servicemitarbeiter","14ab88frjm8":"Der Arbeitgeber belastet CHF 300 pro Monat für das Mittagessen im Betrieb, vom Nettolohn abgezogen. Die AHV-Pauschale für das Mittagessen beträgt CHF 10 pro Tag (CHF 300 pro Monat), ein Abzug dieser Höhe bedeutet daher keine Naturalleistung, und die AHV-Basis bleibt bei CHF 4’500. Prüfen Sie die Verpflegungsregeln in Ihrem Gesamtarbeitsvertrag (L-GAV).","1chadidjxco":"Restaurant: Gratis-Mittagessen als Naturalleistung","2g6el8pznn3":"Dasselbe Restaurant, aber das Mittagessen ist gratis. Es ist eine Naturalleistung: CHF 300 pro Monat werden zum AHV-Pauschalansatz dem Bruttolohn zugerechnet, AHV, ALV, NBU und KTG werden daher auf CHF 4’800 berechnet. Die Arbeitnehmerin zahlt nichts in bar, der Nettolohn ist also höher als in Fall I. Das BVG wird nur auf dem Barlohn gezeigt; Kassen können abweichen.","1l117m7bzaj":"Nachbildung einer echten Restaurant-Lohnabrechnung (Quellensteuer A0N)","hdvtkrjfcz":"Anonymisierte Nachbildung einer echten Abrechnung: Monat mit 30 Tagen, Verpflegungspauschale 30 × CHF 9.00, Quellensteuercode A0N, KTG 0.770 %, NBU 1.433 %, eine UVG-Zusatzzeile mit 0.00, BVG-Arbeitnehmersatz 7.000 % auf einer koordinierten Basis von 1’995 = (4’200 × 12 − 26’460) ÷ 12, und auf 5 Rappen gerundete Beträge.","1rp3x8zonwj":"Krankheit: Der Arbeitgeber zahlt, dann zahlt der Versicherer direkt","1fm70yikjxy":"Die Arbeitnehmerin ist in der zweiten Monatshälfte krank. Der Arbeitgeber zahlt die Tage 1–15 (CHF 3’000, AHV-pflichtig). Ab Tag 16 zahlt die Krankentaggeldversicherung direkt 80 % (CHF 2’400): Das steht nicht auf der Lohnabrechnung und ist nicht AHV-pflichtig. Das BVG wird in voller Höhe gezeigt; ob eine Kasse es während der Krankheit erlässt, hängt von ihrem Reglement ab. Total erhaltenes Bargeld: 2’627.17 + 2’400.00 = CHF 5’027.17.","2buyr29hirx":"Vom Arbeitgeber weiterbezahlter Lohn, Tage 1–15","1dns7k8ill3":"Taggeld 80 %, Tage 16–30, vom Versicherer direkt an die Arbeitnehmerin bezahlt: ausserhalb der Lohnabrechnung und nicht AHV-pflichtig","j4miyh9jxf":"Eintritt mitten im Monat (anteilig)","6yet8g5h8w":"HR-Sachbearbeiter","zr8yjxoq2z":"Beginn am 15. Oktober: 16 von 30 Tagen = CHF 3’200 (6’000 × 16 ÷ 30). Die Sozialabzüge gelten für das tatsächlich Ausbezahlte. Das BVG wird hier anteilig gezeigt; einige Kassen verrechnen den ganzen Monat.","1pj7kqn3mdl":"Lohn ab Eintrittsdatum, 16 von 30 Tagen","1mogwyup84b":"Bonusmonat","22x64rn6thl":"Der Bonus ist Lohn für AHV, ALV und Unfallversicherung, diese Abzüge gelten daher für CHF 9’000. In diesem Beispiel versichert die Kasse nur den festen Lohn, das BVG ändert sich also nicht; prüfen Sie Ihr Reglement. Bei Quellensteuer würde der Bonus zudem mit einem höheren Satz besteuert (nicht dargestellt).","12eps4sj9k9":"In diesem Monat ausbezahlter Jahresbonus","2969tgfk0rw":"Schlussabrechnung mit Ferienauszahlung","1e58r1srxb6":"Die Ferienentschädigung ist AHV-Lohn, daher gelten die Beiträge für CHF 7’384.62. Nicht bezogene Ferien dürfen nur bei Beendigung des Arbeitsverhältnisses ausbezahlt werden (Art. 329d), nicht währenddessen. Der Tagesansatz verwendet 260 Arbeitstage pro Jahr, eine Annahme: Verträge und Kassen können eine andere Methode verwenden.","2bpua2bwm3f":"Lohn des letzten Monats","1nqj3a09bm":"Auszahlung von 5 nicht bezogenen Ferientagen (6’000 × 12 ÷ 260 pro Tag)","l85hbt95f6":"Ihre eigene Berechnung","n83xacdpt7":"Ihr Fall","2efwzapb1al":"Geben Sie Ihre eigenen Zahlen im Feld ein. Ein Feld wird übernommen, wenn Sie es verlassen oder die Eingabetaste drücken. Alle Sätze sind Annahmen, die Sie ändern können; das BVG-Feld ersetzt die Methode der gesetzlichen halben Gutschrift, wenn es über 0 liegt.","ua2efzm2d6":"Deutsch","2gf7zk2u4or":"Französisch","1r8k08hp1vi":"Italienisch","dbqco6f55b":"Rätoromanisch","2gczhwym8ye":"Neujahr","qe9i8i4f5c":"Berchtoldstag (2. Jan.)","47gwhfwua8":"Dreikönigstag (6. Jan.)","189dtrlribw":"Karfreitag","70swekbis4":"Ostermontag","pq1e15wd4l":"Tag der Arbeit (1. Mai)","8k1251gs74":"Auffahrt","l4vxaxapg7":"Pfingstmontag","18xr46wxgl":"Fronleichnam","uenqgdpm9i":"Nationalfeiertag (1. Aug.)","1kmaboqb4ui":"Mariä Himmelfahrt (15. Aug.)","14omel5r3cj":"Bruder-Klausen-Fest (25. Sep.)","1dkhar5ngxm":"Allerheiligen (1. Nov.)","24cd9ow9clf":"Mariä Empfängnis (8. Dez.)","1g3o8ar10td":"Weihnachten (25. Dez.)","hbhtl4pfgp":"Stephanstag (26. Dez.)","6cx66wxf9u":"Viele weitere Feiertage werden nach Bezirk oder Gemeinde festgelegt (die katholischen Feiertage gelten in den meisten Bezirken).","a7q8m89u9r":"Mehrere Feiertage (Berchtoldstag, Ostermontag, Pfingstmontag und die katholischen) gelten nur in einigen Gemeinden; es gibt sechs verschiedene Kombinationen.","7womn1ttvp":"Einige katholische Feiertage gelten nur in einem Teil des Kantons; viele Gemeinden fügen lokale Patronatsfeste hinzu.","1jyet0ni899":"Die Gemeinden können mindestens einen weiteren Feiertag festlegen, und viele tun es.","12ajj1zxtls":"Viele Gemeinden fügen lokale Patronatsfeste hinzu.","1a7pjd2g19r":"Dazu der Genfer Bettag (Jeûne genevois) im September.","k1o9ywpscj":"Dazu die Näfelser Fahrt im April.","2f0turhsdfh":"Berchtoldstag und Stephanstag werden anerkannt, wenn sie auf einen Montag fallen; in der Praxis wird der 2. Januar jedes Jahr begangen.","24gagy6m9gw":"Karfreitag, Ostermontag und Pfingstmontag sind keine offiziellen Feiertage; die katholischen wiegen mehr.","1moy9ssuvn8":"Karfreitag ist kein Feiertag.","1uebmr7dw51":"CHF 24.59 (2027: 24.73)","k49arkwarr":"CHF 22.20","ylj7sfef2d":"CHF 21.40","20db98c48am":"CHF 21.35","2av283x7em7":"CHF 20.00–20.50 je nach Branche","1kfnlc2ubow":"Noch keiner (siehe Tabelle der Mindestlöhne)","292gj7omzjc":"Berner Skala: 3 Wochen im Jahr 1, 1 Monat im Jahr 2, 2 Monate in den Jahren 3–4, 3 Monate in den Jahren 5–9, 4 Monate in den Jahren 10–14, 5 Monate in den Jahren 15–19 und 6 Monate ab dem Jahr 20.","gn8oyrkoji":"Zürcher Skala: 3 Wochen im Jahr 1, 8 Wochen im Jahr 2, 9 im Jahr 3, 10 im Jahr 4, dann eine Woche mehr für jedes weitere Jahr.","1pwhj7tza9c":"Basler Skala (in den ersten Jahren grosszügiger): 3 Wochen im Jahr 1, 2 Monate in den Jahren 2 und 3, 3 Monate im Jahr 4; prüfen Sie die vollständige Skala für spätere Jahre.","kvzeblwy01":"Die Quellen weichen für Graubünden ab (nach einigen Zürcher Skala, nach anderen Berner Skala): Klären Sie dies beim Kantonsgericht oder bei Ihrer Krankentaggeldversicherung.","16h6uh88eut":"Lehrmässige Zusammenfassung, keine Rechtsberatung. Die Regeln variieren je nach Kanton, Branche und Vertrag, und das Recht ändert sich. Prüfen Sie stets Fedlex (fedlex.admin.ch) oder eine Schweizer Fachanwältin bzw. einen Schweizer Fachanwalt für Arbeitsrecht, bevor Sie sich auf einen Punkt verlassen.","l9k3bvrhts":"Themen, Gesetze, Begriffe suchen…","4cd4226oyi":"Glossar DE · EN · ES","1ypc08h5ifc":"Deutsch","2aztfk35c0t":"Englisch","26pg2ar2b1p":"Spanisch","2gdo894choh":"Zuletzt überprüft: November 2026. Gegen offizielle Quellen geprüft: Sozialversicherungszahlen 2026, Obergrenze der Säule 3a, BVG-Schwellenwerte, Schwelle der Quellensteuer, Beitragszeit der Arbeitslosenversicherung, Regeln zu Bewilligungen und Anmeldung. Ebenfalls geprüft: Arbeitszeiterfassung, Nacht- un

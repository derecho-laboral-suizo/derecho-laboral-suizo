 reference or confirmation (art. 330a), and any employer certificate needed for unemployment benefits. Report the exit to the pension fund (vested benefits go to the new fund or a vested-benefits account), the accident insurer and the compensation fund. Cover continues after exit for 31 days under UVG and 1 month under BVG, so tell the employee what to arrange.","<b>Good practice:</b> keep a checklist per stage, record proof of every written communication, and keep payroll records for audits."],["<b>Alta, antes del inicio:</b> comprueba el derecho a trabajar (un ciudadano UE/AELC necesita permiso o, hasta 90 días laborables, la notificación en línea) y firma el contrato, o entrega las condiciones por escrito en un mes (art. 330b). Pacta prueba, salario, número de pagas y jornada.","<b>Alta, registros:</b> AHV (si el trabajador no tiene número AHV, pide la tarjeta de seguro a la caja de compensación al incorporarse; el personal nuevo se comunica una vez al año con la declaración de salarios); caja de pensiones si el salario supera el umbral de entrada, incluida la transferencia de los fondos de libre paso de la caja anterior; aseguradora de accidentes (BU, y NBU desde 8 horas semanales); seguro de subsidio diario por enfermedad si la empresa lo tiene; caja de subsidios familiares y libro de familia para quien tiene hijos; código de impuesto en origen según la declaración del trabajador si no tiene permiso C. El seguro médico (KVG) es del propio trabajador, no de la nómina.","<b>Cada mes:</b> recoge los datos variables (horas, ausencias, bonus, gastos), calcula, emite la nómina por escrito (art. 323b) y paga a fin de mes. El empleador paga a la caja de compensación los anticipos de AHV, ALV y subsidios familiares, mensual o trimestralmente, en 30 días desde el fin del período o corren intereses. Las cotizaciones a la caja de pensiones y a las aseguradoras siguen las reglas de cada una; el impuesto en origen se liquida con el cantón según sus normas.","<b>Cambios durante el año:</b> comunica a las aseguradoras y a la caja cualquier cambio de salario, jornada, estado civil o salida.","<b>Cierre anual:</b> la declaración de salarios a la caja de compensación (AHV/IV/EO/ALV/FAK) debe llegar antes del 30 de enero, con un interés de demora del 5% si se retrasa. Las declaraciones de accidentes y subsidio diario suelen tener la misma fecha, fijada por el contrato. La caja de pensiones pide los salarios del año siguiente por adelantado. Los empleados reciben en enero el certificado anual de salario (Lohnausweis, el mismo formulario en todo el país) para la declaración de impuestos.","<b>Baja:</b> emite la última nómina (vacaciones, 13.ª proporcional, horas extra), el certificado de trabajo o la confirmación (art. 330a) y cualquier certificado del empleador necesario para el desempleo. Comunica la salida a la caja de pensiones (el fondo de libre paso va a la nueva caja o a una cuenta de libre paso), a la aseguradora de accidentes y a la caja de compensación. La cobertura continúa tras la salida 31 días en la UVG y 1 mes en la BVG, así que informa al trabajador de lo que debe contratar.","<b>Buena práctica:</b> una lista de control por etapa, prueba de cada comunicación escrita y conservación de los registros de nóminas para auditorías."]],
s:["In Spain the alta in the Seguridad Social comes before the start date and the contract is communicated to the SEPE. In Switzerland there is no single portal: you register staff with each insurer and once a year through the salary declaration.","En España el alta en la Seguridad Social va antes del inicio y el contrato se comunica al SEPE. En Suiza no hay un portal único: das de alta al personal en cada aseguradora y una vez al año con la declaración de salarios."]},
{t:["17. Illness and accident","17. Enfermedad y accidente"],r:"CO art. 324a · UVG/LAA",
b:[["If the employee is prevented from working through no fault of their own (art. 324a), the employer pays salary for a limited time: at least 3 weeks in the first year of service, then a longer period “as fair” by scale.","Courts use three scales: Basel, Bern and Zurich. Many employers take out daily sickness benefit insurance (Krankentaggeld), typically 80% for up to 720 days.","Accidents: UVG insurance pays 80% of insured salary. Employer pays occupational accident (BU); the employee normally pays non-occupational accident (NBU) if working at least 8 h per week.","A medical certificate can be demanded from the first day if the contract or company rules say so.","<b>Accident insurance timing:</b> UVG daily allowances start on the 3rd day after the accident. For the first 2 days the employer must continue to pay salary under art. 324a. The employee must report absence immediately; abuse or false certificates can justify dismissal.","<b>Sick-pay scales (art. 324a):</b> after the first service year the law only says “a longer period as fair”, so the courts use three scales. Bern (most cantons): year 1 = 3 weeks; year 2 = 1 month; years 3–4 = 2 months; years 5–9 = 3 months; years 10–14 = 4 months; years 15–19 = 5 months; from year 20 = 6 months. Zurich (mainly ZH, SH, TG): 3 weeks, then 8 weeks in year 2, 9 in year 3, 10 in year 4, plus one week for each further year. Basel (BS, BL): 3 weeks, 2 months in years 2–3, then 3 months and more with seniority.","<b>How it works:</b> the entitlement arises anew in each service year and counts all absences of that year together, not per illness. It needs an employment that lasted, or was agreed for, more than 3 months; the employee must not be at fault; the employer may ask for a medical certificate.","<b>Insurance instead of the scale:</b> the parties may agree in writing on a daily sickness insurance of at least equivalent value, typically 80% of salary. If the benefit is at least 80%, the employer can charge the employee up to half of the premium. The insurer pays either the employer or the employee directly.","<b>Payroll treatment:</b> salary continued by the employer is AHV salary. Daily sickness allowances paid by an insurer are not AHV salary, so no AHV/IV/EO/ALV is deducted from them. Whether pension fund contributions continue during sickness depends on the fund’s regulations.","<b>Example (Bern scale):</b> an employee in year 4 is sick for 3 months from 1 March: the employer pays 2 months at 100%, and then the obligation for that service year ends unless a daily insurance keeps paying. Dismissal protection (section 22) can continue even after the pay has ended."],["Si el trabajador no puede trabajar sin culpa propia (art. 324a), el empleador paga el salario durante un tiempo limitado: al menos 3 semanas en el primer año de servicio y después un período más largo “equitativo” según escala.","Los tribunales usan tres escalas: Basilea, Berna y Zúrich. Muchas empresas contratan un seguro de subsidio diario por enfermedad (Krankentaggeld), normalmente 80% hasta 720 días.","Accidentes: el seguro UVG paga el 80% del salario asegurado. El empleador paga el accidente profesional (BU); el trabajador suele pagar el no profesional (NBU) si trabaja al menos 8 h semanales.","Puede exigirse certificado médico desde el primer día si el contrato o las normas de empresa lo prevén.","<b>Plazos del seguro de accidentes:</b> los subsidios diarios de la UVG empiezan el 3.er día tras el accidente. Los 2 primeros días el empleador debe seguir pagando el salario según el art. 324a. El trabajador debe avisar de la ausencia de inmediato; el abuso o un certificado falso pueden justificar el despido.","<b>Escalas de baja (art. 324a):</b> después del primer año de servicio la ley solo dice “un tiempo más largo equitativo”, por eso los tribunales usan tres escalas. Berna (la mayoría de cantones): año 1 = 3 semanas; año 2 = 1 mes; años 3–4 = 2 meses; años 5–9 = 3 meses; años 10–14 = 4 meses; años 15–19 = 5 meses; desde el año 20 = 6 meses. Zúrich (sobre todo ZH, SH, TG): 3 semanas, luego 8 semanas en el año 2, 9 en el año 3, 10 en el año 4, y una semana más por cada año siguiente. Basilea (BS, BL): 3 semanas, 2 meses en los años 2–3, y después 3 meses y más con la antigüedad.","<b>Cómo funciona:</b> el derecho nace de nuevo en cada año de servicio y suma todas las ausencias de ese año, no por enfermedad. Exige una relación que haya durado, o se haya pactado, más de 3 meses; el trabajador no debe tener culpa; el empleador puede pedir un certificado médico.","<b>Seguro en lugar de la escala:</b> las partes pueden pactar por escrito un seguro de subsidio diario de valor al menos equivalente, normalmente del 80% del salario. Si la prestación es de al menos el 80%, el empleador puede cargar al trabajador hasta la mitad de la prima. La aseguradora paga al empleador o directamente al trabajador.","<b>Tratamiento en nómina:</b> el salario que sigue pagando el empleador es salario AHV. Los subsidios diarios que paga una aseguradora no son salario AHV, así que no se les descuenta AHV/IV/EO/ALV. Que las cotizaciones de la caja de pensiones continúen durante la baja depende del reglamento de la caja.","<b>Ejemplo (escala de Berna):</b> un empleado en su año 4 está 3 meses de baja desde el 1 de marzo: el empleador paga 2 meses al 100%, y después la obligación de ese año de servicio termina salvo que un seguro de subsidio diario siga pagando. La protección frente al despido (apartado 22) puede continuar aunque el pago haya terminado."]]},
{t:["20. Termination and notice","20. Despido y preaviso"],r:"CO art. 335–335c",
b:[["Principle: freedom of termination. No reason is needed, but it must be given in writing if the other party asks (art. 335).","Notice after probation: 1 month in the first year of service, 2 months from the 2nd to the 9th, 3 months from the 10th. It ends at the end of a month.","Shorter or longer notice can be agreed in writing, but not shorter than 1 month (except in the first year by GAV) and it must be equal for both parties.","The period starts when the other party receives the notice; if it does not end on a month-end, it runs to the next month-end.","<b>Form and delivery:</b> the law requires no form unless the contract or a collective agreement does, but a written notice with proof of receipt is strongly advised. The notice takes effect when it reaches the other party, and whoever terminates must be able to prove delivery.","<b>Reasons:</b> no reason is needed, but on request the reasons must be given in writing (art. 335 para 2), and they must be true. This applies in probation and to immediate dismissal too.","<b>Garden leave (Freistellung):</b> the employer can release the employee from work until the end date. The employment legally continues to the last day, which is also the exit date on the certificate. The holiday balance is usually deemed covered by the release, but overtime can only be offset if the employee agrees or the contract provides time compensation. Put the rights and duties during the release in writing.","<b>Special cases:</b> a fixed-term contract ends without notice (art. 334); if work simply continues after the end date, it becomes open-ended; a contract fixed for more than 10 years can be terminated after 10 years (art. 334 para 3). Notice shorter than 1 month is only possible through a collective agreement in the first year (art. 335c para 2); notice must be equal for both sides, except that when the employer dismisses for economic reasons a shorter period for the employee may be agreed (art. 335a para 2).","<b>Holidays and protected periods:</b> a notice given during holidays is valid. During a protected period (section 22) the employer’s notice is void.","<b>HR checklist for a dismissal:</b> 1) contract type and service year; 2) protected periods; 3) end date (end of a month) counted from the receipt date; 4) letter with proof of receipt; 5) holidays, overtime and garden leave; 6) final payslip, certificate and insurance information; 7) report the exit to the pension fund and insurers (section 7). A model letter is in Templates."],["Principio: libertad de despido. No se necesita motivo, pero debe darse por escrito si la otra parte lo pide (art. 335).","Preaviso tras la prueba: 1 mes en el primer año de servicio, 2 meses del 2.º al 9.º, 3 meses desde el 10.º. Termina a fin de mes.","Pueden pactarse por escrito plazos menores o mayores, pero no inferiores a 1 mes (salvo en el primer año por GAV) y deben ser iguales para ambas partes.","El plazo empieza cuando la otra parte recibe el despido; si no termina a fin de mes, se prolonga hasta el siguiente fin de mes.","<b>Forma y entrega:</b> la ley no exige forma salvo que la exija el contrato o un convenio colectivo, pero se recomienda mucho un despido por escrito con prueba de recepción. El despido surte efecto cuando llega a la otra parte, y quien despide debe poder probar la entrega.","<b>Motivos:</b> no hace falta motivo, pero si se pide hay que darlo por escrito (art. 335 ap. 2), y debe ser veraz. Esto vale también en la prueba y en el despido inmediato.","<b>Dispensa de trabajo (Freistellung):</b> el empleador puede dispensar al trabajador de trabajar hasta la fecha de fin. La relación continúa legalmente hasta el último día, que es también la fecha de salida del certificado. Las vacaciones pendientes se consideran normalmente cubiertas por la dispensa, pero las horas extra solo pueden compensarse si el trabajador acepta o el contrato prevé compensarlas con descanso. Fija por escrito los derechos y deberes durante la dispensa.","<b>Casos especiales:</b> un contrato de duración determinada termina sin preaviso (art. 334); si el trabajo simplemente continúa tras la fecha de fin, pasa a ser indefinido; un contrato pactado por más de 10 años puede resolverse después de 10 años (art. 334 ap. 3). Un preaviso inferior a 1 mes solo es posible por convenio colectivo en el primer año (art. 335c ap. 2); el preaviso debe ser igual para ambas partes, salvo que si el empleador despide por motivos económicos puede pactarse un plazo más corto para el trabajador (art. 335a ap. 2).","<b>Vacaciones y períodos de protección:</b> un despido comunicado durante las vacaciones es válido. Durante un período de protección (apartado 22) el despido del empleador es nulo.","<b>Lista de control de RRHH para un despido:</b> 1) tipo de contrato y año de servicio; 2) períodos de protección; 3) fecha de fin (fin de mes) contada desde la recepción; 4) carta con prueba de recepción; 5) vacaciones, horas extra y dispensa; 6) última nómina, certificado e información de seguros; 7) comunicar la salida a la caja de pensiones y aseguradoras (apartado 7). Hay un modelo de carta en Plantillas."]],
s:["Big difference with Spain: no “causa” is required, no 33/20-day-per-year severance, and no conciliation (SMAC) before the dismissal.","Gran diferencia con España: no hace falta causa, no hay indemnización de 33/20 días por año ni conciliación previa."]},
{t:["21. Worked examples: notice, sick pay, severance","21. Ejemplos: preaviso, baja por enfermedad, indemnización"],r:"CO art. 324a, 335c, 336c, 339b",
b:[["<b>Notice (receipt matters):</b> the employee has 3 years of service (2 months’ notice). The employer’s letter is received on 12 March. Two months later is 12 May, which is not a month-end, so the contract ends on 31 May. Practical tip: what counts is the date the letter reaches the employee, so use registered mail or hand it over against a signed receipt.","<b>Protected period:</b> in year 3 the employee receives notice on 25 May (ends 31 July). On 10 June they fall ill until 30 June (21 days, inside the 90-day protection). The notice period is suspended during the illness and resumes on 1 July. The nominal end moves from 25 July to 15 August, so the contract ends on 31 August.","Key point: the protected period only stops notice given <i>during</i> the illness (void) or suspends notice given <i>before</i> it. It does not stop the employee from resigning.","<b>Sick pay (art. 324a):</b> the law only says “for a limited time”, so courts use scales. Bern scale: year 1 = 3 weeks; year 2 = 1 month; years 3–4 = 2 months; years 5–9 = 3 months. Zurich and Basel scales are different. Example: an employee in year 4 who is ill for 3 months receives 2 months’ full salary under the Bern scale (unless there is a better contract or daily sickness insurance).","Daily sickness insurance (Krankentaggeld): if the employer has it, it normally replaces the scale: typically 80% of salary for up to 720 days after a waiting period (often 30 days), and the employer usually pays at least half of the premium. Check the policy terms.","<b>Severance:</b> Switzerland has no general severance pay. The only legal one (art. 339b) is for employees dismissed at 50 or older after at least 20 years of service: between 2 and 8 months’ salary. Other payments come from the contract, a collective agreement or a negotiated exit (“Aufhebungsvertrag”).","Exit agreement: check that the employee is not giving up mandatory rights (art. 341), and that unemployment benefits may be delayed if the employee signs it voluntarily."],["<b>Preaviso (cuenta la recepción):</b> el trabajador lleva 3 años (2 meses de preaviso). Recibe la carta del empleador el 12 de marzo. Dos meses después es el 12 de mayo, que no es fin de mes, así que el contrato termina el 31 de mayo. Consejo práctico: lo que cuenta es la fecha en que la carta llega al trabajador, por eso conviene usar correo certificado o entrega en mano con acuse firmado.","<b>Período de protección:</b> en el año 3 el trabajador recibe el despido el 25 de mayo (termina el 31 de julio). El 10 de junio enferma hasta el 30 de junio (21 días, dentro de los 90 de protección). El preaviso se suspende durante la enfermedad y se reanuda el 1 de julio. El fin teórico pasa del 25 de julio al 15 de agosto, así que el contrato termina el 31 de agosto.","Clave: la protección solo anula el despido comunicado <i>durante</i> la enfermedad o suspende el comunicado <i>antes</i>. No impide que el trabajador dimita.","<b>Salario en baja (art. 324a):</b> la ley solo dice “durante un tiempo limitado”, por eso los tribunales usan escalas. Escala de Berna: año 1 = 3 semanas; año 2 = 1 mes; años 3–4 = 2 meses; años 5–9 = 3 meses. Las escalas de Zúrich y Basilea son distintas. Ejemplo: un trabajador en su año 4 que está 3 meses de baja cobra 2 meses de salario completo con la escala de Berna (salvo contrato más favorable o seguro de subsidio diario).","Seguro de subsidio diario (Krankentaggeld): si el empleador lo tiene, normalmente sustituye a la escala: suele pagar el 80% del salario hasta 720 días tras un período de espera (a menudo 30 días) y el empleador suele pagar al menos la mitad de la prima. Revisa las condiciones de la póliza.","<b>Indemnización:</b> Suiza no tiene indemnización general por despido. La única legal (art. 339b) es para quien es despedido con 50 años o más y al menos 20 años de servicio: entre 2 y 8 meses de salario. Otros pagos vienen del contrato, de un convenio colectivo o de una salida pactada (“Aufhebungsvertrag”).","Salida pactada: comprueba que el trabajador no renuncia a derechos irrenunciables (art. 341) y que si firma voluntariamente puede retrasarse el cobro del desempleo."]],
s:["In Spain, an unfair dismissal gives 33 days’ pay per year of service, a mandatory conciliation step and a labour court. In Switzerland, a valid notice needs no cause and carries no severance.","En España, el despido improcedente da 33 días de salario por año, conciliación previa y juzgado de lo social. En Suiza un preaviso válido no necesita causa ni da indemnización."]},
{t:["22. Protected periods (Sperrfrist)","22. Períodos de protección (Sperrfrist)"],r:"CO art. 336c",
b:[["After probation the employer cannot terminate during: military or civil service (plus 4 weeks before and after), illness or accident (30 days in year 1, 90 days in years 2–5, 180 days from year 6), pregnancy and 16 weeks after birth, and some other cases.","A notice given during a protected period is void. If given before it, the notice period is suspended and resumes afterwards, ending at the next month-end.","The employee can terminate during these periods; protection applies to the employer only.","<b>When it applies:</b> only after probation and only against dismissal by the employer. A notice given inside the period is void and must be repeated after it ends. If the notice was given before the period, it stays valid but the notice period is interrupted and continues afterwards; if it then does not end on a month-end, it runs to the next month-end.","<b>Illness and accident:</b> the illness must not be the employee’s fault, and full or partial incapacity both protect. The days are calendar days (weekends and holidays count) and the protection lasts only while the incapacity lasts, up to 30, 90 or 180 days. An unrelated new illness or accident starts a new period; a relapse of the same illness does not. If an incapacity starts in one service year and continues into the next, the longer period of the later year can apply.","<b>Pregnancy and parenthood:</b> protection lasts from the start of the pregnancy (counted back from conception) until 16 weeks after birth, or to the end of an extended maternity leave under the EOG. There is also protection around care leave for a seriously ill child.","<b>Military and civil service:</b> protection applies during Swiss compulsory military, civil protection or civil service and, for services of more than 11 days, also 4 weeks before and after. Comparable service abroad may be treated the same way.","<b>Example:</b> in year 3 an employee is on sick leave and the employer sends a notice on 3 July. The notice is void, so the employer has to wait until the 90-day protection ends (or the employee is fit again) and give notice again.","<b>HR tip:</b> check absences and pregnancy before any dismissal and document delivery dates; a void notice costs time and may cause further disputes."],["Tras la prueba el empleador no puede despedir durante: servicio militar o civil (más 4 semanas antes y después), enfermedad o accidente (30 días en el año 1, 90 días en los años 2–5, 180 días desde el 6.º), embarazo y 16 semanas tras el parto, y otros casos.","Un despido dado en período de protección es nulo. Si se dio antes, el plazo se suspende y se reanuda después, terminando a fin de mes.","El trabajador sí puede resolver en esos períodos; la protección solo vale frente al empleador.","<b>Cuándo se aplica:</b> solo después de la prueba y solo frente al despido del empleador. Un despido comunicado dentro del período es nulo y hay que repetirlo cuando termine. Si el despido se comunicó antes del período, sigue siendo válido pero el preaviso se interrumpe y continúa después; si entonces no termina a fin de mes, se prolonga hasta el siguiente fin de mes.","<b>Enfermedad y accidente:</b> la enfermedad no debe ser culpa del trabajador, y protege tanto la incapacidad total como la parcial. Los días son naturales (cuentan fines de semana y festivos) y la protección dura solo mientras dura la incapacidad, hasta 30, 90 o 180 días. Una nueva enfermedad o accidente sin relación inicia un período nuevo; una recaída de la misma enfermedad no. Si una incapacidad empieza en un año de servicio y continúa en el siguiente, puede aplicarse el período más largo del año posterior.","<b>Embarazo y paternidad:</b> la protección dura desde el inicio del embarazo (contado hacia atrás desde la concepción) hasta 16 semanas después del parto, o hasta el fin de una baja de maternidad ampliada según la EOG. También hay protección en torno al permiso de cuidado de un hijo gravemente enfermo.","<b>Servicio militar y civil:</b> la protección se aplica durante el servicio militar obligatorio suizo, la protección civil o el servicio civil y, en servicios de más de 11 días, también 4 semanas antes y después. Un servicio comparable en el extranjero puede tratarse igual.","<b>Ejemplo:</b> en el año 3 un trabajador está de baja y el empleador envía un despido el 3 de julio. El despido es nulo, así que el empleador debe esperar a que termine la protección de 90 días (o el trabajador esté recuperado) y despedir de nuevo.","<b>Consejo de RRHH:</b> comprueba ausencias y embarazo antes de cualquier despido y documenta las fechas de entrega; un despido nulo cuesta tiempo y puede causar nuevos conflictos."]]},
{t:["23. Abusive and immediate dismissal","23. Despido abusivo e inmediato"],r:"CO art. 336–337d",
b:[["Abusive dismissal (art. 336): e.g. for a protected trait, for exercising a constitutional right, for claiming employment rights in good faith, or to prevent claims from the employment relationship.","Procedure: written objection to the employer before the notice ends, then a claim within 180 days after the end of the relationship. Compensation up to 6 months’ salary (art. 336a); the dismissal still stands.","Immediate dismissal (art. 337): only for “good cause” that makes continuing in good faith unreasonable. It must be given promptly, usually within 2–3 working days of knowing the facts.","Unjustified immediate dismissal: the employee gets what they would have earned until the notice would have ended, plus up to 6 months’ salary compensation.","<b>Grounds listed in art. 336 (not exhaustive):</b> a personal characteristic such as origin, age or nationality unless it matters for the job; exercising a constitutional right; frustrating claims arising from the employment; revenge for asserting claims in good faith (Rachekündigung); mandatory military or civil service; acting as an employee representative; and mass redundancy without the required consultation. Other breaches of good faith can also count.","<b>Effects:</b> an abusive dismissal stays valid. The court can award compensation of up to 6 months’ salary (2 months for a mass redundancy without consultation), plus damages under other rules. Normally the employee must prove the abuse; a close timing between a claim and the dismissal is a strong indication.","<b>Procedure:</b> object in writing to the employer before the notice period ends (art. 336b). If no agreement to continue is reached, file the claim within 180 days after the employment ends, or the right lapses.","<b>Immediate dismissal (art. 337):</b> only for good cause that makes continuing in good faith unreasonable. Poor performance alone is usually not enough. Reasons must be given in writing on request. No prior objection is needed to claim the compensation of art. 337c (up to 6 months’ salary).","<b>HR practice:</b> document facts and warnings, apply the same rules to comparable cases, give reasons truthfully and check protected periods first (section 22)."],["Despido abusivo (art. 336): p. ej. por una característica protegida, por ejercer un derecho constitucional, por reclamar de buena fe derechos laborales o para impedir pretensiones derivadas de la relación.","Procedimiento: oposición por escrito al empleador antes de acabar el preaviso y demanda en los 180 días posteriores al fin de la relación. Indemnización de hasta 6 meses de salario (art. 336a); el despido sigue siendo válido.","Despido inmediato (art. 337): solo por “justa causa” que haga inexigible continuar de buena fe. Debe darse sin demora, normalmente en 2–3 días laborables desde que se conocen los hechos.","Despido inmediato injustificado: el trabajador recibe lo que habría ganado hasta el fin del preaviso, más hasta 6 meses de salario de indemnización.","<b>Motivos del art. 336 (lista no cerrada):</b> una característica personal como origen, edad o nacionalidad salvo que importe para el puesto; ejercer un derecho constitucional; frustrar pretensiones derivadas de la relación laboral; represalia por reclamar de buena fe (Rachekündigung); servicio militar o civil obligatorio; actuar como representante de los trabajadores; y despido colectivo sin la consulta exigida. Otras infracciones de la buena fe también pueden contar.","<b>Efectos:</b> un despido abusivo sigue siendo válido. El tribunal puede conceder una indemnización de hasta 6 meses de salario (2 meses en un despido colectivo sin consulta), más daños según otras reglas. Normalmente el trabajador debe probar el abuso; una estrecha cercanía temporal entre una reclamación y el despido es un fuerte indicio.","<b>Procedimiento:</b> oponte por escrito al empleador antes de que termine el preaviso (art. 336b). Si no se acuerda continuar, presenta la demanda en los 180 días posteriores al fin de la relación, o el derecho caduca.","<b>Despido inmediato (art. 337):</b> solo con causa justa que haga inexigible continuar de buena fe. El mal rendimiento por sí solo normalmente no basta. Los motivos deben darse por escrito si se piden. No hace falta oposición previa para reclamar la indemnización del art. 337c (hasta 6 meses de salario).","<b>Práctica de RRHH:</b> documenta hechos y advertencias, aplica las mismas reglas a casos comparables, da los motivos con veracidad y comprueba antes los períodos de protección (apartado 22)."]]},
{t:["18. Family leave","18. Permisos familiares"],r:"EOG/LAPG · CO art. 329f–329h · ArG art. 36",
b:[["Maternity: 14 weeks at 80% of average earnings, capped at CHF 220 per day (EO). Extended if the newborn has a long hospital stay.","Paternity: 2 weeks (10 days), taken in the 6 months after birth, same 80% and CHF 220 cap. Adoption leave: 2 weeks.","Care leave for a seriously ill or injured child: up to 14 weeks within 18 months.","Short absences to care for a sick family member: up to 3 days per event and 10 days per year (ArG art. 36)."],["Maternidad: 14 semanas al 80% del ingreso medio, con tope de 220 CHF diarios (EO). Se amplía si el recién nacido tiene hospitalización prolongada.","Paternidad: 2 semanas (10 días) dentro de los 6 meses posteriores al nacimiento, mismo 80% y tope de 220 CHF. Adopción: 2 semanas.","Permiso para cuidar a un hijo gravemente enfermo o accidentado: hasta 14 semanas en 18 meses.","Ausencias breves para cuidar a un familiar enfermo: hasta 3 días por caso y 10 días al año (art. 36 ArG)."]],
s:["Spain: 19 weeks each parent. Switzerland is much shorter and gives them to the mother (14) and father (2).","España: 19 semanas por progenitor. Suiza es mucho más breve y lo da a la madre (14) y al padre (2)."]},
{t:["19. Family leave in detail","19. Permisos familiares en detalle"],r:"EOG/LAPG · ArG art. 35a · CO art. 329f–329h",
b:[["<b>Maternity pay (EO):</b> the mother must have been insured under the AHV for the 9 months before birth and have worked at least 5 of them. Pay is 80% of average income, capped at CHF 220 per day, for 98 days (14 weeks). If she returns to work earlier, the entitlement ends.","<b>Example:</b> salary CHF 8,000 a month: daily rate 8,000 × 12 / 360 = CHF 266.67; 80% = CHF 213 a day, so about CHF 20,900 in total. With CHF 10,000 a month, 80% would be CHF 267, so the CHF 220 cap applies: 98 × 220 = CHF 21,560.","Protection at work (ArG art. 35a): no work in the 8 weeks after birth, and from week 9 to 16 only with the mother’s consent. Dismissal is also barred during pregnancy and for 16 weeks after birth. Nursing time is paid as working time. The employer may top up pay to 100% by contract or policy.","<b>Paternity:</b> same insurance conditions, 2 weeks (10 days), taken in weeks or single days within 6 months of birth. The employer submits the claim to the compensation fund. Adoption leave: 2 weeks.","<b>Care leave for a seriously ill child:</b> up to 14 weeks (98 daily allowances) within 18 months, which parents can share and take in weeks or days. Short care absences for a sick family member: up to 3 days per event and 10 days per year (ArG art. 36).","<b>Maternity pay conditions (EO):</b> the mother must have been AHV-insured for the 9 months before birth, have worked at least 5 of them (at any workload) and be working at the birth (or protected after a dismissal). Entitlement starts at birth and ends after 98 days, or earlier if she goes back to work. The allowance is itself subject to AHV contributions. The CHF 220 daily cap is reached from a monthly salary of CHF 8,250 (8,250 × 80% ÷ 30).","<b>Example:</b> monthly salary CHF 6,000: daily rate 6,000 ÷ 30 = CHF 200; 80% = CHF 160 a day; 98 days = CHF 15,680. Paternity leave: 14 daily allowances × CHF 160 = CHF 2,240.","<b>Extension and cantons:</b> if the newborn stays in hospital for a longer period, the mother can claim up to 8 more weeks of allowance when she resumes work afterwards. Geneva adds 2 weeks (16 in total) from a cantonal fund.","<b>Paternity leave:</b> for the legal father (and the wife of a woman who gave birth). The 2 weeks (10 working days) must be taken within 6 months, in a block or as single days. The employer cannot dismiss during the leave.","<b>Adoption and care leave:</b> adoption leave is 2 weeks for a child under 4, shared between the parents but not at the same time, and it does not apply to adopting a spouse’s child. Care leave for a seriously ill or injured child is up to 14 weeks within 18 months and can be shared by the parents."],["<b>Pago de maternidad (EO):</b> la madre debe haber estado asegurada en el AHV durante los 9 meses anteriores al parto y haber trabajado al menos 5. El pago es el 80% del ingreso medio, con tope de 220 CHF diarios, durante 98 días (14 semanas). Si vuelve a trabajar antes, el derecho se extingue.","<b>Ejemplo:</b> salario de 8.000 CHF al mes: tarifa diaria 8.000 × 12 / 360 = 266,67 CHF; el 80% son 213 CHF al día, es decir unos 20.900 CHF en total. Con 10.000 CHF al mes el 80% sería 267 CHF, así que se aplica el tope de 220: 98 × 220 = 21.560 CHF.","Protección en el trabajo (art. 35a ArG): prohibido trabajar en las 8 semanas posteriores al parto, y de la semana 9 a la 16 solo con consentimiento de la madre. Tampoco puede haber despido durante el embarazo ni en las 16 semanas posteriores. El tiempo de lactancia se paga como tiempo de trabajo. El empleador puede completar hasta el 100% por contrato o política interna.","<b>Paternidad:</b> mismas condiciones de seguro, 2 semanas (10 días), en semanas o días sueltos dentro de los 6 meses posteriores al nacimiento. El empleador presenta la solicitud a la caja de compensación. Adopción: 2 semanas.","<b>Cuidado de un hijo gravemente enfermo:</b> hasta 14 semanas (98 subsidios diarios) en 18 meses, que los progenitores pueden compartir y tomar en semanas o días. Ausencias breves para cuidar a un familiar enfermo: hasta 3 días por caso y 10 días al año (art. 36 ArG).","<b>Requisitos del pago de maternidad (EO):</b> la madre debe haber estado asegurada en la AHV durante los 9 meses anteriores al parto, haber trabajado al menos 5 de ellos (con cualquier jornada) y estar trabajando en el parto (o protegida tras un despido). El derecho empieza con el parto y termina a los 98 días, o antes si vuelve a trabajar. La prestación cotiza ella misma a la AHV. El tope de 220 CHF diarios se alcanza con un salario mensual de 8.250 CHF (8.250 × 80% ÷ 30).","<b>Ejemplo:</b> salario mensual de 6.000 CHF: tarifa diaria 6.000 ÷ 30 = 200 CHF; el 80% son 160 CHF al día; 98 días = 15.680 CHF. Permiso de paternidad: 14 subsidios diarios × 160 CHF = 2.240 CHF.","<b>Ampliación y cantones:</b> si el recién nacido permanece hospitalizado un tiempo largo, la madre puede reclamar hasta 8 semanas más de prestación cuando vuelva a trabajar después. Ginebra añade 2 semanas (16 en total) con un fondo cantonal.","<b>Permiso de paternidad:</b> para el padre legal (y la esposa de una mujer que ha dado a luz). Las 2 semanas (10 días laborables) deben tomarse en los 6 meses siguientes, seguidas o en días sueltos. El empleador no puede despedir durante el permiso.","<b>Adopción y cuidado:</b> el permiso de adopción es de 2 semanas para un menor de 4 años, compartido entre los progenitores pero no a la vez, y no se aplica a adoptar al hijo del cónyuge. El permiso de cuidado de un hijo gravemente enfermo o accidentado es de hasta 14 semanas en 18 meses y pueden compartirlo los progenitores."]]},
{t:["25. Social insurance (2026)","25. Seguros sociales (2026)"],r:"AHVG · AVIG · BVG · UVG · FamZG",
b:[["AHV/IV/EO (first pillar): 5.3% employee + 5.3% employer = 10.6% of the full gross salary, with no ceiling.","ALV (unemployment): 1.1% each on salary up to CHF 148,200 per year.","BVG (second pillar): mandatory above an annual salary of CHF 22,680; coordination deduction CHF 26,460; upper limit CHF 90,720. Rates by age are set by the fund; employer pays at least 50%.","UVG: occupational accident paid by employer; non-occupational (NBU) by employee. Maximum insured salary CHF 148,200.","Family allowances (FamZG): federal minimum per child CHF 215/month (to age 16) and CHF 268 (education, 16–25); cantons may pay more. Employers contribute via the family fund (FAK).","From 1 January 2027 the BVG entry threshold rises to CHF 23,040 and the coordination deduction to CHF 26,880 (see the 2027 box in Tools).","<b>Unemployment insurance (ALV) in practice:</b> to claim you need at least 12 months of contributions in the 2 years before registering. You register with the regional employment office (RAV) and file a claim with an unemployment fund, with an employer certificate, recent payslips, the contract and the termination letter. Benefits are paid as daily allowances, 5 a week.","<b>ALV amount:</b> 70% of insured earnings, or 80% if you support children under 25, your insured earnings are at most CHF 3,797 a month, or you have a disability degree of at least 40%. Insured earnings are capped at CHF 148,200 a year, and the daily rate is the monthly insured earnings divided by 21.7.","<b>ALV duration:</b> up to 200 days (under 25 without maintenance duty), 260 days (12 to under 18 contribution months), 400 days (18 months or more) and 520 days (22 months or more and age 55 or older, or an IV pension of at least 40%). A waiting period applies at the start.","<b>Example:</b> insured monthly earnings of CHF 5,000 give daily earnings of CHF 230.40 (5,000 ÷ 21.7). At 70% the daily allowance is CHF 161.30 and at 80% CHF 184.35, before deductions such as AHV, accident insurance and pension fund.","<b>Family allowances (FamZG):</b> the federal minimum is CHF 215 a month per child up to 16 and CHF 268 for training from 16 to 25; cantons may pay more (for example Geneva, Valais, Vaud and Zug pay more than CHF 300 as child allowance). The employer pays them through the family allowance fund.","<b>Who pays what in sickness and accident:</b> the employer under art. 324a or a daily sickness insurance (usually 80%, not AHV salary); accident insurance (UVG) pays 80% from day 3; maternity and paternity are paid by the EO at 80% up to CHF 220 a day; unemployment as above.","<b>Practical rule for HR:</b> every benefit has its own deduction rules and its own deadlines, so ask the payer (compensation fund, insurer or pension fund) before building a payroll rule."],["AHV/IV/EO (primer pilar): 5,3% trabajador + 5,3% empleador = 10,6% del salario bruto íntegro, sin tope.","ALV (desempleo): 1,1% cada parte sobre salario hasta 148.200 CHF anuales.","BVG (segundo pilar): obligatorio desde un salario anual de 22.680 CHF; deducción de coordinación 26.460 CHF; límite superior 90.720 CHF. Los tipos por edad los fija la caja; el empleador paga al menos el 50%.","UVG: accidente profesional a cargo del empleador; no profesional (NBU) a cargo del trabajador. Salario máximo asegurado 148.200 CHF.","Subsidios familiares (FamZG): mínimo federal por hijo 215 CHF/mes (hasta 16 años) y 268 CHF (formación, 16–25); los cantones pueden pagar más. El empleador cotiza a la caja de familia (FAK).","Desde el 1 de enero de 2027 el umbral de entrada del BVG sube a 23.040 CHF y la deducción de coordinación a 26.880 CHF (véase el aviso de 2027 en Herramientas).","<b>Seguro de desempleo (ALV) en la práctica:</b> para cobrar necesitas al menos 12 meses de cotización en los 2 años anteriores al registro. Te registras en la oficina regional de empleo (RAV) y presentas la solicitud en una caja de desempleo, con el certificado del empleador, las últimas nóminas, el contrato y la carta de despido. Las prestaciones se pagan como subsidios diarios, 5 por semana.","<b>Importe de la ALV:</b> el 70% del salario asegurado, o el 80% si mantienes a hijos menores de 25 años, tu salario asegurado es de como máximo 3.797 CHF al mes, o tienes un grado de invalidez de al menos el 40%. El salario asegurado tiene un tope de 148.200 CHF al año, y el subsidio diario es el salario mensual asegurado dividido entre 21,7.","<b>Duración de la ALV:</b> hasta 200 días (menores de 25 sin obligación de mantenimiento), 260 días (de 12 a menos de 18 meses de cotización), 400 días (18 meses o más) y 520 días (22 meses o más y 55 años o más, o una pensión de la IV de al menos el 40%). Al inicio se aplica un período de espera.","<b>Ejemplo:</b> un salario mensual asegurado de 5.000 CHF da un salario diario de 230,40 CHF (5.000 ÷ 21,7). Al 70% el subsidio diario es de 161,30 CHF y al 80% de 184,35 CHF, antes de deducciones como AHV, seguro de accidentes y caja de pensiones.","<b>Subsidios familiares (FamZG):</b> el mínimo federal es de 215 CHF al mes por hijo hasta los 16 años y 268 CHF por formación de los 16 a los 25; los cantones pueden pagar más (por ejemplo Ginebra, Valais, Vaud y Zug pagan más de 300 CHF de subsidio por hijo). El empleador los paga a través de la caja de subsidios familiares.","<b>Quién paga qué en enfermedad y accidente:</b> el empleador según el art. 324a o un seguro de subsidio diario (normalmente 80%, no es salario AHV); el seguro de accidentes (UVG) paga el 80% desde el día 3; la maternidad y la paternidad las paga la EO al 80% hasta 220 CHF diarios; el desempleo como arriba.","<b>Regla práctica para RRHH:</b> cada prestación tiene sus propias reglas de deducción y sus propios plazos, así que pregunta al pagador (caja de compensación, aseguradora o caja de pensiones) antes de crear una regla de nómina."]],
s:["Figures are 2026 and come from the Federal Social Insurance Office (BSV/OFAS) key figures; confirm on bsv.admin.ch.","Cifras de 2026 según las cifras clave de la Oficina Federal de Seguros Sociales (BSV/OFAS); confirma en bsv.admin.ch."]},
{t:["26. The three pillars in depth","26. Los tres pilares en detalle"],r:"AHVG/LAVS · IVG · EOG · BVG/LPP · BVV 3",
b:[["<b>Idea:</b> three layers so retirement, disability and death do not cause a sharp drop in income. Rule of thumb: pillars 1 and 2 together aim at about 60% of the last salary.","<b>Pillar 1 – AHV/IV/EO (state, pay-as-you-go):</b> mandatory for everyone who lives or works in Switzerland. It covers old age and survivors (AHV), disability (IV) and income compensation during military service, maternity and paternity (EO). It is paid for by current workers, not by your own savings.","Pillar 1 pension: depends on years paid (a full pension needs 44 years) and average earnings. In 2026 a single person gets between CHF 1,260 and CHF 2,520 per month; a married couple’s two pensions together are capped at 150% of the maximum (CHF 3,780). A 13th monthly pension is paid for the first time in December 2026. Each missing year cuts the pension by about 1/44.","If you have also paid into another EU/EFTA country’s system, those years count towards the minimum insurance period under EU rules, but each country pays its own pension pro rata.","<b>Pillar 2 – BVG (occupational pension, capitalised):</b> mandatory for employees earning more than CHF 22,680 a year. Both sides pay and the employer at least 50%. Savings build up in your individual account at the pension fund (Pensionskasse), which also insures disability and death (risk cover from age 17, savings from age 25).","Mandatory calculation: coordinated salary = salary minus CHF 26,460, capped at CHF 64,260 (that is, CHF 90,720 minus 26,460). Legal old-age credits, employee plus employer: 7% at 25–34, 10% at 35–44, 15% at 45–54, 18% at 55–65.","At retirement the capital becomes an annuity (legal conversion rate 6.8% on the mandatory part) or, if the fund allows, a lump sum. Many funds are better than the legal minimum (supra-mandatory plans).","Changing job: the capital moves to the new fund. Leaving Switzerland for the EU/EFTA: the mandatory part cannot be paid out in cash and stays in a vested-benefits account; only the supra-mandatory part can be withdrawn. Early withdrawal to buy a home (WEF/EPL) is possible under conditions.","<b>Pillar 3 – private:</b> 3a is a tied savings account or insurance, tax-deductible; for employees with a pension fund the yearly cap is CHF 7,258 in 2026 (CHF 7,373 from 2027). It can usually be withdrawn from 5 years before reference age, or to buy a home, start self-employment or leave Switzerland permanently. 3b is free savings with no tax deduction.","<b>Example:</b> Ana, 40, gross salary CHF 100,000. AHV/IV/EO: 5.3% = CHF 5,300. ALV: 1.1% = CHF 1,100. BVG: coordinated salary capped at CHF 64,260 × 10% credit = CHF 6,426 a year; her half is CHF 3,213. Her deductions total about CHF 9,613, plus non-occupational accident premium (about 1%) and income tax. Her employer pays another 5.3% + 1.1% + at least CHF 3,213, plus family fund and occupational accident. Simplified: real fund contributions also cover risk and admin costs.","<b>In plain words:</b> pillar 1 is the state’s basic pension, pillar 2 is a mandatory savings account built through your employer, and pillar 3 is voluntary savings with a tax advantage. Pillars 1 and 2 together aim to keep your way of life after you retire (a common rule of thumb is about 60% of your last salary); pillar 3 fills the gap.","<b>Where the money comes from:</b> pillar 1 works pay-as-you-go (today’s workers pay today’s pensions); pillars 2 and 3 are capitalised: your own money plus interest.","<b>When each pillar pays:</b> the AHV at the reference age (65; for women it has been rising gradually from 64 to 65 since 2025), with early draw possible against a reduction (6.8% per year of early draw as a general rate) or deferral for a supplement (5.2% after 1 year up to 31.5% after 5 years). The pension fund and pillar 3a pay from 5 years before the reference age; pillar 3a can be paid earlier to buy a home, become self-employed or leave Switzerland for good.","<b>Changing job:</b> your pension fund capital follows you: the old fund transfers it to the new one, or to a vested-benefits account if you have no job. Ask each employer for the pension certificate (Vorsorgeausweis) and check the projected pension.","<b>Leaving Switzerland, for example to another EU/EFTA country:</b> the AHV pension is still paid abroad. The mandatory pension fund capital cannot be paid out in cash if you stay compulsorily insured in an EU/EFTA country: it stays in a Swiss vested-benefits account, available 5 years before the reference age. The supra-mandatory part can be paid out. Pillar 3a can be withdrawn when you leave for good.","<b>Few years in Switzerland:</b> the AHV pension is proportional to your Swiss contribution years: 22 of 44 years give about half. A full pension needs 44 years, counted from age 21. Each country pays a pension for its own periods.","<b>Couples:</b> the two AHV pensions of a married couple are capped together at 150% of the maximum (CHF 3,780 a month); two unmarried people can each receive up to CHF 2,520.","<b>Taxes:</b> pensions are declared as income; pillar 3a contributions are deductible; capital withdrawals are taxed separately, and splitting 3a and pension fund withdrawals over several years usually lowers the tax. The retirement calculator in Tools lets you try the numbers.","<b>Return and risk:</b> only pillars 2 and 3 are invested. In pillar 2 the fund invests collectively and credits interest to your account; in pillar 3a you choose between a savings account (low interest, no risk) and securities solutions (funds or ETFs, more risk and usually more return over the long term). Fees reduce the return. From 2026, 3a contributions missed since 2025 can be made up under certain conditions."],["<b>Idea:</b> tres capas para que la jubilación, la invalidez y el fallecimiento no provoquen una caída brusca de ingresos. Regla orientativa: los pilares 1 y 2 juntos buscan cubrir alrededor del 60% del último salario.","<b>Pilar 1 – AHV/IV/EO (estatal, reparto):</b> obligatorio para todo el que vive o trabaja en Suiza. Cubre vejez y supervivencia (AHV), invalidez (IV) y compensación de ingresos durante el servicio militar, la maternidad y la paternidad (EO). Lo pagan los trabajadores actuales, no tus ahorros personales.","Pensión del pilar 1: depende de los años cotizados (la completa exige 44 años) y del ingreso medio. En 2026 una persona sola recibe entre 1.260 y 2.520 CHF al mes; las dos pensiones de un matrimonio juntas tienen un tope del 150% del máximo (3.780 CHF). En diciembre de 2026 se paga por primera vez una 13.ª pensión. Cada año que falta reduce la pensión en torno a 1/44.","España–Suiza: los años cotizados en España cuentan para el período mínimo de seguro según las reglas de la UE, pero cada país paga su pensión de forma proporcional.","<b>Pilar 2 – BVG (previsión profesional, capitalizada):</b> obligatorio para quien gana más de 22.680 CHF al año. Cotizan ambas partes y el empleador al menos el 50%. El ahorro se acumula en tu cuenta individual de la caja de pensiones (Pensionskasse), que también asegura invalidez y fallecimiento (riesgo desde los 17 años, ahorro desde los 25).","Cálculo obligatorio: salario coordinado = salario menos 26.460 CHF, con tope de 64.260 CHF (es decir, 90.720 menos 26.460). Bonificaciones legales de vejez, trabajador más empleador: 7% a los 25–34 años, 10% a los 35–44, 15% a los 45–54, 18% a los 55–65.","Al jubilarte el capital se convierte en renta (tasa de conversión legal 6,8% sobre la parte obligatoria) o, si la caja lo permite, en capital de una vez. Muchas cajas mejoran el mínimo legal (planes supraobligatorios).","Cambio de empleo: el capital pasa a la nueva caja. Salida de Suiza hacia la UE/AELC: la parte obligatoria no se puede cobrar en efectivo y queda en una cuenta de libre paso; solo se puede retirar la parte supraobligatoria. El retiro anticipado para comprar vivienda (WEF/EPL) es posible bajo condiciones.","<b>Pilar 3 – privado:</b> el 3a es una cuenta o seguro de ahorro vinculado, deducible de impuestos; para quien tiene caja de pensiones el tope anual es de 7.258 CHF en 2026 (7.373 CHF desde 2027). Normalmente se puede retirar desde 5 años antes de la edad de referencia, o para comprar vivienda, iniciar actividad autónoma o salir definitivamente de Suiza. El 3b es ahorro libre sin deducción fiscal.","<b>Ejemplo:</b> Ana, 40 años, salario bruto 100.000 CHF. AHV/IV/EO: 5,3% = 5.300 CHF. ALV: 1,1% = 1.100 CHF. BVG: salario coordinado con tope de 64.260 CHF × 10% de bonificación = 6.426 CHF al año; su mitad son 3.213 CHF. Sus descuentos suman unos 9.613 CHF, más la prima de accidente no profesional (en torno al 1%) y el impuesto sobre la renta. Su empleador paga además 5,3% + 1,1% + al menos 3.213 CHF, más caja de familia y accidente profesional. Simplificado: las cotizaciones reales de la caja incluyen también costes de riesgo y administración.","<b>En palabras sencillas:</b> el pilar 1 es la pensión básica del Estado, el pilar 2 es una cuenta de ahorro obligatoria a través de tu empresa y el pilar 3 es ahorro voluntario con ventaja fiscal. Los pilares 1 y 2 juntos buscan mantener tu nivel de vida al jubilarte (una regla práctica habitual es en torno al 60% de tu último salario); el pilar 3 cubre la diferencia.","<b>De dónde sale el dinero:</b> el pilar 1 funciona por reparto (los trabajadores actuales pagan las pensiones actuales); los pilares 2 y 3 son de capitalización: tu propio dinero más intereses.","<b>Cuándo paga cada pilar:</b> la AHV a la edad de referencia (65; para las mujeres sube gradualmente de 64 a 65 desde 2025), con posibilidad de adelantarla con una reducción (6,8% por año de adelanto como tipo general) o aplazarla con un suplemento (5,2% tras 1 año hasta 31,5% tras 5 años). La caja de pensiones y el pilar 3a pagan desde 5 años antes de la edad de referencia; el pilar 3a puede cobrarse antes para comprar vivienda, ser autónomo o irte de Suiza definitivamente.","<b>Si cambias de trabajo:</b> el capital de tu caja de pensiones te sigue: la caja anterior lo transfiere a la nueva, o a una cuenta de libre paso si no tienes trabajo. Pide a cada empleador el certificado de la caja de pensiones (Vorsorgeausweis) y revisa la pensión proyectada.","<b>Si te vas de Suiza, por ejemplo a España:</b> la pensión AHV se sigue pagando en el extranjero. El capital obligatorio de la caja de pensiones no se puede cobrar en efectivo si sigues asegurado obligatoriamente en un país UE/AELC: queda en una cuenta de libre paso suiza, disponible 5 años antes de la edad de referencia. La parte supraobligatoria sí puede cobrarse. El pilar 3a puede retirarse al irte definitivamente.","<b>Pocos años en Suiza:</b> la pensión AHV es proporcional a tus años cotizados en Suiza: 22 de 44 años dan aproximadamente la mitad. La pensión completa exige 44 años, contados desde los 21. Cada país paga una pensión por sus propios períodos.","<b>Matrimonios:</b> las dos pensiones AHV de un matrimonio tienen un tope conjunto del 150% del máximo (3.780 CHF al mes); dos personas solteras pueden cobrar hasta 2.520 CHF cada una.","<b>Impuestos:</b> las pensiones se declaran como ingreso; las aportaciones al pilar 3a son deducibles; los retiros de capital se gravan aparte, y repartir los retiros del 3a y de la caja de pensiones en varios años suele reducir el impuesto. La calculadora de jubilación de Herramientas te permite probar las cifras.","<b>Rentabilidad y riesgo:</b> solo se invierten los pilares 2 y 3. En el pilar 2 la caja invierte de forma colectiva y acredita intereses en tu cuenta; en el pilar 3a eliges entre una cuenta de ahorro (interés bajo, sin riesgo) y soluciones con valores (fondos o ETF, más riesgo y normalmente más rentabilidad a largo plazo). Las comisiones reducen la rentabilidad. Desde 2026 se pueden recuperar, con ciertas condiciones, las aportaciones al 3a no hechas desde 2025."]],
s:["In Spain the state pension is the core and private plans are voluntary. In Switzerland the second pillar is mandatory and capitalised, so every payslip also builds your own pension capital.","En España la pensión pública es el eje y los planes privados son voluntarios. En Suiza el segundo pilar es obligatorio y capitalizado, así que cada nómina también construye tu propio capital de pensión."]},
{t:["24. Certificate and non-compete","24. Certificado y pacto de no competencia"],r:"CO art. 330a, 340–340c",
b:[["Work reference (Arbeitszeugnis, art. 330a): the employee can ask at any time, even during employment. Full reference covers role, duration, performance and conduct; a simple confirmation covers only role and duration. It must be truthful and benevolent.","Non-compete (art. 340): written form is required. Valid only if the employee had access to the client base or trade secrets and misuse would cause significant harm. Limited in place, time (normally up to 3 years) and subject; a court can reduce excessive ones.","A contractual penalty for breach is possible, but the employer can only demand the ban be enforced if the contract says so expressly.","<b>When a non-compete ends (art. 340c):</b> it lapses if the employer has no real interest any more, if the employer terminates without a reason given by the employee, or if the employee terminates for a justified reason attributable to the employer.","<b>Reading a reference:</b> Swiss references have no official grading code. A common scale in German-speaking practice is “stets zu unserer vollsten Zufriedenheit” = very good, “stets zu unserer vollen Zufriedenheit” = good, “zu unserer vollen Zufriedenheit” = satisfactory and “zu unserer Zufriedenheit” = sufficient. The employee can ask for corrections and, if refused, sue.","<b>Confidentiality after leaving:</b> the duty of secrecy continues as long as the employer has a legitimate interest (art. 321a para. 4). The employee must also return company property and documents when the relationship ends.","<b>Interim reference (Zwischenzeugnis):</b> an employee with a justified reason, such as a new superior, a restructuring or a planned change, can ask for an interim reference during employment.","<b>Non-compete penalty:</b> a contractual penalty can be agreed; unless the contract says otherwise, paying it releases the employee from the ban, and a court can reduce an excessive penalty (art. 340b).","<b>HR practice:</b> keep a standard text for each performance level, have a second person review every certificate and send the draft to the employee before the exit date."],["Certificado de trabajo (Arbeitszeugnis, art. 330a): el trabajador puede pedirlo en cualquier momento, incluso durante la relación. El completo incluye función, duración, rendimiento y conducta; la simple confirmación solo función y duración. Debe ser veraz y benevolente.","No competencia (art. 340): exige forma escrita. Solo vale si el trabajador conoció la clientela o secretos de empresa y un uso indebido causaría un perjuicio considerable. Limitada en lugar, tiempo (normalmente hasta 3 años) y objeto; el juez puede reducir las excesivas.","Puede pactarse pena convencional por incumplimiento, pero el empleador solo puede exigir que se cumpla la prohibición si el contrato lo dice expresamente.","<b>Cuándo termina la no competencia (art. 340c):</b> caduca si el empleador ya no tiene un interés real, si el empleador resuelve sin un motivo dado por el trabajador, o si el trabajador resuelve por una causa justificada imputable al empleador.","<b>Cómo leer un certificado:</b> los certificados suizos no tienen un código oficial de notas. Una escala habitual en la práctica de habla alemana es “stets zu unserer vollsten Zufriedenheit” = muy bien, “stets zu unserer vollen Zufriedenheit” = bien, “zu unserer vollen Zufriedenheit” = satisfactorio y “zu unserer Zufriedenheit” = suficiente. El trabajador puede pedir correcciones y, si se niegan, demandar.","<b>Confidencialidad tras la salida:</b> el deber de secreto continúa mientras el empleador tenga un interés legítimo (art. 321a ap. 4). El trabajador también debe devolver material y documentos de la empresa al terminar la relación.","<b>Certificado intermedio (Zwischenzeugnis):</b> un trabajador con un motivo justificado, como un nuevo superior, una reestructuración o un cambio previsto, puede pedir un certificado intermedio durante la relación.","<b>Pena de la no competencia:</b> puede pactarse una pena convencional; salvo que el contrato diga otra cosa, pagarla libera al trabajador de la prohibición, y un tribunal puede reducir una pena excesiva (art. 340b).","<b>Práctica de RRHH:</b> ten un texto estándar para cada nivel de rendimiento, haz que una segunda persona revise cada certificado y envía el borrador al trabajador antes de la fecha de salida."]]},
{t:["3. EU/EFTA nationals in Switzerland","3. Españoles en Suiza"],r:"AFMP/ALCP · Reg. 883/2004",
b:[["EU/EFTA citizens move under the Agreement on Free Movement of Persons. Common permits: L (short stay, under 1 year), B (residence, usually 5 years) and G (cross-border).","Social security is coordinated with the EU (Regulation 883/2004): periods of insurance can be aggregated for unemployment, and posted workers can keep home-country coverage with an A1 certificate.","Quellensteuer (withholding tax): employees without a C permit are taxed at source by canton; the employer deducts it from salary.","<b>Short assignments and registration:</b> up to 90 working days per calendar year no permit is needed: the Swiss employer reports the job through the online notification procedure. For longer employment, register with your municipality within 14 days of arrival and before starting work, and apply for the permit.","<b>Health insurance is not in payroll:</b> basic health insurance (KVG) is mandatory within 3 months of arrival, retroactive to arrival, and you choose and pay the insurer yourself (premium, franchise, excess). The employer does not deduct it.","<b>Unemployment benefits:</b> you generally need 12 months of contributions in the last 2 years. Under EU coordination, months insured in another EU/EFTA country can be added to Swiss months.","<b>Taxes:</b> employees without a C permit pay Quellensteuer. If you live in Switzerland and your gross employment income reaches CHF 120,000 a year, an ordinary tax assessment follows automatically. A C permit is normally granted after 5 years for EU-15 nationals. Human resources is not a regulated profession in Switzerland, so no diploma recognition is needed to work.","<b>Permits for EU/EFTA nationals:</b> L permit for contracts up to 364 days; B permit for contracts of at least one year or open-ended, valid 5 years and renewable; G permit for cross-border workers who return home daily or at least weekly; C (settlement) permit normally after 5 years of uninterrupted residence for nationals of EU-15 states (10 years for some other EU states).","<b>Losing the right to stay:</b> if you lose your job through no fault of your own during your first 12 months of residence, you keep the right to stay for 6 months, or until your unemployment benefit ends if that is longer, and without access to social assistance. After the first 12 months you keep it while you receive unemployment benefit and for 6 months after it ends. Check with the cantonal migration office. Leaving Switzerland for a long period can also end a C permit unless you ask to keep it.","<b>Family:</b> family members of an EU/EFTA national with a Swiss permit can move in, normally receive a B permit and may work.","<b>First steps:</b> sign the contract, register with the municipality within 14 days and before starting work, apply for the permit through the employer or canton, note your AHV number, arrange basic health insurance and keep your family documents ready.","<b>Coming from another EU/EFTA country:</b> insurance periods abroad and in Switzerland can be added up for unemployment benefits (form PD U1) and pension rights accumulate under EU rules; ask the employment and pension authorities of your previous country before leaving.","<b>Nationals of other countries:</b> a visa may be required and permits are subject to quotas. This section covers EU/EFTA nationals; check your case with the State Secretariat for Migration (SEM)."],["Los ciudadanos UE/AELC se desplazan bajo el Acuerdo sobre Libre Circulación de Personas. Permisos habituales: L (estancia corta, menos de 1 año), B (residencia, normalmente 5 años) y G (transfronterizo).","La seguridad social se coordina con la UE (Reglamento 883/2004): los períodos de seguro se acumulan para desempleo y los desplazados pueden mantener la cobertura del país de origen con el certificado A1.","Quellensteuer (retención en origen): los trabajadores sin permiso C tributan en origen según el cantón; el empleador lo descuenta del salario.","<b>Estancias cortas y registro:</b> hasta 90 días laborables por año natural no hace falta permiso: el empleador suizo comunica el empleo por el procedimiento de notificación en línea. Para empleos más largos, regístrate en tu municipio en los 14 días posteriores a la llegada y antes de empezar a trabajar, y solicita el permiso.","<b>El seguro médico no va en nómina:</b> el seguro médico básico (KVG) es obligatorio en los 3 meses siguientes a la llegada, con efecto retroactivo, y tú eliges y pagas al asegurador (prima, franquicia, copago). El empleador no lo descuenta.","<b>Prestación por desempleo:</b> en general se necesitan 12 meses de cotización en los últimos 2 años. Con la coordinación de la UE, los meses asegurados en España pueden sumarse a los suizos.","<b>Impuestos:</b> los trabajadores sin permiso C pagan Quellensteuer. Si resides en Suiza y tus ingresos brutos del trabajo alcanzan 120.000 CHF al año, se hace automáticamente una liquidación ordinaria posterior. Los españoles obtienen normalmente el permiso C tras 5 años. Recursos humanos no es una profesión regulada en Suiza, por lo que no hace falta homologar el título para trabajar.","<b>Permisos para ciudadanos UE/AELC (incluida España):</b> permiso L para contratos de hasta 364 días; permiso B para contratos de al menos un año o indefinidos, válido 5 años y renovable; permiso G para transfronterizos que vuelven a casa a diario o al menos cada semana; permiso C (establecimiento) normalmente tras 5 años de residencia ininterrumpida para nacionales de los Estados UE-15 como España (10 años para algunos otros Estados de la UE).","<b>Perder el derecho a residir:</b> si pierdes el empleo sin culpa tuya durante tus primeros 12 meses de residencia, conservas el derecho a quedarte 6 meses, o hasta que termine tu prestación de desempleo si dura más, y sin acceso a la ayuda social. Pasados los 12 primeros meses lo conservas mientras cobras el paro y 6 meses después de que termine. Consúltalo con la oficina cantonal de migración. Salir de Suiza por mucho tiempo también puede acabar con un permiso C si no pides mantenerlo.","<b>Familia:</b> los familiares de un ciudadano UE/AELC con permiso suizo pueden trasladarse, normalmente reciben un permiso B y pueden trabajar.","<b>Primeros pasos:</b> firma el contrato, regístrate en el municipio en 14 días y antes de empezar a trabajar, solicita el permiso a través del empleador o del cantón, anota tu número AHV, contrata el seguro médico básico y ten a mano los documentos familiares.","<b>Específico de España:</b> los períodos de seguro en España y Suiza pueden sumarse para las prestaciones por desempleo (formulario PD U1) y los derechos de pensión se acumulan según las reglas de la UE; consulta al SEPE y al INSS españoles antes de irte."]]},
{t:["28. Your HR career in Switzerland","28. Tu carrera de RRHH en Suiza"],r:"HR Swiss · SBFI/SERI · Berufsprüfung · AVG",
b:[["<b>Typical Swiss HR ladder:</b> HR assistant (HR-Assistent/in, HRSE certificate) or personnel administrator (Sachbearbeiter/in Personalwesen, kv edupool) → HR specialist with a federal professional certificate (HR-Fachmann/-frau mit eidg. Fachausweis, Berufsprüfung) → head of HR with a federal diploma (Leiter/in Human Resources, Höhere Fachprüfung).","<b>The federal HR specialist exam:</b> it usually needs a federal vocational certificate (EFZ) or a matura-level equivalent, the HR assistant level and several years of HR experience (providers mention at least two years in the last five). Associations include HR Swiss and the Kaufmännischer Verband. The Confederation reimburses up to 50% of the course costs after the exam; one provider quotes a maximum of CHF 9,500 for a Fachausweis.","<b>Specialisations:</b> recruiting, payroll, HR administration and personnel development, plus roles that advise managers on employment law.","<b>Your starting point from abroad:</b> HR is not a regulated profession in Switzerland, so you can work without formal recognition, but employers will read your foreign degree and experience against Swiss titles. The Swiss knowledge you need first is what this site covers: employment law (CO, ArG), social insurance, payroll and permits.","<b>Language:</b> most Swiss HR work is done in the local language (German, French or Italian) because contracts, payslips and authorities use it, which is why this site gives the German terms.","<b>CV and applications (common practice):</b> a structured CV with dates, copies of employment references (Arbeitszeugnisse) and diplomas, and a cover letter; a photo is customary but optional. Swiss employers give great weight to references, so ask previous employers abroad for a detailed work certificate and have it translated.","<b>Job search (common practice):</b> jobs.ch, LinkedIn, company career pages, cantonal employment offices and recruitment agencies, which are regulated by the Employment Services Act (AVG).","<b>First 90 days:</b> permit and registration; AHV number; health insurance; bank account; pension fund transfer; learn the payroll cycle (section 7); build your German glossary; try the payslip simulator with real cases.","<b>Study plan with this site:</b> 1) sections 1–16 (law, pay and payroll); 2) sections 17–26 (absences, dismissal, certificates, insurance); and, if you are planning a move, sections 2, 3 and 27; 3) templates and calculators; 4) the glossary; 5) shadow a full payroll cycle at work."],["<b>Escalera típica de RRHH en Suiza:</b> asistente de RRHH (HR-Assistent/in, certificado HRSE) o administrativo de personal (Sachbearbeiter/in Personalwesen, kv edupool) → especialista de RRHH con certificado profesional federal (HR-Fachmann/-frau mit eidg. Fachausweis, Berufsprüfung) → responsable de RRHH con diploma federal (Leiter/in Human Resources, Höhere Fachprüfung).","<b>El examen federal de especialista de RRHH:</b> suele exigir un certificado de formación profesional federal (EFZ) o un equivalente de nivel de bachillerato, el nivel de asistente de RRHH y varios años de experiencia en RRHH (los centros de formación mencionan al menos dos años en los últimos cinco). Hay asociaciones como HR Swiss y el Kaufmännischer Verband. La Confederación reembolsa hasta el 50% de los costes del curso tras el examen; un centro cita un máximo de 9.500 CHF para un Fachausweis.","<b>Especializaciones:</b> selección, nóminas, administración de personal y desarrollo de personas, además de puestos que asesoran a los mandos en derecho laboral.","<b>Tu punto de partida desde España:</b> RRHH no es una profesión regulada en Suiza, así que puedes trabajar sin homologación formal, pero los empleadores leerán tu título y experiencia españoles frente a los títulos suizos. Lo primero que necesitas es lo que cubre esta página: derecho laboral (CO, ArG), seguros sociales, nóminas y permisos.","<b>Idioma:</b> la mayor parte del trabajo de RRHH en Suiza se hace en el idioma local (alemán, francés o italiano) porque contratos, nóminas y autoridades lo usan, por eso esta página da los términos en alemán.","<b>CV y candidaturas (práctica habitual):</b> un CV estructurado con fechas, copias de certificados de trabajo (Arbeitszeugnisse) y títulos, y una carta de presentación; la foto es habitual pero opcional. Los empleadores suizos dan mucho peso a las referencias, así que pide a tus empleadores españoles anteriores un certificado de trabajo detallado y tradúcelo.","<b>Búsqueda de empleo (práctica habitual):</b> jobs.ch, LinkedIn, páginas de empleo de las empresas, oficinas cantonales de empleo y agencias de selección, que están reguladas por la Ley de Servicios de Empleo (AVG).","<b>Primeros 90 días:</b> permiso y registro; número AHV; seguro médico; cuenta bancaria; traspaso de la caja de pensiones; aprende el ciclo de nómina (apartado 7); crea tu glosario de alemán; prueba el simulador de nóminas con casos reales.","<b>Plan de estudio con esta página:</b> 1) apartados 1–16 (derecho, salario y nómina); 2) apartados 17–26 (ausencias, despido, certificados, seguros); y, si planeas mudarte, los apartados 2, 3 y 27; 3) plantillas y calculadoras; 4) el glosario; 5) acompañar un ciclo completo de nómina en el trabajo."]]},
{t:["2. Arriving in Switzerland: first 90 days and recognition of qualifications", "2. Llegar a Suiza: primeros 90 días y convalidación de títulos"],r:"FZA/ALCP · KVG art. 3 · AIG · SBFI / anerkennung.swiss",
b:[["<b>Before you travel:</b> EU/EFTA citizens need no visa; nationals of other countries usually need a visa and a permit (check with the State Secretariat for Migration, SEM). Once you have a contract, the permit is processed through your commune and canton: permit L for a contract of more than 3 months and under 1 year, permit B (usually valid 5 years) for 12 months or more or an open-ended contract.", "<b>Three months without a permit:</b> you may stay up to 3 months to look for a job. For a job of 3 months or less you do not need a permit, but it must be notified online at the latest the day before work starts. For a job longer than 3 months the permit has to be requested before you start working.", "<b>Register with your commune (Einwohnerkontrolle):</b> the usual deadline is 14 days after arrival, and some communes ask for less. Bring a valid passport or ID card, your contract and proof of address; check the exact list on your commune’s website.", "<b>If you arrive without a contract:</b> after the first 3 months you can apply for a job-search permit, normally for 3 months and extendable (usually up to 6 months in total, depending on the canton) if you show real job-search efforts and own means. Job seekers have no right to social assistance, and you cannot claim Swiss unemployment benefit without contributions paid in Switzerland.", "<b>Health insurance (Krankenkasse):</b> compulsory for everyone who lives in Switzerland, each family member individually. You have 3 months from arrival to take out basic cover, which is retroactive to your arrival date: premiums are owed from that day. Even with a contract of under 3 months you must insure yourself in Switzerland unless you have equivalent foreign cover.", "<b>Accident and pension insurance:</b> your employer enrols you in accident insurance (UVG) and, above the entry threshold, in the pension fund. You do not have to do anything, but check both lines on your first payslip (see the social insurance section).", "<b>First payslip and tax:</b> with a permit B or L, income tax is withheld from your salary (Quellensteuer). Compare your payslip with the net salary calculator and the payslip simulator in Tools.", "<b>Contract in writing:</b> a verbal contract is valid in Switzerland, but ask for the key terms in writing: within one month your employer must give you written information on the parties, start date, role, salary and working hours (art. 330b CO).", "<b>Housing and bank:</b> landlords usually ask for a debt-collection register extract (Betreibungsregisterauszug) from your commune and your payslips; the rental deposit cannot legally exceed 3 months’ rent and is held in a blocked account.", "<b>Recognition of qualifications:</b> recognition is compulsory only for regulated professions, for example health professions, teachers and some technical or legal ones: without it you cannot practise. For non-regulated professions, which are the large majority of jobs, no recognition is needed and the employer judges your diploma. You also do not need recognition to study in Switzerland.", "<b>Who recognises what:</b> there is no single authority; it depends on the profession. The federal portal anerkennung.swiss (SBFI) tells you whether yours is regulated and whom to ask; the Swiss Red Cross handles non-university health professions, and swissuniversities (Swiss ENIC) assesses foreign university diplomas.", "<b>Optional level confirmation:</b> for non-regulated professions the SBFI can issue a level confirmation (Niveaubestätigung, CHF 350) that tells employers the level of your foreign diploma, not its equivalence to a specific Swiss degree. The recognition procedure for regulated professions costs CHF 550. Times vary by case.", "<b>Looking for work:</b> start with the main job portals, such as jobs.ch (German-speaking) and jobup.ch (French-speaking), and temp agencies, and ask for the contract in writing before you travel. Be wary of anyone who charges you for a guaranteed job."], ["<b>Antes de viajar:</b> los españoles no necesitan visado. Cuando tengas contrato, el permiso se tramita a través de tu municipio y cantón: permiso L para un contrato de más de 3 meses y menos de 1 año, permiso B (normalmente válido 5 años) para 12 meses o más o contrato indefinido.", "<b>Tres meses sin permiso:</b> puedes quedarte hasta 3 meses para buscar trabajo. Para un trabajo de 3 meses o menos no necesitas permiso, pero debe notificarse en línea como muy tarde el día antes de empezar. Para un trabajo de más de 3 meses, el permiso debe solicitarse antes de empezar a trabajar.", "<b>Regístrate en tu municipio (Einwohnerkontrolle):</b> el plazo habitual es de 14 días desde la llegada, y algunos municipios piden menos. Lleva pasaporte o DNI en vigor, tu contrato y un justificante de domicilio; consulta la lista exacta en la web de tu municipio.", "<b>Si llegas sin contrato:</b> pasados los 3 primeros meses puedes pedir un permiso para buscar trabajo, normalmente de 3 meses y ampliable (por lo común hasta 6 meses en total, según el cantón) si demuestras una búsqueda real y medios propios. Quien busca trabajo no tiene derecho a ayuda social, y no puedes cobrar el paro suizo sin cotizaciones pagadas en Suiza.", "<b>Seguro médico (Krankenkasse):</b> obligatorio para todos los que viven en Suiza, cada miembro de la familia por separado. Tienes 3 meses desde la llegada para contratar el seguro básico, que es retroactivo a tu fecha de llegada: las primas se deben desde ese día. Incluso con un contrato de menos de 3 meses debes asegurarte en Suiza salvo que tengas una cobertura extranjera equivalente.", "<b>Seguro de accidentes y caja de pensiones:</b> tu empresa te da de alta en el seguro de accidentes (UVG) y, por encima del umbral de entrada, en la caja de pensiones. No tienes que hacer nada, pero revisa ambas líneas en tu primera nómina (ver el apartado de seguros sociales).", "<b>Primera nómina e impuestos:</b> con permiso B o L, el impuesto sobre la renta se retiene de tu sueldo (Quellensteuer). Compara tu nómina con la calculadora de sueldo neto y el simulador de nóminas de Herramientas.", "<b>Contrato por escrito:</b> un contrato verbal es válido en Suiza, pero pide las condiciones principales por escrito: en el plazo de un mes tu empresa debe darte información escrita sobre las partes, la fecha de inicio, el puesto, el salario y la jornada (art. 330b CO).", "<b>Vivienda y banco:</b> los propietarios suelen pedir un extracto del registro de embargos (Betreibungsregisterauszug) de tu municipio y tus nóminas; la fianza no puede superar legalmente 3 meses de alquiler y se deposita en una cuenta bloqueada.", "<b>Reconocimiento de títulos (convalidación):</b> el reconocimiento es obligatorio solo para las profesiones reguladas, por ejemplo las sanitarias, la docencia y algunas técnicas o jurídicas: sin él no puedes ejercer. Para las profesiones no reguladas, que son la gran mayoría de los empleos, no hace falta ningún reconocimiento y la empresa valora tu título. Tampoco necesitas reconocimiento para estudiar en Suiza.", "<b>Quién reconoce qué:</b> no hay una autoridad única; depende de la profesión. El portal federal anerkennung.swiss (SBFI) te dice si la tuya es regulada y a quién dirigirte; la Cruz Roja Suiza gestiona las profesiones sanitarias no universitarias y swissuniversities (Swiss ENIC) evalúa los títulos universitarios extranjeros.", "<b>Confirmación de nivel opcional:</b> para profesiones no reguladas, la SBFI puede emitir una confirmación de nivel (Niveaubestätigung, 350 CHF) que indica a las empresas el nivel de tu título español, no su equivalencia con un título suizo concreto. El procedimiento de reconocimiento de profesiones reguladas cuesta 550 CHF. Los plazos varían según el caso.", "<b>Buscar trabajo:</b> empieza por los portales principales, como jobs.ch (zona germanófona) y jobup.ch (zona francófona), y por las empresas de trabajo temporal, y pide el contrato por escrito antes de viajar. Desconfía de quien te cobre por garantizarte un empleo."]],
s:["In Spain public healthcare comes with your registration in the Social Security. In Switzerland you must choose and pay for your own insurer within 3 months, and the premium is a personal cost on top of the payslip deductions.", "En España la sanidad pública va ligada a tu alta en la Seguridad Social. En Suiza debes elegir y pagar tu propia aseguradora en 3 meses, y la prima es un coste personal añadido a los descuentos de la nómina."]},
